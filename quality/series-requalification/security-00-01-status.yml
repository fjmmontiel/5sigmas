active_defect:
  code: SECURITY_CTXMIX_PREMATURE_SEMANTIC_DISCLOSURE
  severity: P1
  status: REPAIRED_SOURCE_AND_GATE_EXACT_QA_PENDING
  affected_visuals: [control-vs-datos]
  discovery:
    - >-
      The ctxmix step copy says state 1 establishes provenance, state 2 introduces the mixed language context,
      state 3 makes model influence observable through a risky tool-call proposal, and state 4 applies the runtime
      authorization boundary. The rendered DOM nevertheless exposed the mixed context and send_credentials proposal
      from state 1, so later causal outcomes were visible before their semantic step.
    - >-
      The previous text-visibility gate treated every explanatory probe as required-visible in every state. That
      protected opacity but could not express legitimate semantic hiding, and therefore did not fail this sequencing
      defect.
  site_repair: >-
    ES and EN now use structural display staging: the mixed context is absent from layout/accessibility until state 2,
    the model proposal is absent until state 3, and the final denied verdict remains hidden until state 4. This changes
    observable geometry and disclosure according to the mechanism instead of using opacity or decorative highlighting.
  gate_repair: >-
    validate_security_text_visibility.mjs now distinguishes hidden future teaching content from visible legibility,
    enforces context -> proposal -> verdict visibility as false/false/false at state 1, true/false/false at state 2,
    true/true/false at state 3 and true/true/true at state 4 across ES/EN, desktop/mobile and normal/reduced motion.
    Its --self-test includes negative mutations for early context/proposal/verdict disclosure and missing final proposal.
  regression_scope: >-
    Site-facing changes are confined to Security 1.1 ES/EN control-vs-data snippets. Datacenters and every
    pre-Datacenters reference series remain untouched. No threshold was lowered.

