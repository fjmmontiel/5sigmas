active_defect:
  code: TEACHING_TEXT_ANCESTOR_OPACITY_CONTRAST_BLIND_SPOT
  severity: P1
  status: SOURCE_REPAIRED_PENDING_EXACT_QA_AND_MANUAL_PIXEL_REVIEW
  affected_visuals: [control-vs-datos, defensa-en-capas]
  discovered_from_source:
    - >-
      The prior browser contrast gate measured descendant computed foreground/background colors but did not
      account for CSS opacity applied by an ancestor, so text inside a faded teaching panel could falsely pass.
    - >-
      ES and EN control-vs-datos rendered mechanism/context/proposal groups at 20/25 percent opacity in early
      states and the runtime group at 35 percent in state 3. The old verdict was also left visible at 18 percent.
    - >-
      ES and EN defensa-en-capas rendered an entire disabled gate at 42 percent opacity. The ES inactive status
      additionally leaked the English token "off".
  gate_repair: >-
    validate_security_contrast.mjs now contains an ancestor-opacity regression fixture, rejects inspected teaching
    text rendered through cumulative ancestor opacity below 0.999, and exercises presentation bounded/unbounded,
    ctxmix steps 1..4, RAG clean/poisoned and defense all-on/first-off across ES/EN, desktop/mobile and
    normal/reduced motion while retaining runtime/resource listeners.
  site_repair: >-
    ES/EN ctxmix no longer fades text-bearing mechanism groups. The final verdict is hidden until its explanatory
    state and then shown at full opacity. ES/EN defense disabled gates preserve readable text and communicate state
    through dashed border plus explicit state pill rather than fading the entire card. ES uses "inactivo".
  regression_scope: >-
    Site-facing changes are confined to the two Security 1.1 visual snippets in ES and EN; the gate change is
    confined to the focused Security validator. Datacenters and pre-Datacenters reference-series files are untouched.
  certification_effect: >-
    Prior same-agent PIXEL_REVIEW/PEDAGOGY_REVIEW receipts cannot certify the current content revision after this
    newly discovered defect and the subsequent site-facing repair. Current exact manual review is fail-closed PENDING.

