      Changing preload from none to metadata can queue Chromium media resource selection before networkState updates. The prior
      NETWORK_EMPTY guard then called video.load() in the same task, which can reset/cancel that valid range request. Revision 56
      therefore reproduced the deterministic lazy-load abort in every requested context.
