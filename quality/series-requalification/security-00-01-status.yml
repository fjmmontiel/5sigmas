    discovery: >-
      Revision 42 did not require all three localized state-4 authorization-result labels, so a missing ES
      destino/permiso or EN destination could escape the negative gate despite the product rendering the full check set.
    site_product_status: >-
      Current ES/EN product already renders scope + destino/permiso and scope + destination/permission respectively and
      keeps the authorization-check result container structurally hidden until state 4. No site-facing content change
      was required.
    gate_repair: >-
      validate_security_text_visibility.mjs derives all three required localized labels, fails when any is absent,
      records expected terms and includes deterministic missing-label mutations. No threshold was lowered.
    gate_repair_commit: 24408773a3d129a14b7a9eb5bad1ec59dafaa065
    exact_qa: PASS_REVISION_43

