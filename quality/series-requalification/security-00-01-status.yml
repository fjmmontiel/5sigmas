active_defect:
  code: TEXT_BEARING_GROUP_OPACITY_NOT_COVERED_BY_CONTRAST_GATE
  status: FIX_IMPLEMENTED_QA_PENDING
  affected_visual: control-vs-data
  finding: >-
    Intermediate states dimmed complete explanatory containers to 20-35% opacity. The existing WCAG gate
    correctly checked foreground/background colour contrast, including translucent backgrounds, but a
    descendant's computed opacity remains 1 when an ancestor supplies group opacity; therefore it could
    certify colours while the final rendered text was materially faded.
  repair:
    - keep context, model/runtime and proposal explanatory text at full opacity in every state
    - communicate state 1/2/3/4 with structural outlines rather than fading text
    - hide the final verdict until state 4 instead of rendering low-opacity ghost text
    - exercise ES/EN, desktop/mobile, normal/reduced and states 1-4 in a browser gate
    - multiply ancestor opacity for every explanatory text probe and fail below 0.99
  files:
    - docs/stylesheets/revamp-ux.css
    - scripts/validate_security_text_visibility.mjs
    - .github/workflows/series-experience-diagnostic.yml
  regression_scope: >-
    Overrides are restricted to .ctxmix[data-state], the stateful Security visual. The older prompt-injection
    topic visual uses .ctxmix without data-state, and Datacenters/pre-Datacenters series are not targeted.

