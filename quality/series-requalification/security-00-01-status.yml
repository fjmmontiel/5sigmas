media_gate:
  script: scripts/validate_security_video_media.py
  integrated_workflow: .github/workflows/series-experience-diagnostic.yml
  policy:
    - explicit video, poster, title, summary and ISO duration are mandatory
    - captions must be declared as a non-empty local VTT
    - transcript must be declared as a non-empty local Markdown or text file
    - curated video_chapters must be named, ordered, non-overlapping, begin near zero and cover the declared duration
    - exactly one H.264 1920x1080 yuv420p video stream is required for the current Security 00/01 canon
    - at least one audio stream is mandatory
    - declared ISO duration must be valid and within 1 second of ffprobe duration
    - gate never generates, clones, or substitutes Francisco's voice
