resolved_defects_revision_44:
  - code: SECURITY_RUNTIME_LISTENER_VERDICT_BEFORE_TEARDOWN
    severity: P1
    status: REPAIRED_EXACT_QA_PASS
    discovery: >-
      Several focused Security browser gates retained pageerror/console/requestfailed/HTTP listeners during their
      interactions, but evaluated the collected runtime arrays before browser-context teardown. A late lazy-media,
      navigation or teardown-time resource error could therefore be appended after a gate had already decided PASS,
      leaving the final retained evidence stronger or weaker than the verdict.
    repair: >-
      Added an independent conjunctive runtime-listener lifetime gate for Security 00 + 1.1. It installs runtime/resource
      listeners before navigation, scrolls the whole page to trigger lazy resources, exercises the presentation trajectory
      or Prompt Injection mechanisms, performs inline poster -> play -> pause -> seek, closes the context, and only then
      computes the verdict from the final retained arrays. Its deterministic self-test injects a synthetic post-teardown
      failure and proves that the mutation is rejected. The workflow now requires this gate without changing thresholds.
    site_facing_bytes_changed: false
    exact_qa: PASS_REVISION_44
    exact_run: 34945840966
    exact_artifact: 10387727554
    observed_contexts: 16
    expected_contexts: 16
    dimensions: ES_EN_X_PRESENTATION_PROMPT_X_DESKTOP_1440_MOBILE_390_X_NORMAL_REDUCED
    verdict_basis: POST_CONTEXT_TEARDOWN
    runtime_errors_before_teardown: 0
    runtime_errors_after_teardown: 0
    teardown_appended_runtime_errors: 0
    regression_scope: QA_HARNESS_ONLY_SECURITY_00_01

