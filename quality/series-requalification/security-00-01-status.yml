      Revision 42 exercised ctxmix states 1..4 but durably captured only states 1, 3 and 4. State 2 is the first frame
      where mixed context becomes visible, so DOM/state assertions alone did not satisfy the reinforced real-pixel gate.
    repair: >-
      validate_security_prompt_visual_states.mjs now retains screenshots for all semantic states 1/2/3/4 without
      removing prior evidence. Revision-43 artifact 10383286488 contains 32 ctxmix screenshots: 8 ES/EN ×
      desktop/mobile × normal/reduced contexts × 4 states.
    exact_qa: PASS_REVISION_43
    manual_review: >-
      State 2 was inspected in all eight locale/device/motion contexts together with start/later/final states. No clipping,
      global horizontal overflow, overlap, locale leakage or giant-canvas dependency was observed. The sequence teaches
      mixed context -> changed proposal -> runtime authorization result rather than cosmetic relabeling.
    regression_scope: EVIDENCE_HARNESS_ONLY_SECURITY_1_1

  - code: SECURITY_AUTHORIZATION_CHECK_LABEL_GATE_INCOMPLETE
    severity: P1
