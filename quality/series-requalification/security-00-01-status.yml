active_defect:
  code: RAG_VISUAL_ORDER_RANK_LABEL_ACCESSIBILITY_SEQUENCE_MISMATCH
  status: REPAIRED_PENDING_EXACT_REVIEW
  affected_visual: rag-trigger-fragment
  original_finding: >-
    In the optimized-trigger scenario CSS reordered the poisoned document from its clean position below the
    top-K cut to the first visible row, but the hard-coded visible badge still said rank 4. The other rows
    retained their clean rank badges as well. CSS visual order also diverged from DOM/accessibility reading
    order, so the same state presented incompatible retrieval sequences to sighted and non-visual readers.
  repair: >-
    ES and EN now use one per-mode order model. render() calls syncRanking(), which physically reorders the
    document rows and top-K cut in the DOM and derives each visible rank badge from that same order. Visual
    sequence, DOM/accessibility sequence, cut membership and rank numerals therefore share one state source.
  es_repair_head: 5a483ccc85b8cf56a4d2e68c351cff6f2b426410
  en_repair_head: c08826cc7e9226f72f27b40e587b8dd73a51b92f
  exact_validation_head: 0d42b8b3645c75e21d4d16c2a83eac1817899a63
  deterministic_evidence: PENDING_RUN36
  regression_scope: >-
    Changes are confined to the Security 1.1 RAG snippet in ES and EN. Datacenters and all pre-Datacenters
    reference-series files are untouched by this repair.

