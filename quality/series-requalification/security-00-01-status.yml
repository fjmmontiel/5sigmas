    queries:
      - seguridad-ia narration
      - 01-prompt-injection
      - VOICE_MISSING
      - audio_mix
      - narration asset
    result: NO_AUTHORIZED_SECURITY_NARRATION_FOUND
  google_drive:
    traversed_security_folders: true
    audio_mime_query_result: NO_RESULTS
    targeted_queries:
      - prompt injection mp3
      - prompt injection wav
      - narracion seguridad
      - seguridad-ia mp4
    result: NO_AUTHORIZED_SECURITY_NARRATION_FOUND
  gmail:
    query: 'after:2026/08/01 has:attachment {filename:wav filename:mp3 filename:m4a} {"prompt injection" seguridad 5sigmas} -in:trash -in:spam'
    result: NO_RESULTS
  rejected_substitutes:
    - source: Google Drive VOICE_REPLACEMENT_NOTES.md
      reason: >-
        The historical XTTS/Kokoro POC explicitly says its Kokoro tracks do not imitate
        the user's timbre and are safe alternatives to user-voice cloning. They are not
        Francisco's authorized narration and must not be substituted into this series.
  note: >-
    The bounded connected GitHub + Google Drive + targeted Gmail search found no exact
    authorized Francisco narration for Security 00/01. This does not prove that no asset
    can exist outside connected/searchable surfaces. The correct fail-closed state remains
    VOICE_MISSING.

media_gate:
  script: scripts/validate_security_video_media.py
  integrated_workflow: .github/workflows/series-experience-diagnostic.yml
