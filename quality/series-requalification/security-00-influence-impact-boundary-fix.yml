finding:
  severity: P2
  id: SECURITY00_MODEL_INFLUENCE_VS_EXECUTION_IMPACT_CONFLATION
  previous_es: "Un documento recuperado por RAG, una observación escrita por otro agente, una salida de herramienta o una nota guardada en memoria pueden dejar de ser simples datos y convertirse en una orden operativa si el sistema no separa bien privilegios, contexto y ejecución."
  previous_en: "A document retrieved by RAG, an observation written by another agent, a tool result or a note stored in memory can stop behaving like passive data and become an operational instruction if the system does not separate privileges, context and execution correctly."
  defect: privilege_context_execution_separation_was_worded_as_if_it_determined_whether_untrusted_content_can_influence_the_model_instead_of_bounding_the_consequences_after_influence

correction:
  es: "Untrusted retrieved/tool/memory content can influence the model as if it were an instruction; separating privileges, context and execution does not eliminate that influence and instead limits the data/actions reachable if the model follows it."
  en: "Untrusted retrieved/tool/memory content can influence the model as if it were an instruction; separating privileges, context and execution does not eliminate that influence and instead limits the data/actions reachable if the model follows it."
