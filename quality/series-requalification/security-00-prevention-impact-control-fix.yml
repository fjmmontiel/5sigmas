finding:
  id: SECURITY00_PREVENTION_VS_IMPACT_CONTROL_CONFLATION
  summary: >-
    The series introduction used the broad statement that many apparently reasonable
    mitigations only buy time without closing the underlying path. That framing
    conflated two different mechanisms: controls that reduce the probability that
    untrusted content changes model behavior, and controls that constrain reachable
    data, tools and actions when influence still occurs.
  old_es_fragment: "muchas mitigaciones que parecen razonables solo compran tiempo sin cerrar el camino de fondo"
  old_en_fragment: "many seemingly reasonable mitigations buy time without closing the underlying path"

repair:
  es: >-
    El objetivo ahora separa explícitamente qué controles reducen la probabilidad de
    que contenido no confiable altere el comportamiento del modelo y qué controles
    limitan las consecuencias —datos accesibles, herramientas y acciones— incluso
    cuando esa influencia ocurre.
  en: >-
    The goal now explicitly separates controls that reduce the chance that untrusted
    content changes model behavior from controls that limit the consequences—
    accessible data, tools and actions—even when that influence occurs.
  material_es_en_parity: true
  datacenters_or_pre_datacenters_modified: false

primary_sources_revalidated:
  - OWASP LLM Prompt Injection Prevention Cheat Sheet
  - OWASP AI Agent Security Cheat Sheet
  - OWASP RAG Security Cheat Sheet
  rationale: >-
    Current OWASP guidance separates prompt/data handling and prompt-injection
    mitigations from least privilege, independent authorization and decision/execution
    controls that bound downstream impact.

