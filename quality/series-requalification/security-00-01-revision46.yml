  interpretation: >-
    Revision 46 disproves the candidate classifier assumption that a legitimate seek cancellation must be followed by a
    later 200/206 response. In all eight ES contexts the only media response is already observed immediately before the
    requestfailed event: response seq N is 206 for the exact same source, then requestfailed seq N+1 occurs during the
