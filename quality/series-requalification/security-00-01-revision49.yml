revision_49_touch_diagnosis_and_repair:
  diagnosis: >-
    The previous article-watch gate treated every pre-teardown ERR_ABORTED as fatal. Revision 49 proved that real mobile
    article↔watch navigation and watch-page native media loading legitimately cancel the exact native media request while the
    navigation contract itself succeeds. Seven failures were emitted during watch-interaction and one during article-to-watch.
    A blanket allow-list would be equally incorrect, so the repair is evidence-correlated rather than phase-only.
  repair_commit: 9800bc818901d28b9d8bdae3dfbcb53af7a3b76b
  repair_status: IMPLEMENTED_PENDING_EXACT_QA
  repair_policy:
    - context-close ERR_ABORTED may be expected only during actual teardown
    - navigation media cancellation requires resourceType=media, exact expected native media URL, explicit article-to-watch or watch-to-article phase, and successful destination navigation
    - watch-interaction range cancellation requires exact native media URL, prior HTTP 200/206 for the same Request before cancellation, watch page reached, source match, readyState>=1, and no media.error
    - wrong URL, non-media requests, failed destination, missing response proof, different request, response after abort, unhealthy player, non-abort failures, pageerror, console errors and HTTP errors remain fatal
  local_verification:
    node_syntax_check: PASS
    classifier_self_test: PASS
    positive_cases: 4
    negative_mutations: 12
    browser_exact_qa_after_repair: NOT_RUN_THIS_CHECKPOINT
    reason: GROUP_CI_TO_NEXT_USEFUL_INTEGRATION_MILESTONE

