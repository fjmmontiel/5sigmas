manual_frame_review:
  security02:
    es:
      sample_seconds: [0.0, 12.067, 24.133, 36.2, 48.267, 59.127]
      observed_sequence:
        - Una negativa no es una garantía de seguridad
        - Búsqueda sobre múltiples variantes
        - Optimización adversaria y transferencia
        - Presupuesto Best-of-N
        - Bajar aleatoriedad no elimina la vulnerabilidad
        - La autorización sigue siendo la frontera para tools
    en:
      sample_seconds: [0.0, 9.513, 19.027, 28.54, 38.053, 46.615]
      observed_sequence:
        - A refusal is one observation, not a guarantee
        - Search explores prompt variants
        - Optimize the attack, then test transfer
        - Higher attack budgets increase exposure
        - Stable output is not a security boundary
  security03:
    es:
      sample_seconds: [0.0, 12.067, 24.133, 36.2, 48.267, 59.127]
      observed_sequence:
        - La persistencia amplía el riesgo más allá del turno
        - Una instrucción almacenada puede reaparecer
        - Persistir memoria contaminada crea superficie de ataque
        - Comportamiento latente puede esperar un disparador
        - La procedencia de la memoria debe ser visible
        - La memoria debe poder revocarse
    en:
      sample_seconds: [0.0, 9.513, 19.027, 28.54, 38.053, 46.615]
      observed_sequence:
        - Persistence extends beyond one turn
        - State writes create hidden attack surfaces
        - Trust and provenance on every write
        - Retention is part of the control plane
        - Observability and revocation close the loop
  security04:
    es:
      sample_seconds: [0.0, 12.067, 24.133, 36.2, 48.267, 59.127]
      observed_sequence:
        - Pasar un test no demuestra ausencia de vulnerabilidad
        - Separar capacidades de acciones
        - Mantener evaluación fija y presión adaptativa separadas
        - El evaluador también puede fallar
        - Cada paso debe dejar evidencia
        - Deployment necesita riesgo medido antes del incidente
    en:
      sample_seconds: [0.0, 9.513, 19.027, 28.54, 38.053, 46.615]
      observed_sequence:
        - Test reachable harm, not only prompts
        - The attack path has multiple gates
        - Coverage is a matrix, not a prompt list
        - Evaluators need calibration and observability
        - Release depends on evidence, not confidence
  security05:
    es:
      sample_seconds: [0.0, 12.067, 24.133, 36.2, 48.267, 59.127]
      observed_sequence:
        - Producción segura no depende de que el modelo nunca falle
        - Lectores no confiables no deben poseer tools privilegiadas
        - Mínimo privilegio por herramienta
        - MCP estandariza integración, no confianza
        - Observabilidad y kill path cierran el ciclo
        - Acciones irreversibles necesitan confirmación
    en:
      sample_seconds: [0.0, 9.513, 19.027, 28.54, 38.053, 46.615]
      observed_sequence:
        - Assume a defensive layer will fail
        - Separate untrusted reading from privileged action
        - Least privilege for every tool
        - MCP standardizes integration, not trust
        - Observability and stop mechanisms close the loop
