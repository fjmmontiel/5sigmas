findings:
  - id: P1_SECURITY02_GCG_WHITEBOX_MECHANICS_OMITTED
    severity: P1
    status: CORRECTED_PENDING_EXACT_HEAD_GATE_EXECUTION
    previous_problem: >-
      The chapter described GCG as discrete token search driven only by an evaluation
      function and observed results, omitting that the original GCG optimization is
      white-box and uses model gradients before the resulting suffixes are tested for
      transfer to black-box models.
    correction: >-
      ES and EN now explicitly separate white-box gradient-guided optimization from
      subsequent black-box transfer testing.
    es_commit: c60f6f7e088bd56adcfb2862855064d9d67ee001
    en_commit: d7c1979a3fbc99186a608df8d06734f07d388e05
    deterministic_guard: scripts/validate_security02_source_claims.py
    guard_commit: 4840f280f78dd8ba7cc7ab6df91a43ae9c1fc97f
    guard_self_test_defined: true
    guard_executed_on_exact_head: false

  - id: P2_SECURITY02_TEMPERATURE_ZERO_CAUSAL_OVERCLAIM
    severity: P2
    status: CORRECTED_PENDING_EXACT_HEAD_GATE_EXECUTION
    previous_problem: >-
      The article gave an unsourced causal explanation that deterministic decoding at
      temperature zero merely makes an adversarial result more repeatable.
    correction: >-
      ES and EN now use the narrower current OWASP claim: lowering temperature offers
      minimal protection even at temperature zero and does not remove the adversarial
      surface.
    deterministic_guard: scripts/validate_security02_source_claims.py

  - id: P1_SECURITY02_INTERACTIONS_TOO_COSMETIC
    severity: P1
    status: OPEN
    evidence:
      - docs/snippets/seguridad-ia/02-superficie-jailbreak.html
      - docs/snippets/seguridad-ia/02-attack-budget.html
      - docs/snippets/seguridad-ia/02-outcome-ladder.html
    problem: >-
      Source inspection shows that the current interactions are dominated by dot/bar
      progress, selected-card highlighting and label/copy changes. They do not yet make
      the attack search, adaptive feedback, control boundary or outcome transition
      observable through a sufficiently explicit model as required by amendment
      5655569434 and the current owner contract.
    next_action: >-
      Redesign the smallest coherent Security02 visual mechanism so user input changes
      an explicit attack/search state or failure path and produces a different modeled
      outcome; then mirror/localize and perform real desktop/mobile normal/reduced pixel
      and pedagogy review.

