finding:
  severity: P2
  id: SECURITY00_SOFTWARE_CODE_DATA_BOUNDARY_OVERGENERALIZATION
  previous_es: "si separas bien el código de los datos, las clases de ataque principales quedan acotadas"
  previous_en: "if code and data are cleanly separated, the main attack classes are easier to bound"
  problem: >-
    The statement generalized a useful injection-security boundary into a claim about
    the main software attack classes. OWASP Injection Prevention and MITRE CWE-74
    support the narrower mechanism: untrusted data reaching an interpreter can alter
    parsing/control when special elements are not safely separated or neutralized.
    They do not support the broader ranking over software security as a whole.

repair:
  es: >-
    En seguridad de software, una defensa clásica contra las inyecciones consiste en
    impedir que datos no confiables modifiquen la sintaxis o el significado de una
    instrucción que ejecuta un intérprete. Esa frontera no resuelve todas las clases
    de ataque, pero sí evita que esos datos se conviertan en control por el mismo canal.
  en: >-
    In software security, a classic defense against injection is to prevent untrusted
    data from changing the syntax or meaning of an instruction executed by an
    interpreter. That boundary does not solve every attack class, but it does stop
    that data from becoming control through the same channel.
  es_en_material_parity: true
