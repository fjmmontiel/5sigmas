shared_browser_resource_exact_qa:
  state: FAIL
  requested_routes: 16
  profiles: [desktop-normal, desktop-reduced, mobile-normal, mobile-reduced]
  contexts: 64
  failing_contexts: 64
  failure_signature:
    event: requestfailed
    error: net::ERR_ABORTED
    resource_type: media
    phase: lazy-load
    navigation_request: false
  affected_scope: SECURITY_PLUS_DATACENTERS_PLUS_PRE_DATACENTERS_REFERENCE_ROUTES_ES_EN
  browser_pass_granted: false
  diagnosis: >-
    The hardened shared gate forced video.load() during its lazy-resource exercise even when a native MP4 request was already
    active, and its classifier accepted ERR_ABORTED only during context teardown. Chromium can cancel a valid MP4 metadata/range
    request after successful response headers or when a same-source request supersedes it. Revision 55 therefore exposed a
    deterministic shared-gate false positive rather than evidence that all 64 published contexts had broken media.

