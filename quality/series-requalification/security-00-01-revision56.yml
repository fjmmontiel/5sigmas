new_diagnosis:
  defect: MEDIA_METADATA_EXERCISE_STILL_SELF_CANCELS
  cause: >-
    exerciseLazyResources changed preload from none to metadata and then synchronously called video.load() whenever networkState was
    still NETWORK_EMPTY. Chromium can queue resource selection from the preload change before networkState updates; load() in the
    same task then resets/cancels that valid request. The NETWORK_EMPTY guard therefore did not remove the race exposed in revision 55.
  evidence:
    - REVISION56_64_OF_64_SAME_LAZY_LOAD_ABORT_SIGNATURE
    - REVISION56_SHARED_REPORT_EXPECTED_ABORTS_0
    - SAME_HEAD_FOCUSED_SECURITY_REAL_PLAYBACK_GATES_PASS

