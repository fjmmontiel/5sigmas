diagnosis:
  proven:
    - All three rev70 timeouts are ES, 390px, reduced-motion and occur inside the current coarse lazy-load phase.
    - Matching locale/motion/viewport peers for the same routes complete lazy-load in roughly 0.8-1.1 seconds.
    - Lowering full-sweep concurrency from four workers to two did not eliminate the timeout class.
    - The current lazy traversal uses an in-page setTimeout(20) between viewport-sized scroll steps while two browser contexts run concurrently.
  hypothesis_not_yet_certified:
    - Renderer-side timer throttling or renderer scheduling during the in-page traversal is the leading auditor-side explanation for the ~24 second stalls; this must not be reported as proven until the traversal implementation is changed and rerun.
  rejected_actions:
    - Do not increase the 25000 ms context timeout.
    - Do not mark these routes defective from timeout alone.
    - Do not advance BROWSER_PASS from this run.
next_exact_fix:
  - Replace renderer-timed lazy traversal with host-controlled viewport scroll steps while retaining full-document lazy-load coverage.
  - Split lazy-load telemetry into fonts, traversal, post-scroll settle and DOM inspection so a future timeout names the exact subphase.
  - Add deterministic self-checks for traversal planning and preserve fail-closed request listeners through teardown.
  - Run focused mobile/reduced reproductions first; only then run one 84x4 integration sweep if the focused reproductions are clean.
