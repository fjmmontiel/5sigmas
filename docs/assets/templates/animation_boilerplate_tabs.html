<!--
  5SIGMAS Animation Boilerplate (Tabs)
  Include with: {{ include_html("snippets/<path>.html") }}
  Fullscreen is on by default. Set data-anim-fullscreen="off" to disable.
  The fullscreen button/modal belong to the global include_html shell; do not add local fullscreen UI here.
  Branding (footer/logo/shell) is injected by include_html(...), do not embed it here.
-->

<div class="ta-demo ta-tabs demo-slug" data-anim-tabs data-default="tab1" data-anim-fullscreen="on" data-anim-contrast="force">
  <section class="ta-section ta-section--header">
    <div class="ta-tabs-title">Titulo de la animacion</div>
    <div class="ta-tabs-subtitle">Resumen breve de lo que explica esta demo.</div>
  </section>

  <section class="ta-section ta-section--tabs">
    <div class="ta-tablist" role="tablist" aria-label="Secciones de la animacion">
      <button class="ta-tab" type="button" role="tab" aria-selected="true" data-tab="tab1">Tab 1</button>
      <button class="ta-tab" type="button" role="tab" aria-selected="false" data-tab="tab2">Tab 2</button>
    </div>

    <div class="ta-panels">
      <section class="ta-panel" role="tabpanel" data-panel="tab1">
        <div class="ta-grid">
          <div class="ta-vizbox">Visual principal</div>
          <div class="ta-card">
            <div class="ta-card-k">Interpretacion</div>
            <div class="ta-card-v">Explica el comportamiento de la animacion en este tab.</div>
          </div>
        </div>
      </section>

      <section class="ta-panel" role="tabpanel" data-panel="tab2" hidden>
        <div class="ta-grid">
          <div class="ta-vizbox">Visual alternativo</div>
          <div class="ta-card">
            <div class="ta-card-k">Comparativa</div>
            <div class="ta-card-v">Describe que cambia respecto al primer tab.</div>
          </div>
        </div>
      </section>
    </div>
  </section>

  <section class="ta-section ta-section--notes">
    <div class="ta-card-k">Notas</div>
    <div class="ta-card-v">Puedes anadir notas operativas, supuestos o limitaciones.</div>
  </section>
</div>

<!--
  If you add custom CSS, scope every selector with `.demo-slug` to avoid cross-snippet style leakage.
  Example: `.demo-slug .demo-copy { ... }`
-->
<style>
  /* Minimal standalone fallback styles. Shared repo CSS can override/extend these. */
  .demo-slug .ta-tablist { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .demo-slug .ta-tab { cursor: pointer; }
  .demo-slug .ta-panel[hidden] { display: none; }
</style>
<script>
  (() => {
    function bind(root) {
      if (!root || root.__portableTabsInited) return;
      root.__portableTabsInited = true;
      const tabs = Array.from(root.querySelectorAll('[data-tab]'));
      const panels = Array.from(root.querySelectorAll('[data-panel]'));
      if (!tabs.length || !panels.length) return;
      const defaultKey = (root.dataset.default || tabs[0].dataset.tab || '').trim();

      function show(key) {
        tabs.forEach((tab) => tab.setAttribute('aria-selected', tab.dataset.tab === key ? 'true' : 'false'));
        panels.forEach((panel) => { panel.hidden = panel.dataset.panel !== key; });
      }

      root.addEventListener('click', (ev) => {
        const btn = ev.target.closest('[data-tab]');
        if (!btn || !root.contains(btn)) return;
        show(btn.dataset.tab || defaultKey);
      });

      root.addEventListener('keydown', (ev) => {
        const btn = ev.target.closest('[data-tab]');
        if (!btn || !root.contains(btn)) return;
        const i = tabs.indexOf(btn);
        if (i < 0) return;
        let j = -1;
        if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
        else if (ev.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
        else if (ev.key === 'Home') j = 0;
        else if (ev.key === 'End') j = tabs.length - 1;
        else return;
        ev.preventDefault();
        tabs[j].focus();
        show(tabs[j].dataset.tab || defaultKey);
      });

      show(defaultKey);
    }

    if (window.TabbedAnimations && typeof window.TabbedAnimations.initAll === 'function') {
      window.TabbedAnimations.initAll();
      return;
    }

    document.querySelectorAll('.demo-slug[data-anim-tabs]').forEach(bind);
  })();
</script>
