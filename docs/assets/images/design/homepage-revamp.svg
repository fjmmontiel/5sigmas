<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500"><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset=".52" stop-color="#17244a"/><stop offset="1" stop-color="#0a1020"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#13203d" flood-opacity=".16"/></filter></defs><rect width="1440" height="1500" fill="#f5f7fb"/><rect width="1440" height="68" fill="#0a1020"/><circle cx="64" cy="34" r="21" fill="#11a89b"/><path d="M52 24h24M52 34h18M52 44h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="100" y="43" font-family="Arial" font-size="20" font-weight="700" fill="#fff">5sigmas</text><text x="850" y="42" font-family="Arial" font-size="14" fill="#c7d1e1">Inicio</text><text x="925" y="42" font-family="Arial" font-size="14" fill="#c7d1e1">Series</text><text x="995" y="42" font-family="Arial" font-size="14" fill="#c7d1e1">Artículos técnicos</text><text x="1130" y="42" font-family="Arial" font-size="14" fill="#c7d1e1">Próximamente</text><text x="1260" y="42" font-family="Arial" font-size="14" fill="#c7d1e1">Sobre</text><rect x="80" y="112" width="1280" height="550" rx="32" fill="url(#hero)" filter="url(#s)"/><g stroke="#fff" stroke-opacity=".035"><path d="M80 180h1280M80 248h1280M80 316h1280M80 384h1280M80 452h1280M80 520h1280M80 588h1280"/><path d="M160 112v550M240 112v550M320 112v550M400 112v550M480 112v550M560 112v550M640 112v550M720 112v550M800 112v550M880 112v550M960 112v550M1040 112v550M1120 112v550M1200 112v550M1280 112v550"/></g><text x="140" y="180" font-family="monospace" font-size="15" font-weight="700" fill="#6ed6cd">— 5Σ · SEÑAL SOBRE RUIDO</text><text x="140" y="265" font-family="Arial" font-size="72" font-weight="800" letter-spacing="-4" fill="#fff">Entender la IA</text><text x="140" y="342" font-family="Arial" font-size="72" font-weight="800" letter-spacing="-4" fill="#fff">antes de comprar</text><text x="140" y="419" font-family="Arial" font-size="72" font-weight="800" letter-spacing="-4" fill="#fff">el hype.</text><text x="140" y="470" font-family="Arial" font-size="19" fill="#b9c6da">Fundamentos, papers y sistemas reales para construir criterio técnico propio.</text><rect x="140" y="520" width="190" height="50" rx="25" fill="#fff"/><text x="169" y="551" font-family="Arial" font-size="15" font-weight="700" fill="#0a1020">Explorar las series</text><rect x="344" y="520" width="190" height="50" rx="25" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".25"/><text x="373" y="551" font-family="Arial" font-size="15" font-weight="700" fill="#fff">Notas técnicas</text><g><rect x="900" y="170" width="360" height="112" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/><text x="930" y="202" font-family="monospace" font-size="12" font-weight="700" fill="#83ddd4">FUENTE</text><text x="930" y="232" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Primarias antes que narrativa</text><text x="930" y="258" font-family="Arial" font-size="13" fill="#9faec4">Papers, repositorios, datasets y benchmarks.</text><rect x="900" y="298" width="360" height="112" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/><text x="930" y="330" font-family="monospace" font-size="12" font-weight="700" fill="#83ddd4">MÉTODO</text><text x="930" y="360" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Hecho ≠ interpretación</text><text x="930" y="386" font-family="Arial" font-size="13" fill="#9faec4">Evidencia, inferencia y límites separados.</text><rect x="900" y="426" width="360" height="112" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/><text x="930" y="458" font-family="monospace" font-size="12" font-weight="700" fill="#83ddd4">OBJETIVO</text><text x="930" y="488" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Fundamentos → producción</text><text x="930" y="514" font-family="Arial" font-size="13" fill="#9faec4">Latencia, coste, evaluación y operación.</text></g><text x="80" y="744" font-family="monospace" font-size="14" font-weight="700" fill="#11a89b">— ELIGE UNA RUTA</text><text x="80" y="798" font-family="Arial" font-size="38" font-weight="800" letter-spacing="-2" fill="#0a1020">Entra por el nivel que necesitas.</text><g filter="url(#s)"><rect x="80" y="850" width="400" height="270" rx="22" fill="#fff" stroke="#0a1020" stroke-opacity=".1"/><rect x="520" y="850" width="400" height="270" rx="22" fill="#fff" stroke="#0a1020" stroke-opacity=".1"/><rect x="960" y="850" width="400" height="270" rx="22" fill="#fff" stroke="#0a1020" stroke-opacity=".1"/></g><text x="112" y="890" font-family="monospace" font-size="12" font-weight="700" fill="#11a89b">01 / FUNDAMENTOS</text><text x="112" y="965" font-family="Arial" font-size="24" font-weight="800" fill="#0a1020">Construye el vocabulario</text><text x="112" y="997" font-family="Arial" font-size="24" font-weight="800" fill="#0a1020">correcto</text><text x="112" y="1040" font-family="Arial" font-size="14" fill="#64718a">Qué es IA, qué cambia con la generativa</text><text x="112" y="1062" font-family="Arial" font-size="14" fill="#64718a">y qué debes dominar antes de avanzar.</text><text x="552" y="890" font-family="monospace" font-size="12" font-weight="700" fill="#5368d9">02 / FRONTERA</text><text x="552" y="965" font-family="Arial" font-size="24" font-weight="800" fill="#0a1020">Entiende los modelos</text><text x="552" y="997" font-family="Arial" font-size="24" font-weight="800" fill="#0a1020">actuales</text><text x="552" y="1040" font-family="Arial" font-size="14" fill="#64718a">Multimodalidad, razonamiento y límites</text><text x="552" y="1062" font-family="Arial" font-size="14" fill="#64718a">reales de la frontera.</text><text x="992" y="890" font-family="monospace" font-size="12" font-weight="700" fill="#eaa72d">03 / SISTEMAS</text><text x="992" y="965" font-family="Arial" font-size="24" font-weight="800" fill="#0a1020">Lleva la teoría a</text><text x="992" y="997" font-family="Arial" font-size="24" font-weight="800" fill="#0a1020">producción</text><text x="992" y="1040" font-family="Arial" font-size="14" fill="#64718a">Arquitectura, runtime, tool calling, coste</text><text x="992" y="1062" font-family="Arial" font-size="14" fill="#64718a">y evaluación operacional.</text><text x="80" y="1210" font-family="monospace" font-size="14" font-weight="700" fill="#11a89b">— CONTENIDO DESTACADO</text><text x="80" y="1264" font-family="Arial" font-size="38" font-weight="800" letter-spacing="-2" fill="#0a1020">Ideas que merecen más de un titular.</text><rect x="80" y="1310" width="1280" height="130" rx="22" fill="#fff" stroke="#0a1020" stroke-opacity=".1"/><text x="112" y="1350" font-family="monospace" font-size="12" font-weight="700" fill="#11a89b">RUTA HISTÓRICA · 5 CAPÍTULOS</text><text x="112" y="1390" font-family="Arial" font-size="25" font-weight="800" fill="#0a1020">De las cavernas a la AGI</text><text x="1010" y="1390" font-family="Arial" font-size="15" font-weight="700" fill="#0a1020">Recorrer la historia completa →</text></svg>