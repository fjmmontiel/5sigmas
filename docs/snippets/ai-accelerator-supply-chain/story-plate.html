<section id="{{ stage_id }}" class="ac-story-plate" data-anim-fullscreen="off" data-anim-contrast="auto">
  <div class="ac-story-layout">
    <h2>{{ stage_title }}</h2>
    <figure>
      <img src="/assets/images/ai-accelerator-supply-chain/{{ picture }}.webp" alt="{{ picture_alt }}" loading="lazy" decoding="async">
      <figcaption>{{ picture_caption }} · <a href="{{ source_url }}">{{ source_name }}</a></figcaption>
    </figure>
    <p class="ac-story-copy">{{ story }}</p>
    <p class="ac-story-next">{{ handoff }}</p>
  </div>
</section>
