              '<div class="rv-pos-eq">= 1</div>' +
            '</div>' +
            '<div class="rv-pos-row">' +
              '<div class="rv-digit-cell rv-digit-cell--empty"></div>' +
              '<div class="rv-digit-cell">1</div>' +
              '<div class="rv-digit-cell rv-digit-cell--zero">0</div>' +
              '<div class="rv-pos-eq">= 10</div>' +
            '</div>' +
            '<div class="rv-pos-row">' +
              '<div class="rv-digit-cell">1</div>' +
              '<div class="rv-digit-cell rv-digit-cell--zero">0</div>' +
              '<div class="rv-digit-cell rv-digit-cell--zero">0</div>' +
              '<div class="rv-pos-eq">= 100</div>' +
            '</div>' +
          '</div>' +
          '<div class="rv-zero-note">el 0 no vale nada — pero vale todo según dónde esté</div>' +
        '</div>';
      }
    },
    {
      era: 'Francia',
      date: '≈ 1637',
      color: '#8b5cf6',
      title: 'Geometría analítica (Descartes)',
      desc: 'La Géométrie de Descartes unifica álgebra y geometría: una curva es una ecuación, una posición es un par de números. El espacio geométrico se convierte en un sistema algebraico calculable. El mundo físico, por primera vez, es manipulable con reglas.',
      key: 'El espacio geométrico como sistema algebraico',
      next: 'Hace posible el cálculo diferencial: describir cómo cambia una función en cada punto',
      visual: function(c) {
        return '<div class="rv-coord">' +
          '<div class="rv-axes-wrap">' +
            '<div class="rv-axis-y"></div>' +
            '<div class="rv-axis-x"></div>' +
            '<div class="rv-axis-lbl rv-axis-lbl--y">y</div>' +
            '<div class="rv-axis-lbl rv-axis-lbl--x">x</div>' +
            '<div class="rv-curve-point" style="left:48px;bottom:55px"></div>' +
            '<div class="rv-curve-point" style="left:72px;bottom:68px;opacity:.7"></div>' +
            '<div class="rv-curve-point" style="left:96px;bottom:55px;opacity:.4"></div>' +
          '</div>' +
          '<div class="rv-coord-formula">y = f(x)</div>' +
          '<div class="rv-coord-note">una curva en el espacio = una ecuación algebraica</div>' +
        '</div>';
      }
    },
    {
      era: 'Europa — Newton / Leibniz',
      date: '≈ 1666 – 1676',
      color: '#324AB2',
      title: 'El cálculo diferencial e integral',
      desc: 'Herramientas para describir el cambio de magnitudes en cada punto. Sin cálculo no hay gradiente. Sin gradiente no hay descenso de gradiente. Sin descenso de gradiente no hay entrenamiento de redes neuronales. La IA actual hereda directamente este trabajo.',
      key: 'Descripción matemática del cambio — fundamento del entrenamiento de IA',
      next: '→ directamente al backpropagation y los LLMs actuales (350 años después)',
      final: true,
      visual: function(c) {
        return '<div class="rv-calc">' +
          '<div class="rv-calc-formulas">' +

            '<div class="rv-calc-step"><div class="rv-calc-dot"></div>Gradiente → descenso de gradiente</div>' +
            '<div class="rv-calc-step"><div class="rv-calc-dot"></div>Descenso → backpropagation</div>' +
            '<div class="rv-calc-step rv-calc-step--final"><div class="rv-calc-dot"></div>Backprop → redes neuronales modernas</div>' +
          '</div>' +
        '</div>';
      }
    }
  ];

  var current = 0;

  function boot() {
    var wrap = document.querySelector('[data-demo="01-timeline-representar"]');
    if (!wrap || wrap.dataset.repReady) return;
    wrap.dataset.repReady = '1';

    var card   = wrap.querySelector('#repCard');
    var visual = wrap.querySelector('#repVisual');
    var chip   = wrap.querySelector('#repChip');
    var era    = wrap.querySelector('#repEra');
    var date   = wrap.querySelector('#repDate');
    var title  = wrap.querySelector('#repTitle');
    var desc   = wrap.querySelector('#repDesc');
    var key    = wrap.querySelector('#repKey');
    var bridge = wrap.querySelector('#repBridgeText');
    var dots   = wrap.querySelector('#repDots');
    var prev   = wrap.querySelector('#repPrev');
    var next   = wrap.querySelector('#repNext');

    // Build dots
    dots.innerHTML = '';
    STEPS.forEach(function(_, i) {
      var d = document.createElement('button');
      d.className = 'rep-dot' + (i === 0 ? ' rep-dot--active' : '');
      d.setAttribute('aria-label', 'Paso ' + (i + 1));
      d.addEventListener('click', function() { go(i); });
      dots.appendChild(d);
    });

    function setColor(color) {
      wrap.style.setProperty('--rstep', color);
    }

    function render(idx, dir) {
      var s = STEPS[idx];
      setColor(s.color);

      if (dir) {
        card.classList.add('rep-card--out');
      }

      setTimeout(function() {
        chip.textContent   = 'Paso ' + (idx + 1) + ' / ' + STEPS.length;
        era.textContent    = s.era;
        date.textContent   = s.date;
        title.textContent  = s.title;
        desc.textContent   = s.desc;
        key.textContent    = s.key;
        bridge.textContent = s.next;
        visual.innerHTML   = s.visual(s.color);

        if (s.final) {
          wrap.querySelector('#repBridge').style.borderTopColor = 'color-mix(in srgb,' + s.color + ' 30%, var(--rbd))';
        }

        // Update dots
        dots.querySelectorAll('.rep-dot').forEach(function(d, i) {
          d.classList.toggle('rep-dot--active', i === idx);
        });

        prev.disabled = idx === 0;
        next.textContent = s.final ? '← Inicio' : 'Siguiente →';

        card.classList.remove('rep-card--out');
        card.classList.add('rep-card--in');
        setTimeout(function() { card.classList.remove('rep-card--in'); }, 300);
      }, dir ? 220 : 0);
    }

    function go(idx) {
      var dir = idx > current ? 1 : -1;
      current = Math.max(0, Math.min(STEPS.length - 1, idx));
      render(current, dir);
    }

    prev.addEventListener('click', function() { if (current > 0) go(current - 1); });
    next.addEventListener('click', function() {
      if (current < STEPS.length - 1) go(current + 1);
      else go(0);
    });

    render(0, null);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
  else boot();
  if (typeof document$ !== 'undefined' && document$.subscribe) document$.subscribe(boot);
})();
</script>
