<div class="sm-wrap" data-state="{{ data_state }}" data-level="{{ data_level }}">
  <div class="sm-chips">

    <span class="sm-chip sm-chip--status">
      <span class="sm-dot" aria-hidden="true"></span>
      <span class="sm-chip-label">{{ status_label }}</span>
    </span>

    <span class="sm-chip sm-chip--level">
      <svg class="sm-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2" y="10" width="2.5" height="4" rx=".5" fill="currentColor"/>
        <rect x="6.75" y="7" width="2.5" height="7" rx=".5" fill="currentColor"/>
        <rect x="11.5" y="4" width="2.5" height="10" rx=".5" fill="currentColor"/>
      </svg>
      <span class="sm-chip-label">{{ level_label }}</span>
    </span>

    <span class="sm-chip sm-chip--time">
      <svg class="sm-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 5v3.5l2 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="sm-chip-label">{{ data_time }}</span>
    </span>

    <span class="sm-chip sm-chip--count">
      <svg class="sm-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M5 7h6M5 10h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span class="sm-chip-label">{{ count_label }}</span>
    </span>

  </div>
  {{ extra_rows }}
</div>

<style>

  --sm-wip: #FFB343;
  --sm-bg: var(--md-default-bg-color, #fff);
  --sm-fg: var(--md-default-fg-color, #0f172a);

  --sm-f: "Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;

  margin: 0 0 1.4rem;
  padding: 10px 14px;
  border: 1px solid var(--sm-bd);
  border-radius: 12px;
  background: color-mix(in srgb, var(--sm-bg) 97%, #0f172a 3%);
  font-family: var(--sm-f);
  -webkit-font-smoothing: antialiased;
}

[data-md-color-scheme="slate"] .sm-wrap {
  --sm-bg: var(--md-default-bg-color, #0f172a);

  --sm-muted: rgba(226,232,240,.52);
}

}

.sm-wrap .series-meta-row {

  align-items: baseline;
  gap: 4px;
  margin-top: 8px;
