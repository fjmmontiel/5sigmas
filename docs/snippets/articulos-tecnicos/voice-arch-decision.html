<!-- GOLDEN_VISUAL_CONTRACT
learning_objective: Mostrar cómo la propiedad que se quiere proteger desplaza la arquitectura de modalidad hacia más fronteras textuales explícitas, un compromiso audio-native+TTS o mayor continuidad acústica.
mechanism: Un mapa conceptual sitúa full cascade, audio-native+TTS y speech-to-speech sobre dos ejes estructurales; al cambiar la prioridad, un vector y una diana se mueven hacia una región distinta del mapa.
visual_variables: x-position=continuidad acústica del camino principal; y-position=fronteras textuales obligatorias y sustituibles; vector direction=presión de diseño; target position=región favorecida por la prioridad elegida.
why_visual: La prosa enumera trade-offs, pero el mapa permite ver simultáneamente que las tres opciones ocupan posiciones estructurales distintas y que cambiar la propiedad prioritaria cambia la dirección de la decisión, no un ranking universal.
-->
<section class="s5v s5v-decision s5v-decision-map s5v--wide" data-s5v-stepper data-s5v-steps="3" data-step="1" data-anim-fullscreen="on" data-anim-contrast="off" aria-label="Mapa conceptual de decisión entre full cascade, audio-native con TTS y speech-to-speech">
  <style>
    .s5v-decision-map,.s5v-decision-map *{box-sizing:border-box}
    .s5v-decision-map{--ink:#07191b;--muted:#59686b;--line:rgba(7,25,27,.14);--soft:#f5f8f7;--accent:#7357ff;--accent-soft:#f0edff;--audio:#0c8392;--audio-soft:#e5f5f6;--text:#b36a00;--text-soft:#fff2dc;color:var(--ink);font-family:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;margin:28px auto 34px;max-width:1380px}
    .s5v-decision-map .s5v__canvas{padding:30px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#fff,#fbfcfc);box-shadow:0 22px 54px rgba(18,35,39,.1)}
    .s5v-decision-map .s5v__head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:18px}
    .s5v-decision-map .s5v__head>div{min-width:0}
    .s5v-decision-map .s5v__kicker{font-size:.73rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--audio)}
    .s5v-decision-map h3{margin:7px 0 0;font-size:clamp(1.65rem,3vw,2.55rem);line-height:1.02;letter-spacing:-.04em}
    .s5v-decision-map .s5v__head p{max-width:440px;margin:0;color:var(--muted);font-size:.82rem;line-height:1.45;font-weight:700;text-align:right}
    .s5v-decision-map .s5v__steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
    .s5v-decision-map .s5v__steps button{appearance:none;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:9px 13px;font:850 .72rem/1 "Avenir Next","Avenir","Segoe UI",sans-serif;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease}
    .s5v-decision-map .s5v__steps button:hover{transform:translateY(-1px)}
    .s5v-decision-map .s5v__steps button[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(115,87,255,.35);color:#4d37bf}
    .s5v-decision-map__figure{margin:0}
    .s5v-decision-map__plot{position:relative;min-height:410px;border-left:2px solid rgba(7,25,27,.38);border-bottom:2px solid rgba(7,25,27,.38);margin:34px 34px 18px 82px;background:linear-gradient(90deg,transparent 49.8%,rgba(7,25,27,.055) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(7,25,27,.055) 50%,transparent 50.2%),radial-gradient(circle at 50% 50%,rgba(115,87,255,.035),transparent 56%)}
    .s5v-decision-map__plot::after{content:"";position:absolute;right:-3px;bottom:-5px;border-left:8px solid rgba(7,25,27,.45);border-top:5px solid transparent;border-bottom:5px solid transparent}
    .s5v-decision-map__plot::before{content:"";position:absolute;left:-5px;top:-3px;border-bottom:8px solid rgba(7,25,27,.45);border-left:5px solid transparent;border-right:5px solid transparent}
    .s5v-decision-map__axis-x{position:absolute;right:0;bottom:-29px;color:var(--muted);font-size:.62rem;font-weight:900;letter-spacing:.02em}
    .s5v-decision-map__axis-y{position:absolute;left:-76px;top:4px;width:66px;color:var(--muted);font-size:.62rem;font-weight:900;line-height:1.18;text-align:right}
    .s5v-decision-map__origin{position:absolute;left:-1px;bottom:-29px;color:var(--muted);font-size:.56rem;font-weight:750}
    .s5v-decision-map__node{position:absolute;width:min(190px,30%);transform:translate(-50%,-50%);padding-left:18px;z-index:3}
    .s5v-decision-map__node::after{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px #fff,0 0 0 5px rgba(7,25,27,.16)}
    .s5v-decision-map__node b{display:block;font-size:.78rem;line-height:1.15}
    .s5v-decision-map__node span{display:block;margin-top:4px;color:var(--muted);font-size:.61rem;line-height:1.25;font-weight:700}
    .s5v-decision-map__node--cascade{left:20%;top:21%}
    .s5v-decision-map__node--half{left:51%;top:50%}
    .s5v-decision-map__node--s2s{left:81%;top:79%}
    .s5v-decision-map__node--cascade::before,.s5v-decision-map__node--half::before,.s5v-decision-map__node--s2s::before{content:"";position:absolute;left:-6px;top:-1px;width:21px;height:21px;border-radius:50%;border:2px solid transparent;transition:border-color .16s ease,transform .16s ease}
    .s5v-decision-map[data-step="1"] .s5v-decision-map__node--cascade::before,.s5v-decision-map[data-step="2"] .s5v-decision-map__node--half::before,.s5v-decision-map[data-step="3"] .s5v-decision-map__node--s2s::before{border-color:rgba(115,87,255,.55);transform:scale(1.12)}
    .s5v-decision-map__vector{position:absolute;left:50%;top:54%;width:29%;height:3px;background:var(--accent);transform-origin:0 50%;z-index:2;transition:left .22s ease,top .22s ease,width .22s ease,transform .22s ease}
    .s5v-decision-map__vector::after{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent}
    .s5v-decision-map__target{position:absolute;width:34px;height:34px;border:3px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(115,87,255,.09);z-index:4;transition:left .22s ease,top .22s ease}
    .s5v-decision-map[data-step="1"] .s5v-decision-map__vector{left:50%;top:55%;width:38%;transform:rotate(221deg)}
    .s5v-decision-map[data-step="1"] .s5v-decision-map__target{left:20%;top:21%}
    .s5v-decision-map[data-step="2"] .s5v-decision-map__vector{left:28%;top:72%;width:34%;transform:rotate(-40deg)}
    .s5v-decision-map[data-step="2"] .s5v-decision-map__target{left:51%;top:50%}
    .s5v-decision-map[data-step="3"] .s5v-decision-map__vector{left:50%;top:45%;width:39%;transform:rotate(39deg)}
    .s5v-decision-map[data-step="3"] .s5v-decision-map__target{left:81%;top:79%}
    .s5v-decision-map__legend{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:start;margin:6px 0 0 82px;color:var(--muted);font-size:.64rem;line-height:1.35;font-weight:720}
    .s5v-decision-map__legend i{width:22px;height:3px;margin-top:7px;background:var(--accent);border-radius:99px}
    .s5v-decision-map__state{margin-top:16px;padding:13px 15px;border-radius:15px;background:var(--soft);border:1px solid var(--line);font-size:.72rem;line-height:1.42;font-weight:750;color:var(--muted)}
    .s5v-decision-map__state span{display:none}
    .s5v-decision-map[data-step="1"] .s5v-decision-map__state [data-s5v-copy="1"],.s5v-decision-map[data-step="2"] .s5v-decision-map__state [data-s5v-copy="2"],.s5v-decision-map[data-step="3"] .s5v-decision-map__state [data-s5v-copy="3"]{display:inline}
    .s5v-decision-map__state strong{color:var(--ink)}
    .s5v-decision-map__caption{margin:12px 0 0 82px;color:var(--muted);font-size:.61rem;line-height:1.35;font-weight:720}
    @media(max-width:720px){
      .s5v-decision-map .s5v__canvas{padding:20px 14px;border-radius:22px}
      .s5v-decision-map .s5v__head{display:grid;gap:9px}.s5v-decision-map .s5v__head p{text-align:left}
      .s5v-decision-map__plot{min-height:360px;margin:34px 8px 18px 62px}
      .s5v-decision-map__axis-y{left:-59px;width:52px;font-size:.55rem}
      .s5v-decision-map__axis-x{font-size:.55rem}
      .s5v-decision-map__node{width:36%;padding-left:15px}
      .s5v-decision-map__node b{font-size:.66rem}.s5v-decision-map__node span{font-size:.53rem}
      .s5v-decision-map__legend,.s5v-decision-map__caption{margin-left:62px}
    }
    @media(prefers-reduced-motion:reduce){.s5v-decision-map *{transition-duration:0s!important;animation:none!important}}
  </style>
  <div class="s5v__canvas">
    <header class="s5v__head">
      <div><span class="s5v__kicker">Decisión</span><h3>¿Qué propiedad quieres proteger?</h3></div>
      <p>La arquitectura cambia el tipo de control que conservas.</p>
    </header>
    <div class="s5v__steps" aria-label="Prioridad de diseño">
      <button data-s5v-step="1">Fronteras</button>
      <button data-s5v-step="2">Señal</button>
      <button data-s5v-step="3">Continuidad</button>
    </div>
    <figure class="s5v-decision-map__figure">
      <div class="s5v-decision-map__plot" aria-label="Mapa conceptual con continuidad acústica en el eje horizontal y fronteras textuales explícitas en el vertical">
        <span class="s5v-decision-map__axis-y">más fronteras textuales obligatorias ↑</span>
        <span class="s5v-decision-map__axis-x">más continuidad acústica →</span>
        <span class="s5v-decision-map__origin">camino principal</span>
        <div class="s5v-decision-map__node s5v-decision-map__node--cascade"><b>Full cascade</b><span>fronteras explícitas y componentes sustituibles</span></div>
        <div class="s5v-decision-map__node s5v-decision-map__node--half"><b>Audio-native + TTS</b><span>audio original al modelo y voz separada</span></div>
        <div class="s5v-decision-map__node s5v-decision-map__node--s2s"><b>Speech-to-speech</b><span>continuidad acústica y menos fronteras de modalidad</span></div>
        <div class="s5v-decision-map__vector" aria-hidden="true"></div>
        <div class="s5v-decision-map__target" aria-hidden="true"></div>
      </div>
      <div class="s5v-decision-map__legend"><i aria-hidden="true"></i><span>El vector muestra cómo cambia la dirección de diseño al cambiar la propiedad prioritaria; no mide calidad ni latencia.</span></div>
      <div class="s5v-decision-map__state">
        <span data-s5v-copy="1"><strong>Proteger fronteras:</strong> favorece contratos textuales visibles y componentes sustituibles.</span>
        <span data-s5v-copy="2"><strong>Proteger señal + voz:</strong> favorece conservar audio original hacia el modelo sin acoplar la voz al mismo modelo.</span>
        <span data-s5v-copy="3"><strong>Proteger continuidad acústica:</strong> favorece reducir fronteras de modalidad en el camino principal.</span>
      </div>
      <figcaption class="s5v-decision-map__caption">Mapa conceptual ordinal, no benchmark cuantitativo. La posición resume la estructura de modalidad; el runtime, el provider y el canal siguen pudiendo cambiar el resultado operativo.</figcaption>
    </figure>
  </div>
</section>
