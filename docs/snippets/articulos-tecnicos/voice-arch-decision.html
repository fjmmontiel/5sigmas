<!-- GOLDEN_VISUAL_CONTRACT
learning_objective: Show how the modality architecture shifts as the product protects explicit text boundaries, direct acoustic evidence with a separate voice layer, or end-to-end acoustic continuity.
mechanism: A two-axis ordinal map places full cascade, audio-native plus TTS, and speech-to-speech by mandatory text boundaries and acoustic continuity. Changing the design priority moves both a target and a direction vector to a different region.
visual_variables: x-position=continuidad acústica del camino principal; y-position=fronteras textuales obligatorias y sustituibles; vector direction=presión de diseño; target position=región favorecida. These variables are ordinal, not benchmark magnitudes.
why_visual: Prose can list trade-offs, but the map makes the structural relationship between the three modality families and the consequence of changing priorities visible at once.
-->
