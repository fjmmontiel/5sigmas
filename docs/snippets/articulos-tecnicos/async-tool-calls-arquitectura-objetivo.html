<section class="atca-wrap" data-anim-fullscreen="on" data-anim-contrast="force" aria-label="Siguiente paso hacia producción para Reactive / Proactive Agent">
  <style>
    .atca-wrap,.atca-wrap *{box-sizing:border-box}
    .atca-wrap{
      font-family:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;
      display:grid;
      gap:10px;
      margin:28px auto 34px;
      max-width:1600px;
    }
    .anim-shell-modal .atca-wrap{
      margin:0;
      max-width:none;
    }
    .atca-sheet{
      position:relative;
      overflow-x:auto;
      scrollbar-gutter:stable both-edges;
      border-radius:26px;
      border:1px solid rgba(18,35,39,.10);
      background:
        radial-gradient(circle at 12% 10%,rgba(35,134,58,.08),transparent 28%),
        radial-gradient(circle at 86% 12%,rgba(8,127,143,.08),transparent 30%),
        linear-gradient(180deg,#ffffff 0%,#fbfcfc 100%);
      box-shadow:0 22px 54px rgba(18,35,39,.12);
    }
    .atca-sheet::after{
      content:"";
      position:sticky;
      right:0;
      display:block;
      width:34px;
      height:0;
      margin-left:auto;
      box-shadow:-18px 0 24px 16px rgba(255,255,255,.88);
      pointer-events:none;
    }
    .atca-board{
      display:block;
      width:100%;
      height:auto;
      font-family:"Avenir Next","Avenir","Segoe UI","Helvetica Neue",Arial,sans-serif;
    }
    .atca-board .lane{font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;fill:#546366}
    .atca-board .node-title{font-size:26px;font-weight:950;letter-spacing:-.04em;fill:#07191b}
    .atca-board .node-sub{font-size:15px;font-weight:700;fill:#546366}
    .atca-board .chip-text{font-size:14px;font-weight:900}
    .atca-board .small{font-size:13px;font-weight:700;fill:#546366}
    .atca-board .mono{font-family:"SF Mono","JetBrains Mono","Courier New",monospace;font-size:15px;font-weight:800}
    .atca-board .soft-green{fill:#eaf6e8;stroke:rgba(35,134,58,.30)}
    .atca-board .soft-teal{fill:#e7f7f8;stroke:rgba(8,127,143,.28)}
    .atca-board .soft-amber{fill:#fff3da;stroke:rgba(217,138,0,.30)}
    .atca-board .soft-slate{fill:#f3f7f7;stroke:rgba(18,35,39,.12)}
    .atca-board .box{fill:rgba(255,255,255,.92);stroke:rgba(7,25,27,.14);stroke-width:1.7}
    .atca-board .band{fill:rgba(255,255,255,.72);stroke-width:2}
    .atca-board .stroke-green{stroke:rgba(35,134,58,.56)}
    .atca-board .stroke-teal{stroke:rgba(8,127,143,.56)}
    .atca-board .stroke-amber{stroke:rgba(217,138,0,.58)}
    .atca-board .stroke-slate{stroke:rgba(84,99,102,.28)}
    .atca-board .green{fill:#23863a}
    .atca-board .teal{fill:#087f8f}
    .atca-board .amber{fill:#d98a00}
    .atca-board .slate{fill:#546366}
    .atca-board .flow{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .atca-board .flow-thin{stroke-width:2.3}
    .atca-board .flow-green{stroke:#23863a;marker-end:url(#atcaArrowGreen)}
    .atca-board .flow-teal{stroke:#087f8f;marker-end:url(#atcaArrowTeal)}
    .atca-board .flow-amber{stroke:#d98a00;marker-end:url(#atcaArrowAmber)}
    .atca-board .flow-slate{stroke:#546366;marker-end:url(#atcaArrowSlate)}
    .atca-board .dash{stroke-dasharray:11 9}
    @media (max-width:900px){
      .atca-sheet{
        border-radius:20px;
        box-shadow:0 16px 34px rgba(18,35,39,.12);
      }
      .atca-sheet::before{
        content:"Desliza horizontalmente para revisar la lamina completa";
        position:sticky;
        left:10px;
        top:10px;
        z-index:1;
        display:inline-flex;
        margin:10px 0 -2px 10px;
        padding:7px 10px;
        border-radius:999px;
        background:rgba(255,255,255,.92);
        border:1px solid rgba(18,35,39,.10);
        color:#546366;
        font-size:.74rem;
        font-weight:850;
        backdrop-filter:blur(8px);
      }
      .atca-board{
        width:1180px;
        max-width:none;
      }
    }
  </style>

        <rect x="664" y="662" width="240" height="86" rx="22" class="box stroke-amber"/>

        <rect x="568" y="774" width="346" height="40" rx="14" class="box"/>

        <rect x="998" y="774" width="372" height="40" rx="14" class="box"/>
        <text x="1184" y="800" text-anchor="middle" class="small">el cierre vuelve por proactive o next_turn</text>

        <rect x="1190" y="442" width="182" height="88" rx="20" class="box stroke-slate"/>

        <path d="M895 604 V620 H1281 V530" class="flow flow-slate flow-thin dash"/>

    </svg>
  </div>
</section>
