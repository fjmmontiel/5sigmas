<div class="security-visual security-visual--jailbreak" role="img" aria-label="Un atacante explora variaciones de entrada mientras el filtro intenta cerrar una salida">
  <style>
    .security-visual--jailbreak{margin:2rem 0;padding:1.5rem;border:1px solid color-mix(in srgb,var(--md-default-fg-color) 16%,transparent);border-radius:18px;background:color-mix(in srgb,var(--md-default-bg-color) 92%,#324ab2);}
    .security-visual--jailbreak .sj-title{font-weight:800;font-size:1.05rem;margin-bottom:1rem;}
    .security-visual--jailbreak .sj-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center;}
    .security-visual--jailbreak .sj-box{min-height:8rem;padding:1rem;border-radius:14px;background:color-mix(in srgb,var(--md-default-bg-color) 78%,#324ab2);}
    .security-visual--jailbreak .sj-box--attack{background:color-mix(in srgb,var(--md-default-bg-color) 84%,#ffb343);}
    .security-visual--jailbreak .sj-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65;}
    .security-visual--jailbreak .sj-main{font-weight:700;margin-top:.5rem;}
    .security-visual--jailbreak .sj-arrow{font-size:1.5rem;color:#ef4444;}
    .security-visual--jailbreak .sj-note{margin-top:1rem;font-size:.9rem;opacity:.76;}
    @media (max-width:700px){.security-visual--jailbreak .sj-grid{grid-template-columns:1fr;}.security-visual--jailbreak .sj-arrow{transform:rotate(90deg);text-align:center;}}
  </style>
  <div class="sj-title">El filtro reduce frecuencia. La búsqueda explora la frontera.</div>
  <div class="sj-grid">
    <div class="sj-box sj-box--attack"><div class="sj-label">Atacante</div><div class="sj-main">varía la entrada y observa el resultado</div></div>
    <div class="sj-arrow" aria-hidden="true">→</div>
    <div class="sj-box"><div class="sj-label">Producto</div><div class="sj-main">clasifica, limita, autoriza y decide si actúa</div></div>
  </div>
  <div class="sj-note">Un jailbreak de texto no equivale a una acción dañina. La evaluación debe seguir la cadena completa.</div>
</div>
