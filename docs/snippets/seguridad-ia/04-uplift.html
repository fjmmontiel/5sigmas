<div class="security-visual security-visual--uplift" role="img" aria-label="Comparación de una tarea con recursos normales y con asistencia de un modelo">
  <style>
    .security-visual--uplift{margin:2rem 0;padding:1.5rem;border:1px solid color-mix(in srgb,var(--md-default-fg-color) 16%,transparent);border-radius:18px;background:color-mix(in srgb,var(--md-default-bg-color) 92%,#ffb343);}
    .security-visual--uplift .su-title{font-weight:800;font-size:1.05rem;margin-bottom:1rem;}
    .security-visual--uplift .su-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    .security-visual--uplift .su-col{padding:1rem;border-radius:14px;background:color-mix(in srgb,var(--md-default-bg-color) 80%,#ffb343);}
    .security-visual--uplift .su-col--model{background:color-mix(in srgb,var(--md-default-bg-color) 80%,#324ab2);}
    .security-visual--uplift .su-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65;}
    .security-visual--uplift .su-main{font-weight:700;margin-top:.5rem;}
    .security-visual--uplift .su-foot{margin-top:1rem;font-size:.9rem;opacity:.76;}
    @media (max-width:700px){.security-visual--uplift .su-row{grid-template-columns:1fr;}}
  </style>
  <div class="su-title">La evaluación cambia si una persona recibe ayuda del modelo.</div>
  <div class="su-row">
    <div class="su-col"><div class="su-label">Sin ayuda del modelo</div><div class="su-main">tarea con recursos normales</div></div>
    <div class="su-col su-col--model"><div class="su-label">Con ayuda del modelo</div><div class="su-main">tarea con asistencia y condiciones declaradas</div></div>
  </div>
  <div class="su-foot">Comparar ambos casos explica mejor el riesgo que contar respuestas bloqueadas en una sola pregunta.</div>
</div>
