<!doctype html><html lang="en"><meta charset="utf-8"><title>5sigmas Seguridad deterministic renderer</title>
<style>html,body{margin:0;background:#fff}canvas{display:block;width:100%;height:auto}</style>
<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
import {renderSeguridadFrame,validateSeguridadLayouts} from '../src/seguridad/render.mjs';
import {renderChapter01} from '../src/seguridad/chapter01.mjs';
import {renderChapter02} from '../src/seguridad/chapter02.mjs';
import {renderChapter03} from '../src/seguridad/chapter03.mjs';
import {seguridadRenderMatrix,validateSeguridadMechanismCoverage} from '../src/seguridad/engine.mjs';
const canvas=document.querySelector('#stage');
window.setup=(spec,register)=>{window.S=spec;window.R=register;const jobs=seguridadRenderMatrix(spec,register);const coverage=validateSeguridadMechanismCoverage(spec,register);return {jobs,coverage};};
window.draw=(jobId,time,reduced=false)=>{
 const m=/^seguridad-ia-(\d{2})-(es|en)-(horizontal|vertical)$/.exec(jobId);
 if(!m)throw new Error('INVALID_SEGURIDAD_JOB');
 const [,chapter,locale,orientation]=m;
 if(chapter==='01')return renderChapter01(canvas,locale,orientation,time,{reducedMotion:reduced});
 if(chapter==='02')return renderChapter02(canvas,locale,orientation,time,{reducedMotion:reduced});
 if(chapter==='03')return renderChapter03(canvas,locale,orientation,time,{reducedMotion:reduced});
 return renderSeguridadFrame(canvas,window.S,window.R,jobId,time,{reducedMotion:reduced});
};
window.frame=(jobId,time,reduced=false)=>{const result=window.draw(jobId,time,reduced);return {result,jpeg:canvas.toDataURL('image/jpeg',.95).split(',')[1]};};
window.layoutCheck=()=>validateSeguridadLayouts(canvas,window.S,window.R);
window.ready=true;
</script></html>
