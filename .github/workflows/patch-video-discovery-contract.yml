name: Patch final video discovery contract

on:
  pull_request:
    paths:
      - '.github/workflows/patch-video-discovery-contract.yml'
      - 'scripts/test_video_schema_contract.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'reconcile/organic-growth-video-library-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal contract-test dependencies
        run: python -m pip install mkdocs==1.6.1 PyYAML==6.0.3

      - name: Align video schema, topics and cross-origin playback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          sitemap = Path('hooks/video_sitemap.py')
          body = sitemap.read_text(encoding='utf-8')

          topic_anchor = '    "datacenters-espacio": ("infraestructura", "Infraestructura"),\n'
          security_topic = '    "seguridad-ia": ("seguridad", "Seguridad en IA"),\n'
          if security_topic not in body:
              if topic_anchor not in body:
                  raise SystemExit('video topic insertion anchor missing')
              body = body.replace(topic_anchor, topic_anchor + security_topic, 1)

          body = body.replace(
              '<video controls preload="metadata" poster="{entry[\'thumb_url\']}" playsinline data-s5-watch-player>',
              '<video controls crossorigin="anonymous" preload="metadata" poster="{entry[\'thumb_url\']}" playsinline data-s5-watch-player>',
              1,
          )

          seek_block = '''        "potentialAction": {\n            "@type": "SeekToAction",\n            "target": f"{entry['watch_url']}?t={{seek_to_second_number}}",\n            "startOffset-input": "required name=seek_to_second_number",\n        },\n'''
          if seek_block in body:
              body = body.replace(seek_block, '', 1)

          tail = '''        schema["hasPart"] = clips\n    return schema\n'''
          replacement = '''        schema["hasPart"] = clips\n    else:\n        schema["potentialAction"] = {\n            "@type": "SeekToAction",\n            "target": f"{entry['watch_url']}?t={{seek_to_second_number}}",\n            "startOffset-input": "required name=seek_to_second_number",\n        }\n    return schema\n'''
          if '    else:\n        schema["potentialAction"]' not in body:
              if tail not in body:
                  raise SystemExit('video schema tail anchor missing')
              body = body.replace(tail, replacement, 1)

          sitemap.write_text(body, encoding='utf-8')

          embed = Path('hooks/video_embed.py')
          embed_body = embed.read_text(encoding='utf-8')
          old_controls = '''        "    controls\\n"\n        '    controlsList="nodownload"\\n'\n'''
          new_controls = '''        "    controls\\n"\n        '    crossorigin="anonymous"\\n'\n        '    controlsList="nodownload"\\n'\n'''
          if 'crossorigin="anonymous"' not in embed_body:
              if old_controls not in embed_body:
                  raise SystemExit('article video controls anchor missing')
              embed_body = embed_body.replace(old_controls, new_controls, 1)
          embed.write_text(embed_body, encoding='utf-8')
          PY

          python scripts/test_video_schema_contract.py
          git add hooks/video_sitemap.py hooks/video_embed.py scripts/test_video_schema_contract.py
          if git diff --cached --quiet; then
            echo 'Video discovery contract already conforms.'
          else
            git diff --cached --check
            git commit -m 'fix: align video discovery and cross-origin playback contracts'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
