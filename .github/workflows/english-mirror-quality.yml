name: English mirror quality

on:
  pull_request:
    paths:
      - 'locales/en/**'
      - 'mkdocs.en.yml'
      - 'scripts/prepare_locale.py'
      - 'scripts/validate_english_series_mirror.mjs'
      - 'scripts/validate_english_reasoning_ttc.mjs'
      - 'scripts/validate_english_energy_ch1.mjs'
      - 'scripts/validate_english_energy_complete.mjs'
      - 'scripts/validate_english_cave_ch1.mjs'
      - 'scripts/validate_english_history_ch2.mjs'
      - 'scripts/validate_english_caves_complete.mjs'
      - 'scripts/validate_english_foundations_complete.mjs'
      - 'scripts/validate_english_multimodality_complete.mjs'
      - 'scripts/validate_english_datacenters_complete.mjs'
      - 'scripts/validate_english_security_complete.mjs'
      - 'docs/assets/javascripts/series_energy_ai_preview.js'
      - '.github/workflows/english-mirror-quality.yml'

permissions:
  contents: read

jobs:
  series-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      S5_LOCALE: en
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare strict English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve English preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-en-mirror.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/en/series/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-en-mirror.log
          exit 1

      - name: Validate full English series mirror
        run: node scripts/validate_english_series_mirror.mjs

      - name: Validate translated Test-Time Compute chapter
        env:
          S5_REQUIRE_EN_TTC_MEDIA: '0'
        run: node scripts/validate_english_reasoning_ttc.mjs

      - name: Validate English Energy chapter 1
        run: node scripts/validate_english_energy_ch1.mjs

      - name: Validate complete English Energy series
        run: node scripts/validate_english_energy_complete.mjs

      - name: Validate English history chapter 1
        run: node scripts/validate_english_cave_ch1.mjs

      - name: Validate English history chapter 2
        run: node scripts/validate_english_history_ch2.mjs

      - name: Validate complete English Caves to AGI series
        run: node scripts/validate_english_caves_complete.mjs

      - name: Validate complete English Foundations series
        run: node scripts/validate_english_foundations_complete.mjs

      - name: Validate complete English Multimodality series
        run: node scripts/validate_english_multimodality_complete.mjs

      - name: Validate complete English Data Centers in Space series
        run: node scripts/validate_english_datacenters_complete.mjs

      - name: Validate complete English AI Security series
        run: node scripts/validate_english_security_complete.mjs

      - name: Upload English mirror screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-en-series-mirror
          path: artifacts/visual-review/english-*.png
          if-no-files-found: warn
          retention-days: 14
