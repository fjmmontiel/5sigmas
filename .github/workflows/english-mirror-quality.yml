name: English mirror quality

on:
  pull_request:
    paths:
      - 'locales/en/**'
      - 'mkdocs.en.yml'
      - 'scripts/prepare_locale.py'
      - 'scripts/validate_english_series_mirror.mjs'
      - 'scripts/validate_english_reasoning_ttc.mjs'
      - 'docs/assets/javascripts/series_energy_ai_preview.js'
      - '.github/workflows/english-mirror-quality.yml'

permissions:
  contents: read

jobs:
  series-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      S5_LOCALE: en
      S5_EN_TTC_SEED_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-2028-81f4-9eab-ac94800f4fec/raw?se=2026-08-13T10%3A03%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=dcb3d45e-9abd-572f-8040-c30e59535edc&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T09%3A30%3A13Z&ske=2026-08-14T09%3A30%3A13Z&sks=b&skv=2026-02-06&sig=6I7lyFGpzl%2BO2ZocqzPfplw%2BqSjx/8nyrfZF3vSLjpE%3D"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare strict English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve English preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-en-mirror.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/en/series/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-en-mirror.log
          exit 1

      - name: Validate full English series mirror
        run: node scripts/validate_english_series_mirror.mjs

      - name: Validate translated Test-Time Compute chapter
        env:
          S5_REQUIRE_EN_TTC_MEDIA: '0'
        run: node scripts/validate_english_reasoning_ttc.mjs

      - name: Stage reviewed English TTC media seed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$S5_EN_TTC_SEED_URL" -o /tmp/en-ttc.zip
          mkdir -p artifacts/en-ttc-seed
          unzip -q -j /tmp/en-ttc.zip '03-test-time-compute.mp4' '03-test-time-compute.jpg' -d artifacts/en-ttc-seed
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  artifacts/en-ttc-seed/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  artifacts/en-ttc-seed/03-test-time-compute.jpg' | sha256sum -c -

      - name: Upload reviewed English TTC media seed
        uses: actions/upload-artifact@v4
        with:
          name: english-ttc-reviewed-seed
          path: artifacts/en-ttc-seed/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload English mirror screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-en-series-mirror
          path: artifacts/visual-review/english-*.png
          if-no-files-found: warn
          retention-days: 14
