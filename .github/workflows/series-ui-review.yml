name: Series UI + advanced GOLDEN polish review
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      owner_review:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: series-ui-review-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Check out exact PR base
        run: |
          git -C candidate fetch --no-tags --depth=1 origin "${{ inputs.base_sha }}"
          git -C candidate worktree add --detach ../baseline "${{ inputs.base_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact build and browser dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          python -m pip install -r candidate/requirements.txt
          python -m pip install playwright==1.55.0 beautifulsoup4==4.13.5 lxml==6.0.2 pillow
          python -m playwright install --with-deps chromium
      - name: Build baseline and candidate ES/EN
        run: |
          set -euo pipefail
          for directory in baseline candidate; do
            cd "$GITHUB_WORKSPACE/$directory"
            mkdocs build --clean --strict
            python scripts/prepare_locale.py --locale en
            S5_LOCALE=en mkdocs build -f mkdocs.en.yml --clean --strict
          done
          cd "$GITHUB_WORKSPACE/candidate"
          node --check docs/assets/javascripts/series-experience.js
          node --check docs/assets/javascripts/reader-direct-navigation.js
          node --check docs/assets/javascripts/advanced-series-golden.js
          python scripts/test_publication_nav.py
          python scripts/test_series_experience.py
      - name: Validate navigation, preserved mechanisms and GOLDEN polish
        env:
          REVIEW_HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python baseline/scripts/serve_preview.py --directory baseline/site --port 8000 >/tmp/baseline.log 2>&1 &
          BASE_PID=$!
          python candidate/scripts/serve_preview.py --directory candidate/site --port 8001 >/tmp/candidate.log 2>&1 &
          CANDIDATE_PID=$!
          trap 'kill "$BASE_PID" "$CANDIDATE_PID" || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/series/ >/dev/null && curl -fsS http://127.0.0.1:8001/series/ >/dev/null && break
            sleep 1
          done
          cd candidate
          python scripts/test_series_navigation.py
          python scripts/capture_gallery_series_review.py
          python scripts/capture_series_ui_review.py
      - name: Upload series regression evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: series-ui-real-browser-evidence
          path: candidate/artifacts/series-ui-review/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6

  owner-review:
    if: inputs.owner_review
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build exact review candidate
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          python -m pip install -r requirements.txt
          python -m pip install beautifulsoup4==4.13.5 lxml==6.0.2 playwright==1.55.0
          python -m playwright install --with-deps chromium
          mkdocs build --clean --strict
          python scripts/prepare_locale.py --locale en
          S5_LOCALE=en mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Build the exact owner-rejected reference for A/B inspection
        run: |
          git fetch --no-tags --depth=1 origin b8a0ec5a4b9461b5b68f5d65ea504b549de4d7dc
          git worktree add --detach ../owner-before b8a0ec5a4b9461b5b68f5d65ea504b549de4d7dc
          cd ../owner-before
          mkdocs build --clean --strict
          python scripts/prepare_locale.py --locale en
          S5_LOCALE=en mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Build and exercise the standalone owner review
        env:
          REVIEW_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python scripts/build_series_owner_review.py --site site --before-site ../owner-before/site --output artifacts/owner-review/5sigmas-revision-interactiva.html --candidate-sha "$REVIEW_HEAD_SHA" --baseline-sha b8a0ec5a4b9461b5b68f5d65ea504b549de4d7dc
          python scripts/test_series_owner_review.py --html artifacts/owner-review/5sigmas-revision-interactiva.html --output artifacts/owner-review/tests

      - name: Retain explicit owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: series-owner-interactive-review
          path: artifacts/owner-review/
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn
