name: Integrate reviewed final F1 W1 metadata
on:
  push:
    branches: [release/owner-approved-video-batch-20260927]
    paths: [.github/workflows/final-metadata-integration.yml]
permissions:
  contents: write
concurrency:
  group: final-f1-w1-metadata-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor == 'fjmmontiel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .release-media
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Apply only the locally reviewed and hash-pinned overlay
        run: python -u .release-media/final_overlay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-overlay-integration-receipt
          path: /tmp/final-overlay-receipt.json
          retention-days: 1
          if-no-files-found: warn
