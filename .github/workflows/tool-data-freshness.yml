name: Volatile tool data freshness

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volatile-tool-data-freshness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit volatile tool datasets
        run: node scripts/audit_tool_data_freshness.mjs
      - name: Audit Model Price/Performance freshness
        run: node scripts/audit_model_price_performance_freshness.mjs --max-age-days=8
