# One-shot milestone certification; remove after evidence is recorded.
name: Coding Agents 2.2 certification

on:
  push:
    branches:
      - series/coding-agents-agent-harnesses-golden
    paths:
      - '.github/workflows/coding-agents-ch2-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate chapter source contracts
        run: |
          node scripts/validate_coding_agent_harness_ch1_source.mjs
          node scripts/validate_coding_agent_harness_ch2_source.mjs

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Prepare and audit English sources
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Audit browser resources and locale mirrors
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_series_mirror.mjs
          node scripts/validate_locale_switching.mjs

      - name: Regress chapter 2.1 locale and browser contracts
        run: |
          node scripts/validate_coding_agent_harness_ch1_locale_navigation.mjs
          node scripts/validate_coding_agent_harness_ch1_accessibility.mjs

      - name: Validate chapter 2.2 browser accessibility and responsive geometry
        run: node scripts/validate_coding_agent_harness_ch2_accessibility.mjs

      - name: Validate direct reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Upload chapter 2.2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-agents-ch2-visual-evidence
          path: artifacts/visual-review/coding-harness-ch2-*.png
          if-no-files-found: warn
          retention-days: 1
