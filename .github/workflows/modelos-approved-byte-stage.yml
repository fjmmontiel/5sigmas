name: Modelos approved byte staging

# Recover and stage the exact frozen owner-approved horizontal snapshot without redesigning it.
on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - .github/workflows/modelos-approved-byte-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelos-approved-byte-stage
  cancel-in-progress: false

jobs:
  recover-exact-approved-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BRANCH: migration/video-golden-modelos-razonadores
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/video-golden-modelos-razonadores

      - name: Fetch every reachable repository ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          echo "reachable_commits=$(git rev-list --all --count)"
          echo "reachable_objects=$(git rev-list --objects --all | wc -l)"

      - name: Recover exact approved MP4 blobs from reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, sys

          expected = {
              'e45db8339e97972c672f1d13aa5705bc9f6b25c5fcebfb28556d1c42d40487d6': ('docs/series/modelos-razonadores/00_presentacion_serie.mp4', 4051574),
              'a357ab3df54ff2d8344a362307a5d4625201797d86f534fb840ae03817c48807': ('docs/series/modelos-razonadores/01-que-es-razonar.mp4', 4686122),
              'd7496cea7bc0b5889f64cca5b60f59506963c7125f4cb2eb9b166e79d26562ed': ('docs/series/modelos-razonadores/02-fallos.mp4', 5852621),
              'e9c6c081bb19d2953777b3d37642e5a718de8dd16ce7b6f73ff9dc252dca8710': ('docs/series/modelos-razonadores/03-test-time-compute.mp4', 7897504),
              '1ba074bafc897e818ef1015bfa4c3597d8c80f16f58496c3cb5345eca49c020f': ('docs/series/modelos-razonadores/04-latencia-streaming.mp4', 6391044),
              'f594dde47114da817416d0a6b37089cdec34eb607005fe452d5fc22f5b2df381': ('docs/series/modelos-razonadores/05-riesgos.mp4', 6724633),
              'f26ac17cb5b4fa077b5175b00256ac6eaffb414e85fa0b51a4e878efc6d9a730': ('locales/en/series/modelos-razonadores/00_presentacion_serie.mp4', 3946808),
              'b4e13a927f4485c3fa372bbf5fa53c2d8452107431a66e38cb1e692c4c72ffcc': ('locales/en/series/modelos-razonadores/01-que-es-razonar.mp4', 4641477),
              '3f5f6fe9ec604b06ce448092e0f66ffb0fc543998cb9ba0f4583f3f3575c52b2': ('locales/en/series/modelos-razonadores/02-fallos.mp4', 5615464),
              '27860f4c8304a3215dc5e29894e071df10f2b276fa1ddc5cbc6ea69c7f81e400': ('locales/en/series/modelos-razonadores/03-test-time-compute.mp4', 7580952),
              '3d8cb7f28b0a0ded5eb1b048a5f4d38b533948ee5181d2ea899507bc38dcc5a0': ('locales/en/series/modelos-razonadores/04-latencia-streaming.mp4', 6128150),
              'ef27ccf56d3112214286d5eab4a34bcf4b55c1bf2bc108abe4e074eb0c29beec': ('locales/en/series/modelos-razonadores/05-riesgos.mp4', 6439609),
          }
          size_to_hashes = {}
          for digest, (_, size) in expected.items():
              size_to_hashes.setdefault(size, set()).add(digest)

          # Start with exact bytes already present at canonical paths.
          found = {}
          for digest, (target_s, size) in expected.items():
              p = Path(target_s)
              if p.is_file() and p.stat().st_size == size:
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  if actual == digest:
                      found[digest] = {'object': None, 'source_path': target_s, 'already_canonical': True}

          lines = subprocess.check_output(['git','rev-list','--objects','--all'], text=True).splitlines()
          objects = {}
          for line in lines:
              parts = line.split(' ', 1)
              oid = parts[0]
              path = parts[1] if len(parts) > 1 else ''
              if not path.lower().endswith('.mp4'):
                  continue
              objects.setdefault(oid, path)

          print(f'Unique reachable MP4 objects to inspect: {len(objects)}')
          inspected = 0
          for oid, source_path in objects.items():
              if len(found) == len(expected):
                  break
              try:
                  size = int(subprocess.check_output(['git','cat-file','-s',oid], text=True).strip())
              except subprocess.CalledProcessError:
                  continue
              if size not in size_to_hashes:
                  continue
              data = subprocess.check_output(['git','cat-file','blob',oid])
              inspected += 1
              digest = hashlib.sha256(data).hexdigest()
              if digest not in expected or digest in found:
                  continue
              target_s, expected_size = expected[digest]
              if len(data) != expected_size:
                  raise SystemExit(f'internal size mismatch for {digest}: {len(data)} != {expected_size}')
              target = Path(target_s)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              found[digest] = {'object': oid, 'source_path': source_path, 'already_canonical': False}
              print(f'RECOVERED {digest} object={oid} historical_path={source_path!r} -> {target_s}')

          missing = [d for d in expected if d not in found]
          result = {
              'expected': len(expected),
              'found': len(found),
              'inspected_size_matched_mp4_objects': inspected,
              'assets': [
                  {
                      'sha256': d,
                      'target': expected[d][0],
                      'size': expected[d][1],
                      **found[d],
                  }
                  for d in expected if d in found
              ],
              'missing': [{'sha256': d, 'target': expected[d][0], 'size': expected[d][1]} for d in missing],
          }
          Path('/tmp/modelos-history-recovery.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if missing:
              print(f'Exact history recovery incomplete: {len(found)}/12; no false PASS.', file=sys.stderr)
              raise SystemExit(3)
          print('Exact approved history recovery: 12/12')
          PY

      - name: Verify exact hashes after recovery
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m=json.loads(Path('/tmp/modelos-history-recovery.json').read_text())
          for a in m['assets']:
              p=Path(a['target'])
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h != a['sha256'] or p.stat().st_size != a['size']:
                  raise SystemExit(f'exact binding failed for {p}: {h} {p.stat().st_size}')
              print('EXACT_PASS', h, p)
          PY
          node motion/scripts/check_modelos_approved_snapshot.mjs

      - name: Refuse stale concurrent write
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          remote="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          local="$(git rev-parse HEAD)"
          echo "local=${local} remote=${remote}"
          test "${local}" = "${remote}"

      - name: Commit recovered exact approved snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/series/modelos-razonadores/*.mp4 locales/en/series/modelos-razonadores/*.mp4
          if git diff --cached --quiet; then
            echo 'All twelve exact approved horizontal bytes were already canonical.'
            exit 0
          fi
          git commit -m 'migration: stage exact approved Modelos R2 horizontal snapshot [skip ci]'
          git push origin HEAD:"${RELEASE_BRANCH}"
