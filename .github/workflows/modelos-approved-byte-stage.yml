name: Modelos approved byte staging

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - .github/workflows/modelos-approved-byte-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelos-approved-byte-stage
  cancel-in-progress: false

jobs:
  stage-approved-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberately use only the single owner-approved user-facing root.
      # Individual/private Drive file IDs never enter public repository state.
      DRIVE_ROOT: https://drive.google.com/drive/folders/1R6q481pxvf_AAKzt7xAnUWzUA17VzS-Z
      RELEASE_BRANCH: migration/video-golden-modelos-razonadores
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: migration/video-golden-modelos-razonadores

      - name: Install exact-byte transport dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip --version
          if ! python -m pip install --disable-pip-version-check 'gdown==5.2.0'; then
            echo 'Standard pip install failed; retrying with externally-managed-environment override.' >&2
            python -m pip install --break-system-packages --disable-pip-version-check 'gdown==5.2.0'
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          python -m gdown --version

      - name: Fetch frozen owner-approved collection from the one stable Drive root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/modelos-approved-root
          mkdir -p /tmp/modelos-approved-root
          # No sharing mutation is performed. This only reads the already configured root.
          python -m gdown --folder --remaining-ok "${DRIVE_ROOT}" -O /tmp/modelos-approved-root
          find /tmp/modelos-approved-root -type f -printf '%s\t%p\n' | sort -n

      - name: Bind exact approved hashes to the twelve canonical horizontal consumers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, sys

          root = Path('/tmp/modelos-approved-root')
          expected = {
              'e45db8339e97972c672f1d13aa5705bc9f6b25c5fcebfb28556d1c42d40487d6': ('docs/series/modelos-razonadores/00_presentacion_serie.mp4', 4051574),
              'a357ab3df54ff2d8344a362307a5d4625201797d86f534fb840ae03817c48807': ('docs/series/modelos-razonadores/01-que-es-razonar.mp4', 4686122),
              'd7496cea7bc0b5889f64cca5b60f59506963c7125f4cb2eb9b166e79d26562ed': ('docs/series/modelos-razonadores/02-fallos.mp4', 5852621),
              'e9c6c081bb19d2953777b3d37642e5a718de8dd16ce7b6f73ff9dc252dca8710': ('docs/series/modelos-razonadores/03-test-time-compute.mp4', 7897504),
              '1ba074bafc897e818ef1015bfa4c3597d8c80f16f58496c3cb5345eca49c020f': ('docs/series/modelos-razonadores/04-latencia-streaming.mp4', 6391044),
              'f594dde47114da817416d0a6b37089cdec34eb607005fe452d5fc22f5b2df381': ('docs/series/modelos-razonadores/05-riesgos.mp4', 6724633),
              'f26ac17cb5b4fa077b5175b00256ac6eaffb414e85fa0b51a4e878efc6d9a730': ('locales/en/series/modelos-razonadores/00_presentacion_serie.mp4', 3946808),
              'b4e13a927f4485c3fa372bbf5fa53c2d8452107431a66e38cb1e692c4c72ffcc': ('locales/en/series/modelos-razonadores/01-que-es-razonar.mp4', 4641477),
              '3f5f6fe9ec604b06ce448092e0f66ffb0fc543998cb9ba0f4583f3f3575c52b2': ('locales/en/series/modelos-razonadores/02-fallos.mp4', 5615464),
              '27860f4c8304a3215dc5e29894e071df10f2b276fa1ddc5cbc6ea69c7f81e400': ('locales/en/series/modelos-razonadores/03-test-time-compute.mp4', 7580952),
              '3d8cb7f28b0a0ded5eb1b048a5f4d38b533948ee5181d2ea899507bc38dcc5a0': ('locales/en/series/modelos-razonadores/04-latencia-streaming.mp4', 6128150),
              'ef27ccf56d3112214286d5eab4a34bcf4b55c1bf2bc108abe4e074eb0c29beec': ('locales/en/series/modelos-razonadores/05-riesgos.mp4', 6439609),
          }

          found = {}
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              digest = h.hexdigest()
              if digest in expected:
                  if digest in found:
                      raise SystemExit(f'duplicate exact approved hash {digest}: {found[digest]} and {p}')
                  found[digest] = p

          missing = sorted(set(expected) - set(found))
          if missing:
              print('Missing exact approved hashes from stable Drive root:', file=sys.stderr)
              for h in missing:
                  print(f'  {h} -> {expected[h][0]}', file=sys.stderr)
              raise SystemExit(2)

          manifest = []
          for digest, (target_s, expected_size) in expected.items():
              src = found[digest]
              actual_size = src.stat().st_size
              if actual_size != expected_size:
                  raise SystemExit(f'size mismatch for {digest}: {actual_size} != {expected_size}')
              target = Path(target_s)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, target)
              manifest.append({'sha256': digest, 'size': actual_size, 'source_name': src.name, 'target': target_s})
              print(f'BOUND {digest} {actual_size} {src.name!r} -> {target_s}')

          Path('/tmp/modelos-approved-binding.json').write_text(
              json.dumps({'count': len(manifest), 'assets': manifest}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print('Exact approved horizontal binding: 12/12')
          PY

      - name: Verify media integrity and exact approved delivery gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m = json.loads(Path('/tmp/modelos-approved-binding.json').read_text(encoding='utf-8'))
          for a in m['assets']:
              p = a['target']
              probe = subprocess.check_output([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,width,height,pix_fmt,r_frame_rate',
                  '-of','json',p
              ], text=True)
              s = json.loads(probe)['streams'][0]
              observed = (s['codec_name'], s['width'], s['height'], s['pix_fmt'], s['r_frame_rate'])
              required = ('h264', 1920, 1080, 'yuvj420p', '60/1')
              if observed != required:
                  raise SystemExit(f'profile mismatch {p}: {observed} != {required}')
              subprocess.run(['ffmpeg','-v','error','-i',p,'-f','null','-'], check=True)
              print('FULL_DECODE_PASS', p)
          PY
          node motion/scripts/check_modelos_approved_snapshot.mjs

      - name: Refuse a stale concurrent write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          remote="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          local="$(git rev-parse HEAD)"
          echo "local=${local} remote=${remote}"
          test "${local}" = "${remote}"

      - name: Commit exact approved snapshot to the existing complete-unit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/series/modelos-razonadores/*.mp4 locales/en/series/modelos-razonadores/*.mp4
          if git diff --cached --quiet; then
            echo "All twelve approved horizontal bytes are already canonical; nothing to commit."
            exit 0
          fi
          git commit -m "migration: stage exact approved Modelos R2 horizontal snapshot [skip ci]"
          git push origin HEAD:"${RELEASE_BRANCH}"
