name: Modelos approved byte staging

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - .github/workflows/modelos-approved-byte-stage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-approved-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact owner-approved MP4s from content-addressed staging blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          append_blob() {
            local sha="$1"
            local out="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> "${out}"
          }

          reconstruct() {
            local target="$1"
            local expected_sha="$2"
            local expected_size="$3"
            shift 3
            local tmp_b64
            tmp_b64="$(mktemp)"
            : > "${tmp_b64}"
            for blob in "$@"; do
              append_blob "${blob}" "${tmp_b64}"
            done
            mkdir -p "$(dirname "${target}")"
            base64 -d "${tmp_b64}" > "${target}"
            rm -f "${tmp_b64}"

            actual_sha="$(sha256sum "${target}" | awk '{print $1}')"
            actual_size="$(stat -c '%s' "${target}")"
            echo "${target}: sha256=${actual_sha} size=${actual_size}"
            test "${actual_sha}" = "${expected_sha}"
            test "${actual_size}" = "${expected_size}"
          }

          reconstruct \
            docs/series/modelos-razonadores/00_presentacion_serie.mp4 \
            e45db8339e97972c672f1d13aa5705bc9f6b25c5fcebfb28556d1c42d40487d6 \
            4051574 \
            ef2c4afe35de4aef79787e8e9566c8fa90afac4f \
            71bc341d60fd774ebdab964d33e9d7b8c9bcb0b9 \
            315ee4beffc3c3cca15ddd9af4bb38d5d016f2d6 \
            2a6af72a0d6dd733c2ebd441a71cc80307c9fd8a

          reconstruct \
            docs/series/modelos-razonadores/01-que-es-razonar.mp4 \
            a357ab3df54ff2d8344a362307a5d4625201797d86f534fb840ae03817c48807 \
            4686122 \
            3dc1f887fe023cf1d44e0e554e72247583f16d3a \
            c839c226db4565a2070f8b89562f041d3833a673 \
            03ba383da7008a59b91a59ec176964ae45cf8019 \
            88d954d885c07d7c40022f5ce2be7be04d44aecc \
            dd45f3bc60c509c30a8ec760b1e6b91e5e875a8c

      - name: Commit exact approved bytes to the existing complete-unit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/series/modelos-razonadores/00_presentacion_serie.mp4 \
            docs/series/modelos-razonadores/01-que-es-razonar.mp4
          if git diff --cached --quiet; then
            echo "Approved bytes already staged exactly; nothing to commit."
            exit 0
          fi
          git commit -m "migration: stage exact approved Modelos R2 bytes 00-01 [skip ci]"
          git push origin HEAD:migration/video-golden-modelos-razonadores
