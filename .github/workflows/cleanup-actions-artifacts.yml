name: Cleanup Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-artifacts.yml'
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: Delete non-protected artifacts older than this many hours
        required: true
        default: '6'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete obsolete Actions artifacts
        uses: actions/github-script@v7
        env:
          MIN_AGE_HOURS: ${{ github.event.inputs.min_age_hours || '6' }}
          PRESERVE_ARTIFACT_ID: '9176659529'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const minAgeHours = Number(process.env.MIN_AGE_HOURS || '6');
            const preserveArtifactId = Number(process.env.PRESERVE_ARTIFACT_ID);
            const cutoff = Date.now() - minAgeHours * 60 * 60 * 1000;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const candidates = artifacts.filter((artifact) => {
              if (artifact.expired) return false;
              if (artifact.id === preserveArtifactId) return false;
              if (artifact.name === 'english-ttc-reviewed-seed') return false;
              return Date.parse(artifact.created_at) < cutoff;
            });

            const bytes = candidates.reduce(
              (sum, artifact) => sum + (artifact.size_in_bytes || 0),
              0
            );

            core.info(
              `Deleting ${candidates.length} obsolete artifacts (${(bytes / 1024 / 1024).toFixed(1)} MiB)`
            );

            for (const artifact of candidates) {
              core.info(
                `Deleting ${artifact.id} ${artifact.name} ` +
                `(${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MiB, ${artifact.created_at})`
              );
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }

            await core.summary
              .addHeading('Actions artifact cleanup')
              .addTable([
                [{data: 'Deleted artifacts', header: true}, String(candidates.length)],
                [{data: 'Storage removed', header: true}, `${(bytes / 1024 / 1024).toFixed(1)} MiB`],
                [{data: 'Minimum age', header: true}, `${minAgeHours} hours`],
                [{data: 'Protected artifact', header: true}, 'english-ttc-reviewed-seed (9176659529)'],
              ])
              .write();
