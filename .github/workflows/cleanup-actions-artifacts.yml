name: Cleanup Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-artifacts.yml'
  schedule:
    # Generic artifacts are only failure evidence; remove them quickly.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: Delete non-protected artifacts older than this many hours
        required: true
        default: '1'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete obsolete Actions artifacts
        uses: actions/github-script@v7
        env:
          MIN_AGE_HOURS: ${{ github.event.inputs.min_age_hours || '1' }}
          PRESERVE_ARTIFACT_ID: '9176659529'
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const minAgeHours = Number(process.env.MIN_AGE_HOURS || '1');
            const preserveArtifactId = Number(process.env.PRESERVE_ARTIFACT_ID);
            const cutoff = Date.now() - minAgeHours * 60 * 60 * 1000;

            // Two narrowly-scoped exceptions:
            // 1) github-pages is required only until deploy-pages consumes it; a dedicated
            //    workflow deletes it immediately after that workflow completes.
            // 2) english-ttc-reviewed-seed is a small verified media fallback still used
            //    when the dedicated Actions cache is cold.
            const isProtected = (artifact) =>
              artifact.name === 'github-pages' ||
              artifact.id === preserveArtifactId ||
              artifact.name === 'english-ttc-reviewed-seed';

            const listCandidates = async () => {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner, repo, per_page: 100 }
              );
              return artifacts.filter((artifact) =>
                !artifact.expired &&
                !isProtected(artifact) &&
                Date.parse(artifact.created_at) < cutoff
              );
            };

            let deletedCount = 0;
            let deletedBytes = 0;

            // Multiple passes handle eventual consistency and partial API failures.
            for (let pass = 1; pass <= 3; pass += 1) {
              const candidates = await listCandidates();
              core.info(`Cleanup pass ${pass}: ${candidates.length} candidates`);
              if (candidates.length === 0) break;

              for (const artifact of candidates) {
                try {
                  core.info(
                    `Deleting ${artifact.id} ${artifact.name} ` +
                    `(${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MiB, ${artifact.created_at})`
                  );
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                  deletedCount += 1;
                  deletedBytes += artifact.size_in_bytes || 0;
                } catch (error) {
                  core.warning(
                    `Could not delete artifact ${artifact.id} ${artifact.name}: ` +
                    `${error.status || ''} ${error.message || error}`
                  );
                }
              }

              if (pass < 3) {
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
            }

            const leftovers = await listCandidates();

            await core.summary
              .addHeading('Actions artifact cleanup')
              .addTable([
                [{data: 'Deleted artifacts', header: true}, String(deletedCount)],
                [{data: 'Storage removed', header: true}, `${(deletedBytes / 1024 / 1024).toFixed(1)} MiB`],
                [{data: 'Minimum age', header: true}, `${minAgeHours} hours`],
                [{data: 'Protected deployment artifact', header: true}, 'github-pages (deleted after deployment)'],
                [{data: 'Protected media fallback', header: true}, 'english-ttc-reviewed-seed (9176659529)'],
                [{data: 'Old non-protected leftovers', header: true}, String(leftovers.length)],
              ])
              .write();

            if (leftovers.length > 0) {
              for (const artifact of leftovers) {
                core.error(
                  `Leftover ${artifact.id} ${artifact.name} ` +
                  `(${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MiB, ${artifact.created_at})`
                );
              }
              core.setFailed(
                `${leftovers.length} old non-protected Actions artifacts remain after cleanup`
              );
            }
