name: Voice chapter 4 freshness repair

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - .github/workflows/voice-ch4-freshness-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/realtime-voice-agents-golden
          fetch-depth: 0
      - name: Repair stale Pipecat semantics
        run: |
          echo '' | base64 -d > /tmp/repair_ch4.py
          python /tmp/repair_ch4.py
          node scripts/validate_voice_tools_state_ch4_source.mjs
      - name: Persist repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md locales/en/series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md scripts/validate_voice_tools_state_ch4_source.mjs locales/en/editorial_review.voice-agents.yml
          git diff --cached --check
          git commit -m 'fix(voice): refresh Pipecat async cancellation semantics'
          git push origin HEAD:series/realtime-voice-agents-golden
