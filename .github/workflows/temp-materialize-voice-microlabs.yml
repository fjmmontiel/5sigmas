name: Temporary materialization · voice microlabs

on:
  push:
    branches:
      - agent/voice-animation-responsive
    paths:
      - 'scripts/apply_voice_microanimations.py'
      - '.github/workflows/temp-materialize-voice-microlabs.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/voice-animation-responsive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and place the microlabs
        run: python scripts/apply_voice_microanimations.py

      - name: Commit generated article and snippet changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articulos-tecnicos docs/snippets/articulos-tecnicos
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Split voice reports into progressive microlabs"
            git push origin HEAD:agent/voice-animation-responsive
          fi
