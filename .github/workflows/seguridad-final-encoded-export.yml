name: Seguridad IA complete encoded export

on:
  push:
    branches:
      - migration/video-golden-seguridad-ia
    paths:
      - 'motion/src/seguridad/**'
      - 'motion/src/render/**'
      - 'motion/web/seguridad-render.html'
      - 'motion/scripts/seguridad_render_check.py'
      - 'motion/scripts/seguridad_final_export.py'
      - 'motion/scripts/seguridad_final_package_check.py'
      - 'motion/migration/seguridad-ia-content-v1.json'
      - 'motion/migration/seguridad-ia-series-register.json'
      - '.github/workflows/seguridad-final-encoded-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-ia-complete-encoded-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  encode-chapter:
    name: encode chapter ${{ matrix.chapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chapter: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact source before expensive encode
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile motion/scripts/seguridad_render_check.py motion/scripts/seguridad_final_export.py
          node --check motion/src/seguridad/render.mjs
          node --check motion/src/seguridad/engine.mjs
          node --check motion/src/seguridad/mechanisms.mjs

      - name: Install browser encoder dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Encode ES/EN horizontal and vertical from one timeline
        shell: bash
        run: |
          set -euo pipefail
          OUT="motion/dist/seguridad-ia-final/ch${{ matrix.chapter }}"
          for locale in es en; do
            for orientation in horizontal vertical; do
              python motion/scripts/seguridad_final_export.py \
                --chapter "${{ matrix.chapter }}" \
                --locale "$locale" \
                --orientation "$orientation" \
                --source-head "$GITHUB_SHA" \
                --out "$OUT"
            done
          done
          test "$(find "$OUT" -name '*.mp4' | wc -l)" -eq 4
          test "$(find "$OUT" -name '*.metadata.json' | wc -l)" -eq 4
          test "$(find "$OUT" -name '*.visual-transcript.json' | wc -l)" -eq 4
          test "$(find "$OUT" -name '*.poster.jpg' | wc -l)" -eq 4

      - name: Preserve chapter outputs
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-final-ch${{ matrix.chapter }}-${{ github.sha }}
          path: motion/dist/seguridad-ia-final/ch${{ matrix.chapter }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package-gate:
    name: complete 24-output package gate
    needs: encode-chapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all six immutable chapter artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: seguridad-final-ch*-${{ github.sha }}
          path: motion/dist/seguridad-ia-final-package
          merge-multiple: true

      - name: Install package review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Validate 24 exact final encodes, ES/EN parity and encoded motion
        shell: bash
        run: |
          set -euo pipefail
          python motion/scripts/seguridad_final_package_check.py \
            --package motion/dist/seguridad-ia-final-package
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('motion/dist/seguridad-ia-final-package/seguridad-ia-final-manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['state']=='COMPLETE_ENCODED_PACKAGE_PASS_NOT_OWNER_APPROVED'
          assert d['output_count']==24
          assert d['errors']==[]
          assert d['technical_golden'] is False
          assert d['owner_visual_approval']=='NOT_REQUESTED'
          print(json.dumps({
            'state':d['state'],
            'outputs':d['output_count'],
            'motion_scene_checks':len(d['encoded_motion_check'])*5,
            'parity_pairs':len(d['es_en_parity']),
          }))
          PY

      - name: Preserve complete review package
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-ia-complete-review-${{ github.sha }}
          path: motion/dist/seguridad-ia-final-package/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
