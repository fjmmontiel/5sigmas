name: Temporary review · editorial reader v3

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'hooks/reading_navigation.py'
      - 'hooks/direct_reader_navigation.py'
      - 'docs/stylesheets/reader-editorial-v3.css'
      - 'scripts/validate_direct_reader_navigation.mjs'
      - 'mkdocs.yml'
      - '.github/workflows/temp-reader-v3-review.yml'

permissions:
  contents: read

jobs:
  build-capture-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site strictly
        run: mkdocs build --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          python -m http.server 8000 --directory site > /tmp/reader-v3-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/reader-v3-preview.log
          exit 1

      - name: Capture full pages and validate the reader system
        shell: bash
        run: |
          mkdir -p artifacts/reader-v3-review
          cat > capture-reader-v3.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs/promises';

          const baseUrl = 'http://127.0.0.1:8000';
          const outputDir = 'artifacts/reader-v3-review';
          const specs = [
            { slug: 'reactive-proactive-voice', path: '/articulos-tecnicos/reactive-proactive-voice-agents/', visual: '.s5v-contract' },
            { slug: 'voice-architectures', path: '/articulos-tecnicos/voice-agent-architectures/', visual: '.s5v-arch-map' },
            { slug: 'series-presentation', path: '/series/from-cave-to-agi/00_presentacion_serie/', visual: null },
            { slug: 'series-chapter', path: '/series/modelos-razonadores/03-test-time-compute/', visual: null },
          ];
          const desktopViewports = [
            { name: 'wide', width: 1728, height: 1117 },
            { name: 'standard', width: 1440, height: 1000 },
          ];

          const browser = await chromium.launch({ headless: true });
          const metrics = [];
          const failures = [];

          const box = async (page, selector) => {
            const locator = page.locator(selector).first();
            if (!await locator.count()) return null;
            return locator.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              const round = (value) => Math.round(value * 10) / 10;
              return {
                x: round(rect.x), y: round(rect.y), width: round(rect.width), height: round(rect.height),
                display: style.display, position: style.position, fontSize: style.fontSize,
              };
            });
          };

          async function settle(page) {
            await page.waitForLoadState('networkidle');
            await page.evaluate(async () => {
              await document.fonts.ready;
              document.documentElement.style.scrollBehavior = 'auto';
              const step = Math.max(520, Math.floor(window.innerHeight * .72));
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 50));
              }
              window.scrollTo(0, 0);
              await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            });
            await page.addStyleTag({ content: `
              html, body { scroll-behavior: auto !important; }
              *, *::before, *::after {
                animation-play-state: paused !important;
                transition-duration: 0s !important;
                transition-delay: 0s !important;
              }
            ` });
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(260);
          }

          const recordFailure = (label, message) => failures.push(`${label}: ${message}`);

          async function desktop(spec, viewport) {
            const label = `${spec.slug}/${viewport.name}`;
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            await page.goto(`${baseUrl}${spec.path}`, { waitUntil: 'domcontentloaded' });
            await settle(page);

            const geometry = {
              page: spec.slug, viewport: viewport.name, viewportWidth: viewport.width,
              header: await box(page, '.md-header__inner'),
              tabs: await box(page, '.md-tabs'),
              library: await box(page, '.s5-reader-direct'),
              content: await box(page, '.md-content'),
              context: await box(page, '.s5-reader-context'),
              title: await box(page, 'article h1'),
              navigator: await box(page, '.s5-reader-topbar'),
              firstLead: await box(page, '.md-typeset > blockquote'),
              firstParagraph: await box(page, '.md-typeset > p'),
              visual: spec.visual ? await box(page, spec.visual) : null,
              visibleCollections: await page.locator('.s5-reader-direct__collection:visible').count(),
              tagsVisible: await page.locator('.md-tags:visible').count(),
              breadcrumbsVisible: await page.locator('.md-path:visible').count(),
              directToggleVisible: await page.locator('.s5-reader-direct-toggle:visible').count(),
              overflow: await page.evaluate(() => Math.max(0, document.documentElement.scrollWidth - window.innerWidth)),
              pageErrors,
            };
            metrics.push(geometry);

            await page.screenshot({ path: `${outputDir}/${spec.slug}-${viewport.name}-viewport.png`, fullPage: false });
            await page.screenshot({ path: `${outputDir}/${spec.slug}-${viewport.name}-full.png`, fullPage: true });

            for (const field of ['header', 'library', 'content', 'context', 'title', 'navigator']) {
              if (!geometry[field]) recordFailure(label, `missing ${field}`);
            }
            if (!geometry.firstLead && !geometry.firstParagraph) recordFailure(label, 'missing readable lead or paragraph');
            if (geometry.pageErrors.length) recordFailure(label, `browser errors ${JSON.stringify(geometry.pageErrors)}`);
            if (geometry.overflow > 1) recordFailure(label, `horizontal overflow ${geometry.overflow}px`);
            if (geometry.visibleCollections !== 1) recordFailure(label, `${geometry.visibleCollections} contextual collections visible`);
            if (geometry.tagsVisible || geometry.breadcrumbsVisible || geometry.directToggleVisible) recordFailure(label, 'duplicated navigation chrome visible');
            if (geometry.navigator?.height > 52) recordFailure(label, `navigator height ${geometry.navigator.height}px`);
            if (geometry.content && geometry.library && geometry.content.x - (geometry.library.x + geometry.library.width) < 30) recordFailure(label, 'library/article gap below 30px');
            if (geometry.title && geometry.content && Math.abs(geometry.title.x - geometry.content.x) > 1) recordFailure(label, 'title/content edges differ');
            if (geometry.navigator && geometry.content && Math.abs(geometry.navigator.x - geometry.content.x) > 1) recordFailure(label, 'navigator/content edges differ');
            if (geometry.firstParagraph && (geometry.firstParagraph.width < 700 || geometry.firstParagraph.width > 790)) recordFailure(label, `prose width ${geometry.firstParagraph.width}px`);
            if (geometry.firstLead && geometry.firstLead.width > 890) recordFailure(label, `lead width ${geometry.firstLead.width}px`);
            if (geometry.visual && geometry.visual.width < 900) recordFailure(label, `visual width ${geometry.visual.width}px`);
            if (geometry.title?.y > 245) recordFailure(label, `title y=${geometry.title.y}px`);
            await page.close();
          }

          async function compact(spec, kind) {
            const isMobile = kind === 'mobile';
            const viewport = isMobile ? { width: 390, height: 844 } : { width: 1024, height: 900 };
            const pageOptions = isMobile
              ? { ...devices['Pixel 7'], viewport, deviceScaleFactor: 1 }
              : { viewport, deviceScaleFactor: 1 };
            const label = `${spec.slug}/${kind}`;
            const page = await browser.newPage(pageOptions);
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            await page.goto(`${baseUrl}${spec.path}`, { waitUntil: 'domcontentloaded' });
            await settle(page);

            const geometry = {
              page: spec.slug, viewport: kind,
              context: await box(page, '.s5-reader-context'),
              title: await box(page, 'article h1'),
              navigator: await box(page, '.s5-reader-topbar'),
              firstLead: await box(page, '.md-typeset > blockquote'),
              firstParagraph: await box(page, '.md-typeset > p'),
              libraryVisible: await page.locator('.s5-reader-direct:visible').count(),
              directToggleVisible: await page.locator('.s5-reader-direct-toggle:visible').count(),
              tagsVisible: await page.locator('.md-tags:visible').count(),
              breadcrumbsVisible: await page.locator('.md-path:visible').count(),
              overflow: await page.evaluate(() => Math.max(0, document.documentElement.scrollWidth - window.innerWidth)),
              pageErrors,
            };
            metrics.push(geometry);

            await page.screenshot({ path: `${outputDir}/${spec.slug}-${kind}-viewport.png`, fullPage: false });
            if (isMobile) await page.screenshot({ path: `${outputDir}/${spec.slug}-${kind}-full.png`, fullPage: true });

            if (!geometry.context || !geometry.title || !geometry.navigator) recordFailure(label, 'missing contextual header');
            if (geometry.libraryVisible || geometry.directToggleVisible || geometry.tagsVisible || geometry.breadcrumbsVisible) recordFailure(label, 'duplicated navigation chrome visible');
            if (geometry.navigator?.position !== 'sticky') recordFailure(label, 'navigator is not sticky');
            if (geometry.navigator?.height > 54) recordFailure(label, `navigator height ${geometry.navigator.height}px`);
            if (geometry.overflow > 1) recordFailure(label, `horizontal overflow ${geometry.overflow}px`);
            if (isMobile && geometry.title?.y > 190) recordFailure(label, `title y=${geometry.title.y}px`);
            if (pageErrors.length) recordFailure(label, `browser errors ${JSON.stringify(pageErrors)}`);
            await page.close();
          }

          try {
            for (const spec of specs) {
              for (const viewport of desktopViewports) await desktop(spec, viewport);
              await compact(spec, 'tablet');
              await compact(spec, 'mobile');
            }
          } finally {
            await browser.close();
          }

          await fs.writeFile(`${outputDir}/reader-v3-metrics.json`, JSON.stringify(metrics, null, 2));
          await fs.writeFile(`${outputDir}/reader-v3-failures.txt`, failures.join('\n'));
          console.log(JSON.stringify(metrics, null, 2));
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          JS

          node capture-reader-v3.mjs

      - name: Validate direct navigation contract
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-v3-review
          path: artifacts/reader-v3-review/*
          if-no-files-found: error
          retention-days: 10
