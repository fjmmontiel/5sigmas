name: Series 5 one-shot chapter 5.6 ordered-list repair

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-fix-ch6-ordered-list.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/evaluating-ai-systems-production-golden
          fetch-depth: 1
      - name: Repair exact editorial defects and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('locales/en/series/evaluating-ai-systems-production/06-observability-failure-taxonomies-production-eval-repair-feedback-loops.md')
          text = path.read_text()
          replacements = {
              '1. **deduplicate by mechanism**, not just text;': '1. **deduplicate by mechanism**, not just text.',
              '2. define the **equivalence class** you want to protect;': '2. define the **equivalence class** you want to protect.',
              '3. add at least one **neighbor case** where correct behavior differs;': '3. add at least one **neighbor case** where correct behavior differs.',
              '4. add a **hard negative** when needed so the repair does not become a universal rule;': '4. add a **hard negative** when needed so the repair does not become a universal rule.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/series5-fix-ch6-ordered-list.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locales/en/series/evaluating-ai-systems-production/06-observability-failure-taxonomies-production-eval-repair-feedback-loops.md .github/workflows/series5-fix-ch6-ordered-list.yml
          git commit -m 'fix(series5): normalize chapter 5.6 English ordered-list punctuation'
          git push origin HEAD:series/evaluating-ai-systems-production-golden
