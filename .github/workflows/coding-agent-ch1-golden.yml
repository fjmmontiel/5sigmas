name: Coding Agents chapter 2.1 GOLDEN milestone
# milestone retry after restoring shared EN manifest parity

on:
  push:
    branches:
      - series/coding-agents-agent-harnesses-golden
    paths:
      - '.github/workflows/coding-agent-ch1-golden.yml'

permissions:
  contents: read

jobs:
  chapter-2-1-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate chapter 2.1 source and relationship-first visual contract
        run: node scripts/validate_coding_agent_harness_ch1_source.mjs

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale source
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Serve combined ES/EN preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/series/coding-agents-agent-harnesses/01-que-es-agent-harness/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/series/coding-agents-agent-harnesses/01-que-es-agent-harness/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Audit browser resource loading
        run: node scripts/audit_browser_resources.mjs

      - name: Validate chapter 2.1 locale and reader navigation
        run: node scripts/validate_coding_agent_harness_ch1_locale_navigation.mjs

      - name: Validate chapter 2.1 desktop/mobile relationship geometry and accessibility
        run: node scripts/validate_coding_agent_harness_ch1_accessibility.mjs

      - name: Validate direct reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Upload chapter 2.1 visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-ch1-golden-evidence
          path: artifacts/visual-review/coding-harness-ch1-*.png
          if-no-files-found: warn
          retention-days: 2
