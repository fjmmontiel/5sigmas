name: Series 5 diagnose chapter 5.5 source gate

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-diagnose-ch5.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture source-gate diagnostics
        id: diag
        continue-on-error: true
        run: |
          mkdir -p artifacts/diagnostics
          set +e
          rc=0
          for n in 1 2 3 4 5; do
            echo "===== CHAPTER $n =====" | tee -a artifacts/diagnostics/source-gates.log
            node scripts/validate_ai_systems_eval_ch${n}_source.mjs 2>&1 | tee -a artifacts/diagnostics/source-gates.log
            x=${PIPESTATUS[0]}
            echo "exit=$x" | tee -a artifacts/diagnostics/source-gates.log
            if [ "$x" -ne 0 ]; then rc=1; fi
          done
          echo "overall_rc=$rc" | tee -a artifacts/diagnostics/source-gates.log
          exit "$rc"
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: series5-ch5-source-diagnostics
          path: artifacts/diagnostics/source-gates.log
          if-no-files-found: error
          retention-days: 1
      - name: Cleanup diagnostic workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/series5-diagnose-ch5.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci(series5): remove chapter 5.5 diagnostic workflow'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Fail if source gates failed
        if: steps.diag.outcome == 'failure'
        run: exit 1
