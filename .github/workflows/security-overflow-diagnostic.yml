name: Security overflow diagnostic

on:
  push:
    branches: ['quality/post-datacenters-requalification']
    paths: ['quality/series-requalification/overflow-request.json']

permissions:
  contents: read

concurrency:
  group: security-overflow-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Spanish strictly
        run: mkdocs build --clean --strict
      - name: Prepare English
        run: python scripts/prepare_locale.py --locale en
      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict
      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve built preview with byte-range support
        run: |
          python scripts/serve_preview.py --self-test
          python scripts/serve_preview.py --directory site --port 8000 > /tmp/security-overflow-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/security-overflow-preview.log
          exit 1
      - name: Diagnose EN Security presentation horizontal overflow
        id: overflow
        continue-on-error: true
        timeout-minutes: 4
        run: |
          node scripts/diagnose_security_overflow.mjs
          test -s artifacts/security-requalification/overflow-diagnostic/report.json
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-overflow-diagnostic-report
          path: artifacts/security-requalification/overflow-diagnostic/report.json
          retention-days: 1
          if-no-files-found: error
      - name: Fail closed while overflow remains
        if: always()
        env:
          OUTCOME: ${{ steps.overflow.outcome }}
        run: test "$OUTCOME" = success
