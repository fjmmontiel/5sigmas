name: Fundamentos IA encoded motion gate

on:
  push:
    branches:
      - migration/video-golden-fundamentos-ia-iag
    paths:
      - 'motion/migration/fundamentos-ia-iag/**'
      - 'motion/src/fundamentos/**'
      - 'motion/web/fundamentos-render.html'
      - 'motion/scripts/fundamentos_render_check.py'
      - 'motion/scripts/fundamentos_encode_motion_probe.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundamentos-ia-iag-encoded-motion
  cancel-in-progress: false

jobs:
  encoded-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe source before expensive encode
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile motion/scripts/fundamentos_render_check.py motion/scripts/fundamentos_encode_motion_probe.py
          for f in motion/src/fundamentos/*.mjs; do node --check "$f"; done
      - name: Install deterministic browser/media dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check playwright pillow
          command -v google-chrome || command -v chromium || command -v chromium-browser
          ffmpeg -version | head -1
      - name: Encode and inspect all canonical concept motion H/V
        shell: bash
        run: |
          set -euo pipefail
          python motion/scripts/fundamentos_encode_motion_probe.py
          cat motion/dist/fundamentos-encoded-motion/fundamentos-encoded-motion-report.json
      - name: Preserve bounded encoded-motion failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentos-encoded-motion-${{ github.sha }}
          path: motion/dist/fundamentos-encoded-motion/
          if-no-files-found: warn
          retention-days: 1
