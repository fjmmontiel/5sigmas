name: Series 5 integrate chapter 5.1

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-integrate-ch1.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/evaluating-ai-systems-production-golden
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Integrate chapter 5.1 without weakening gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          route = 'series/evaluating-ai-systems-production/01-que-evaluar-modelo-componente-sistema-workflow-trayectoria.md'
          visual = 'snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.html'

          replace_once(
              'mkdocs.yml',
              '          - "Benchmarking de inferencia: cost/task, throughput, latencia, energía y hardware": series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md\n',
              '          - "Benchmarking de inferencia: cost/task, throughput, latencia, energía y hardware": series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md\n      - Evaluar sistemas de IA en producción:\n          - Qué evaluar: modelo, componente, sistema, workflow y trayectoria: ' + route + '\n',
          )
          replace_once(
              'mkdocs.en.yml',
              '          - "Benchmarking inference: cost/task, throughput, latency, energy, and hardware constraints": series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md\n',
              '          - "Benchmarking inference: cost/task, throughput, latency, energy, and hardware constraints": series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md\n      - Evaluating AI Systems in Production:\n          - What to evaluate: model, component, system, workflow, and trajectory: ' + route + '\n',
          )
          replace_once(
              'locales/en/manifest.yml',
              '  - series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md\n',
              '  - series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md\n  - ' + route + '\n',
          )
          replace_once(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/inference-benchmark-measurement-boundary.html\n',
              '  - snippets/articulos-tecnicos/inference-benchmark-measurement-boundary.html\n  - ' + visual + '\n',
          )

          es_path = 'docs/series/evaluating-ai-systems-production/01-que-evaluar-modelo-componente-sistema-workflow-trayectoria.md'
          en_path = 'locales/en/series/evaluating-ai-systems-production/01-que-evaluar-modelo-componente-sistema-workflow-trayectoria.md'

          replace_once(
              es_path,
              'Incluso benchmarks etiquetados como «agentic» suelen fijar un harness concreto. Las model cards actuales de Google DeepMind, por ejemplo, publican resultados de Terminal-bench junto al harness usado; ese detalle forma parte de la configuración evaluada, no es decoración metodológica.[^gemini-card]',
              'Incluso benchmarks etiquetados como «agentic» suelen fijar un harness concreto. La model card de Gemini 3.5 Flash publicada por Google DeepMind en mayo de 2026, por ejemplo, reporta Terminal-bench 2.1 con el harness Terminus-2; ese detalle forma parte de la configuración evaluada, no es decoración metodológica.[^gemini-card]',
          )
          replace_once(
              en_path,
              'Even benchmarks described as agentic often fix a specific harness. Current Google DeepMind model cards, for example, publish Terminal-bench results alongside the harness used. That setup detail is part of the evaluated configuration, not methodological decoration.[^gemini-card]',
              'Even benchmarks described as agentic often fix a specific harness. Google DeepMind’s May 2026 Gemini 3.5 Flash model card, for example, reports Terminal-bench 2.1 with the Terminus-2 harness. That setup detail is part of the evaluated configuration, not methodological decoration.[^gemini-card]',
          )

          replace_once(
              es_path,
              '\\tau_i\n=\n(a_1, o_1, a_2, o_2, \\ldots, a_T, o_T)\n\\]\n\npara un trial `i`.',
              '\\tau_i\n=\n(a_1, z_1, a_2, z_2, \\ldots, a_T, z_T)\n\\]\n\npara un trial `i`, donde `a_t` es una acción y `z_t` la observación o estado que devuelve el entorno. Reservamos `o` para el outcome final y así no confundimos una observación intermedia con el resultado del trial.',
          )
          replace_once(
              en_path,
              '\\tau_i\n=\n(a_1, o_1, a_2, o_2, \\ldots, a_T, o_T)\n\\]\n\nfor trial `i`.',
              '\\tau_i\n=\n(a_1, z_1, a_2, z_2, \\ldots, a_T, z_T)\n\\]\n\nfor trial `i`, where `a_t` is an action and `z_t` is the observation or state returned by the environment. We reserve `o` for the final outcome so an intermediate observation is not confused with the trial result.',
          )

          replace_once(
              es_path,
              'Y después exigir:\n\n\\[\n\\Delta U_{product}\\mid B_{system} > 0\n\\]\n\nsi afirmamos que el cambio mejora el producto.',
              'Y después, si afirmamos que el cambio mejora el producto, exigir evidencia en la frontera de sistema:\n\n\\[\n\\Delta_{system}\n=\nE[U_{product}(S_{after})]-E[U_{product}(S_{before})] > 0\n\\]\n\ndonde `U_product` representa la utilidad de producto que realmente nos importa y ambos términos se estiman bajo el mismo protocolo representativo. La desigualdad no se presume por una mejora local: debe medirse.',
          )
          replace_once(
              en_path,
              'If we claim product improvement, we then need evidence at the system boundary:\n\n\\[\n\\Delta U_{product}\\mid B_{system} > 0\n\\]\n\nThe notation encodes two rules:',
              'If we claim product improvement, we then need evidence at the system boundary:\n\n\\[\n\\Delta_{system}\n=\nE[U_{product}(S_{after})]-E[U_{product}(S_{before})] > 0\n\\]\n\nwhere `U_product` is the product utility we actually care about and both terms are estimated under the same representative protocol. The inequality is not implied by a local gain; it has to be measured.\n\nThe notation encodes two rules:',
          )

          replace_once(
              es_path,
              '[^gemini-card]: Google DeepMind, *Gemini 3.5 Flash model card*, evaluation table and methodology notes including named harnesses for agentic benchmarks. https://deepmind.google/models/model-cards/gemini-3-5-flash/',
              '[^gemini-card]: Google DeepMind, *Gemini 3.5 Flash model card*, published 19 May 2026; the evaluation table reports Terminal-bench 2.1 with the Terminus-2 harness. https://deepmind.google/models/model-cards/gemini-3-5-flash/',
          )
          replace_once(
              en_path,
              '[^gemini-card]: Google DeepMind, *Gemini 3.5 Flash model card*, evaluation table and methodology notes including named harnesses for agentic benchmarks. https://deepmind.google/models/model-cards/gemini-3-5-flash/',
              '[^gemini-card]: Google DeepMind, *Gemini 3.5 Flash model card*, published May 19, 2026; the evaluation table reports Terminal-bench 2.1 with the Terminus-2 harness. https://deepmind.google/models/model-cards/gemini-3-5-flash/',
          )

          snippet_path = Path('docs/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.html')
          snippet = snippet_path.read_text()
          patches = [
              (
                  'mechanism="change/risk -> choose narrowest boundary containing the mechanism -> execute task/environment through system boundary -> workflow policy selects components/model/tools -> one realized trajectory produces outcome/state; local evals diagnose model/component/workflow behavior while system eval confirms product utility; trajectory evidence explains the path but does not replace outcome."',
                  'mechanism="change/risk -> choose narrowest boundary containing the mechanism -> evaluate a trial whose task/environment define context -> workflow policy selects components/model/tools -> one realized trajectory produces outcome/state; local evals diagnose model/component/workflow behavior while the end-to-end eval confirms product utility; trial context is not automatically part of the production SUT; trajectory evidence explains the path but does not replace outcome."',
              ),
              (
                  'El workflow es una política dentro del sistema. La trayectoria es una ejecución concreta de esa política. El outcome es el estado o resultado que finalmente importa. Una eval útil deja claro cuál de esas fronteras está midiendo.',
                  'El workflow es una política dentro del sistema. La trayectoria es una ejecución concreta de esa política. El outcome es el estado o resultado que finalmente importa. La frontera exterior representa el trial end-to-end: task y environment son contexto evaluado y no se convierten por ello en componentes del SUT de producción.',
              ),
              ('SYSTEM EVAL · FRONTERA DEL PRODUCTO', 'SYSTEM EVAL · FRONTERA END-TO-END DEL TRIAL'),
              ('<g data-node="task">', '<g data-node="task" data-role="trial-context">'),
              ('<g data-node="environment">', '<g data-node="environment" data-role="trial-context">'),
              ('caso y criterios', 'caso y criterios · contexto del trial'),
          ]
          for old, new in patches:
              if new in snippet:
                  continue
              if snippet.count(old) != 1:
                  raise SystemExit(f'snippet: expected exactly one patch anchor for {old!r}, found {snippet.count(old)}')
              snippet = snippet.replace(old, new, 1)
          snippet_path.write_text(snippet)

          i18n_path = Path('locales/en/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.i18n.json')
          i18n = json.loads(i18n_path.read_text())
          replacements = i18n['replacements']
          swaps = {
              'El workflow es una política dentro del sistema. La trayectoria es una ejecución concreta de esa política. El outcome es el estado o resultado que finalmente importa. Una eval útil deja claro cuál de esas fronteras está midiendo.': (
                  'El workflow es una política dentro del sistema. La trayectoria es una ejecución concreta de esa política. El outcome es el estado o resultado que finalmente importa. La frontera exterior representa el trial end-to-end: task y environment son contexto evaluado y no se convierten por ello en componentes del SUT de producción.',
                  'The workflow is a policy inside the system. A trajectory is one concrete execution of that policy. The outcome is the final state or result that actually matters. The outer boundary represents the end-to-end trial: task and environment are evaluated context and do not thereby become components of the production SUT.'
              ),
              'SYSTEM EVAL · FRONTERA DEL PRODUCTO': (
                  'SYSTEM EVAL · FRONTERA END-TO-END DEL TRIAL',
                  'SYSTEM EVAL · END-TO-END TRIAL BOUNDARY'
              ),
              'caso y criterios': (
                  'caso y criterios · contexto del trial',
                  'case and criteria · trial context'
              ),
          }
          for old_key, (new_key, new_value) in swaps.items():
              if new_key in replacements:
                  continue
              if old_key not in replacements:
                  raise SystemExit(f'i18n: missing patch key {old_key!r}')
              replacements.pop(old_key)
              replacements[new_key] = new_value
          data = snippet_path.read_bytes()
          i18n['source_blob_sha'] = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          i18n_path.write_text(json.dumps(i18n, ensure_ascii=False, indent=2) + '\n')

          validator = Path('scripts/validate_ai_systems_eval_ch1_source.mjs')
          text = validator.read_text()
          old = "for (const token of ['S(x, e; M, C, \\\\pi)', 'B_{diagnostic}', '\\\\Delta_{model\\\\mid harness}', 'Recall@k', 'trajectory', 'outcome', 'workflow', 'System Under Test']) {"
          new = "for (const token of ['S(x, e; M, C, \\\\pi)', 'B_{diagnostic}', '\\\\Delta_{system}', '\\\\Delta_{model\\\\mid harness}', 'Recall@k', 'z_1', 'trajectory', 'outcome', 'workflow', 'System Under Test']) {"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('validator: required-token patch anchor missing')
              text = text.replace(old, new, 1)
          old = "for (const token of ['Set the boundary first', 'DIAGNOSTIC BOUNDARY', 'PRODUCT BOUNDARY', 'POLICY / ORCHESTRATION', 'trajectory realized in this trial', 'Outcome + final state', 'Diagnose → move inward', 'Confirm → move outward', 'outcome ≠ trajectory']) {"
          new = "for (const token of ['Set the boundary first', 'DIAGNOSTIC BOUNDARY', 'END-TO-END TRIAL BOUNDARY', 'POLICY / ORCHESTRATION', 'trajectory realized in this trial', 'Outcome + final state', 'Diagnose → move inward', 'Confirm → move outward', 'outcome ≠ trajectory']) {"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('validator: visual-translation token patch anchor missing')
              text = text.replace(old, new, 1)
          anchor = "check(snippet.includes('data-path=\"trajectory\"'), 'Visual: realized trajectory path missing');\n"
          add = anchor + "check((snippet.match(/data-role=\"trial-context\"/g) || []).length === 2, 'Visual: task and environment must be explicitly marked as trial context');\n"
          if 'task and environment must be explicitly marked as trial context' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('validator: trial-context insertion anchor missing')
              text = text.replace(anchor, add, 1)
          validator.write_text(text)

          # Fail if canonical integration is still incomplete.
          assert 'Evaluar sistemas de IA en producción:' in Path('mkdocs.yml').read_text()
          assert 'Evaluating AI Systems in Production:' in Path('mkdocs.en.yml').read_text()
          manifest = Path('locales/en/manifest.yml').read_text()
          assert route in manifest and visual in manifest
          PY

      - name: Run chapter 5.1 source gate after integration
        run: node scripts/validate_ai_systems_eval_ch1_source.mjs

      - name: Commit integrated state
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mkdocs.yml mkdocs.en.yml locales/en/manifest.yml \
            docs/series/evaluating-ai-systems-production/01-que-evaluar-modelo-componente-sistema-workflow-trayectoria.md \
            locales/en/series/evaluating-ai-systems-production/01-que-evaluar-modelo-componente-sistema-workflow-trayectoria.md \
            docs/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.html \
            locales/en/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.i18n.json \
            scripts/validate_ai_systems_eval_ch1_source.mjs
          git commit -m 'feat(series5): integrate and tighten chapter 5.1'
          git push origin HEAD:series/evaluating-ai-systems-production-golden
