name: Integrate approved Coding C1 without changing video bytes
on:
  push:
    branches: [release/coding-c1-approved-20260926]
    paths: [.github/workflows/integrate-coding-c1.yml]
permissions:
  contents: write
concurrency:
  group: coding-c1-exact-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing build and poster dependencies
        run: |
          python -m pip install -q -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
      - name: Run hash-bound integration, never encode a replacement MP4
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,lzma,subprocess,sys
          bundle=Path('.release-coding-c1/integration.json.xz').read_bytes()
          assert hashlib.sha256(bundle).hexdigest()=='8fea6df2d71ea159aa4efaed8f0f42d60823ab9eeb2f20a4a24d6d602e4c3925'
          payload=json.loads(lzma.decompress(bundle))
          assert set(payload)=={'integrate.py','test_video_fractional_timing.py'}
          Path('/tmp/coding-c1-integrate.py').write_text(payload['integrate.py'],encoding='utf-8')
          Path('scripts/test_video_fractional_timing.py').write_text(payload['test_video_fractional_timing.py'],encoding='utf-8')
          subprocess.run([sys.executable,'/tmp/coding-c1-integrate.py'],check=True)
      - name: Check original identity, precise timing and publication contracts
        run: |
          sha256sum -c .github/receipts/coding-c1.sha256
          python scripts/test_video_fractional_timing.py
          python scripts/test_video_schema_contract.py
          python scripts/prepare_video_media.py --check
          python -m py_compile scripts/verify_coding_c1_release.py hooks/video_sitemap.py hooks/video_sitemap_en.py
          node --check scripts/verify_coding_c1_browser.mjs
          node --check scripts/validate_coding_series_browser_milestone.mjs
          node --check scripts/validate_english_series_video_rollback.mjs
          node --check scripts/validate_english_video_hub.mjs
      - name: Commit clean approved release changes, removing temporary source transport
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/release/coding-c1-approved-20260926 | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          python - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/coding-c1-changed.json'))+['scripts/test_video_fractional_timing.py']
          for path in paths:
              subprocess.run(['git','add','--',path],check=True)
          PY
          git rm -r .release-coding-c1 .github/workflows/assemble-coding-c1.yml .github/workflows/integrate-coding-c1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(video): integrate approved Coding C1 originals and exact discovery'
          git push origin HEAD:refs/heads/release/coding-c1-approved-20260926
