name: Fast video AI discovery contract

on:
  pull_request:
    paths:
      - 'hooks/video_sitemap.py'
      - 'hooks/video_sitemap_en.py'
      - 'hooks/video_publication_policy.py'
      - 'scripts/test_video_ai_discovery_contract.py'
      - 'scripts/audit_site_perfection_live.py'
      - '.github/workflows/video-ai-discovery-contract.yml'
  push:
    branches: [main]
    paths:
      - 'hooks/video_sitemap.py'
      - 'hooks/video_sitemap_en.py'
      - 'hooks/video_publication_policy.py'
      - 'scripts/test_video_ai_discovery_contract.py'
      - 'scripts/audit_site_perfection_live.py'
      - '.github/workflows/video-ai-discovery-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            hooks/video_sitemap.py
            hooks/video_sitemap_en.py
            hooks/video_publication_policy.py
            scripts/test_video_ai_discovery_contract.py
            scripts/audit_site_perfection_live.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal generator dependencies
        run: python -m pip install --disable-pip-version-check --quiet mkdocs pyyaml

      - name: Compile changed generators and live auditor
        run: python -m py_compile hooks/video_sitemap.py hooks/video_sitemap_en.py scripts/test_video_ai_discovery_contract.py scripts/audit_site_perfection_live.py

      - name: Verify ES/EN hreflang and truthful LLM text fallback
        run: python scripts/test_video_ai_discovery_contract.py
