name: Context Engineering 3.3 Spanish visual wording repair

on:
  push:
    branches:
      - series/context-engineering-memory-mcp-golden
    paths:
      - '.github/workflows/context-engineering-ch3-language-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/context-engineering-memory-mcp-golden

      - name: Naturalize Spanish visual copy and repin EN mirror
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          visual_path = Path('docs/snippets/articulos-tecnicos/context-memory-lifecycle.html')
          i18n_path = Path('locales/en/snippets/articulos-tecnicos/context-memory-lifecycle.i18n.json')
          gate_path = Path('scripts/validate_context_engineering_ch3_source.mjs')

          visual = visual_path.read_text(encoding='utf-8')
          old = '<strong>Persistir no hace equivalentes estos stores.</strong>'
          new = '<strong>Persistir no hace equivalentes estos almacenes.</strong>'
          if visual.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy visual phrase, found {visual.count(old)}')
          visual = visual.replace(old, new, 1)
          visual_path.write_text(visual, encoding='utf-8')

          raw = visual.encode('utf-8')
          blob_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          i18n = json.loads(i18n_path.read_text(encoding='utf-8'))
          old_key = '<strong>Persistir no hace equivalentes estos stores.</strong> Los episodios registran eventos, la memoria semántica consolida conocimiento derivado, el system of record gobierna el estado de negocio y el checkpoint existe para reanudar ejecución. Sólo el subconjunto seleccionado entra en <code>Wₜ</code>.'
          new_key = '<strong>Persistir no hace equivalentes estos almacenes.</strong> Los episodios registran eventos, la memoria semántica consolida conocimiento derivado, el system of record gobierna el estado de negocio y el checkpoint existe para reanudar ejecución. Sólo el subconjunto seleccionado entra en <code>Wₜ</code>.'
          if old_key not in i18n['replacements']:
              raise SystemExit('legacy visual translation key not found')
          translated = i18n['replacements'].pop(old_key)
          i18n['replacements'][new_key] = translated
          i18n['source_blob_sha'] = blob_sha
          i18n_path.write_text(json.dumps(i18n, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gate = gate_path.read_text(encoding='utf-8')
          anchor = "check(!es.includes('cuarto bucket') && !es.includes('Deletion y corrección') && !es.includes('data pipeline'), 'ES: unnatural mixed-language lifecycle terminology returned');"
          guard = "check(!snippet.includes('estos stores') && snippet.includes('estos almacenes'), 'ES visual: unnatural stores wording returned');"
          if guard not in gate:
              if anchor not in gate:
                  raise SystemExit('source-gate insertion anchor not found')
              gate = gate.replace(anchor, anchor + '\n' + guard, 1)
              gate_path.write_text(gate, encoding='utf-8')
          PY

          node scripts/validate_context_engineering_ch3_source.mjs
          git diff --check

      - name: Commit repair and remove repair workflow
        shell: bash
        run: |
          rm .github/workflows/context-engineering-ch3-language-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/snippets/articulos-tecnicos/context-memory-lifecycle.html \
                  locales/en/snippets/articulos-tecnicos/context-memory-lifecycle.i18n.json \
                  scripts/validate_context_engineering_ch3_source.mjs \
                  .github/workflows/context-engineering-ch3-language-repair.yml
          git commit -m 'fix(context): naturalize chapter 3.3 Spanish visual copy'
          git push origin HEAD:series/context-engineering-memory-mcp-golden
