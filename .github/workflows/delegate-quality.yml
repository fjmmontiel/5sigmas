name: Delegated PR quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Quality suite to delegate
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - core
          - reader
          - series
          - english
          - locale
          - tools

permissions:
  actions: read
  contents: read

concurrency:
  group: delegated-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan delegated suites
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      series: ${{ steps.plan.outputs.series }}
      owner: ${{ steps.plan.outputs.owner }}
      english: ${{ steps.plan.outputs.english }}
      locale: ${{ steps.plan.outputs.locale }}
      tools: ${{ steps.plan.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Route changed files to autonomous suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DELEGATED_SUITE: ${{ inputs.suite || 'auto' }}
        run: python scripts/ci_plan.py

  core:
    name: Core E2E
    needs: plan
    if: needs.plan.outputs.core == 'true'
    uses: ./.github/workflows/pr-visual-review.yml

  series:
    name: Series UX
    needs: plan
    if: needs.plan.outputs.series == 'true'
    uses: ./.github/workflows/series-ui-review.yml

  owner-review:
    name: Series owner review
    needs: plan
    if: needs.plan.outputs.owner == 'true'
    uses: ./.github/workflows/series-owner-workbench.yml

  english:
    name: English mirror
    needs: plan
    if: needs.plan.outputs.english == 'true'
    uses: ./.github/workflows/english-mirror-quality.yml

  locale:
    name: Locale routing
    needs: plan
    if: needs.plan.outputs.locale == 'true'
    uses: ./.github/workflows/locale-switch-quality.yml

  tools:
    name: Tools
    needs: plan
    if: needs.plan.outputs.tools == 'true'
    uses: ./.github/workflows/tools-quality.yml
