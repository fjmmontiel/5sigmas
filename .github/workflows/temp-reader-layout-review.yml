name: Temporary reader layout review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'docs/stylesheets/reader-layout-breathing.css'
      - 'docs/stylesheets/voice-report-animations-polish.css'
      - '.github/workflows/temp-reader-layout-review.yml'

permissions:
  contents: read

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build strictly
        run: mkdocs build --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve site
        run: |
          python -m http.server 8000 --directory site > /tmp/reader-layout-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/reader-layout-preview.log
          exit 1

      - name: Capture pages and validate geometry
        run: |
          cat > capture-reader-layout.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs/promises';

          const baseUrl = 'http://127.0.0.1:8000';
          const outputDir = 'artifacts/reader-layout-review';
          await fs.mkdir(outputDir, { recursive: true });

          const pages = [
            {
              slug: 'reactive-proactive-voice',
              path: '/articulos-tecnicos/reactive-proactive-voice-agents/',
              animation: '.s5v-contract',
            },
            {
              slug: 'voice-architectures',
              path: '/articulos-tecnicos/voice-agent-architectures/',
              animation: '.s5v-arch-map',
            },
            {
              slug: 'series-reader',
              path: '/series/from-cave-to-agi/00_presentacion_serie/',
              animation: null,
            },
          ];

          const desktopViewports = [
            { name: 'wide', width: 1728, height: 1117 },
            { name: 'standard', width: 1440, height: 1000 },
          ];

          const browser = await chromium.launch({ headless: true });
          const metrics = [];

          const box = async (page, selector) => {
            const locator = page.locator(selector).first();
            if (!await locator.count()) return null;
            return locator.evaluate((element) => {
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                x: Math.round(rect.x * 10) / 10,
                y: Math.round(rect.y * 10) / 10,
                width: Math.round(rect.width * 10) / 10,
                height: Math.round(rect.height * 10) / 10,
                maxWidth: style.maxWidth,
                marginLeft: style.marginLeft,
              };
            });
          };

          async function settle(page) {
            await page.waitForLoadState('networkidle');
            await page.evaluate(async () => {
              await document.fonts.ready;
              const step = Math.max(500, Math.floor(window.innerHeight * .75));
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 55));
              }
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(350);
            await page.addStyleTag({
              content: `
                *, *::before, *::after {
                  animation-play-state: paused !important;
                  transition: none !important;
                }
              `,
            });
          }

          async function inspectDesktop(spec, viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto(`${baseUrl}${spec.path}`, { waitUntil: 'domcontentloaded' });
            await settle(page);

            const geometry = {
              page: spec.slug,
              viewport: viewport.name,
              viewportWidth: viewport.width,
              library: await box(page, '.s5-reader-direct'),
              content: await box(page, '.md-content'),
              inner: await box(page, '.md-content__inner'),
              title: await box(page, 'article h1'),
              prose: await box(page, '.md-typeset > p'),
              navigation: await box(page, '.s5-reader-topbar'),
              animation: spec.animation ? await box(page, spec.animation) : null,
              horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth),
            };
            metrics.push(geometry);

            const { library, content, title, prose, navigation, animation } = geometry;
            if (!library || !content || !title || !prose || !navigation) {
              throw new Error(`Missing reader geometry: ${JSON.stringify(geometry)}`);
            }
            if (geometry.horizontalOverflow > 1) {
              throw new Error(`Horizontal overflow on ${spec.slug}/${viewport.name}: ${geometry.horizontalOverflow}px`);
            }
            if (library.x > (viewport.width >= 1700 ? 100 : 45)) {
              throw new Error(`Library remains too centred on ${spec.slug}/${viewport.name}: x=${library.x}`);
            }
            if (content.x - (library.x + library.width) < 26) {
              throw new Error(`Reader columns need more separation: ${JSON.stringify(geometry)}`);
            }
            if (viewport.width >= 1700 && content.width < 1180) {
              throw new Error(`Article canvas is still too narrow: ${content.width}px`);
            }
            if (viewport.width < 1700 && content.width < 1080) {
              throw new Error(`Standard desktop article canvas is too narrow: ${content.width}px`);
            }
            if (Math.abs(title.x - content.x) > 2 || Math.abs(navigation.x - content.x) > 2) {
              throw new Error(`Title and navigation do not share the article edge: ${JSON.stringify(geometry)}`);
            }
            if (prose.width < 790 || prose.width > 850) {
              throw new Error(`Prose measure is outside the intended range: ${prose.width}px`);
            }
            if (animation && animation.x + animation.width > viewport.width - 20) {
              throw new Error(`Animation leaves the viewport: ${JSON.stringify(animation)}`);
            }

            await page.screenshot({
              path: `${outputDir}/${spec.slug}-${viewport.name}-viewport.png`,
              fullPage: false,
            });
            await page.screenshot({
              path: `${outputDir}/${spec.slug}-${viewport.name}-full.png`,
              fullPage: true,
            });
            await page.close();
          }

          async function inspectMobile(spec) {
            const pixel = devices['Pixel 7'];
            const page = await browser.newPage({
              ...pixel,
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
            });
            await page.goto(`${baseUrl}${spec.path}`, { waitUntil: 'domcontentloaded' });
            await settle(page);

            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            if (overflow > 1) {
              throw new Error(`Mobile horizontal overflow on ${spec.slug}: ${overflow}px`);
            }

            await page.screenshot({
              path: `${outputDir}/${spec.slug}-mobile-viewport.png`,
              fullPage: false,
            });
            await page.screenshot({
              path: `${outputDir}/${spec.slug}-mobile-full.png`,
              fullPage: true,
            });
            await page.close();
          }

          try {
            for (const spec of pages) {
              for (const viewport of desktopViewports) {
                await inspectDesktop(spec, viewport);
              }
              await inspectMobile(spec);
            }
          } finally {
            await browser.close();
          }

          await fs.writeFile(
            `${outputDir}/layout-metrics.json`,
            JSON.stringify(metrics, null, 2),
          );
          console.log(JSON.stringify(metrics, null, 2));
          JS

          node capture-reader-layout.mjs

      - name: Upload reader layout review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-layout-review
          path: artifacts/reader-layout-review/*
          if-no-files-found: error
          retention-days: 7
