name: CI storage policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifact-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Reject wasteful Actions artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          errors = []
          workflow_dir = Path('.github/workflows')
          upload_use = re.compile(r'^\s*(?:-\s*)?uses:\s*actions/upload-artifact@')
          pages_upload_use = re.compile(r'^\s*(?:-\s*)?uses:\s*actions/upload-pages-artifact@')
          pages_uploads = []

          def step_block(lines, index):
              line = lines[index]
              stripped = line.lstrip()
              uses_indent = len(line) - len(stripped)

              if stripped.startswith('- '):
                  step_indent = uses_indent
                  start = index
              else:
                  step_indent = max(uses_indent - 2, 0)
                  start = index
                  while start > 0:
                      candidate = lines[start - 1]
                      candidate_stripped = candidate.lstrip()
                      indent = len(candidate) - len(candidate_stripped)
                      start -= 1
                      if indent == step_indent and candidate_stripped.startswith('- '):
                          break

              end = index + 1
              while end < len(lines):
                  candidate = lines[end]
                  candidate_stripped = candidate.lstrip()
                  indent = len(candidate) - len(candidate_stripped)
                  if indent == step_indent and candidate_stripped.startswith('- '):
                      break
                  end += 1

              return '\n'.join(lines[start:end])

          for path in sorted([*workflow_dir.glob('*.yml'), *workflow_dir.glob('*.yaml')]):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if pages_upload_use.match(line):
                      pages_uploads.append((path, index + 1))

                  if not upload_use.match(line):
                      continue

                  block = step_block(lines, index)

                  if not re.search(r'(?m)^\s*retention-days:\s*1\s*(?:#.*)?$', block):
                      errors.append(f'{path}:{index + 1}: upload-artifact must set retention-days: 1')

                  if_match = re.search(r'(?m)^\s*if:\s*(.+?)\s*$', block)
                  if not if_match:
                      errors.append(
                          f'{path}:{index + 1}: generic upload-artifact is allowed only as failure evidence; '
                          'add if: failure()'
                      )
                  else:
                      expression = if_match.group(1).split('#', 1)[0].strip()
                      if expression != 'failure()':
                          errors.append(
                              f'{path}:{index + 1}: generic upload-artifact must be failure-only; '
                              f'found if: {expression}'
                          )

                  for match in re.finditer(r'(?m)^\s*path:\s*["\']?([^"\'\n#]+)', block):
                      artifact_path = match.group(1).strip()
                      if artifact_path == 'site' or artifact_path.startswith('site/'):
                          errors.append(
                              f'{path}:{index + 1}: do not retain built site directories with upload-artifact; '
                              'validate them in-run or use upload-pages-artifact for deployment'
                          )

          if len(pages_uploads) != 1 or pages_uploads[0][0].name != 'deploy-pages.yml':
              rendered = ', '.join(f'{path}:{line}' for path, line in pages_uploads) or 'none'
              errors.append(
                  'upload-pages-artifact is permitted exactly once, in deploy-pages.yml; '
                  f'found: {rendered}'
              )

          cleanup_path = workflow_dir / 'cleanup-actions-artifacts.yml'
          if not cleanup_path.exists():
              errors.append('cleanup-actions-artifacts.yml must exist')
          else:
              cleanup = cleanup_path.read_text(encoding='utf-8')
              for required in (
                  'schedule:',
                  "cron: '17 * * * *'",
                  "default: '1'",
                  'actions: write',
                  'deleteArtifact',
                  'cancel-in-progress: true',
                  "artifact.name === 'github-pages'",
                  "artifact.name === 'english-ttc-reviewed-seed'",
              ):
                  if required not in cleanup:
                      errors.append(
                          f'cleanup-actions-artifacts.yml must preserve storage safeguard: {required}'
                      )

          pages_cleanup_path = workflow_dir / 'cleanup-pages-artifact.yml'
          if not pages_cleanup_path.exists():
              errors.append('cleanup-pages-artifact.yml must exist so Pages artifacts are deleted after use')
          else:
              pages_cleanup = pages_cleanup_path.read_text(encoding='utf-8')
              for required in (
                  'workflow_run:',
                  "workflows: ['Deploy MkDocs to GitHub Pages']",
                  'actions: write',
                  "artifact.name === 'github-pages'",
                  'deleteArtifact',
              ):
                  if required not in pages_cleanup:
                      errors.append(
                          f'cleanup-pages-artifact.yml must preserve Pages cleanup safeguard: {required}'
                      )

          if errors:
              print('CI storage policy violations:', file=sys.stderr)
              for error in errors:
                  print(f' - {error}', file=sys.stderr)
              raise SystemExit(1)

          print(
              'CI storage policy OK: generic artifacts are failure-only with one-day maximum retention, '
              'old generic artifacts are purged hourly, and the single required Pages artifact is deleted after deployment.'
          )
          PY
