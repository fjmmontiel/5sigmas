name: Render English Caves native media

on:
  push:
    branches:
      - agent/english-media-caves
    paths:
      - scripts/render_english_caves_media.py
      - .github/workflows/render-english-caves-media.yml

permissions:
  contents: write

jobs:
  render:
    if: github.event.head_commit.message == 'Add temporary Caves native media render workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-media-caves
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render native-English Caves media
        run: python scripts/render_english_caves_media.py

      - name: Validate media contract
        shell: bash
        run: |
          set -euo pipefail
          root='locales/en/series/from-cave-to-agi'
          for slug in \
            00_presentacion_serie \
            01-representar \
            02-mecanizar \
            03-aprender \
            04-escalar \
            05-mas-alla; do
            test -s "$root/$slug.mp4"
            test -s "$root/$slug.jpg"
            codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$root/$slug.mp4")
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$root/$slug.mp4")
            pix=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$root/$slug.mp4")
            fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$root/$slug.mp4")
            test "$codec" = 'h264'
            test "$dims" = '1920x1080'
            test "$pix" = 'yuv420p'
            test "$fps" = '30/1'
          done

      - name: Commit rendered binaries to the migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f locales/en/series/from-cave-to-agi/*.mp4 locales/en/series/from-cave-to-agi/*.jpg
          if git diff --cached --quiet; then
            echo 'Rendered media is already current.'
            exit 0
          fi
          git commit -m 'Render native English Caves media'
          git push origin HEAD:agent/english-media-caves

      - name: Upload poster review set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-caves-native-media-posters
          path: locales/en/series/from-cave-to-agi/*.jpg
          if-no-files-found: error
          retention-days: 14
