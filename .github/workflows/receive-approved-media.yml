name: Receive exact owner-approved media
on:
  push:
    branches: [release/owner-approved-video-batch-20260927]
    paths: [.github/workflows/receive-approved-media.yml]
permissions:
  contents: write
concurrency:
  group: receive-owner-approved-video-batch-20260927
  cancel-in-progress: false
jobs:
  receive:
    if: github.actor == 'fjmmontiel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media validation and sealed-transfer dependencies
        run: |
          python -m pip install cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Receive hash-pinned original files without rendering or publishing
        run: python -u .release-media/receive.py
