name: Reasoning evidence-surfaces visual quality

on:
  pull_request:
    paths:
      - 'docs/temas/razonamiento.md'
      - 'docs/snippets/temas/reasoning-evidence-surfaces.html'
      - 'locales/en/temas/razonamiento.md'
      - 'locales/en/snippets/temas/reasoning-evidence-surfaces.html'
      - 'locales/en/snippets/temas/reasoning-evidence-surfaces.i18n.json'
      - 'scripts/validate_reasoning_evidence_surfaces_visual.mjs'
      - '.github/workflows/topic-reasoning-evidence-surfaces-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Build English locale strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-reasoning-evidence-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/temas/razonamiento/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/temas/razonamiento/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-reasoning-evidence-preview.log
          exit 1

      - name: Validate reasoning evidence surfaces ES/EN
        run: node scripts/validate_reasoning_evidence_surfaces_visual.mjs

      - name: Upload reasoning evidence-surface review on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-evidence-surfaces-visual-review
          path: artifacts/visual-review/reasoning-evidence-surfaces-*.png
          if-no-files-found: warn
          retention-days: 1
