name: Series 5 repair chapter 5.1 source gate

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-fix-source-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/evaluating-ai-systems-production-golden
          fetch-depth: 0

      - name: Repair markdown-sensitive distinction assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate_ai_systems_eval_ch1_source.mjs')
          text = p.read_text()
          anchor = "check(es.includes('workflow describe las reglas o política') && es.includes('trayectoria') && es.includes('camino concreto'), 'ES: workflow-versus-trajectory distinction missing');\ncheck(en.includes('workflow describes the rules or policy') && en.includes('trajectory') && en.includes('path that actually occurred'), 'EN: workflow-versus-trajectory distinction missing');"
          replacement = "const esPlain = es.replace(/\\*\\*/g, '');\nconst enPlain = en.replace(/\\*\\*/g, '');\ncheck(esPlain.includes('workflow describe las reglas o política') && esPlain.includes('trayectoria') && esPlain.includes('camino concreto'), 'ES: workflow-versus-trajectory distinction missing');\ncheck(enPlain.includes('workflow describes the rules or policy') && enPlain.includes('trajectory') && enPlain.includes('path that actually occurred'), 'EN: workflow-versus-trajectory distinction missing');"
          if replacement in text:
              raise SystemExit('repair already present; refusing ambiguous duplicate run')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one source-gate anchor, found {text.count(anchor)}')
          p.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Confirm repair preserves gate syntax
        run: node --check scripts/validate_ai_systems_eval_ch1_source.mjs

      - name: Commit deterministic gate repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_ai_systems_eval_ch1_source.mjs
          git commit -m 'fix(series5): make 5.1 distinction gate markdown-robust'
          git push origin HEAD:series/evaluating-ai-systems-production-golden
