name: Patch video schema contract

on:
  pull_request:
    paths:
      - '.github/workflows/patch-video-schema-contract.yml'
      - 'scripts/test_video_schema_contract.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'reconcile/organic-growth-video-library-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove invalid watch-page embedUrl and verify contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          path = Path('hooks/video_sitemap.py')
          body = path.read_text(encoding='utf-8')
          needle = '        "embedUrl": entry["watch_url"],\n'
          if needle in body:
              body = body.replace(needle, '', 1)
              path.write_text(body, encoding='utf-8')
          elif '"embedUrl": entry["watch_url"]' in body:
              raise SystemExit('embedUrl is present in an unexpected form')
          PY
          python scripts/test_video_schema_contract.py
          git add hooks/video_sitemap.py scripts/test_video_schema_contract.py
          if git diff --cached --quiet; then
            echo 'Video schema already conforms.'
          else
            git diff --cached --check
            git commit -m 'fix: use content URL without fake video embed URL'
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
