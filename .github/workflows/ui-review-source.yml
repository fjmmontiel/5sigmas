name: UI review source export (no deployment)

on:
  push:
    branches: ['ui/series-discovery-review-20260929']
    paths: ['.github/workflows/ui-review-source.yml']

permissions:
  contents: read
  actions: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-review-source-6209a852
          run-id: 36581945714
          github-token: ${{ github.token }}
          path: /tmp/ui-review
      - name: Split original archive without modifying its bytes
        run: |
          cd /tmp/ui-review
          sha256sum source.tar.gz
          split -b 400M source.tar.gz source-part-
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source-part-aa
          path: /tmp/ui-review/source-part-aa
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source-part-ab
          path: /tmp/ui-review/source-part-ab
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-offline-build-dependencies
          path: |
            /tmp/ui-review/wheels/
            /tmp/ui-review/BASE_SHA.txt
            /tmp/ui-review/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
