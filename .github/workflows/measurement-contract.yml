name: First-party measurement contract

on:
  pull_request:
    paths:
      - 'docs/assets/javascripts/measurement.js'
      - 'docs/assets/javascripts/measurement-*.js'
      - 'scripts/measurement_test_harness.mjs'
      - 'scripts/build_measurement_catalog.py'
      - 'scripts/configure_measurement.py'
      - 'scripts/tests/test_measurement_setup.py'
      - 'measurement-deployment.json'
      - 'docs/javascripts/external-links.js'
      - 'scripts/test_measurement_contract.mjs'
      - 'scripts/test_model_price_performance_measurement.mjs'
      - 'docs/assets/javascripts/tools/model-price-performance.js'
      - 'docs/herramientas/precio-rendimiento-modelos.md'
      - 'locales/en/tools/model-price-performance.md'
      - 'MEASUREMENT.md'
      - '.github/workflows/measurement-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/assets/javascripts/measurement.js'
      - 'docs/assets/javascripts/measurement-*.js'
      - 'scripts/measurement_test_harness.mjs'
      - 'scripts/build_measurement_catalog.py'
      - 'scripts/configure_measurement.py'
      - 'scripts/tests/test_measurement_setup.py'
      - 'measurement-deployment.json'
      - 'docs/javascripts/external-links.js'
      - 'scripts/test_measurement_contract.mjs'
      - 'scripts/test_model_price_performance_measurement.mjs'
      - 'docs/assets/javascripts/tools/model-price-performance.js'
      - 'docs/herramientas/precio-rendimiento-modelos.md'
      - 'locales/en/tools/model-price-performance.md'
      - 'MEASUREMENT.md'
      - '.github/workflows/measurement-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate privacy and event semantics
        run: node scripts/test_measurement_contract.mjs
      - name: Verify model explorer attribution and privacy
        run: node scripts/test_model_price_performance_measurement.mjs
      - name: Verify vocabulary and safe build activation
        run: python3 -m unittest scripts.tests.test_measurement_setup
      - name: Verify runtime syntax
        run: |
          node --check docs/assets/javascripts/measurement.js
          node --check docs/assets/javascripts/tools/model-price-performance.js
