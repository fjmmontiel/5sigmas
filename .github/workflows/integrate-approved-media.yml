name: Integrate exact owner-approved video collections
on:
  push:
    branches: [release/owner-approved-video-batch-20260927]
    paths: [.github/workflows/integrate-approved-media.yml]
permissions:
  contents: write
concurrency:
  group: integrate-approved-golden-batch-20260928
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor == 'fjmmontiel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sealed-transfer and media verification dependencies
        run: |
          python -m pip install cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble clean release with exact original hashes and full decode
        run: python -u .release-media/integrate_approved.py
      - name: Upload actual assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-integration-evidence
          path: /tmp/approved-integration-evidence/*
          if-no-files-found: warn
          retention-days: 7
