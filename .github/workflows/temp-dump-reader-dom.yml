name: Temporary inspect · reader header geometry

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-dump-reader-dom.yml'
      - 'docs/stylesheets/reader-editorial-v3.css'
      - 'docs/stylesheets/reader-editorial-v3-iteration.css'

permissions:
  contents: read

jobs:
  inspect-reader-header:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Build site
        run: |
          pip install -r requirements.txt
          mkdocs build --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve and inspect
        shell: bash
        run: |
          mkdir -p artifacts/reader-header
          python -m http.server 8000 --directory site > /tmp/reader-header.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done

          cat > inspect-reader-header.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1728, height: 1117 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:8000/articulos-tecnicos/reactive-proactive-voice-agents/', { waitUntil: 'networkidle' });
          await page.evaluate(() => document.fonts.ready);

          const inspect = async (selector) => page.locator(selector).evaluateAll((nodes) => nodes.map((node) => {
            const rect = node.getBoundingClientRect();
            const style = getComputedStyle(node);
            const round = (value) => Math.round(value * 10) / 10;
            return {
              text: (node.textContent || '').replace(/\s+/g, ' ').trim(),
              x: round(rect.x),
              y: round(rect.y),
              width: round(rect.width),
              height: round(rect.height),
              top: style.top,
              marginTop: style.marginTop,
              paddingTop: style.paddingTop,
              paddingBottom: style.paddingBottom,
              lineHeight: style.lineHeight,
              transform: style.transform,
              overflow: style.overflow,
              display: style.display,
              alignItems: style.alignItems,
              position: style.position,
            };
          }));

          const geometry = {
            header: await inspect('.md-header'),
            headerInner: await inspect('.md-header__inner'),
            tabs: await inspect('.md-tabs'),
            tabsInner: await inspect('.md-tabs__inner'),
            tabsList: await inspect('.md-tabs__list'),
            tabsItems: await inspect('.md-tabs__item'),
            tabsLinks: await inspect('.md-tabs__link'),
          };

          await fs.writeFile('artifacts/reader-header/header-geometry.json', JSON.stringify(geometry, null, 2));
          await page.screenshot({ path: 'artifacts/reader-header/header.png', fullPage: false });
          await browser.close();
          JS

          node inspect-reader-header.mjs

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: reader-header-inspection
          path: artifacts/reader-header/*
          if-no-files-found: error
          retention-days: 5
