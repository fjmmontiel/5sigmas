name: Temporary inspect · reader DOM

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-dump-reader-dom.yml'
      - 'docs/**'
      - 'hooks/**'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  inspect-reader-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Build site
        run: |
          pip install -r requirements.txt
          mkdocs build --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve and inspect
        shell: bash
        run: |
          mkdir -p artifacts/reader-dom
          python -m http.server 8000 --directory site > /tmp/reader-dom.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done

          cat > inspect-reader-dom.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:8000/series/from-cave-to-agi/00_presentacion_serie/', { waitUntil: 'networkidle' });
          await page.evaluate(() => document.fonts.ready);

          const outline = await page.locator('article.md-content__inner.md-typeset').evaluate((root) => [...root.children].map((node, index) => {
            const rect = node.getBoundingClientRect();
            const style = getComputedStyle(node);
            return {
              index,
              tag: node.tagName,
              className: node.className || '',
              id: node.id || '',
              text: (node.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 220),
              x: Math.round(rect.x * 10) / 10,
              y: Math.round(rect.y * 10) / 10,
              width: Math.round(rect.width * 10) / 10,
              height: Math.round(rect.height * 10) / 10,
              display: style.display,
              outerHTML: node.outerHTML.slice(0, 1600),
            };
          }));

          const allReadingTime = await page.locator('article.md-content__inner text=/Tiempo de lectura/i').evaluateAll((nodes) => nodes.map((node) => ({
            tag: node.tagName,
            className: node.className || '',
            parentTag: node.parentElement?.tagName || '',
            parentClass: node.parentElement?.className || '',
            grandparentTag: node.parentElement?.parentElement?.tagName || '',
            grandparentClass: node.parentElement?.parentElement?.className || '',
            outerHTML: node.parentElement?.outerHTML.slice(0, 2000) || node.outerHTML.slice(0, 2000),
          })));

          await fs.writeFile('artifacts/reader-dom/series-presentation-outline.json', JSON.stringify({ outline, allReadingTime }, null, 2));
          await page.screenshot({ path: 'artifacts/reader-dom/series-presentation-mobile.png', fullPage: true });
          await browser.close();
          JS

          node inspect-reader-dom.mjs

      - name: Upload DOM inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-dom-inspection
          path: artifacts/reader-dom/*
          if-no-files-found: error
          retention-days: 5
