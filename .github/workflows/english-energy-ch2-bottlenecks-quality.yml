name: English Energy Chapter 2 bottlenecks quality

on:
  pull_request:
    paths:
      - 'locales/en/snippets/ia-pib-bienestar-energia/02-cuellos-botella.*'
      - 'locales/en/series/ia-pib-bienestar-energia/02-ia-tecnologia-electrica.md'
      - 'scripts/validate_english_energy_ch2_bottlenecks.mjs'
      - 'locale_main.py'
      - '.github/workflows/english-energy-ch2-bottlenecks-quality.yml'

permissions:
  contents: read

jobs:
  energy-ch2-bottlenecks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      S5_LOCALE: en
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare strict English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve English preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-energy-ch2-bottlenecks.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/en/series/ia-pib-bienestar-energia/02-ia-tecnologia-electrica/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-energy-ch2-bottlenecks.log
          exit 1

      - name: Validate canonical Energy Chapter 2 bottlenecks visual
        run: node scripts/validate_english_energy_ch2_bottlenecks.mjs

      - name: Upload Energy Chapter 2 bottlenecks screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-energy-ch2-bottlenecks-review
          path: artifacts/visual-review/english-energy-ch2-bottlenecks-*.png
          if-no-files-found: ignore
