name: Modelos R2 live discovery

on:
  push:
    branches:
      - main
    paths:
      - 'discovery/modelos-razonadores/**'
      - 'hooks/video_discovery_surface.py'
      - 'hooks/video_key_moments.py'
      - 'docs/assets/javascripts/video-library.js'
      - 'scripts/validate_modelos_r2_discovery_browser.mjs'
      - '.github/workflows/modelos-r2-live-discovery.yml'

permissions:
  contents: read

concurrency:
  group: modelos-r2-live-discovery
  cancel-in-progress: true

jobs:
  live-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact revision to be live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            manifest="$(curl --fail --silent --show-error --location "https://5sigmas.com/modelos-r2-release.json?rev=$GITHUB_SHA" || true)"
            if grep -q "\"revision\": \"$GITHUB_SHA\"" <<< "$manifest"; then
              echo "Exact revision $GITHUB_SHA is live."
              exit 0
            fi
            sleep 5
          done
          echo "Exact revision $GITHUB_SHA did not become live within the validation window."
          exit 1

      - name: Validate all 12 Modelos R2 discovery surfaces live
        env:
          S5_BASE_URL: https://5sigmas.com
        run: node scripts/validate_modelos_r2_discovery_browser.mjs
