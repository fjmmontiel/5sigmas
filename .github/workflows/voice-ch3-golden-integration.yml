name: Voice chapter 3 GOLDEN integration gate

# One-shot integration rerun after final bilingual editorial certification.
on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch3-golden-integration.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: voice-ch3-golden-integration
  cancel-in-progress: false

jobs:
  golden-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Realtime Voice Agents chapter 3 source contract
        run: node scripts/validate_voice_latency_ch3_source.mjs

      - name: Strict Spanish build
        run: mkdocs build --clean --strict

      - name: Prepare and audit English locale sources
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Strict English build and rendered locale audit
        run: |
          mkdocs build -f mkdocs.en.yml --clean --strict
          python scripts/audit_locale.py --locale en --site site/en

      - name: Restore reviewed English TTC media
        id: restore_ttc
        continue-on-error: true
        run: |
          set -euo pipefail
          media='.localized-media/en/ttc-v1'
          mkdir -p "$media"
          cp -f /tmp/ttc-v1/03-test-time-compute.mp4 "$media/03-test-time-compute.mp4"
          cp -f /tmp/ttc-v1/03-test-time-compute.jpg "$media/03-test-time-compute.jpg"

      - name: Seed reviewed English TTC media from verified artifact
        if: steps.restore_ttc.outcome == 'failure'
        run: |
          set -euo pipefail
          mkdir -p .localized-media/en/ttc-v1
          curl --fail --location --silent --show-error \
            https://5sigmas-media-production.s3.eu-west-1.amazonaws.com/en/ttc-v1/03-test-time-compute.mp4 \
            -o .localized-media/en/ttc-v1/03-test-time-compute.mp4
          curl --fail --location --silent --show-error \
            https://5sigmas-media-production.s3.eu-west-1.amazonaws.com/en/ttc-v1/03-test-time-compute.jpg \
            -o .localized-media/en/ttc-v1/03-test-time-compute.jpg

      - name: Verify and stage reviewed English TTC media
        run: |
          set -euo pipefail
          media='.localized-media/en/ttc-v1'
          mp4="$media/03-test-time-compute.mp4"
          jpg="$media/03-test-time-compute.jpg"
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  .localized-media/en/ttc-v1/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  .localized-media/en/ttc-v1/03-test-time-compute.jpg' | sha256sum -c -
          test "$(stat -c %s "$mp4")" = '4337214'
          test "$(stat -c %s "$jpg")" = '105949'
          target='site/en/series/modelos-razonadores'
          mkdir -p "$target"
          cp "$mp4" "$target/03-test-time-compute.mp4"
          cp "$jpg" "$target/03-test-time-compute.jpg"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-voice-ch3-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-voice-ch3-preview.log
          exit 1

      - name: Browser resource and broken-media audit
        run: node scripts/audit_browser_resources.mjs

      - name: Locale and mirror browser gates
        run: |
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_home_parity.mjs
          node scripts/validate_english_concepts.mjs

      - name: Realtime Voice Agents chapter 1 regression gate
        run: |
          node scripts/validate_voice_architecture_ch1.mjs
          node scripts/validate_voice_architecture_ch1_accessibility.mjs

      - name: Realtime Voice Agents chapter 2 regression gate
        run: |
          node scripts/validate_voice_turn_taking_ch2_source.mjs
          node scripts/validate_voice_turn_taking_ch2_accessibility.mjs

      - name: Realtime Voice Agents chapter 3 accessibility and responsive states
        run: node scripts/validate_voice_latency_ch3_accessibility.mjs

      - name: Reader navigation gate
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Upload chapter 3 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-ch3-golden-visual-evidence
          path: artifacts/visual-review/voice-latency-ch3-*.png
          if-no-files-found: error
          retention-days: 1
