name: Security capture direct execution

on:
  push:
    branches: ['quality/post-datacenters-requalification']
    paths: ['quality/series-requalification/capture-request.json']

permissions:
  contents: read

concurrency:
  group: security-capture-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record exact capture request
        run: |
          git rev-parse HEAD
          cat quality/series-requalification/capture-request.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install existing build dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Prepare English
        run: python scripts/prepare_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Install existing Playwright version
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve built preview with byte-range media support
        run: |
          python scripts/serve_preview.py --self-test
          python scripts/serve_preview.py --directory site --port 8000 > /tmp/security-capture-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/security-capture-preview.log
          exit 1

      - name: Capture whole-article and per-asset editorial evidence for active Security 00/01
        id: editorial_capture
        continue-on-error: true
        timeout-minutes: 12
        env:
          S5_SECURITY_EDITORIAL_DIR: artifacts/security-requalification/editorial-evidence
        run: |
          node scripts/capture_security_editorial_evidence.mjs
          test -s artifacts/security-requalification/editorial-evidence/report.json

      - name: Re-run Prompt Injection state gate across normal/reduced motion
        id: prompt_states
        continue-on-error: true
        timeout-minutes: 10
        run: |
          node scripts/validate_security_prompt_visual_states.mjs
          test -s artifacts/security-requalification/prompt-states/report.json

      - name: Summarize technical capture without editorial certification
        if: always()
        env:
          EDITORIAL_OUTCOME: ${{ steps.editorial_capture.outcome }}
          PROMPT_STATES_OUTCOME: ${{ steps.prompt_states.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          editorial_path = Path('artifacts/security-requalification/editorial-evidence/report.json')
          prompt_path = Path('artifacts/security-requalification/prompt-states/report.json')
          summary = {
              'editorial_capture_outcome': os.environ.get('EDITORIAL_OUTCOME', ''),
              'prompt_states_outcome': os.environ.get('PROMPT_STATES_OUTCOME', ''),
              'editorial_report_present': editorial_path.exists(),
              'prompt_report_present': prompt_path.exists(),
              'golden': False,
              'pixel_review': 'PENDING_MANUAL_INSPECTION_OF_ALL_RETAINED_ACTIVE_ARTICLE_IMAGES',
              'pedagogy_review': 'PENDING_MANUAL_EDITORIAL_REVIEW; TECHNICAL_CAPTURE_CANNOT_CERTIFY',
          }
          if editorial_path.exists():
              data = json.loads(editorial_path.read_text())
              rows = data.get('contexts', [])
              failures = data.get('failures', [])
              screenshots = []
              for row in rows:
                  if row.get('fullPageScreenshot'):
                      screenshots.append(row['fullPageScreenshot'])
                  for asset in row.get('assets', []):
                      screenshots.extend(asset.get('screenshots', []))
              summary.update({
                  'editorial_contexts_expected': data.get('expected_contexts'),
                  'editorial_contexts_observed': len(rows),
                  'editorial_failure_count': len(failures),
                  'editorial_failures': failures,
                  'retained_screenshot_count': len(screenshots),
                  'profiles': data.get('profiles', []),
                  'locales': data.get('locales', []),
                  'browser': data.get('browser', {}),
                  'post_teardown_contexts': sum(1 for row in rows if row.get('verdictBasis') == 'POST_CONTEXT_TEARDOWN'),
                  'runtime_unexpected_total': sum(len(row.get('runtimeUnexpected', [])) for row in rows),
              })
          if prompt_path.exists():
              data = json.loads(prompt_path.read_text())
              evidence = data.get('evidence', [])
              failures = data.get('failures', [])
              summary.update({
                  'prompt_contexts_observed': len(evidence),
                  'prompt_failure_count': len(failures),
                  'prompt_runtime_unexpected_total': sum(len(row.get('runtime_unexpected', [])) for row in evidence),
              })
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          ok = os.environ.get('EDITORIAL_OUTCOME') == 'success' and os.environ.get('PROMPT_STATES_OUTCOME') == 'success'
          raise SystemExit(0 if ok else 1)
          PY

      - name: Retain bounded active-article evidence for manual pixel and pedagogy review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-capture-direct-report
          path: |
            artifacts/security-requalification/editorial-evidence/report.json
            artifacts/security-requalification/editorial-evidence/screenshots/*.jpg
            artifacts/security-requalification/prompt-states/report.json
          retention-days: 1
          if-no-files-found: warn
          overwrite: true
