name: 5sigmas PR Quality Manager

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: Quality suite to delegate
        required: true
        default: all
        type: choice
        options: [all, core, series, english, topics, tools, mcp]
      base_ref:
        description: Base ref for manual delegated reviews
        required: true
        default: main
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan delegated quality
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
      base_sha: ${{ steps.refs.outputs.base_sha }}
      pr_number: ${{ steps.refs.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            quality/ci-workflows.json
            scripts/plan_pr_quality.py
            scripts/tests/test_plan_pr_quality.py
          sparse-checkout-cone-mode: false

      - name: Verify planner
        run: python scripts/tests/test_plan_pr_quality.py

      - name: Resolve refs and changed files
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE_REF: ${{ inputs.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/changed-files.txt
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > /tmp/changed-files.txt
            head_sha="$PR_HEAD_SHA"
            base_sha="$PR_BASE_SHA"
            pr_number="$PR_NUMBER"
          else
            git fetch --no-tags --depth=1 origin "${MANUAL_BASE_REF:-main}"
            head_sha="$GITHUB_SHA"
            base_sha="$(git rev-parse FETCH_HEAD)"
            pr_number="manual-$GITHUB_RUN_ID"
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Select delegated workflows
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUITE: ${{ inputs.suite }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          suite="changed"
          draft="${IS_DRAFT:-false}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            suite="${MANUAL_SUITE:-all}"
            draft="false"
          fi
          python scripts/plan_pr_quality.py             --manifest quality/ci-workflows.json             --changed-files /tmp/changed-files.txt             --suite "$suite"             --draft "$draft"             --github-output "$GITHUB_OUTPUT"

      - name: Publish delegation plan
        env:
          SELECTED: ${{ steps.plan.outputs.selected }}
          COUNT: ${{ steps.plan.outputs.selected_count }}
        run: |
          {
            echo "## 5sigmas delegated quality"
            echo
            echo "**Selected:** $COUNT"
            echo
            echo '```json'
            echo "$SELECTED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci_storage_policy:
    name: ci-storage-policy
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'ci-storage-policy') }}
    uses: ./.github/workflows/ci-storage-policy.yml
    with:
      head_sha: ${{ needs.plan.outputs.head_sha }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      pr_number: ${{ needs.plan.outputs.pr_number }}
    secrets: inherit

