  quality_gate:
    name: Quality gate summary
    if: always()
    needs: [plan, ci_storage_policy, deploy_mcp_worker, english_editorial_quality, english_energy_ch2_bottlenecks_quality, english_mirror_quality, english_reasoning_ch1_quality, english_reasoning_ch2_quality, english_reasoning_ch3_quality, english_reasoning_ch4_quality, english_reasoning_ch5_quality, locale_switch_quality, measurement_contract, pr_visual_review, series_owner_workbench, series_ui_review, tool_shell_contract, tools_quality, topic_agent_autonomy_quality, topic_evaluation_benchmark_contamination_quality, topic_evaluation_human_protocol_quality, topic_evaluation_offline_online_quality, topic_evaluation_uncertainty_quality, topic_evaluation_verifier_quality, topic_prompt_injection_taxonomy_quality, topic_reasoning_evaluation_quality, topic_reasoning_evidence_surfaces_quality, topic_reasoning_latency_quality, topic_reasoning_verifier_quality, topic_transformer_attention_cost_quality, topic_transformer_rnn_attention_quality, voice_architecture_article_quality]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Aggregate delegated results
        shell: python
        run: |
          import json, os, sys
          results=json.loads(os.environ["RESULTS"])
          bad=[]
          rows=[]
          for name,data in results.items():
              result=data.get("result")
              rows.append((name,result))
              if name != "plan" and result not in {"success","skipped"}:
                  bad.append((name,result))
          print("\n".join(f"{name}: {result}" for name,result in rows))
          if bad:
              raise SystemExit("Delegated quality failed: " + ", ".join(f"{n}={r}" for n,r in bad))
