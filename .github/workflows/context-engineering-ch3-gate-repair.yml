name: Context Engineering 3.3 visual QA wording repair

on:
  push:
    branches:
      - series/context-engineering-memory-mcp-golden
    paths:
      - '.github/workflows/context-engineering-ch3-gate-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/context-engineering-memory-mcp-golden
      - name: Repair stale Spanish visual expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_context_engineering_ch3_accessibility.mjs')
          text = path.read_text(encoding='utf-8')
          old = "'Persistir no hace equivalentes estos stores.'"
          new = "'Persistir no hace equivalentes estos almacenes.'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale QA token, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node scripts/validate_context_engineering_ch3_source.mjs
          git diff --check
      - name: Commit repaired gate and remove repair workflow
        shell: bash
        run: |
          rm .github/workflows/context-engineering-ch3-gate-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_context_engineering_ch3_accessibility.mjs .github/workflows/context-engineering-ch3-gate-repair.yml
          git commit -m 'fix(context): align chapter 3.3 visual QA with Spanish copy'
          git push origin HEAD:series/context-engineering-memory-mcp-golden
