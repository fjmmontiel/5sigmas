name: Voice chapter 6 freshness repair once

on:
  push:
    branches:
      - series/realtime-voice-agents-golden

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fail-closed chapter 6 freshness and publication wiring repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md',
              "Para errores, un `FrameProcessor` dispara `on_error` antes de propagar `ErrorFrame` upstream; `ErrorFrame` incluye mensaje, excepción opcional, origen y un flag `fatal` que indica si el pipeline se cancelará.[^pipecat-errors]\n\nEstas primitives permiten un ledger detallado del pipeline. No conviertas sus nombres en tu única taxonomía de producto. Un `ErrorFrame` fatal describe el pipeline; no dice por sí solo si una reserva quedó creada o si el usuario oyó audio parcial.",
              "Para errores, un `FrameProcessor` dispara `on_error` antes de propagar `ErrorFrame` upstream. El frame expone mensaje, excepción opcional, categoría y el processor de origen. En la API actual, `fatal` está deprecado desde v1.8.0 y se elimina en 2.0.0; la señal vigente para saber si el processor puede seguir aceptando trabajo es `error.processor.is_usable`, con `on_usable_changed` cuando cambia ese estado.[^pipecat-errors]\n\nEstas primitives permiten un ledger detallado del pipeline. No conviertas sus nombres en tu única taxonomía de producto. `is_usable=False` describe la capacidad actual de un processor, no el outcome del turno: no dice por sí solo si una reserva quedó creada, si existió recovery en otra capa o si el usuario oyó audio parcial."
          )

          replace_once(
              'locales/en/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md',
              "For errors, a `FrameProcessor` fires `on_error` before an `ErrorFrame` is propagated upstream. `ErrorFrame` carries an error string, optional exception, source processor, and a `fatal` flag indicating whether the pipeline will be cancelled.[^pipecat-errors]\n\nThese primitives can support a detailed pipeline ledger. They should not become the entire product taxonomy. A fatal `ErrorFrame` describes pipeline behavior. It does not tell you whether a booking was committed or whether the caller heard partial audio.",
              "For errors, a `FrameProcessor` fires `on_error` before an `ErrorFrame` is propagated upstream. The frame carries the error string, optional exception, error category, and source processor. In the current API, `fatal` is deprecated since v1.8.0 and removed in 2.0.0; the current signal for whether that processor can still accept work is `error.processor.is_usable`, with `on_usable_changed` exposing later usability transitions.[^pipecat-errors]\n\nThese primitives can support a detailed pipeline ledger. They should not become the entire product taxonomy. `is_usable=False` describes the processor's current ability to do its job, not the turn outcome. It does not tell you whether a booking was committed, whether another layer recovered, or whether the caller heard partial audio."
          )

          source_gate = Path('scripts/validate_voice_evaluation_observability_ch6_source.mjs')
          text = source_gate.read_text(encoding='utf-8')
          old = "check(es.includes('`FrameProcessor` dispara `on_error`') && es.includes('flag `fatal`'), 'ES: Pipecat error propagation semantics missing');\ncheck(en.includes('`FrameProcessor` fires `on_error`') && en.includes('`fatal` flag'), 'EN: Pipecat error propagation semantics missing');"
          new = "check(es.includes('`FrameProcessor` dispara `on_error`') && es.includes('`error.processor.is_usable`') && es.includes('`on_usable_changed`') && es.includes('deprecado desde v1.8.0') && es.includes('se elimina en 2.0.0'), 'ES: current Pipecat error/usability semantics missing');\ncheck(en.includes('`FrameProcessor` fires `on_error`') && en.includes('`error.processor.is_usable`') && en.includes('`on_usable_changed`') && en.includes('deprecated since v1.8.0') && en.includes('removed in 2.0.0'), 'EN: current Pipecat error/usability semantics missing');\ncheck(!es.includes('flag `fatal` que indica si el pipeline se cancelará'), 'ES: stale Pipecat fatal semantics returned');\ncheck(!en.includes('`fatal` flag indicating whether the pipeline will be cancelled'), 'EN: stale Pipecat fatal semantics returned');"
          if text.count(old) != 1:
              raise SystemExit('source gate: stale Pipecat assertion block not found exactly once')
          source_gate.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'mkdocs.yml',
              '          - WebRTC, SIP y telefonía: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
              '          - WebRTC, SIP y telefonía: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n          - Evaluación, observabilidad y reliability: series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md\n'
          )
          replace_once(
              'mkdocs.en.yml',
              '          - WebRTC, SIP and telephony: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
              '          - WebRTC, SIP and telephony: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n          - Evaluation, observability and reliability: series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md\n'
          )
          replace_once(
              'locales/en/manifest.yml',
              '  - series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
              '  - series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n  - series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md\n'
          )
          replace_once(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/voice-network-paths.html\n',
              '  - snippets/articulos-tecnicos/voice-network-paths.html\n  - snippets/articulos-tecnicos/voice-turn-evidence-stack.html\n'
          )
          PY

      - name: Validate repaired source contract
        run: node scripts/validate_voice_evaluation_observability_ch6_source.mjs

      - name: Verify scope and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          expected=$(cat <<'EOF'
          docs/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md
          locales/en/manifest.yml
          locales/en/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md
          mkdocs.en.yml
          mkdocs.yml
          scripts/validate_voice_evaluation_observability_ch6_source.mjs
          EOF
          )
          actual=$(git diff --name-only | sort)
          if [ "$actual" != "$(printf '%s\n' "$expected" | sort)" ]; then
            echo 'Unexpected repair scope'
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md \
                  locales/en/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md \
                  scripts/validate_voice_evaluation_observability_ch6_source.mjs \
                  mkdocs.yml mkdocs.en.yml locales/en/manifest.yml
          git commit -m 'fix(voice): refresh chapter 6 Pipecat error semantics and wiring'
          git push origin HEAD:series/realtime-voice-agents-golden
