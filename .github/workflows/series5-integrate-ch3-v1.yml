name: Series 5 integrate chapter 5.3

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-integrate-ch3-v1.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/evaluating-ai-systems-production-golden
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair chapter 5.3 canonical English route
        run: |
          python - <<'PY'
          from pathlib import Path

          old_slug = '03-llm-as-judge-human-evaluation-calibration-bias-variance-agreement'
          canonical_slug = '03-llm-as-judge-evaluacion-humana-calibracion-sesgo-varianza-acuerdo'
          old_en = Path(f'locales/en/series/evaluating-ai-systems-production/{old_slug}.md')
          canonical_en = Path(f'locales/en/series/evaluating-ai-systems-production/{canonical_slug}.md')

          if old_en.exists() and canonical_en.exists():
              raise SystemExit('both old and canonical EN chapter paths exist; refusing ambiguous move')
          if old_en.exists():
              old_en.rename(canonical_en)
          if not canonical_en.exists():
              raise SystemExit('canonical EN chapter path missing after move')

          for file_name in [
              'mkdocs.en.yml',
              'locales/en/manifest.yml',
              'scripts/validate_ai_systems_eval_ch3_source.mjs',
              'scripts/validate_ai_systems_eval_ch3_accessibility.mjs',
          ]:
              p = Path(file_name)
              text = p.read_text()
              if old_slug not in text:
                  if canonical_slug not in text:
                      raise SystemExit(f'neither old nor canonical slug found in {file_name}')
                  continue
              p.write_text(text.replace(old_slug, canonical_slug))

          source_gate = Path('scripts/validate_ai_systems_eval_ch3_source.mjs')
          text = source_gate.read_text()
          anchor = "const visualPath = 'snippets/articulos-tecnicos/eval-judge-calibration-bias-agreement.html';\n"
          addition = "const staleRouteEn = 'series/evaluating-ai-systems-production/03-llm-as-judge-human-evaluation-calibration-bias-variance-agreement.md';\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('source-gate route anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          pub_anchor = "check(manifest.includes(`  - ${visualPath}`), 'EN: chapter 5.3 visual missing from required_snippets');\n"
          pub_addition = "check(manifest.includes('route_strategy: preserve-source-slugs'), 'EN: locale manifest must preserve canonical source slugs');\ncheck(routeEn === routeEs, 'EN: chapter 5.3 route must preserve canonical source slug');\ncheck(!mkEn.includes(staleRouteEn), 'EN: stale native-English chapter route remains in navigation');\ncheck(!manifest.includes(`  - ${staleRouteEn}`), 'EN: stale native-English chapter route remains in manifest');\n"
          if pub_addition not in text:
              if pub_anchor not in text:
                  raise SystemExit('source-gate publication anchor missing')
              text = text.replace(pub_anchor, pub_anchor + pub_addition, 1)
          source_gate.write_text(text)
          PY

          test ! -e locales/en/series/evaluating-ai-systems-production/03-llm-as-judge-human-evaluation-calibration-bias-variance-agreement.md
          test -e locales/en/series/evaluating-ai-systems-production/03-llm-as-judge-evaluacion-humana-calibracion-sesgo-varianza-acuerdo.md

      - name: Run chapter 5.3 source gate before persisting route repair
        run: node scripts/validate_ai_systems_eval_ch3_source.mjs

      - name: Persist scope-clean canonical-route repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mkdocs.en.yml locales/en/manifest.yml locales/en/series/evaluating-ai-systems-production/03-llm-as-judge-*.md scripts/validate_ai_systems_eval_ch3_source.mjs scripts/validate_ai_systems_eval_ch3_accessibility.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(series5): preserve canonical 5.3 English route'
          git push origin HEAD:series/evaluating-ai-systems-production-golden
