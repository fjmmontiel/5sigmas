name: Interactive tools quality

on:
  pull_request:
    paths:
      - 'docs/herramientas/**'
      - 'locales/en/tools/**'
      - 'docs/assets/data/tools/**'
      - 'docs/assets/javascripts/tools/**'
      - 'docs/stylesheets/tools.css'
      - 'docs/stylesheets/tools-kv-context.css'
      - 'docs/stylesheets/tools-attention.css'
      - 'docs/stylesheets/tools-context-budget.css'
      - 'docs/stylesheets/tools-rag-retrieval.css'
      - 'docs/stylesheets/tools-rag-evaluation.css'
      - 'docs/stylesheets/tools-voice-latency.css'
      - 'docs/stylesheets/tools-voice-cost-capacity.css'
      - 'docs/stylesheets/tools-agent-reliability.css'
      - 'docs/stylesheets/tools-prompt-injection.css'
      - 'docs/stylesheets/tools-benchmark-reliability.css'
      - 'docs/stylesheets/tools-model-capability-timeline.css'
      - 'docs/stylesheets/tools-scaling-laws.css'
      - 'docs/stylesheets/tools-training-energy.css'
      - 'docs/stylesheets/tools-datacenter-capacity.css'
      - 'docs/stylesheets/tools-global-ai-ecosystem.css'
      - 'tools/**'
      - 'hooks/locale_alternates.py'
      - 'scripts/prepare_locale.py'
      - 'scripts/audit_english_full_parity.py'
      - 'scripts/audit_multilingual_search_foundation.py'
      - 'scripts/*tool*.mjs'
      - 'scripts/validate_locale_switching.mjs'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
  workflow_dispatch:

concurrency:
  group: interactive-tools-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify calculator math and pricing provenance
        run: node scripts/test_llm_cost_latency_tool.mjs

      - name: Verify model explorer math, frontier and provenance
        run: node scripts/test_model_price_performance_tool.mjs

      - name: Verify inference VRAM math and architecture provenance
        run: node scripts/test_inference_vram_tool.mjs

      - name: Verify KV cache/context math and provenance
        run: node scripts/test_kv_context_tool.mjs

      - name: Verify Transformer attention math and provenance
        run: node scripts/test_transformer_attention_tool.mjs

      - name: Verify context budget math and provenance
        run: node scripts/test_context_budget_tool.mjs

      - name: Verify RAG retrieval math and provenance
        run: node scripts/test_rag_retrieval_tool.mjs

      - name: Verify RAG evaluation math, uncertainty and provenance
        run: node scripts/test_rag_evaluation_tool.mjs

      - name: Verify voice latency critical-path math
        run: node scripts/test_voice_latency_tool.mjs

      - name: Verify voice cost/capacity math and provenance
        run: node scripts/test_voice_cost_capacity_tool.mjs

      - name: Verify agent reliability metrics and gates
        run: node scripts/test_agent_reliability_tool.mjs

      - name: Verify prompt-injection threat reachability
        run: node scripts/test_prompt_injection_tool.mjs

      - name: Verify benchmark reliability math and provenance
        run: node scripts/test_benchmark_reliability_tool.mjs

      - name: Verify model capability timeline data, chronology and provenance
        run: node scripts/test_model_capability_timeline_tool.mjs

      - name: Verify scaling-laws compute allocation and provenance
        run: node scripts/test_scaling_laws_tool.mjs

      - name: Verify training compute/energy math and provenance
        run: node scripts/test_training_compute_energy_tool.mjs

      - name: Verify datacenter capacity constraints and provenance
        run: node scripts/test_datacenter_ai_capacity_tool.mjs

      - name: Verify global AI ecosystem coverage, normalization and provenance
        run: node scripts/test_global_ai_ecosystem_tool.mjs

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Audit Spanish search foundation
        run: python scripts/audit_multilingual_search_foundation.py

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English source parity
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Audit combined SEO crawl
        run: python scripts/audit_seo_site.py --site-dir site --output-dir seo-audit --label tools

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve bilingual preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-tools-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-tools-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/herramientas/coste-latencia-llm/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/llm-cost-latency/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/precio-rendimiento-modelos/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/model-price-performance/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/vram-inferencia/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/inference-vram/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/kv-cache-contexto/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/kv-cache-context/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/atencion-transformer/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/transformer-attention/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/presupuesto-contexto/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/context-budget/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/laboratorio-recuperacion-rag/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/rag-retrieval-lab/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/evaluacion-rag/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/rag-evaluation/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/latencia-agente-voz/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/voice-latency-budget/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/coste-capacidad-agente-voz/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/voice-cost-capacity/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/fiabilidad-evaluacion-agentes/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/agent-reliability-eval/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/amenazas-prompt-injection/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/prompt-injection-threat/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/fiabilidad-benchmarks/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/benchmark-reliability/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/linea-temporal-capacidades-modelos/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/model-capability-timeline/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/leyes-escalado/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/scaling-laws/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/computo-energia-entrenamiento/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/training-compute-energy/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/capacidad-datacenter-ia/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/datacenter-ai-capacity/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/herramientas/ecosistema-global-ia/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/tools/global-ai-ecosystem/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-tools-preview.log
          exit 1

      - name: Validate calculator in browser and capture visual evidence
        run: node scripts/validate_llm_cost_latency_tool.mjs

      - name: Validate model explorer in browser and capture visual evidence
        run: node scripts/validate_model_price_performance_tool.mjs

      - name: Validate inference VRAM calculator and capture visual evidence
        run: node scripts/validate_inference_vram_tool.mjs

      - name: Validate KV cache/context explorer and capture visual evidence
        run: node scripts/validate_kv_context_tool.mjs

      - name: Validate Transformer attention visualizer and capture visual evidence
        run: node scripts/validate_transformer_attention_tool.mjs

      - name: Validate context budget planner and capture visual evidence
        run: node scripts/validate_context_budget_tool.mjs

      - name: Validate RAG retrieval lab and capture visual evidence
        run: node scripts/validate_rag_retrieval_tool.mjs

      - name: Validate RAG evaluation playground and capture visual evidence
        run: node scripts/validate_rag_evaluation_tool.mjs

      - name: Validate voice latency explorer and capture visual evidence
        run: node scripts/validate_voice_latency_tool.mjs

      - name: Validate voice cost/capacity planner and capture visual evidence
        run: node scripts/validate_voice_cost_capacity_tool.mjs

      - name: Validate agent reliability playground and capture visual evidence
        run: node scripts/validate_agent_reliability_tool.mjs

      - name: Validate prompt-injection threat explorer and capture visual evidence
        run: node scripts/validate_prompt_injection_tool.mjs

      - name: Validate benchmark reliability explorer and capture visual evidence
        run: node scripts/validate_benchmark_reliability_tool.mjs

      - name: Validate model capability timeline and capture visual evidence
        run: node scripts/validate_model_capability_timeline_tool.mjs

      - name: Validate scaling-laws explorer and capture visual evidence
        run: node scripts/validate_scaling_laws_tool.mjs

      - name: Validate training compute/energy estimator and capture visual evidence
        run: node scripts/validate_training_compute_energy_tool.mjs

      - name: Validate datacenter AI capacity explorer and capture visual evidence
        run: node scripts/validate_datacenter_ai_capacity_tool.mjs

      - name: Validate global AI ecosystem explorer and capture visual evidence
        run: node scripts/validate_global_ai_ecosystem_tool.mjs

      - name: Validate localized route switching and hreflang
        run: node scripts/validate_locale_switching.mjs

      - name: Upload tools visual review
        if: ${{ failure() || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-tools-visual-review
          path: |
            artifacts/visual-review/llm-cost-latency-*.png
            artifacts/visual-review/model-price-performance-*.png
            artifacts/visual-review/inference-vram-*.png
            artifacts/visual-review/kv-context-*.png
            artifacts/visual-review/transformer-attention-*.png
            artifacts/visual-review/context-budget-*.png
            artifacts/visual-review/rag-retrieval-*.png
            artifacts/visual-review/rag-evaluation-*.png
            artifacts/visual-review/voice-latency-*.png
            artifacts/visual-review/voice-cost-capacity-*.png
            artifacts/visual-review/agent-reliability-*.png
            artifacts/visual-review/prompt-injection-*.png
            artifacts/visual-review/benchmark-reliability-*.png
            artifacts/visual-review/model-capability-timeline-*.png
            artifacts/visual-review/scaling-laws-*.png
            artifacts/visual-review/training-compute-energy-*.png
            artifacts/visual-review/datacenter-ai-capacity-*.png
            artifacts/visual-review/global-ai-ecosystem-*.png
          if-no-files-found: warn
          retention-days: 1
          overwrite: true
