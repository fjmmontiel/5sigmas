name: Modelos approved critical source provenance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/modelos-approved-source-critical.yml'

permissions:
  contents: read

jobs:
  f13d-owner-approved-critical:
    if: github.head_ref == 'migration/video-golden-modelos-razonadores'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: 00-presentacion.es.json
            expected: e45db8339e97972c672f1d13aa5705bc9f6b25c5fcebfb28556d1c42d40487d6
          - spec: 05-riesgos.es.json
            expected: f594dde47114da817416d0a6b37089cdec34eb607005fe452d5fc22f5b2df381
          - spec: 05-riesgos.en.json
            expected: ef27ccf56d3112214286d5eab4a34bcf4b55c1bf2bc108abe4e074eb0c29beec
    steps:
      - name: Checkout last output-relevant revision before recorded approval
        uses: actions/checkout@v4
        with:
          ref: f13d94ce62d6548d8519d8d80f4827696f722fc9
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-noto-extra
          fc-cache -f
          python -m pip install -r motion/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render exact source candidate and require approved encoded hash
        working-directory: motion
        env:
          SPEC_NAME: ${{ matrix.spec }}
          EXPECTED_SHA256: ${{ matrix.expected }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-critical
          python scripts/render.py "content/modelos-razonadores/${SPEC_NAME}" --out source-critical
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          spec_path = Path('content/modelos-razonadores') / os.environ['SPEC_NAME']
          spec = json.loads(spec_path.read_text())
          target = Path('source-critical') / f"{spec['id']}-horizontal.mp4"
          expected = os.environ['EXPECTED_SHA256']
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          print(f"SOURCE_REF=f13d94ce62d6548d8519d8d80f4827696f722fc9")
          print(f"SPEC={spec_path}")
          print(f"OUTPUT={target}")
          print(f"EXPECTED_SHA256={expected}")
          print(f"ACTUAL_SHA256={actual}")
          if actual != expected:
              raise SystemExit('Exact approved-byte provenance mismatch')
          print('EXACT_APPROVED_BYTE_PROVENANCE=PASS')
          PY
