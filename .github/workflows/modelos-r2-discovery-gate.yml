name: Modelos R2 discovery gate

on:
  pull_request:
    paths:
      - 'discovery/modelos-razonadores/**'
      - 'hooks/video_discovery_surface.py'
      - 'hooks/video_key_moments.py'
      - 'docs/assets/javascripts/video-library.js'
      - 'scripts/video_discovery_contract.py'
      - 'scripts/prepare_modelos_r2_ci_media.sh'
      - 'scripts/validate_modelos_r2_discovery_browser.mjs'
      - 'tests/test_video_discovery_contract.py'
      - 'tests/test_video_discovery_surface.py'
      - 'tests/test_modelos_r2_discovery_inventory.py'
      - 'tests/test_video_player_contract.mjs'
      - '.github/workflows/modelos-r2-discovery-gate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discovery-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify exact approved media and prepare deterministic posters
        run: bash scripts/prepare_modelos_r2_ci_media.sh

      - name: Run discovery contract regressions
        run: |
          python -m unittest \
            tests.test_video_discovery_contract \
            tests.test_video_discovery_surface \
            tests.test_modelos_r2_discovery_inventory

      - name: Build Spanish discovery surface strictly
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Build English discovery surface strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run deterministic player regressions
        run: node --test tests/test_video_player_contract.mjs

      - name: Localize generated watch URLs for native preview playback
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = []
          for root in (Path('site/videos'), Path('site/en/videos')):
              if root.is_dir():
                  targets.extend([root / 'catalog.json', *root.rglob('*.html')])
          for target in targets:
              if not target.is_file():
                  continue
              text = target.read_text(encoding='utf-8')
              target.write_text(text.replace('https://5sigmas.com/', '/'), encoding='utf-8')
          PY

      - name: Serve combined site
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-modelos-discovery.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-modelos-discovery.log
          exit 1

      - name: Validate all 12 discovery surfaces in native Chromium
        run: node scripts/validate_modelos_r2_discovery_browser.mjs
