name: Render English Reasoning intro media

on:
  push:
    branches:
      - agent/english-article-audio-parity
    paths:
      - scripts/render_english_reasoning_intro_media.py
      - .github/workflows/render-english-reasoning-intro.yml

permissions:
  contents: write

jobs:
  render:
    if: github.event.head_commit.message == 'Render native English Reasoning intro media'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-article-audio-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow==12.3.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render native English Reasoning presentation
        run: python scripts/render_english_reasoning_intro_media.py
      - name: Validate media contract
        shell: bash
        run: |
          set -euo pipefail
          root='locales/en/series/modelos-razonadores'
          for ext in mp4 jpg; do test -s "$root/00_presentacion_serie.$ext"; done
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$root/00_presentacion_serie.mp4")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$root/00_presentacion_serie.mp4")" = 1920x1080
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$root/00_presentacion_serie.mp4")" = yuv420p
      - name: Commit rendered native-English media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locales/en/series/modelos-razonadores/00_presentacion_serie.mp4 locales/en/series/modelos-razonadores/00_presentacion_serie.jpg
          git commit -m 'Add native English Reasoning presentation media'
          git push origin HEAD:agent/english-article-audio-parity
