name: Purge known Actions artifact 9176660709

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-actions-artifact-9176660709.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete stale artifact and verify deletion
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactId = 9176660709;

            try {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifactId,
              });
              core.info(`Deleted stale artifact ${artifactId}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Artifact ${artifactId} is already absent`);
              } else {
                throw error;
              }
            }

            try {
              await github.rest.actions.getArtifact({
                owner,
                repo,
                artifact_id: artifactId,
              });
              core.setFailed(`Artifact ${artifactId} still exists after deletion`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Verified artifact ${artifactId} is absent`);
              } else {
                throw error;
              }
            }
