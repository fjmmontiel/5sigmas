name: Finalize English parity contract

on:
  push:
    branches:
      - agent/english-article-audio-parity
    paths:
      - .github/workflows/finalize-english-parity-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Fix final English parity contract deltas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-article-audio-parity
          fetch-depth: 0
      - name: Reconcile canonical parity semantics and Reasoning media metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit_english_full_parity.py')
          text = audit.read_text()
          old = '''    for rel in PUBLIC_ROOT_FILES:\n        path = DOCS / rel\n        if path.is_file() and not hidden(path):\n            result.add(rel)\n'''
          new = '''    # Explicit root surfaces remain canonical routes even when a page is\n    # intentionally noindex (for example Coming Soon). noindex is an SEO\n    # directive, not a signal that locale route parity may omit the page.\n    for rel in PUBLIC_ROOT_FILES:\n        path = DOCS / rel\n        if path.is_file():\n            result.add(rel)\n'''
          if old not in text:
              raise SystemExit('expected PUBLIC_ROOT_FILES block not found')
          text = text.replace(old, new, 1)
          old = '        "video_articles": compare(videos, en_video_pages),\n'
          new = '        "video_articles": required_subset(videos, en_video_pages),\n'
          if old not in text:
              raise SystemExit('expected video comparison not found')
          text = text.replace(old, new, 1)
          audit.write_text(text)

          media = Path('locales/en/media.yml')
          text = media.read_text()
          route = 'series/modelos-razonadores/00_presentacion_serie.md:'
          if route not in text:
              anchor = 'series/modelos-razonadores/01-que-es-razonar.md:'
              block = '''series/modelos-razonadores/00_presentacion_serie.md:\n  video: 00_presentacion_serie.mp4\n  video_poster: 00_presentacion_serie.jpg\n  video_title: Reasoning Models\n  video_duration: PT45S\n\n'''
              if anchor not in text:
                  raise SystemExit('Reasoning media anchor not found')
              text = text.replace(anchor, block + anchor, 1)
              media.write_text(text)

          manifest = Path('locales/en/manifest.yml')
          text = manifest.read_text()
          media_file = '  - series/modelos-razonadores/00_presentacion_serie.mp4\n'
          if media_file not in text:
              anchor = '  - series/modelos-razonadores/01-que-es-razonar.mp4\n'
              insertion = media_file + '  - series/modelos-razonadores/00_presentacion_serie.jpg\n'
              if anchor not in text:
                  raise SystemExit('Reasoning manifest anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
              manifest.write_text(text)
          PY
      - name: Commit parity contract fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_english_full_parity.py locales/en/media.yml locales/en/manifest.yml
          git commit -m 'Reconcile final English parity deltas'
          git push origin HEAD:agent/english-article-audio-parity
