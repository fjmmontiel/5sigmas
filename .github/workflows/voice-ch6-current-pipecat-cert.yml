name: Voice chapter 6 current Pipecat certification

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch6-current-pipecat-cert.yml'

permissions:
  contents: write
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Apply current Pipecat source correction
        run: python scripts/repair_voice_ch6_pipecat.py

      - name: Validate patch formatting
        run: git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate chapter 2 source contract
        run: node scripts/validate_voice_turn_taking_ch2_source.mjs

      - name: Validate chapter 3 source contract
        run: node scripts/validate_voice_latency_ch3_source.mjs

      - name: Validate chapter 4 source contract
        run: node scripts/validate_voice_tools_state_ch4_source.mjs

      - name: Validate chapter 5 source contract
        run: node scripts/validate_voice_network_telephony_ch5_source.mjs

      - name: Validate chapter 6 source contract
        run: node scripts/validate_voice_evaluation_observability_ch6_source.mjs

      - name: Build Spanish strictly
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English source
        run: python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/voice-ch6-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/en/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/voice-ch6-preview.log
          exit 1

      - name: Regress chapter 1 end-to-end
        run: node scripts/validate_voice_architecture_ch1.mjs

      - name: Audit browser resources
        run: node scripts/audit_browser_resources.mjs

      - name: Validate English series mirror
        run: node scripts/validate_english_series_mirror.mjs

      - name: Validate locale switching
        run: node scripts/validate_locale_switching.mjs

      - name: Regress chapter 1 accessibility
        run: node scripts/validate_voice_architecture_ch1_accessibility.mjs

      - name: Regress chapter 2 relationship geometry
        run: node scripts/validate_voice_turn_taking_ch2_accessibility.mjs

      - name: Regress chapter 3 relationship geometry
        run: node scripts/validate_voice_latency_ch3_accessibility.mjs

      - name: Regress chapter 4 relationship geometry
        run: node scripts/validate_voice_tools_state_ch4_accessibility.mjs

      - name: Regress chapter 5 relationship geometry
        run: node scripts/validate_voice_network_telephony_ch5_accessibility.mjs

      - name: Validate chapter 6 causal evidence geometry
        run: node scripts/validate_voice_evaluation_observability_ch6_accessibility.mjs

      - name: Validate direct reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Commit exact tested source correction
        shell: bash
        run: |
          git config user.name '5sigmas GOLDEN orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md locales/en/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md scripts/validate_voice_evaluation_observability_ch6_source.mjs
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'fix(voice): align chapter 6 with current Pipecat error semantics'
          git push origin HEAD:series/realtime-voice-agents-golden
          echo "CERTIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload chapter 6 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-ch6-current-pipecat-review
          path: artifacts/visual-review/voice-eval-ch6-*.png
          if-no-files-found: error
          retention-days: 2

      - name: Report certified SHA
        run: echo "Certified and pushed $CERTIFIED_SHA"
