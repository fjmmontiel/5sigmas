name: Video motion migration quality

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - 'motion/**'
      - '.github/workflows/video-motion-migration-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic motion contract tests
        working-directory: motion
        run: npm test
      - name: Validate complete-series Golden ledger
        working-directory: motion
        run: npm run gate

  renderer-layout-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies and required fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-noto-extra
          fc-cache -f
          python -m pip install -r motion/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate every authored v4 composition in horizontal and portrait
        working-directory: motion
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qa-layout
          : > qa-layout/results.txt
          failed=0
          for spec in content/modelos-razonadores/*.json; do
            base="$(basename "$spec" .json)"
            for orientation in horizontal portrait; do
              extra=()
              if [ "$orientation" = portrait ]; then extra+=(--portrait); fi
              log="qa-layout/${base}-${orientation}.log"
              if python scripts/render.py "$spec" --out qa-layout --check-only "${extra[@]}" >"$log" 2>&1; then
                echo "PASS ${base} ${orientation}" | tee -a qa-layout/results.txt
              else
                echo "FAIL ${base} ${orientation}" | tee -a qa-layout/results.txt
                failed=1
              fi
            done
          done
          cat qa-layout/results.txt
          exit "$failed"
      - name: Upload layout validation reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelos-razonadores-layout-validation
          path: motion/qa-layout/
          if-no-files-found: warn
          retention-days: 7
