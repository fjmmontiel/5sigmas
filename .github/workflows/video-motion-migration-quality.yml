name: Video motion migration quality

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - 'motion/**'
      - '.github/workflows/video-motion-migration-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic motion contract tests
        working-directory: motion
        run: npm test
