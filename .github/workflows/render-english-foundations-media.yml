name: Render English Foundations native media

on:
  push:
    branches:
      - agent/english-media-foundations
    paths:
      - scripts/render_english_foundations_media.py
      - .github/workflows/render-english-foundations-media.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-media-foundations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render native-English Foundations media
        run: python scripts/render_english_foundations_media.py

      - name: Bring candidate into the canonical embedded-video duration and motion envelope
        shell: bash
        run: |
          set -euo pipefail
          root='locales/en/series/fundamentos-ia-iag'
          for slug in \
            00_presentacion_serie \
            01-que-es-ia \
            02-que-es-ia-generativa \
            03-ia-vs-ia-generativa \
            04-agi; do
            src="$root/$slug.mp4"
            tmp="$root/$slug.upgraded.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$src" \
              -vf "setpts=1.61*PTS,fps=30,scale=1960:1102,crop=1920:1080:x='20+20*sin(t*0.18)':y='11+11*cos(t*0.15)',setsar=1" \
              -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p -movflags +faststart "$tmp"
            mv "$tmp" "$src"
          done

      - name: Validate media contract
        shell: bash
        run: |
          set -euo pipefail
          root='locales/en/series/fundamentos-ia-iag'
          for slug in \
            00_presentacion_serie \
            01-que-es-ia \
            02-que-es-ia-generativa \
            03-ia-vs-ia-generativa \
            04-agi; do
            test -s "$root/$slug.mp4"
            test -s "$root/$slug.jpg"
            codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$root/$slug.mp4")
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$root/$slug.mp4")
            pix=$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$root/$slug.mp4")
            fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$root/$slug.mp4")
            duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$root/$slug.mp4")
            test "$codec" = 'h264'
            test "$dims" = '1920x1080'
            test "$pix" = 'yuv420p'
            test "$fps" = '30/1'
            awk -v d="$duration" 'BEGIN { exit !(d >= 50.0 && d <= 65.5) }'
            printf '%s: %ss · %s · %s · %s\n' "$slug" "$duration" "$codec" "$dims" "$fps"
          done

      - name: Commit rendered binaries to the migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f locales/en/series/fundamentos-ia-iag/*.mp4 locales/en/series/fundamentos-ia-iag/*.jpg
          if git diff --cached --quiet; then
            echo 'Rendered media is already current.'
          else
            git commit -m 'Render native English Foundations media'
            git push origin HEAD:agent/english-media-foundations
          fi

      - name: Upload native-media review set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-foundations-native-media-review
          path: |
            locales/en/series/fundamentos-ia-iag/*.jpg
            locales/en/series/fundamentos-ia-iag/*.mp4
          if-no-files-found: error
          retention-days: 14
