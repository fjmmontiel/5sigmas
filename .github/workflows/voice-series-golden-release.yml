name: Voice series GOLDEN release audit
# milestone rerun after relationship-first decision-map blob pin

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-series-golden-release.yml'

permissions:
  contents: read

jobs:
  series-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate media declarations and binary contracts
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Validate publication contract
        run: python scripts/audit_publication_contract.py

      - name: Prepare and audit English sources
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English
        run: python scripts/audit_locale.py --locale en --site site/en

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/voice-series-preview.log 2>&1 &
          echo $! > /tmp/voice-series-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/series/agentes-voz-tiempo-real/01-arquitecturas-de-voz/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/series/agentes-voz-tiempo-real/01-arquitecturas-de-voz/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/voice-series-preview.log
          exit 1

      - name: Audit browser resources and locale contracts
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_series_mirror.mjs
          node scripts/validate_locale_switching.mjs
          node scripts/validate_english_locale.mjs

      - name: Re-certify all six Voice chapters
        run: |
          node scripts/validate_voice_architecture_ch1.mjs
          node scripts/validate_voice_architecture_ch1_accessibility.mjs
          node scripts/validate_voice_turn_taking_ch2_source.mjs
          node scripts/validate_voice_turn_taking_ch2_accessibility.mjs
          node scripts/validate_voice_latency_ch3_source.mjs
          node scripts/validate_voice_latency_ch3_accessibility.mjs
          node scripts/validate_voice_tools_state_ch4_source.mjs
          node scripts/validate_voice_tools_state_ch4_accessibility.mjs
          node scripts/validate_voice_network_telephony_ch5_source.mjs
          node scripts/validate_voice_network_telephony_ch5_accessibility.mjs
          node scripts/validate_voice_evaluation_observability_ch6_source.mjs
          node scripts/validate_voice_evaluation_observability_ch6_accessibility.mjs

      - name: Validate direct reader progression
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Upload zero-based series visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-series-golden-release-evidence
          path: artifacts/visual-review/*
          if-no-files-found: error
          retention-days: 2
