name: Publish reviewed English TTC media once

on:
  pull_request:
    paths:
      - '.github/workflows/publish-en-ttc-media-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      S5_VIDEO_MEDIA_ORIGIN: ${{ vars.S5_VIDEO_MEDIA_ORIGIN }}
      SOURCE_ZIP: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-0760-8211-8bdd-19d8c5939703/raw?se=2026-08-13T09%3A42%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=b88f3db1-695a-5b41-b4cc-eaad092d5bb1&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T09%3A29%3A39Z&ske=2026-08-14T09%3A29%3A39Z&sks=b&skv=2026-02-06&sig=E3Up9yV4UUHAdE1kRlZT7fW9E8Q4YaCL8DYaQ50otW0%3D"

    steps:
      - uses: actions/checkout@v4

      - name: Install upload tooling
        run: python -m pip install --quiet awscli

      - name: Download reviewed renderer artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP" -o /tmp/en-ttc.zip
          mkdir -p /tmp/en-ttc
          unzip -q /tmp/en-ttc.zip -d /tmp/en-ttc
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  /tmp/en-ttc/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  /tmp/en-ttc/03-test-time-compute.jpg' | sha256sum -c -
          test "$(stat -c %s /tmp/en-ttc/03-test-time-compute.mp4)" = '4337214'
          test "$(stat -c %s /tmp/en-ttc/03-test-time-compute.jpg)" = '105949'

      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          [[ "$S5_VIDEO_MEDIA_ORIGIN" == https://* ]]

      - name: Publish immutable English media
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix='en/series/modelos-razonadores'
          aws s3 cp /tmp/en-ttc/03-test-time-compute.mp4 "s3://${R2_BUCKET_NAME}/${prefix}/03-test-time-compute.mp4" \
            --endpoint-url "$endpoint" --content-type video/mp4 --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 cp /tmp/en-ttc/03-test-time-compute.jpg "s3://${R2_BUCKET_NAME}/${prefix}/03-test-time-compute.jpg" \
            --endpoint-url "$endpoint" --content-type image/jpeg --cache-control 'public,max-age=31536000,immutable' --only-show-errors

      - name: Verify public video and poster
        shell: bash
        run: |
          set -euo pipefail
          base="${S5_VIDEO_MEDIA_ORIGIN%/}/en/series/modelos-razonadores"
          curl --fail --silent --show-error --location --range 0-1023 -H 'Origin: https://5sigmas.com' \
            -D /tmp/video-headers "$base/03-test-time-compute.mp4" -o /tmp/video-head
          grep -Ei '^HTTP/.* 206' /tmp/video-headers
          grep -Ei '^content-range:' /tmp/video-headers
          curl --fail --silent --show-error --location "$base/03-test-time-compute.jpg" -o /tmp/poster.jpg
          test "$(head -c 2 /tmp/poster.jpg | xxd -p)" = 'ffd8'
          echo "verified $base/03-test-time-compute.mp4"
          echo "verified $base/03-test-time-compute.jpg"
