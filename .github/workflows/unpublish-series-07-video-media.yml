name: Enforce series 07+ video unpublish

on:
  pull_request:
    paths:
      - 'hooks/video_publication_policy.py'
      - 'hooks/video_sitemap.py'
      - 'hooks/video_sitemap_en.py'
      - 'scripts/prepare_video_media.py'
      - '.github/workflows/unpublish-series-07-video-media.yml'
  push:
    branches: [main]
    paths:
      - 'hooks/video_publication_policy.py'
      - 'hooks/video_sitemap.py'
      - 'hooks/video_sitemap_en.py'
      - 'scripts/prepare_video_media.py'
      - '.github/workflows/unpublish-series-07-video-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: series-07-video-unpublish
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      S5_VIDEO_MEDIA_ORIGIN: ${{ vars.S5_VIDEO_MEDIA_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Verify post-merge media deletion can complete
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$S5_VIDEO_MEDIA_ORIGIN" ]; then
            echo "No external media origin configured; no R2/CDN cleanup credentials required."
            exit 0
          fi
          [[ "$S5_VIDEO_MEDIA_ORIGIN" == https://* ]] || { echo "S5_VIDEO_MEDIA_ORIGIN must use HTTPS" >&2; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo "Missing R2_ACCOUNT_ID" >&2; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "Missing R2_BUCKET_NAME" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN needed to purge deleted cached media" >&2; exit 1; }
          test -n "$CLOUDFLARE_ZONE_ID" || { echo "Missing CLOUDFLARE_ZONE_ID needed to purge deleted cached media" >&2; exit 1; }
          echo "PASS: R2 deletion and Cloudflare cache purge credentials are configured."

  remove-public-media:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      S5_VIDEO_MEDIA_ORIGIN: ${{ vars.S5_VIDEO_MEDIA_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cleanup dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.3 awscli

      - name: Validate external-media cleanup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$S5_VIDEO_MEDIA_ORIGIN" ]; then
            echo "No external media origin configured; Pages unpublish is sufficient."
            exit 0
          fi
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing R2_ACCESS_KEY_ID" >&2; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo "Missing R2_ACCOUNT_ID" >&2; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "Missing R2_BUCKET_NAME" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN required to purge cached deleted media" >&2; exit 1; }
          test -n "$CLOUDFLARE_ZONE_ID" || { echo "Missing CLOUDFLARE_ZONE_ID required to purge cached deleted media" >&2; exit 1; }

      - name: Wait for exact GitHub Pages revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            revision="$(
              curl --fail --silent --show-error --location \
                -H 'Cache-Control: no-cache' \
                "https://5sigmas.com/build.json?rev=$GITHUB_SHA" \
              | python -c 'import json,sys; print((json.load(sys.stdin) or {}).get("revision",""))' \
              || true
            )"
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "Exact revision $GITHUB_SHA is live."
              exit 0
            fi
            echo "Waiting for $GITHUB_SHA; observed ${revision:-none}"
            sleep 10
          done
          echo "Exact Pages revision $GITHUB_SHA did not become live within 10 minutes." >&2
          exit 1
      - name: Delete blocked video assets from R2
        if: env.S5_VIDEO_MEDIA_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for series in \
            seguridad-ia \
            agentes-ia \
            agentes-voz-tiempo-real \
            coding-agents-agent-harnesses \
            context-engineering-memory-mcp \
            llm-inference-engineering-economics \
            evaluating-ai-systems-production
          do
            for prefix in "series/${series}/" "en/series/${series}/"; do
              aws s3 rm "s3://${R2_BUCKET_NAME}/${prefix}" --recursive \
                --exclude "*" --include "*.mp4" --include "*.jpg" --include "*.vtt" \
                --endpoint-url "$endpoint" --only-show-errors
            done
          done

      - name: Publish allowed-only video manifest
        if: env.S5_VIDEO_MEDIA_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_video_media.py --output .video-media
          aws s3 cp .video-media/manifest.json "s3://${R2_BUCKET_NAME}/manifests/video-manifest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "no-cache" --content-type "application/json" --only-show-errors

      - name: Verify R2 has no blocked media objects
        if: env.S5_VIDEO_MEDIA_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          failures=0
          for series in \
            seguridad-ia \
            agentes-ia \
            agentes-voz-tiempo-real \
            coding-agents-agent-harnesses \
            context-engineering-memory-mcp \
            llm-inference-engineering-economics \
            evaluating-ai-systems-production
          do
            for prefix in "series/${series}/" "en/series/${series}/"; do
              remaining="$(aws s3 ls "s3://${R2_BUCKET_NAME}/${prefix}" --recursive --endpoint-url "$endpoint" 2>/dev/null | grep -E '\.(mp4|jpg|vtt)$' || true)"
              if [ -n "$remaining" ]; then
                echo "Blocked media still present under ${prefix}:" >&2
                echo "$remaining" >&2
                failures=1
              fi
            done
          done
          exit "$failures"

      - name: Purge cached deleted media URLs
        if: env.S5_VIDEO_MEDIA_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path(".")
          origin = os.environ["S5_VIDEO_MEDIA_ORIGIN"].rstrip("/")
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          zone = os.environ["CLOUDFLARE_ZONE_ID"]
          blocked = {
              "seguridad-ia",
              "agentes-ia",
              "agentes-voz-tiempo-real",
              "coding-agents-agent-harnesses",
              "context-engineering-memory-mcp",
              "llm-inference-engineering-economics",
              "evaluating-ai-systems-production",
          }
          urls = []
          for locale_prefix, source_root in (("", root / "docs/series"), ("en/", root / "locales/en/series")):
              for series in sorted(blocked):
                  folder = source_root / series
                  for pattern in ("*.mp4", "*.jpg", "*.vtt"):
                      for asset in sorted(folder.glob(pattern)):
                          urls.append(f"{origin}/{locale_prefix}series/{series}/{asset.name}")
          urls = sorted(set(urls))
          endpoint = f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache"
          for index in range(0, len(urls), 30):
              payload = json.dumps({"files": urls[index:index+30]}).encode()
              request = Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode())
              if not data.get("success"):
                  raise SystemExit(f"Cloudflare cache purge failed: {data}")
          print(f"purged {len(urls)} blocked media URLs")
          PY

      - name: Verify public media URLs are gone after purge
        if: env.S5_VIDEO_MEDIA_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          origin = os.environ["S5_VIDEO_MEDIA_ORIGIN"].rstrip("/")
          blocked = {
              "seguridad-ia",
              "agentes-ia",
              "agentes-voz-tiempo-real",
              "coding-agents-agent-harnesses",
              "context-engineering-memory-mcp",
              "llm-inference-engineering-economics",
              "evaluating-ai-systems-production",
          }
          urls = []
          for locale_prefix, source_root in (("", Path("docs/series")), ("en/", Path("locales/en/series"))):
              for series in sorted(blocked):
                  folder = source_root / series
                  for pattern in ("*.mp4", "*.jpg", "*.vtt"):
                      for asset in sorted(folder.glob(pattern)):
                          urls.append(f"{origin}/{locale_prefix}series/{series}/{asset.name}")
          failures = []
          for url in sorted(set(urls)):
              request = Request(url, method="HEAD", headers={"Cache-Control": "no-cache", "User-Agent": "5sigmas-unpublish-verifier/1.0"})
              try:
                  with urlopen(request, timeout=20) as response:
                      status = response.status
              except HTTPError as exc:
                  status = exc.code
              if status != 404:
                  failures.append(f"{status} {url}")
          if failures:
              raise SystemExit("Blocked media still publicly reachable:\n" + "\n".join(failures))
          print(f"verified {len(set(urls))} public blocked media URLs return 404")
          PY

      - name: Verify exact live article and indexing rollback
        run: python scripts/verify_series_07_video_unpublish_live.py
