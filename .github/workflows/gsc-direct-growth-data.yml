name: GSC Direct Growth Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: full
        type: choice
        options:
          - full
          - delta
  schedule:
    - cron: '40 9 * * *'
      timezone: 'Europe/Madrid'
    - cron: '40 15 * * *'
      timezone: 'Europe/Madrid'

permissions:
  contents: read
  issues: write

concurrency:
  group: gsc-direct-growth-data
  cancel-in-progress: false

jobs:
  direct-gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: seo/gsc/requirements.txt

      - name: Install direct GSC dependencies
        run: python -m pip install -r seo/gsc/requirements.txt

      - name: Run deterministic GSC engine tests
        run: python -m unittest discover -s seo/gsc/tests -v

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "40 9 * * *" ]]; then
            mode="full"
          else
            mode="delta"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $mode"

      - name: Build direct Search Console report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seo-gsc-output
          if [[ -z "${GSC_SERVICE_ACCOUNT_JSON:-}" ]]; then
            generated_at="$(date -Iseconds)"
            cat > seo-gsc-output/report.md <<EOF
          # 5sigmas direct Search Console state

          - **Status:** \`BOOTSTRAP_REQUIRED\`
          - **Mode:** \`${{ steps.mode.outputs.mode }}\`
          - **Generated:** \`${generated_at}\`
          - **Blocker:** repository secret \`GSC_SERVICE_ACCOUNT_JSON\` is not configured yet.

          Follow \`seo/gsc/README.md\` one-time bootstrap steps. No Search Console data was fabricated and no SEO intervention should be selected from this run.
          EOF
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          payload = {
              "schema_version": 1,
              "status": "BOOTSTRAP_REQUIRED",
              "mode": "${{ steps.mode.outputs.mode }}",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "blocker": "GSC_SERVICE_ACCOUNT_JSON is not configured",
          }
          with open("seo-gsc-output/report.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
            exit 0
          fi

          python -m seo.gsc run \
            --mode "${{ steps.mode.outputs.mode }}" \
            --output-dir seo-gsc-output

      - name: Publish durable Search Console state issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          label="seo-gsc-state"
          title="[seo-gsc-state] 5sigmas direct Search Console ledger"
          gh label create "$label" \
            --color "1D76DB" \
            --description "Latest direct Google Search Console state for the SEO/GEO growth loops" \
            --force

          issue_number="$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "$issue_number" ]]; then
            gh issue create --title "$title" --label "$label" --body-file seo-gsc-output/report.md
          else
            gh issue edit "$issue_number" --title "$title" --body-file seo-gsc-output/report.md
          fi

      - name: Add report to workflow summary
        shell: bash
        run: cat seo-gsc-output/report.md >> "$GITHUB_STEP_SUMMARY"
