name: Modelos approved risks final-polish provenance probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/modelos-approved-risk-provenance.yml'

permissions:
  contents: read

jobs:
  probe-risk-source:
    if: github.head_ref == 'migration/video-golden-modelos-razonadores'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: es-05-horizontal
            source_ref: 3feb2fc8d20dc65bb47fbe0b863935bb59de2388
            portrait_flag: ''
            variant: horizontal
            expected_sha256: f594dde47114da817416d0a6b37089cdec34eb607005fe452d5fc22f5b2df381
          - asset: es-05-vertical
            source_ref: f13d94ce62d6548d8519d8d80f4827696f722fc9
            portrait_flag: '--portrait'
            variant: vertical
            expected_sha256: 5aac072b091ff191297620d04cd5dc40fc97f3167c1973ac230078a27a1ba4d7
    steps:
      - name: Checkout exact bounded historical source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-noto-extra
          fc-cache -f
          python -m pip install -r motion/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render exact risks candidate and compare frozen approved asset
        working-directory: motion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf risk-probe
          python scripts/render.py content/modelos-razonadores/05-riesgos.es.json --out risk-probe ${{ matrix.portrait_flag }}
          file="risk-probe/riesgos-modelos-razonadores-es-${{ matrix.variant }}.mp4"
          test -f "$file"
          got="$(sha256sum "$file" | awk '{print $1}')"
          expected='${{ matrix.expected_sha256 }}'
          echo "ASSET=${{ matrix.asset }}"
          echo "SOURCE_REF=${{ matrix.source_ref }}"
          echo "ENCODED_SHA256=$got"
          echo "APPROVED_ENCODED_SHA256=$expected"
          if [ "$got" != "$expected" ]; then
            echo 'PROVENANCE_RESULT=NOT_VERIFIED' >&2
            exit 1
          fi
          echo 'PROVENANCE_RESULT=EXACT_MATCH'
