name: Recover exact approved Evaluacion C3 release
on:
  push:
    branches: [ops/import-approved-evaluation-c3-20260925]
    paths: [.github/workflows/import-approved-c3-once.yml]
permissions:
  contents: write
concurrency:
  group: import-approved-evaluation-c3-once
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    container: debian:13.3-slim
    timeout-minutes: 40
    steps:
      - name: Install the verified matching runtime
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-cairo python3-yaml ffmpeg=7:7.1.5-0+deb13u1 fontconfig fonts-cabin fonts-noto-core fonts-noto-extra
          printf '%s\n' '28b2901516089b2bf9d3c2b3dd86a1c875de7f3997bc4ebf4a651a8150aa49dc  /usr/share/fonts/opentype/cabin/Cabin-Regular.otf' 'f2a43add6a75ae9b203744857fe3e612a4b038b51585934208b1b5e5b7f455dd  /usr/share/fonts/opentype/cabin/Cabin-Bold.otf' 'bcdc596729c24044e28c54815ecbe6004f83b10169a49a51160b22f59116249f  /usr/share/fonts/truetype/noto/NotoSerifDisplay-Regular.ttf' '8666c2488e681a31670f9fc0b5d59fa4f21f2a0664a76876fe49ebd832f673c7  /usr/share/fonts/truetype/noto/NotoSerifDisplay-Bold.ttf' | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: d7cfd910fd64450cc06b24b1ab44764d6ab59e66
          path: recipe
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/c3-approved-snapshot/**
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8a0f9cada9fa33563c06434915baf775dd618ca1
          path: site
          fetch-depth: 1
      - name: Recover exact approved files in isolated processes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('recipe/.github/c3-approved-snapshot/build_release.py');s=p.read_text()
          old='ProcessPoolExecutor(max_workers=2)';assert old in s
          s=s.replace(old,'ProcessPoolExecutor(max_workers=2,max_tasks_per_child=1)')
          s=s.replace("assert sha(out)==HASHES[name],f'Not approved bytes: {name}'", "assert sha(out)==HASHES[name],f'Not approved bytes: {name}: {sha(out)} != {HASHES[name]}'")
          p.write_text(s)
          PY
          python3 recipe/.github/c3-approved-snapshot/build_release.py --root site
      - name: Validate scoped release payload
        working-directory: site
        run: |
          set -eu
          sha256sum -c .github/receipts/evaluation-c3.sha256
          python3 -m py_compile scripts/verify_evaluation_c3_release.py hooks/video_publication_policy.py
          python3 - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          files=subprocess.check_output(['git','status','--porcelain','--untracked-files=all']).decode().splitlines()
          roots=('docs/series/evaluating-ai-systems-production/','locales/en/series/evaluating-ai-systems-production/')
          named={'locales/en/media.yml','hooks/video_publication_policy.py','scripts/validate_series_07_video_unpublish.py','scripts/verify_series_07_video_unpublish_live.py','scripts/verify_evaluation_c3_release.py','scripts/verify_evaluation_c3_browser.mjs','docs/evaluation-c3-release.json','.github/receipts/evaluation-c3.sha256','.github/workflows/deploy-pages.yml','.github/workflows/pr-visual-review.yml','.github/workflows/unpublish-series-07-video-media.yml'}
          for line in files:
              p=line[3:]
              if '/__pycache__/' in p:continue
              assert p in named or p.startswith(roots),p
              assert not p.endswith(('.ttf','.otf','.woff','.woff2')),p
          for p in Path('.github/workflows').glob('*.yml'):yaml.safe_load(p.read_text())
          print('Scoped payload validated; other withdrawn series and prior Golden series remain unchanged.')
          PY
      - name: Persist clean release branch; no tooling or transport history
        working-directory: site
        run: |
          set -eu
          target='release/evaluating-ai-c3-approved-20260925'
          test -z "$(git ls-remote origin "refs/heads/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/evaluating-ai-systems-production locales/en/series/evaluating-ai-systems-production locales/en/media.yml hooks/video_publication_policy.py scripts/validate_series_07_video_unpublish.py scripts/verify_series_07_video_unpublish_live.py scripts/verify_evaluation_c3_release.py scripts/verify_evaluation_c3_browser.mjs docs/evaluation-c3-release.json .github/receipts/evaluation-c3.sha256 .github/workflows/deploy-pages.yml .github/workflows/pr-visual-review.yml .github/workflows/unpublish-series-07-video-media.yml
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Release exact owner-approved Evaluacion IA C3 media and bilingual discovery' | git commit-tree "$tree" -p 8a0f9cada9fa33563c06434915baf775dd618ca1)"
          git push origin "$commit:refs/heads/$target"
          printf 'C3_RELEASE_BRANCH=%s\nC3_RELEASE_COMMIT=%s\n' "$target" "$commit"
          echo "Exact-byte release branch prepared at $commit. PR checks, merge, deployment and live verification remain separate." >> "$GITHUB_STEP_SUMMARY"
