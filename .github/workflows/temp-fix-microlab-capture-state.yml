name: Temporary patch · deterministic microlab captures

on:
  push:
    branches:
      - agent/voice-animation-responsive
    paths:
      - '.github/workflows/temp-fix-microlab-capture-state.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/voice-animation-responsive
          fetch-depth: 0

      - name: Freeze step-only microlabs at the requested review state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/capture_voice_report_animations.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    if (await button.count()) await button.click();
              else await root.evaluate((node, value) => { node.dataset.step = String(value); }, step);'''
          new = '''    if (await button.count()) await button.click();
              else await root.evaluate((node, value) => {
                node.dataset.s5vPaused = 'true';
                node.dataset.step = String(value);
                node.style.setProperty('--s5v-step', String(value));
                const stepValue = node.querySelector('[data-s5v-step-value]');
                if (stepValue) stepValue.textContent = String(value);
                if (node.classList.contains('s5v-batch')) {
                  const count = node.querySelector('.s5v-batch__progress b');
                  if (count) count.textContent = value >= 4 ? '3/3' : `${Math.max(0, value - 1)}/3`;
                }
              }, step);'''
          if old not in text:
              raise SystemExit('Missing direct step capture marker')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit the deterministic capture state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture_voice_report_animations.mjs
          git commit -m "Freeze step-only microlabs at deterministic review states"
          git push origin HEAD:agent/voice-animation-responsive
