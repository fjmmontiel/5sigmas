name: Topic quality worker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install site dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Build English locale strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runtime once
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve one bilingual preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-topic-quality.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null &&             curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-topic-quality.log
          exit 1

      - name: Validate all specialized topic visuals
        run: |
          set -euo pipefail
          validators=(
            scripts/validate_agent_autonomy_visual.mjs
            scripts/validate_evaluation_benchmark_contamination_visual.mjs
            scripts/validate_evaluation_human_protocol_visual.mjs
            scripts/validate_evaluation_offline_online_visual.mjs
            scripts/validate_evaluation_uncertainty_visual.mjs
            scripts/validate_evaluation_verifier_visual.mjs
            scripts/validate_prompt_injection_taxonomy_visual.mjs
            scripts/validate_reasoning_evaluation_visual.mjs
            scripts/validate_reasoning_evidence_surfaces_visual.mjs
            scripts/validate_reasoning_latency_visual.mjs
            scripts/validate_reasoning_verifier_visual.mjs
            scripts/validate_transformer_attention_cost_visual.mjs
            scripts/validate_transformer_rnn_attention_visual.mjs
            scripts/validate_voice_architecture_article.mjs
          )
          for validator in "${validators[@]}"; do
            echo "::group::$validator"
            node "$validator"
            echo "::endgroup::"
          done

      - name: Upload topic evidence only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: topic-quality-failure-evidence
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 1
