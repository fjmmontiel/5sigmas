name: Render English Security native media

on:
  push:
    branches:
      - agent/english-media-security
    paths:
      - scripts/render_english_security_media.py
      - .github/workflows/render-english-security-media.yml

permissions:
  contents: write

jobs:
  render:
    if: github.event.head_commit.message == 'Add temporary Security native media render workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-media-security
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render native-English Security media
        run: python scripts/render_english_security_media.py
      - name: Validate media contract
        shell: bash
        run: |
          set -euo pipefail
          root='locales/en/series/seguridad-ia'
          for slug in 00_presentacion_serie 01-prompt-injection 02-jailbreaks 03-envenenamiento 04-red-teaming 05-controles-produccion; do
            test -s "$root/$slug.mp4"
            test -s "$root/$slug.jpg"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$root/$slug.mp4")" = 'h264'
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$root/$slug.mp4")" = '1920x1080'
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$root/$slug.mp4")" = 'yuv420p'
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$root/$slug.mp4")" = '30/1'
          done
      - name: Commit rendered binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f locales/en/series/seguridad-ia/*.mp4 locales/en/series/seguridad-ia/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render native English Security media'
          git push origin HEAD:agent/english-media-security
      - name: Upload poster review set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-security-native-media-posters
          path: locales/en/series/seguridad-ia/*.jpg
          if-no-files-found: error
          retention-days: 14
