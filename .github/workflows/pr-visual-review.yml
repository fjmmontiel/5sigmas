name: PR visual review

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'locales/**'
      - 'overrides/**'
      - 'overrides_locale/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
      - 'main.py'
      - 'locale_main.py'
      - 'requirements.txt'
      - 'Makefile'
      - 'VIDEO_DELIVERY.md'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-video-media.yml'
      - '.github/workflows/pr-visual-review.yml'

permissions:
  actions: read
  contents: read

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install mkdocs mkdocs-material; fi

      - name: Validate video media declarations
        run: python scripts/prepare_video_media.py --check

      - name: Validate media binary signatures
        run: python scripts/audit_media_magic.py

      - name: Validate video structured-data contract
        run: python scripts/test_video_schema_contract.py

      - name: Build site strictly
        run: mkdocs build --clean --strict

      - name: Audit video indexing metadata
        run: python scripts/audit_video_indexing.py

      - name: Audit search foundation
        run: python scripts/audit_multilingual_search_foundation.py

      - name: Enforce priority topic hub contract
        run: python scripts/audit_priority_topic_hubs.py

      - name: Enforce public-series publication contract
        run: python scripts/audit_publication_contract.py

      - name: Capture representative frames from changed public videos
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > /tmp/pr-changed-files.txt
          mapfile -t changed_videos < <(
            grep -E '^docs/(series|articulos-tecnicos)/.*\.mp4$' /tmp/pr-changed-files.txt || true
          )
          if [ "${#changed_videos[@]}" -eq 0 ]; then
            echo "No public MP4 changed; full-catalogue frame review is available on demand."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python scripts/capture_video_density_review.py "${changed_videos[@]}"

      - name: Prepare English locale for combined browser QA
        run: python scripts/prepare_locale.py --locale en

      - name: Build English locale for combined browser QA
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Restore reviewed English TTC media
        id: en-ttc-cache
        uses: actions/cache/restore@v4
        with:
          path: .localized-media/en/ttc-v1
          key: s5-en-ttc-4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33

      - name: Seed reviewed English TTC media from verified PR artifact
        if: steps.en-ttc-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: english-ttc-reviewed-seed
          path: .localized-media/en/ttc-v1
          run-id: 31689108864
          github-token: ${{ github.token }}

      - name: Verify and stage reviewed English TTC media for browser QA
        shell: bash
        run: |
          set -euo pipefail
          media='.localized-media/en/ttc-v1'
          mp4="$media/03-test-time-compute.mp4"
          jpg="$media/03-test-time-compute.jpg"
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  .localized-media/en/ttc-v1/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  .localized-media/en/ttc-v1/03-test-time-compute.jpg' | sha256sum -c -
          test "$(stat -c %s "$mp4")" = '4337214'
          test "$(stat -c %s "$jpg")" = '105949'
          target='site/en/series/modelos-razonadores'
          mkdir -p "$target"
          cp "$mp4" "$target/03-test-time-compute.mp4"
          cp "$jpg" "$target/03-test-time-compute.jpg"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Localize generated video URLs for preview QA
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("site/videos")
          targets = [root / "catalog.json", *root.rglob("*.html")]
          for target in targets:
              if not target.is_file():
                  continue
              text = target.read_text(encoding="utf-8")
              target.write_text(text.replace("https://5sigmas.com/", "/"), encoding="utf-8")
          PY

      - name: Serve built site
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Audit browser resource loading
        run: node scripts/audit_browser_resources.mjs

      - name: Validate English-Spanish homepage parity
        run: node scripts/validate_english_home_parity.mjs

      - name: Validate canonical ES/EN Concepts
        run: node scripts/validate_english_concepts.mjs

      - name: Validate evaluation cycle visual end-to-end
        run: node scripts/validate_evaluation_cycle_visual.mjs

      - name: Validate reasoning chain-of-thought visual end-to-end
        run: node scripts/validate_reasoning_cot_visual.mjs

      - name: Validate LLM topic visuals end-to-end
        run: node scripts/validate_llm_topic_visuals.mjs

      - name: Capture responsive screenshots
        run: node scripts/capture_site_screenshots.mjs

      - name: Capture animation density review
        env:
          S5_CHANGED_FILES_FILE: /tmp/pr-changed-files.txt
        run: node scripts/capture_animation_density_review.mjs

      - name: Validate Seguridad en IA visuals end-to-end
        run: node scripts/capture_security_visuals.mjs

      - name: Validate reader continuation outside animations
        run: node scripts/validate_reader_end_placement.mjs

      - name: Capture and validate every progressive voice microlab
        run: node scripts/capture_voice_report_animations.mjs

      - name: Validate complete video experience lifecycle
        run: node scripts/validate_video_experience_v2.mjs

      - name: Validate direct series and article navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Validate desktop reader header isolation
        run: node scripts/validate_reader_header_overlap.mjs

      - name: Validate responsive interaction polish
        run: node scripts/validate_responsive_polish.mjs

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-visual-review
          path: artifacts/visual-review/*
          if-no-files-found: warn
          retention-days: 14

  english-locale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      S5_LOCALE: en
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve English preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-en-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-en-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-en-preview.log
          exit 1

      - name: Validate English locale in browser
        run: node scripts/validate_english_locale.mjs

      - name: Validate English SEO and schema parity
        run: node scripts/validate_english_seo.mjs

      - name: Upload English visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-en-visual-review
          path: artifacts/visual-review/english-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload English locale preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-en-preview
          path: site/en
          if-no-files-found: warn
          retention-days: 14
