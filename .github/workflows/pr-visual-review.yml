name: PR visual review

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'Makefile'
      - 'VIDEO_DELIVERY.md'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-video-media.yml'
      - '.github/workflows/pr-visual-review.yml'

permissions:
  contents: read

jobs:
  merge-current-main-once:
    if: github.event.pull_request.number == 21
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record current main ancestry and restore the trusted workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git merge --strategy=ours --no-commit origin/main
          git checkout HEAD^ -- .github/workflows/pr-visual-review.yml
          rm -f .github/workflows/merge-current-main-into-pr21.yml
          git add -A
          git diff --cached --check
          git commit -m 'Merge current main after the editorial reader redesign'
          git push origin HEAD:${GITHUB_HEAD_REF}

  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install mkdocs mkdocs-material; fi

      - name: Validate video media declarations
        run: python scripts/prepare_video_media.py --check

      - name: Build site strictly
        run: mkdocs build --clean --strict

      - name: Audit video indexing metadata
        run: python scripts/audit_video_indexing.py

      - name: Audit search foundation
        run: python scripts/audit_search_foundation.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve built site
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Audit browser resource loading
        run: node scripts/audit_browser_resources.mjs

      - name: Capture responsive screenshots
        run: node scripts/capture_site_screenshots.mjs

      - name: Capture and validate every progressive voice microlab
        run: node scripts/capture_voice_report_animations.mjs

      - name: Validate and capture the complete video experience
        run: node scripts/validate_video_library.mjs

      - name: Validate direct series and article navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-visual-review
          path: artifacts/visual-review/*
          if-no-files-found: error
          retention-days: 14
