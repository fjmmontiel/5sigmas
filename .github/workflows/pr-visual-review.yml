name: PR visual review

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'Makefile'
      - 'VIDEO_DELIVERY.md'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-video-media.yml'
      - '.github/workflows/pr-visual-review.yml'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: pr-visual-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-qa:
    uses: ./.github/workflows/visual-qa.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      artifact_name: 5sigmas-visual-review

  media-release-plan:
    uses: ./.github/workflows/publish-video-media.yml
    with:
      publish: false
      base_sha: ${{ github.event.pull_request.base.sha }}
