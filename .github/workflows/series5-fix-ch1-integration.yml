name: Series 5 repair chapter 5.1 integration

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-fix-ch1-integration.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/evaluating-ai-systems-production-golden
          fetch-depth: 0

      - name: Repair YAML-safe navigation and boundary wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def once(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {text.count(old)}')
              p.write_text(text.replace(old,new,1))

          route='series/evaluating-ai-systems-production/01-que-evaluar-modelo-componente-sistema-workflow-trayectoria.md'
          once('mkdocs.yml',
               f'          - Qué evaluar: modelo, componente, sistema, workflow y trayectoria: {route}',
               f'          - "Qué evaluar: modelo, componente, sistema, workflow y trayectoria": {route}')
          once('mkdocs.en.yml',
               f'          - What to evaluate: model, component, system, workflow, and trajectory: {route}',
               f'          - "What to evaluate: model, component, system, workflow, and trajectory": {route}')

          validator=Path('scripts/validate_ai_systems_eval_ch1_source.mjs')
          text=validator.read_text()
          old="check(mkdocsEs.includes('Evaluar sistemas de IA en producción:') && mkdocsEs.includes(`Qué evaluar: modelo, componente, sistema, workflow y trayectoria: ${route}`), 'ES: Series 5 / chapter 5.1 navigation missing');\ncheck(mkdocsEn.includes('Evaluating AI Systems in Production:') && mkdocsEn.includes(`What to evaluate: model, component, system, workflow, and trajectory: ${route}`), 'EN: Series 5 / chapter 5.1 navigation missing');"
          new="check(mkdocsEs.includes('Evaluar sistemas de IA en producción:') && mkdocsEs.includes('Qué evaluar: modelo, componente, sistema, workflow y trayectoria') && mkdocsEs.includes(route), 'ES: Series 5 / chapter 5.1 navigation missing');\ncheck(mkdocsEn.includes('Evaluating AI Systems in Production:') && mkdocsEn.includes('What to evaluate: model, component, system, workflow, and trajectory') && mkdocsEn.includes(route), 'EN: Series 5 / chapter 5.1 navigation missing');"
          if new not in text:
              if text.count(old)!=1: raise SystemExit('validator nav anchor missing')
              text=text.replace(old,new,1)
          validator.write_text(text)

          snippet=Path('docs/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.html')
          s=snippet.read_text()
          old_desc='Una hipótesis entra por la izquierda y selecciona la frontera diagnóstica más estrecha. Dentro de una frontera de sistema aparece un workflow, componentes, modelo, tools y entorno. Una línea gruesa representa una trayectoria concreta que atraviesa sólo algunos nodos y termina en un outcome y estado final. En la parte inferior una flecha hacia dentro indica diagnosticar en fronteras estrechas y otra hacia fuera indica confirmar el cambio en la frontera del producto.'
          new_desc='Una hipótesis entra por la izquierda y selecciona la frontera diagnóstica más estrecha. La frontera exterior representa el trial end-to-end: task y environment aportan contexto evaluado, mientras el workflow contiene componentes, modelo y tools del sistema. Una línea gruesa representa una trayectoria concreta que atraviesa sólo algunos nodos y termina en un outcome y estado final. En la parte inferior una flecha hacia dentro indica diagnosticar en fronteras estrechas y otra hacia fuera indica confirmar el cambio en la frontera donde vive el riesgo del producto.'
          if new_desc not in s:
              if s.count(old_desc)!=1: raise SystemExit('visual desc anchor missing')
              s=s.replace(old_desc,new_desc,1)
          snippet.write_text(s)

          ip=Path('locales/en/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.i18n.json')
          data=json.loads(ip.read_text()); repl=data['replacements']
          old_en='A hypothesis enters from the left and selects the narrowest diagnostic boundary. Inside the system boundary are a workflow, components, model, tools, and environment. A thick path represents one realized trajectory that crosses only some nodes and ends in an outcome and final state. At the bottom, an inward arrow represents diagnosis at narrower boundaries and an outward arrow represents confirming the change at the product boundary.'
          new_en='A hypothesis enters from the left and selects the narrowest diagnostic boundary. The outer boundary represents the end-to-end trial: task and environment provide evaluated context, while the workflow contains the system components, model, and tools. A thick path represents one realized trajectory that crosses only some nodes and ends in an outcome and final state. At the bottom, an inward arrow represents diagnosis at narrower boundaries and an outward arrow represents confirming the change at the boundary where product risk lives.'
          if new_desc in repl:
              repl[new_desc]=new_en
          elif old_desc in repl:
              repl.pop(old_desc); repl[new_desc]=new_en
          else:
              # Existing key may be original Spanish description; require its current English value rather than silently duplicating.
              key=next((k for k,v in repl.items() if v==old_en),None)
              if key is None: raise SystemExit('visual i18n desc anchor missing')
              repl.pop(key); repl[new_desc]=new_en
          raw=snippet.read_bytes()
          data['source_blob_sha']=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
          ip.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Parse configs and run source gate
        run: |
          python - <<'PY'
          import yaml
          for path in ['mkdocs.yml','mkdocs.en.yml','locales/en/manifest.yml']:
              with open(path,encoding='utf-8') as f: yaml.safe_load(f)
          PY
          node scripts/validate_ai_systems_eval_ch1_source.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mkdocs.yml mkdocs.en.yml scripts/validate_ai_systems_eval_ch1_source.mjs \
            docs/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.html \
            locales/en/snippets/articulos-tecnicos/eval-boundary-system-workflow-trajectory.i18n.json
          git commit -m 'fix(series5): repair 5.1 canonical integration'
          git push origin HEAD:series/evaluating-ai-systems-production-golden
