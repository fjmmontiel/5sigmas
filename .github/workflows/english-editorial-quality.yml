name: English editorial quality

on:
  pull_request:
    paths:
      - 'locales/en/**/*.md'
      - 'locales/en/**/*.html'
      - 'docs/**/*.md'
      - 'locales/en/manifest.yml'
      - 'scripts/audit_english_editorial_quality.py'
      - 'scripts/audit_english_ordered_list_quality.py'
      - 'scripts/audit_english_html_editorial_quality.py'
      - '.github/workflows/english-editorial-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  editorial-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Audit published English Markdown against Spanish canonical structure
        run: |
          python scripts/audit_english_editorial_quality.py \
            --strict \
            --json artifacts/english-editorial-quality/markdown-report.json

      - name: Audit ordered-list punctuation in published English Markdown
        run: |
          python scripts/audit_english_ordered_list_quality.py \
            --strict \
            --json artifacts/english-editorial-quality/ordered-list-report.json

      - name: Audit static list text in localized English HTML snippets
        run: |
          python scripts/audit_english_html_editorial_quality.py \
            --strict \
            --json artifacts/english-editorial-quality/html-report.json

      - name: Upload editorial audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: english-editorial-quality-report
          path: artifacts/english-editorial-quality/
          if-no-files-found: error
          retention-days: 1
