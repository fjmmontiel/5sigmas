name: Normalize polished metadata YAML

on:
  pull_request:
    paths:
      - '.github/workflows/fix-meta-yaml.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'reconcile/organic-growth-video-library-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Quote frontmatter descriptions safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          files = [
              'docs/series/modelos-razonadores/00_presentacion_serie.md',
              'docs/series/datacenters-espacio/04-huella-real-datacenter.md',
              'docs/series/multimodalidad-iag/01-el-problema.md',
              'docs/series/multimodalidad-iag/02-alineamiento.md',
              'docs/series/multimodalidad-iag/03-arquitecturas.md',
              'docs/series/multimodalidad-iag/04-evaluacion.md',
              'docs/series/multimodalidad-iag/05-riesgos.md',
              'docs/series/from-cave-to-agi/01-representar.md',
              'docs/series/from-cave-to-agi/03-aprender.md',
          ]

          for filename in files:
              path = Path(filename)
              body = path.read_text(encoding='utf-8')
              lines = body.splitlines()
              for index, line in enumerate(lines[:12]):
                  if not line.startswith('description:'):
                      continue
                  value = line.split(':', 1)[1].strip()
                  if value.startswith('"') and value.endswith('"'):
                      value = value[1:-1]
                  lines[index] = 'description: ' + json.dumps(value, ensure_ascii=False)
                  break
              else:
                  raise SystemExit(f'{filename}: description missing')
              normalized = '\n'.join(lines) + ('\n' if body.endswith('\n') else '')
              frontmatter = normalized.split('---', 2)[1]
              yaml.safe_load(frontmatter)
              path.write_text(normalized, encoding='utf-8')
          PY
          git add docs/series
          git diff --cached --check
          git commit -m 'fix: quote polished meta descriptions safely'
          git push origin HEAD:${GITHUB_HEAD_REF}
