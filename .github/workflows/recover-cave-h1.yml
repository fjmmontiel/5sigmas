name: Recover exact approved Cave H1 bytes
on:
  push:
    branches: [recovery/cave-h1-approved-20260927]
    paths: ['.github/recovery/cave-h1/**', '.github/workflows/recover-cave-h1.yml']
permissions:
  contents: write
concurrency:
  group: exact-cave-h1-recovery
  cancel-in-progress: false
jobs:
  exact-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/recovery/cave-h1/
      - name: Recover only exact owner-approved media in matched Debian runtime
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo debian:trixie-slim bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends python3 python3-cairo python3-pil ffmpeg fonts-cabin fonts-noto-core fonts-dejavu-core fontconfig ca-certificates
            fc-cache -f
            python3 .github/recovery/cave-h1/recover.py
          '
      - name: Commit complete exact collection to recovery branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/cave-h1-exact-recovery.json docs/series/from-cave-to-agi/*-h1-*.mp4 locales/en/series/from-cave-to-agi/*-h1-*.mp4
          git commit -m 'media: recover twelve exact owner-approved Cave H1 originals'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
