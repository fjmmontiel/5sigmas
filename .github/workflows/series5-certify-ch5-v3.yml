name: Series 5 certify chapter 5.5 v3

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-certify-ch5-v3.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair source-gate findings without changing semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          en_path = Path('locales/en/series/evaluating-ai-systems-production/05-online-evaluation-shadow-canary-ab-guardrails-regression-gates.md')
          en = en_path.read_text()
          lines = []
          changed = 0
          for line in en.splitlines():
              if re.match(r'^\s*-\s+.+;\s*$', line):
                  line = re.sub(r';\s*$', '.', line)
                  changed += 1
              lines.append(line)
          en2 = '\n'.join(lines) + '\n'
          en_path.write_text(en2)

          es_path = Path('docs/series/evaluating-ai-systems-production/05-online-evaluation-shadow-canary-ab-guardrails-regression-gates.md')
          es = es_path.read_text()
          old = 'No existe un 1%, 5% o p95 universal que convierta un canary en seguro.'
          new = 'No existe un umbral universal de tráfico o latencia que convierta un canary en seguro.'
          if old in es:
              es = es.replace(old, new, 1)
          elif new not in es:
              raise SystemExit('ES: expected universal-threshold sentence not found')
          es_path.write_text(es)

          print(f'EN semicolon-list lines repaired: {changed}')
          if re.search(r'^\s*-\s+.+;\s*$', en2, re.M):
              raise SystemExit('EN: semicolon-list anti-pattern remains')
          PY
          git diff --check

      - name: Commit source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/evaluating-ai-systems-production/05-online-evaluation-shadow-canary-ab-guardrails-regression-gates.md locales/en/series/evaluating-ai-systems-production/05-online-evaluation-shadow-canary-ab-guardrails-regression-gates.md
          if git diff --cached --quiet; then
            echo 'No source repair required.'
          else
            git commit -m 'content(series5): repair chapter 5.5 source gate findings'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
          echo "repaired_sha=$(git rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current Series 5 source contracts
        run: |
          node scripts/validate_ai_systems_eval_ch1_source.mjs
          node scripts/validate_ai_systems_eval_ch2_source.mjs
          node scripts/validate_ai_systems_eval_ch3_source.mjs
          node scripts/validate_ai_systems_eval_ch4_source.mjs
          node scripts/validate_ai_systems_eval_ch5_source.mjs

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Audit public-series publication contract
        run: python scripts/audit_publication_contract.py

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-series5-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-series5-preview.log
          exit 1

      - name: Audit browser resources, bilingual hub and locale parity
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_series_mirror.mjs
          node scripts/validate_locale_switching.mjs

      - name: Validate current Series 5 relationship geometry and accessibility
        run: |
          node scripts/validate_ai_systems_eval_ch1_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch2_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch3_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch4_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch5_accessibility.mjs

      - name: Validate reader navigation and responsive shell
        run: |
          node scripts/validate_direct_reader_navigation.mjs
          node scripts/validate_reader_header_overlap.mjs
          node scripts/validate_responsive_polish.mjs

      - name: Record exact certification receipt
        run: |
          mkdir -p artifacts/visual-review
          {
            echo "certified_sha=$(git rev-parse HEAD)"
            echo "event_sha=${GITHUB_SHA}"
            echo "es_article_blob=$(git hash-object docs/series/evaluating-ai-systems-production/05-online-evaluation-shadow-canary-ab-guardrails-regression-gates.md)"
            echo "en_article_blob=$(git hash-object locales/en/series/evaluating-ai-systems-production/05-online-evaluation-shadow-canary-ab-guardrails-regression-gates.md)"
            echo "visual_blob=$(git hash-object docs/snippets/articulos-tecnicos/eval-online-shadow-canary-ab-regression-gates.html)"
            echo "source_validator_blob=$(git hash-object scripts/validate_ai_systems_eval_ch5_source.mjs)"
            echo "accessibility_validator_blob=$(git hash-object scripts/validate_ai_systems_eval_ch5_accessibility.mjs)"
          } | tee artifacts/visual-review/series5-ch5-certification.txt

      - name: Upload chapter 5.5 GOLDEN evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-evaluation-ch5-golden-evidence
          path: |
            artifacts/visual-review/ai-systems-eval-*.png
            artifacts/visual-review/english-series-mirror-*.png
            artifacts/visual-review/series5-ch5-certification.txt
          if-no-files-found: error
          retention-days: 2

      - name: Cleanup one-shot certification workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/series5-certify-ch5-v3.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci(series5): remove chapter 5.5 certification workflow v3'
          git push origin HEAD:${GITHUB_REF_NAME}
