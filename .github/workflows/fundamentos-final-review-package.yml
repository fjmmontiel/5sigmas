name: Fundamentos IA complete review package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundamentos-ia-iag-complete-review-package
  cancel-in-progress: false

jobs:
  validate-complete-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact exporter source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile motion/scripts/fundamentos_render_check.py motion/scripts/fundamentos_render_final.py motion/scripts/fundamentos_package_final.py
          for f in motion/src/fundamentos/*.mjs; do node --check "$f"; done
      - name: Install deterministic browser and media dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check playwright pillow
          command -v google-chrome || command -v chromium || command -v chromium-browser
          ffmpeg -version | head -1
      - name: Render and full-decode the complete native ES/EN H/V matrix
        shell: bash
        run: |
          set -euo pipefail
          chapters=(00_presentacion_serie 01-que-es-ia 02-que-es-ia-generativa 03-ia-vs-ia-generativa 04-agi)
          for chapter in "${chapters[@]}"; do
            for locale in es en; do
              for orientation in horizontal vertical; do
                python motion/scripts/fundamentos_render_final.py \
                  --chapter "$chapter" \
                  --locale "$locale" \
                  --orientation "$orientation"
              done
            done
          done
      - name: Validate 20/20, ES/EN parity, native H/V parity and encoded whole-series review support
        shell: bash
        run: |
          set -euo pipefail
          python motion/scripts/fundamentos_package_final.py
          cat motion/dist/fundamentos-review-package/summary.json
          sha256sum motion/dist/fundamentos-review-package/fundamentos-ia-iag-review-candidate.zip
          test -s motion/dist/fundamentos-review-package/fundamentos-ia-iag-review-candidate.zip
      - name: Explain durable delivery policy
        shell: bash
        run: |
          cat <<'EOF'
          The complete package is validated in-run and is intentionally not retained as a generic GitHub Actions artifact.
          Durable owner review delivery belongs in the single private Drive review root after exact-byte read-back.
          Failure evidence in the browser/encoded gates remains one-day and failure-only per repository storage policy.
          EOF
