name: Video motion accessibility

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - 'motion/src/**'
      - 'motion/content/modelos-razonadores/**'
      - 'motion/theme/**'
      - 'motion/web/player-test.html'
      - 'motion/scripts/test_player_accessibility.py'
      - '.github/workflows/video-motion-accessibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install player test dependencies
        run: |
          python -m pip install -r motion/requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Validate localized controls, transcript, keyboard and reduced motion
        run: python motion/scripts/test_player_accessibility.py --browser ${{ matrix.browser }}
