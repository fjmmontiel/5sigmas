name: Render English Technical Article media

on:
  push:
    branches:
      - agent/english-media-technical-articles
    paths:
      - scripts/render_english_technical_article_media.py
      - .github/workflows/render-english-technical-article-media.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-media-technical-articles

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Render native English header demo
        run: python scripts/render_english_technical_article_media.py

      - name: Validate generated media
        shell: bash
        run: |
          set -euo pipefail
          mp4='locales/en/articulos-tecnicos/reactive-proactive-agent-header-demo.mp4'
          jpg='locales/en/articulos-tecnicos/reactive-proactive-agent-header-demo.jpg'
          test -s "$mp4"
          test -s "$jpg"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$mp4")"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$mp4")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$mp4")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$mp4")"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$mp4")"
          test "$codec" = 'h264'
          test "$pix_fmt" = 'yuv420p'
          test "$width" = '1920'
          test "$height" = '1080'
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 19.8 <= duration <= 20.2:
              raise SystemExit(f'unexpected duration: {duration}')
          PY
          echo "Validated $codec $pix_fmt ${width}x${height} ${duration}s"

      - name: Commit rendered native-English pair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            locales/en/articulos-tecnicos/reactive-proactive-agent-header-demo.mp4 \
            locales/en/articulos-tecnicos/reactive-proactive-agent-header-demo.jpg
          if git diff --cached --quiet; then
            echo 'No generated media changes.'
            exit 0
          fi
          git commit -m 'Render native English Technical Article media'
          git push origin HEAD:agent/english-media-technical-articles
