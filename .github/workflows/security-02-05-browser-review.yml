name: Security02-05 bounded browser review

on:
  push:
    branches: ['quality/post-datacenters-requalification']
    paths: ['quality/series-requalification/browser-review-request.json']

permissions:
  contents: read

concurrency:
  group: security-02-05-browser-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Record exact revision and request
        run: |
          git rev-parse HEAD
          cat quality/series-requalification/browser-review-request.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check focused browser gate
        run: node --check scripts/validate_security_02_05_browser.mjs
      - name: Build Spanish strictly
        run: mkdocs build --clean --strict
      - name: Prepare English
        run: python scripts/prepare_locale.py --locale en
      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve built preview with byte-range support
        run: |
          python scripts/serve_preview.py --directory site --port 8000 > /tmp/security-browser-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/security-browser-preview.log
          exit 1
      - name: Security02-05 real browser interaction evidence
        id: browser
        run: node scripts/validate_security_02_05_browser.mjs
      - name: Retain exact browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-02-05-browser-review
          path: artifacts/security-requalification/security-02-05-browser/
          retention-days: 1
          if-no-files-found: error
          overwrite: true
