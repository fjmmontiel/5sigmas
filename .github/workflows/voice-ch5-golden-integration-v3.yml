name: Voice chapter 5 GOLDEN integration gate v3

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch5-golden-integration-v3.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: voice-ch5-golden-integration-v3
  cancel-in-progress: false

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/realtime-voice-agents-golden
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wire chapter 5 into articles, navigation and locale manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def insert_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if addition.strip() in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, got {text.count(anchor)}')
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          include = '\n{{ include_html("snippets/articulos-tecnicos/voice-network-paths.html") }}\n'
          for path in [
              'docs/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md',
              'locales/en/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md',
          ]:
              insert_after(
                  path,
                  'PSTN/carrier → carrier media gateway → WSS audio protocol → application/runtime\n```\n',
                  include,
              )

          insert_after(
              'mkdocs.yml',
              '          - Tools, estado y acciones asíncronas: series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md\n',
              '          - WebRTC, SIP y telefonía: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
          )
          insert_after(
              'mkdocs.en.yml',
              '          - Tools, state and async actions: series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md\n',
              '          - WebRTC, SIP and telephony: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md\n',
              '  - series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/voice-action-lifecycle.html\n',
              '  - snippets/articulos-tecnicos/voice-network-paths.html\n',
          )
          PY

      - name: Chapter 5 source contract
        run: node scripts/validate_voice_network_telephony_ch5_source.mjs

      - name: Media declarations, signatures and schema
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Strict Spanish build
        run: mkdocs build --clean --strict

      - name: Prepare and audit English locale sources
        env:
          S5_LOCALE: en
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Strict English build and rendered locale audit
        env:
          S5_LOCALE: en
        run: |
          mkdocs build -f mkdocs.en.yml --clean --strict
          python scripts/audit_locale.py --locale en --site site/en

      - name: Restore reviewed English TTC media
        id: en-ttc-cache
        uses: actions/cache/restore@v4
        with:
          path: .localized-media/en/ttc-v1
          key: s5-en-ttc-4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33

      - name: Seed reviewed English TTC media from verified artifact
        if: steps.en-ttc-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: english-ttc-reviewed-seed
          path: .localized-media/en/ttc-v1
          run-id: 31689108864
          github-token: ${{ github.token }}

      - name: Verify and stage reviewed English TTC media
        shell: bash
        run: |
          set -euo pipefail
          media='.localized-media/en/ttc-v1'
          mp4="$media/03-test-time-compute.mp4"
          jpg="$media/03-test-time-compute.jpg"
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  .localized-media/en/ttc-v1/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  .localized-media/en/ttc-v1/03-test-time-compute.jpg' | sha256sum -c -
          test "$(stat -c %s "$mp4")" = '4337214'
          test "$(stat -c %s "$jpg")" = '105949'
          target='site/en/series/modelos-razonadores'
          mkdir -p "$target"
          cp "$mp4" "$target/03-test-time-compute.mp4"
          cp "$jpg" "$target/03-test-time-compute.jpg"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Browser resource and broken-media audit
        run: node scripts/audit_browser_resources.mjs

      - name: Locale and mirror browser gates
        run: |
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_home_parity.mjs

      - name: Chapters 1-4 regression gates
        run: |
          node scripts/validate_voice_architecture_ch1.mjs
          node scripts/validate_voice_architecture_ch1_accessibility.mjs
          node scripts/validate_voice_turn_taking_ch2_source.mjs
          node scripts/validate_voice_turn_taking_ch2_accessibility.mjs
          node scripts/validate_voice_latency_ch3_source.mjs
          node scripts/validate_voice_latency_ch3_accessibility.mjs
          node scripts/validate_voice_tools_state_ch4_source.mjs
          node scripts/validate_voice_tools_state_ch4_accessibility.mjs

      - name: Chapter 5 browser and accessibility gate
        run: node scripts/validate_voice_network_telephony_ch5_accessibility.mjs

      - name: Reader navigation gate
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Verify deterministic patch
        run: git diff --check

      - name: Persist validated chapter 5 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '5sigmas-golden-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md \
            locales/en/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md \
            mkdocs.yml mkdocs.en.yml locales/en/manifest.yml
          git diff --cached --check
          git commit -m 'feat(voice): integrate chapter 5 network boundary'
          git push origin HEAD:series/realtime-voice-agents-golden

      - name: Upload chapter 5 GOLDEN visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-ch5-golden-visual-evidence-v3
          path: artifacts/visual-review/voice-network-ch5-*.png
          if-no-files-found: error
          retention-days: 1
