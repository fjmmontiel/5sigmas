name: Inference Engineering ch6 integrate

on:
  push:
    branches:
      - series/llm-inference-engineering-economics-golden
    paths:
      - '.github/workflows/inference-engineering-ch6-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/llm-inference-engineering-economics-golden
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Integrate chapter 4.6 into canonical nav and locale manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if addition in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'anchor not found in {path}: {anchor}')
              text = text.replace(anchor, anchor + '\n' + addition, 1)
              p.write_text(text, encoding='utf-8')

          route = 'series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.md'
          insert_after(
              'mkdocs.yml',
              '          - Model routing, fallback, caching y serving adaptado al workload: series/llm-inference-engineering-economics/05-model-routing-fallback-caching-workload-aware-serving.md',
              f'          - Benchmarking de inferencia: cost/task, throughput, latencia, energía y hardware: {route}',
          )
          insert_after(
              'mkdocs.en.yml',
              '          - Model routing, fallback, caching, and workload-aware serving: series/llm-inference-engineering-economics/05-model-routing-fallback-caching-workload-aware-serving.md',
              f'          - Benchmarking inference: cost/task, throughput, latency, energy, and hardware constraints: {route}',
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - series/llm-inference-engineering-economics/05-model-routing-fallback-caching-workload-aware-serving.md',
              f'  - {route}',
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/inference-routing-fallback-cache-policy.html',
              '  - snippets/articulos-tecnicos/inference-benchmark-measurement-boundary.html',
          )
          PY

      - name: Commit canonical integration
        shell: bash
        run: |
          if git diff --quiet -- mkdocs.yml mkdocs.en.yml locales/en/manifest.yml; then
            echo 'Canonical integration already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mkdocs.yml mkdocs.en.yml locales/en/manifest.yml
          git commit -m 'Integrate Series 4.6 into canonical navigation and locale manifest'
          git push origin HEAD:series/llm-inference-engineering-economics-golden
