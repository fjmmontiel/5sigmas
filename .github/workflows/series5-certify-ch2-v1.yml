# One-shot 5.2 article recertification after rendered-text QA repair. Delete after a successful exact-SHA receipt.
name: Series 5 certify chapter 5.2 v3

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-certify-ch2-v1.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact clean source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'certified_sha=%s\n' "$GITHUB_SHA" | tee /tmp/series5-ch2-v3-evidence.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Series 5 source contracts through 5.2
        run: |
          node scripts/validate_ai_systems_eval_ch1_source.mjs
          node scripts/validate_ai_systems_eval_ch2_source.mjs

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Audit public-series publication contract
        run: python scripts/audit_publication_contract.py

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium without mutating source metadata
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-series5-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-series5-preview.log
          exit 1

      - name: Audit browser resources, English mirror and locale switching
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_series_mirror.mjs
          node scripts/validate_locale_switching.mjs

      - name: Validate Series 5 relationship geometry and accessibility through 5.2
        run: |
          node scripts/validate_ai_systems_eval_ch1_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch2_accessibility.mjs

      - name: Validate reader navigation and responsive shell
        run: |
          node scripts/validate_direct_reader_navigation.mjs
          node scripts/validate_reader_header_overlap.mjs
          node scripts/validate_responsive_polish.mjs

      - name: Record exact evidence hashes
        if: always()
        shell: bash
        run: |
          {
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf '%s\n' 'git_status_begin'
            git status --porcelain --untracked-files=all
            printf '%s\n' 'git_status_end'
            git hash-object docs/series/evaluating-ai-systems-production/02-offline-eval-sets-curation-hard-negatives-contamination-versioning.md | sed 's/^/es_blob=/'
            git hash-object locales/en/series/evaluating-ai-systems-production/02-offline-eval-sets-curation-hard-negatives-contamination-versioning.md | sed 's/^/en_blob=/'
            git hash-object docs/snippets/articulos-tecnicos/eval-dataset-lifecycle-hard-negatives-contamination.html | sed 's/^/visual_blob=/'
            git hash-object locales/en/snippets/articulos-tecnicos/eval-dataset-lifecycle-hard-negatives-contamination.i18n.json | sed 's/^/visual_i18n_blob=/'
            git hash-object scripts/validate_ai_systems_eval_ch2_source.mjs | sed 's/^/source_gate_blob=/'
            git hash-object scripts/validate_ai_systems_eval_ch2_accessibility.mjs | sed 's/^/browser_gate_blob=/'
            sha256sum docs/series/evaluating-ai-systems-production/02-offline-eval-sets-curation-hard-negatives-contamination-versioning.md | awk '{print "es_sha256=" $1}'
            sha256sum locales/en/series/evaluating-ai-systems-production/02-offline-eval-sets-curation-hard-negatives-contamination-versioning.md | awk '{print "en_sha256=" $1}'
            sha256sum docs/snippets/articulos-tecnicos/eval-dataset-lifecycle-hard-negatives-contamination.html | awk '{print "visual_sha256=" $1}'
          } >> /tmp/series5-ch2-v3-evidence.txt
          cat /tmp/series5-ch2-v3-evidence.txt

      - name: Upload chapter 5.2 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-evaluation-ch2-certification-v3
          path: |
            /tmp/series5-ch2-v3-evidence.txt
            artifacts/visual-review/ai-systems-eval-ch1-*.png
            artifacts/visual-review/ai-systems-eval-ch2-*.png
            artifacts/visual-review/english-series-mirror-*.png
          if-no-files-found: error
          retention-days: 1

      - name: Reconfirm exact SHA and source cleanliness after all gates
        if: success()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? artifacts/visual-review/' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected working-tree changes after certification:\n%s\n' "$unexpected" >&2
            exit 1
          fi
