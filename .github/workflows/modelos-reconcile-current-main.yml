name: Modelos reconcile current main

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - '.github/workflows/modelos-reconcile-current-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelos-reconcile-current-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/video-golden-modelos-razonadores
          fetch-depth: 0

      - name: Merge current main without rewriting branch history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          before_sha="$(git rev-parse HEAD)"
          echo "before=${before_sha} main=${main_sha}"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Current main already contained; no merge required.'
            exit 0
          fi
          if ! git merge --no-edit origin/main; then
            echo 'Merge conflicts detected; refusing partial or guessed resolution.' >&2
            git diff --name-only --diff-filter=U >&2 || true
            git merge --abort || true
            exit 2
          fi
          after_sha="$(git rev-parse HEAD)"
          echo "after=${after_sha}"
          git push origin HEAD:migration/video-golden-modelos-razonadores
