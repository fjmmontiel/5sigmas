name: Modelos reconcile current main

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - '.github/workflows/modelos-reconcile-current-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelos-reconcile-current-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/video-golden-modelos-razonadores
          fetch-depth: 0

      - name: Merge current main with explicit conflict ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          before_sha="$(git rev-parse HEAD)"
          echo "before=${before_sha} main=${main_sha}"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Current main already contained; no merge required.'
            exit 0
          fi

          if git merge --no-edit origin/main; then
            echo 'Current main merged cleanly.'
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Observed conflicts:\n'; printf ' - %s\n' "${conflicts[@]}"
            expected=(
              '.github/workflows/ci-storage-policy.yml'
              'locales/en/manifest.yml'
              'locales/en/media.yml'
              'scripts/test_video_schema_contract.py'
              'scripts/validate_coding_agent_harness_ch5_accessibility.mjs'
            )
            for file in "${conflicts[@]}"; do
              found=false
              for allowed in "${expected[@]}"; do
                [[ "$file" == "$allowed" ]] && found=true
              done
              if [[ "$found" != true ]]; then
                echo "Unknown merge conflict; refusing guessed resolution: $file" >&2
                git merge --abort || true
                exit 3
              fi
            done

            # Storage policy: branch version is already reconciled with current-main's
            # Realtime Voice one-day evidence exception plus the Modelos one-day transport.
            git show :2:.github/workflows/ci-storage-policy.yml > /tmp/ci-ours.yml
            for marker in "realtime-voice-browser-pixel-evidence" "video-motion-delivery-gate.yml" "retention-days: 1"; do
              grep -Fq "$marker" /tmp/ci-ours.yml || {
                echo "Branch CI storage policy is missing required reconciled marker: $marker" >&2
                git merge --abort || true
                exit 4
              }
            done
            git checkout --ours -- .github/workflows/ci-storage-policy.yml

            # English manifest: main owns current site inventory, while this release branch
            # adds Modelos caption/transcript and approved-media entries. Union only exact
            # list items per top-level section; preserve current-main ordering first.
            git show :2:locales/en/manifest.yml > /tmp/manifest-ours.yml
            git show :3:locales/en/manifest.yml > /tmp/manifest-main.yml
            python - <<'PY'
          from pathlib import Path

          def blocks(text):
              out=[]; current=[]; key=None
              for line in text.splitlines():
                  if line and not line.startswith((' ', '\t')):
                      if current:
                          out.append((key,current))
                      key=line.split(':',1)[0]
                      current=[line]
                  else:
                      current.append(line)
              if current:
                  out.append((key,current))
              return out

          ours=dict(blocks(Path('/tmp/manifest-ours.yml').read_text()))
          main=blocks(Path('/tmp/manifest-main.yml').read_text())
          merged=[]
          seen=set()
          for key, block in main:
              seen.add(key)
              other=ours.get(key)
              if other and any(line.startswith('  - ') for line in block):
                  items=[line for line in block[1:] if line.startswith('  - ')]
                  extras=[line for line in other[1:] if line.startswith('  - ') and line not in items]
                  merged.extend([block[0], *items, *extras])
              else:
                  merged.extend(block)
          for key, block in ours.items():
              if key not in seen:
                  merged.extend(block)
          Path('locales/en/manifest.yml').write_text('\n'.join(merged).rstrip()+'\n')
          PY

            # English media: current main owns every non-Modelos entry (including Realtime
            # Voice). This branch owns only the six Modelos mappings because their durations,
            # captions and transcripts are bound to the frozen approved release snapshot.
            git show :2:locales/en/media.yml > /tmp/media-ours.yml
            git show :3:locales/en/media.yml > /tmp/media-main.yml
            python - <<'PY'
          from pathlib import Path

          def blocks(text):
              out=[]; current=[]; key=None
              for line in text.splitlines():
                  if line and not line.startswith((' ', '\t')) and line.endswith(':'):
                      if current:
                          out.append((key,current))
                      key=line[:-1]
                      current=[line]
                  else:
                      current.append(line)
              if current:
                  out.append((key,current))
              return out

          ours=dict(blocks(Path('/tmp/media-ours.yml').read_text()))
          main=blocks(Path('/tmp/media-main.yml').read_text())
          merged=[]; seen=set()
          for key, block in main:
              seen.add(key)
              if key and key.startswith('series/modelos-razonadores/') and key in ours:
                  merged.extend(ours[key])
              else:
                  merged.extend(block)
          for key, block in ours.items():
              if key not in seen:
                  merged.extend(block)
          Path('locales/en/media.yml').write_text('\n'.join(merged).rstrip()+'\n')
          PY

            # These two checks are unrelated to Modelos and current main contains the newer
            # Realtime Voice / MathJax accessibility contract. Never regress them for release.
            git checkout --theirs -- scripts/test_video_schema_contract.py
            git checkout --theirs -- scripts/validate_coding_agent_harness_ch5_accessibility.mjs

            git add \
              .github/workflows/ci-storage-policy.yml \
              locales/en/manifest.yml \
              locales/en/media.yml \
              scripts/test_video_schema_contract.py \
              scripts/validate_coding_agent_harness_ch5_accessibility.mjs

            remaining="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$remaining" ]]; then
              echo "Conflicts remain after explicit resolution:" >&2
              echo "$remaining" >&2
              git merge --abort || true
              exit 5
            fi
            git commit --no-edit
          fi

          after_sha="$(git rev-parse HEAD)"
          echo "after=${after_sha}"
          git push origin HEAD:migration/video-golden-modelos-razonadores
