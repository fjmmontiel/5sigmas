name: Model price-performance freshness

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: model-price-performance-freshness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce release-ledger and provenance freshness
        run: node scripts/audit_model_price_performance_freshness.mjs --max-age-days=8

      - name: Re-run deterministic model explorer math
        run: node scripts/test_model_price_performance_tool.mjs
