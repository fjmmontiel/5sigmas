name: Inference Engineering 4.4 GOLDEN certification

on:
  push:
    branches:
      - series/llm-inference-engineering-economics-golden
    paths:
      - '.github/workflows/inference-engineering-ch4-golden.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: series/llm-inference-engineering-economics-golden

      - name: Repair deterministic Spanish benchmark attribution gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '5sigmas GOLDEN orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_inference_engineering_ch4_source.mjs')
          text = path.read_text(encoding='utf-8')
          old = "check(es.includes('comparison entre stacks') && es.includes('no evidencia causal'), 'ES: benchmark attribution boundary missing');"
          new = "check(es.includes('comparación entre stacks') && es.includes('no evidencia causal'), 'ES: benchmark attribution boundary missing');"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale ES benchmark gate, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git add scripts/validate_inference_engineering_ch4_source.mjs
          git commit -m 'test(series4): fix chapter 4.4 Spanish attribution invariant'
          git push origin HEAD:series/llm-inference-engineering-economics-golden
          mkdir -p artifacts/visual-review
          git rev-parse HEAD | tee artifacts/visual-review/inference-engineering-ch4-certified-sha.txt
          git status --porcelain=v1 --untracked-files=no | tee /tmp/tracked-status
          test ! -s /tmp/tracked-status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py

      - name: Validate Series 4 source contracts through 4.4
        run: |
          node scripts/validate_inference_engineering_ch1_source.mjs
          node scripts/validate_inference_engineering_ch2_source.mjs
          node scripts/validate_inference_engineering_ch3_source.mjs
          node scripts/validate_inference_engineering_ch4_source.mjs

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Audit publication contract
        run: python scripts/audit_publication_contract.py

      - name: Prepare and audit English source locale
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Build and audit rendered English strictly
        env:
          S5_LOCALE: en
        run: |
          mkdocs build -f mkdocs.en.yml --clean --strict
          python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-series4-ch4.log 2>&1 &
          echo $! > /tmp/5sigmas-series4-ch4.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null \
              && curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null \
              && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-series4-ch4.log
          exit 1

      - name: Audit browser resources and locale
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_locale.mjs

      - name: Validate Series 4 relationship geometry and accessibility through 4.4
        run: |
          node scripts/validate_inference_engineering_ch1_accessibility.mjs
          node scripts/validate_inference_engineering_ch2_accessibility.mjs
          node scripts/validate_inference_engineering_ch3_accessibility.mjs
          node scripts/validate_inference_engineering_ch4_accessibility.mjs

      - name: Validate reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Verify certified tree stayed exact
        run: |
          set -euo pipefail
          expected="$(cat artifacts/visual-review/inference-engineering-ch4-certified-sha.txt)"
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --exit-code
          git diff --cached --exit-code
          echo "Certified exact SHA: $expected"

      - name: Upload chapter 4.4 GOLDEN evidence
        if: success()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: inference-engineering-ch4-golden-evidence
          path: |
            artifacts/visual-review/inference-engineering-ch4-*.png
            artifacts/visual-review/inference-engineering-ch4-certified-sha.txt
          if-no-files-found: error
          retention-days: 3
