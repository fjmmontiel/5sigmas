name: From Cave to AGI semantic and render foundation

on:
  push:
    branches:
      - migration/video-golden-from-cave-to-agi
    paths:
      - 'motion/content/from-cave-to-agi/**'
      - 'motion/src/from-cave/**'
      - 'motion/src/render/**'
      - 'motion/scripts/check_from_cave_register.mjs'
      - 'motion/scripts/check_from_cave_foundation.mjs'
      - '.github/workflows/from-cave-semantic-register.yml'
  pull_request:
    paths:
      - 'motion/content/from-cave-to-agi/**'
      - 'motion/src/from-cave/**'
      - 'motion/src/render/**'
      - 'motion/scripts/check_from_cave_register.mjs'
      - 'motion/scripts/check_from_cave_foundation.mjs'

permissions:
  contents: read

jobs:
  semantic-and-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check authored renderer foundation
        run: |
          node --check motion/src/from-cave/theme.mjs
          node --check motion/src/render/paint.mjs
          node --check motion/src/render/layout.mjs
          node --check motion/scripts/check_from_cave_register.mjs
          node --check motion/scripts/check_from_cave_foundation.mjs
      - name: Validate complete source-bound series register
        run: node motion/scripts/check_from_cave_register.mjs
      - name: Validate H/V render foundation
        run: node motion/scripts/check_from_cave_foundation.mjs
