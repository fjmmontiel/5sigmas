name: Owner series source import (temporary PR 378 transport)
on:
  pull_request:
    paths:
      - '.github/workflows/series-owner-source-import.yml'
      - 'quality/series-ui-review/import/**'
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'fjmmontiel/5sigmas' && github.event.pull_request.number == 378 && github.event.pull_request.head.repo.full_name == 'fjmmontiel/5sigmas' && github.event.pull_request.head.ref == 'ui/series-discovery-review-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Import exact owner-requested public source patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          folder = Path('quality/series-ui-review/import')
          payload = ''.join((folder / f'part-{i}.b64').read_text().strip() for i in range(7))
          raw = lzma.decompress(base64.b64decode(payload, validate=True))
          assert len(raw) == 251881
          assert hashlib.sha256(raw).hexdigest() == '9761571fceb5f4ddec03d5d18919800c9a8b9594c5a607127003d0c73839826c'
          files = json.loads(raw)
          allowed = {'.github/workflows/series-ui-review.yml','docs/assets/javascripts/series-experience.js','docs/stylesheets/series-experience.css','hooks/series_curriculum.json','hooks/series_experience.py','quality/series-ui-review/README.md','scripts/capture_series_ui_review.py','scripts/test_series_experience.py','scripts/test_series_scenes.mjs','scripts/validate_english_series_mirror.mjs','scripts/validate_english_series_video_rollback.mjs'}
          assert set(files) == allowed
          for name, content in files.items():
              assert isinstance(content, str)
              if name.startswith('.github/'):
                  continue  # Workflow edits remain the native connector's responsibility.
              path = Path(name)
              assert not path.is_symlink()
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
              print(name, hashlib.sha256(content.encode()).hexdigest())
          PY
          node --check docs/assets/javascripts/series-experience.js
          python -m py_compile hooks/series_experience.py scripts/capture_series_ui_review.py scripts/test_series_experience.py
          node scripts/test_series_scenes.mjs
      - name: Commit source only to the review branch, never main
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH='ui/series-discovery-review-20260929'
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git add docs/assets/javascripts/series-experience.js docs/stylesheets/series-experience.css hooks/series_curriculum.json hooks/series_experience.py quality/series-ui-review/README.md scripts/capture_series_ui_review.py scripts/test_series_experience.py scripts/test_series_scenes.mjs scripts/validate_english_series_mirror.mjs scripts/validate_english_series_video_rollback.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(series): full discovery journey and 40 bilingual causal scenes'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
