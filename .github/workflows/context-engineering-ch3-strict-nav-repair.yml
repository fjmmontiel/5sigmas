name: Context Engineering 3.3 strict-nav repair

on:
  push:
    branches:
      - series/context-engineering-memory-mcp-golden
    paths:
      - '.github/workflows/context-engineering-ch3-strict-nav-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/context-engineering-memory-mcp-golden
      - name: Repair nav YAML and source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('mkdocs.yml'): [
                  (
                      '          - Arquitecturas de memoria: working, episodic, semantic y estado persistente: series/context-engineering-memory-mcp/03-memory-architectures-working-episodic-semantic-persistent-state.md',
                      '          - "Arquitecturas de memoria: working, episodic, semantic y estado persistente": series/context-engineering-memory-mcp/03-memory-architectures-working-episodic-semantic-persistent-state.md',
                  ),
              ],
              Path('mkdocs.en.yml'): [
                  (
                      '          - Memory architectures: working, episodic, semantic, and persistent state: series/context-engineering-memory-mcp/03-memory-architectures-working-episodic-semantic-persistent-state.md',
                      '          - "Memory architectures: working, episodic, semantic, and persistent state": series/context-engineering-memory-mcp/03-memory-architectures-working-episodic-semantic-persistent-state.md',
                  ),
              ],
              Path('scripts/validate_context_engineering_ch3_source.mjs'): [
                  (
                      "check(mkdocsEs.includes('Context engineering, memoria y MCP:') && mkdocsEs.includes(`Arquitecturas de memoria: working, episodic, semantic y estado persistente: ${route}`), 'ES: chapter 3.3 navigation missing');",
                      "check(mkdocsEs.includes('Context engineering, memoria y MCP:') && mkdocsEs.includes(route) && mkdocsEs.includes('Arquitecturas de memoria: working, episodic, semantic y estado persistente'), 'ES: chapter 3.3 navigation missing');",
                  ),
                  (
                      "check(mkdocsEn.includes('Context Engineering, Memory & MCP:') && mkdocsEn.includes(`Memory architectures: working, episodic, semantic, and persistent state: ${route}`), 'EN: chapter 3.3 navigation missing');",
                      "check(mkdocsEn.includes('Context Engineering, Memory & MCP:') && mkdocsEn.includes(route) && mkdocsEn.includes('Memory architectures: working, episodic, semantic, and persistent state'), 'EN: chapter 3.3 navigation missing');",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing exact repair target in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          node scripts/validate_context_engineering_ch3_source.mjs
          git diff --check
      - name: Commit repaired strict source and remove repair workflow
        shell: bash
        run: |
          rm .github/workflows/context-engineering-ch3-strict-nav-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mkdocs.yml mkdocs.en.yml scripts/validate_context_engineering_ch3_source.mjs .github/workflows/context-engineering-ch3-strict-nav-repair.yml
          git commit -m 'fix(context): make chapter 3.3 navigation strict-YAML safe'
          git push origin HEAD:series/context-engineering-memory-mcp-golden
