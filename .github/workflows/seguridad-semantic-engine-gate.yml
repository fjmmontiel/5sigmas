name: Seguridad IA semantic engine gate

on:
  push:
    branches:
      - migration/video-golden-seguridad-ia
    paths:
      - 'motion/src/seguridad/**'
      - 'motion/tests/seguridad-*.test.mjs'
      - 'motion/migration/seguridad-ia-content-v1.json'
      - 'motion/migration/seguridad-ia-series-register.json'
      - '.github/workflows/seguridad-semantic-engine-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-ia-semantic-engine
  cancel-in-progress: false

jobs:
  semantic-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fail on invalid UTF-8 or forbidden control bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('motion/src/seguridad/schema.mjs'),
              Path('motion/src/seguridad/mechanisms.mjs'),
              Path('motion/src/seguridad/engine.mjs'),
              Path('motion/tests/seguridad-schema.test.mjs'),
              Path('motion/tests/seguridad-engine.test.mjs'),
              Path('motion/migration/seguridad-ia-content-v1.json'),
              Path('motion/migration/seguridad-ia-series-register.json'),
          ]
          for path in paths:
              raw = path.read_bytes()
              text = raw.decode('utf-8', errors='strict')
              bad = [(i, ord(c)) for i, c in enumerate(text) if ord(c) < 32 and c not in '\n\r\t']
              if bad:
                  raise SystemExit(f'{path}: forbidden control bytes {bad[:8]}')
              print(f'UTF8_CONTROL_PASS {path} bytes={len(raw)}')
          PY

      - name: Syntax and import preflight
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check motion/src/seguridad/schema.mjs
          node --check motion/src/seguridad/mechanisms.mjs
          node --check motion/src/seguridad/engine.mjs
          node --check motion/tests/seguridad-schema.test.mjs
          node --check motion/tests/seguridad-engine.test.mjs
          node -e "import('./motion/src/seguridad/engine.mjs').then(m=>console.log('ENGINE_IMPORT_PASS', Object.keys(m).sort().join(',')))"

      - name: Run schema and semantic-engine regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test motion/tests/seguridad-schema.test.mjs motion/tests/seguridad-engine.test.mjs

      - name: Emit deterministic render coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {seguridadRenderMatrix, validateSeguridadMechanismCoverage} from './motion/src/seguridad/engine.mjs';
          const spec=JSON.parse(fs.readFileSync('motion/migration/seguridad-ia-content-v1.json','utf8'));
          const register=JSON.parse(fs.readFileSync('motion/migration/seguridad-ia-series-register.json','utf8'));
          const jobs=seguridadRenderMatrix(spec,register);
          const coverage=validateSeguridadMechanismCoverage(spec,register);
          console.log(JSON.stringify({jobs:jobs.length,horizontal:jobs.filter(x=>x.orientation==='horizontal').length,vertical:jobs.filter(x=>x.orientation==='vertical').length,...coverage},null,2));
          NODE
