name: Finalize English AI Agents media

on:
  push:
    branches:
      - agent/english-media-agents
    paths:
      - scripts/package_english_agents_media.py
      - .github/workflows/render-english-agents-media.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-media-agents

      - name: Package native English Agents media
        run: |
          python scripts/package_english_agents_media.py
          python - <<'PY'
          from pathlib import Path
          p = Path('locales/en/media.yml')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit final media contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete native English AI Agents media'
          git push origin HEAD:agent/english-media-agents
