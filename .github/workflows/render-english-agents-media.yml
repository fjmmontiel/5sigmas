name: Render English AI Agents media

on:
  push:
    branches:
      - agent/english-media-agents
    paths:
      - scripts/render_english_agents_media.py
      - .github/workflows/render-english-agents-media.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/english-media-agents

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Render native English Agents media
        run: python scripts/render_english_agents_media.py

      - name: Validate generated media
        shell: bash
        run: |
          set -euo pipefail
          root='locales/en/series/agentes-ia'
          for slug in \
            00_presentacion_serie \
            01-que-es-un-agente \
            02-anatomia-de-un-agente \
            03-como-evaluar-un-agente \
            04-seguridad-agentes \
            05-de-la-demo-a-produccion; do
            mp4="$root/$slug.mp4"
            jpg="$root/$slug.jpg"
            test -s "$mp4"
            test -s "$jpg"
            codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$mp4")"
            pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$mp4")"
            width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$mp4")"
            height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$mp4")"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$mp4")"
            test "$codec" = 'h264'
            test "$pix_fmt" = 'yuv420p'
            test "$width" = '1920'
            test "$height" = '1080'
            python - "$slug" "$duration" <<'PY'
          import sys
          slug, duration = sys.argv[1], float(sys.argv[2])
          if not 31.8 <= duration <= 32.2:
              raise SystemExit(f'{slug}: unexpected duration {duration}')
          PY
            echo "Validated $slug: $codec $pix_fmt ${width}x${height} ${duration}s"
          done

      - name: Commit rendered native-English pairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f locales/en/series/agentes-ia/*.mp4 locales/en/series/agentes-ia/*.jpg
          if git diff --cached --quiet; then
            echo 'No generated media changes.'
            exit 0
          fi
          git commit -m 'Render native English AI Agents media'
          git push origin HEAD:agent/english-media-agents
