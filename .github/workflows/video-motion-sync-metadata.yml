name: Video motion metadata sync

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - 'motion/content/modelos-razonadores/**'
      - 'motion/scripts/sync_release_metadata.py'
      - '.github/workflows/video-motion-sync-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migration/video-golden-modelos-razonadores
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive public durations from v4 specs
        run: python motion/scripts/sync_release_metadata.py --write
      - name: Commit deterministic metadata if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/series/modelos-razonadores locales/en/media.yml; then
            echo 'Metadata already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/modelos-razonadores locales/en/media.yml
          git commit -m 'chore(motion): sync reasoning video durations from specs'
          git push origin HEAD:migration/video-golden-modelos-razonadores
