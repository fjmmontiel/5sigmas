name: Production QA trigger probe

on:
  push:
    branches: [main]
    paths:
      - 'qa/probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist probe result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          printf 'run_id=%s\nsource_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/probe/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan qa-probe-result
          git rm -rf .
          cp /tmp/probe/status.txt .
          git add -f status.txt
          git commit -m "qa: actions probe ${GITHUB_RUN_ID}"
          git push --force origin HEAD:qa/probe-result
