name: Voice chapter 6 GOLDEN metadata finalizer

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch6-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/realtime-voice-agents-golden
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Persist chapter 6 permanent gates and editorial certification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr-visual-review.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = "      - name: Validate Realtime Voice Agents chapter 5 accessibility and responsive states\n        run: node scripts/validate_voice_network_telephony_ch5_accessibility.mjs\n"
          addition = "\n      - name: Validate Realtime Voice Agents chapter 6 source contract\n        run: node scripts/validate_voice_evaluation_observability_ch6_source.mjs\n\n      - name: Validate Realtime Voice Agents chapter 6 accessibility and responsive states\n        run: node scripts/validate_voice_evaluation_observability_ch6_accessibility.mjs\n"
          if 'Validate Realtime Voice Agents chapter 6 source contract' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'PR workflow: expected one chapter-5 anchor, got {text.count(anchor)}')
              workflow.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          review = Path('locales/en/editorial_review.voice-agents.yml')
          text = review.read_text(encoding='utf-8')
          route = 'series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md'
          if route not in text:
              entry = """
  - route: series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability.md
    reviewed_on: 2026-09-10
    spanish_blob_sha: 41243fc43839e5765030d9e8ff0c66d680199859
    english_blob_sha: c7801f76f62eea391f24d1fe9cdd8514e5edf7dd
    review_scope: prose, headings, examples, equations, terminology, quantitative examples and denominator semantics, references, logical-turn identity, observed-vs-inferred-vs-judged provenance, outcome-vs-interaction-vs-media-vs-runtime evidence layers, first-harmful-observable-vs-root-cause separation, stage/symptom/cause/recovery/user-impact taxonomy, voice-specific failure classes, turn/request denominator separation, latency distribution linkage, recovered-internal-failure-vs-user-outcome boundary, deterministic invariants, layered eval strategy, transcript/audio/event/dependency/full-path replay, turn-correlated tracing, OpenTelemetry low-cardinality error typing, LiveKit SDK-vs-Cloud observability ownership, LiveKit ErrorEvent recoverability semantics, Pipecat metrics/observers/eval-transport boundaries, current Pipecat ErrorFrame category/processor usability semantics and fatal deprecation, LiveKit/Pipecat/vanilla decision matrix, application-owned canonical turn ledger hybrid, production-to-regression loop, privacy/redaction boundaries, evidence-stack visual labels, mobile runtime-table reachability and semantic parity
    note: Independent ES/EN editorial certification after current first-party revalidation and full strict/browser integration. Both locales preserve the same logical-turn evidence model, formulas and denominators, deterministic business-state invariants, replay ladder, failure taxonomy and runtime decision guidance. The review corrected a freshness regression in Pipecat error handling: ErrorFrame.fatal is deprecated since v1.8.0 and removed in 2.0.0, while error.processor.is_usable plus on_usable_changed is the current processor-usability boundary. That runtime signal is explicitly not treated as product outcome. LiveKit SDK data hooks and OTel export remain distinct from LiveKit Cloud Agent insights, and ev.error.recoverable remains runtime recovery semantics rather than proof of user-visible success. The evidence visual and decision matrix are localized and readable on desktop and 390 px mobile, with the final runtime column explicitly reachable by horizontal scroll.
"""
              review.write_text(text.rstrip() + '\n' + entry, encoding='utf-8')
          PY

      - name: Revalidate chapter 6 source contract
        run: node scripts/validate_voice_evaluation_observability_ch6_source.mjs

      - name: Validate scope and persist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' '.github/workflows/pr-visual-review.yml' 'locales/en/editorial_review.voice-agents.yml' | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected finalization scope'
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          git config user.name '5sigmas-golden-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr-visual-review.yml locales/en/editorial_review.voice-agents.yml
          git commit -m 'test(voice): certify chapter 6 and persist gates'
          git push origin HEAD:series/realtime-voice-agents-golden
