name: Reconcile organic growth v2

on:
  pull_request:
    paths:
      - '.github/workflows/reconcile-organic-growth-v2.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'reconcile/organic-growth-video-library-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge original PR21 branch with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          if git log --format=%s -n 8 | grep -q '^reconcile: merge organic growth PR21 onto current main$'; then
            echo 'Reconciliation commit already present.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/organic-growth-video-library

          set +e
          git merge --no-ff --no-commit origin/agent/organic-growth-video-library
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              'docs/assets/javascripts/reader-navigation.js'
              'docs/stylesheets/voice-report-animations-polish.css'
              'hooks/direct_reader_navigation.py'
              'mkdocs.yml'
              'requirements.txt'
              'scripts/capture_site_screenshots.mjs'
              'scripts/validate_direct_reader_navigation.mjs'
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo 'Unexpected conflict set; refusing automatic resolution.'
              printf 'actual: %s\n' "${conflicts[@]}"
              exit 1
            fi

            git checkout --ours \
              docs/assets/javascripts/reader-navigation.js \
              docs/stylesheets/voice-report-animations-polish.css \
              scripts/capture_site_screenshots.mjs \
              scripts/validate_direct_reader_navigation.mjs

            git checkout --theirs \
              hooks/direct_reader_navigation.py \
              mkdocs.yml \
              requirements.txt
          fi

          python - <<'PY'
          from pathlib import Path

          mkdocs = Path('mkdocs.yml')
          text = mkdocs.read_text(encoding='utf-8')
          security_block = '''      - Seguridad en IA:\n          - Presentación: series/seguridad-ia/00_presentacion_serie.md\n          - Prompt injection: series/seguridad-ia/01-prompt-injection.md\n          - Jailbreaks: series/seguridad-ia/02-jailbreaks.md\n          - Envenenamiento: series/seguridad-ia/03-envenenamiento.md\n          - Red-teaming: series/seguridad-ia/04-red-teaming.md\n          - Controles de producción: series/seguridad-ia/05-controles-produccion.md\n'''
          anchor = '''      - Datacenters en el espacio:\n          - Presentación: series/datacenters-espacio/00_presentacion_serie.md\n          - Por qué ahora: series/datacenters-espacio/01-por-que-ahora.md\n          - Energía, calor y conectividad: series/datacenters-espacio/02-energia-calor-conectividad.md\n          - Qué es un datacenter espacial: series/datacenters-espacio/03-que-es-datacenter-espacio.md\n          - La huella real de un datacenter: series/datacenters-espacio/04-huella-real-datacenter.md\n'''
          if '      - Seguridad en IA:' not in text:
              if anchor not in text:
                  raise SystemExit('Datacenters nav anchor missing')
              text = text.replace(anchor, anchor + security_block, 1)
          text = text.replace('  series/seguridad-ia/**\n', '')
          text = text.replace('  snippets/seguridad-ia/**\n', '')
          mkdocs.write_text(text, encoding='utf-8')

          for filename in ('scripts/capture_site_screenshots.mjs', 'scripts/validate_direct_reader_navigation.mjs'):
              path = Path(filename)
              body = path.read_text(encoding='utf-8')
              if 'const expectedCollections = 8;' not in body:
                  raise SystemExit(f'{filename}: expected collection constant missing')
              body = body.replace('const expectedCollections = 8;', 'const expectedCollections = 9;', 1)
              path.write_text(body, encoding='utf-8')

          path = Path('scripts/validate_direct_reader_navigation.mjs')
          body = path.read_text(encoding='utf-8')
          needle = "  let dialog = await openFullLibrary(desktop, contextual.browse);\n"
          probe = """  const librarySearch = dialog.locator('[data-s5-reader-search]');\n  await librarySearch.fill('qué es un llm');\n  if (await dialog.locator('a[href=\"/temas/llms/\"]:visible').count() !== 1) {\n    throw new Error('Conceptos is missing from the unified reader library.');\n  }\n  await librarySearch.fill('prompt injection');\n  if (await dialog.locator('a[href=\"/series/seguridad-ia/01-prompt-injection/\"]:visible').count() !== 1) {\n    throw new Error('Seguridad en IA is missing from the unified reader library.');\n  }\n  await librarySearch.fill('');\n"""
          if 'Conceptos is missing from the unified reader library.' not in body:
              if needle not in body:
                  raise SystemExit('reader validation insertion point missing')
              body = body.replace(needle, needle + probe, 1)
          path.write_text(body, encoding='utf-8')
          PY

          # GitHub Actions tokens cannot push workflow mutations. Keep the branch's
          # current workflows untouched; reviewed workflow changes are applied via
          # the GitHub connector after this content merge lands on the PR branch.
          git restore --source=HEAD --staged --worktree .github/workflows

          git add -A
          git diff --cached --check
          git commit -m 'reconcile: merge organic growth PR21 onto current main'
          git push origin HEAD:${GITHUB_HEAD_REF}
