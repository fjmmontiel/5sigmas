name: Series 5 chapter 5.4 integration one-shot

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-ch4-integrate-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify expected parent
        shell: bash
        run: |
          set -euo pipefail
          expected='668e35a974e36ea45cd9e18f67426f5ae7f12aa9'
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "Unexpected parent: $actual"; exit 1; }

      - name: Wire chapter 5.4 into canonical publication surfaces
        shell: python
        run: |
          from pathlib import Path

          route = 'series/evaluating-ai-systems-production/04-evaluacion-trayectorias-agentes-tools-exito-eficiencia-recuperacion-policy.md'
          visual = 'snippets/articulos-tecnicos/eval-agent-tool-trajectory-success-recovery-policy.html'

          def insert_after(path, anchor, addition, forbidden):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if forbidden in text:
                  raise SystemExit(f'{path}: target already present; refusing duplicate write')
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {text.count(anchor)}')
              p.write_text(text.replace(anchor, anchor + addition), encoding='utf-8')

          insert_after(
              'mkdocs.yml',
              '          - "LLM-as-judge y evaluación humana: calibración, sesgo, varianza y acuerdo": series/evaluating-ai-systems-production/03-llm-as-judge-evaluacion-humana-calibracion-sesgo-varianza-acuerdo.md\n',
              '          - "Evaluación de trayectorias de agentes y tools: éxito, eficiencia, recuperación y cumplimiento de política": ' + route + '\n',
              route,
          )
          insert_after(
              'mkdocs.en.yml',
              '          - "LLM-as-judge and human evaluation: calibration, bias, variance, and agreement": series/evaluating-ai-systems-production/03-llm-as-judge-evaluacion-humana-calibracion-sesgo-varianza-acuerdo.md\n',
              '          - "Evaluating agent and tool trajectories: success, efficiency, recovery, and policy compliance": ' + route + '\n',
              route,
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - series/evaluating-ai-systems-production/03-llm-as-judge-evaluacion-humana-calibracion-sesgo-varianza-acuerdo.md\n',
              '  - ' + route + '\n',
              route,
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/eval-judge-calibration-bias-agreement.html\n',
              '  - ' + visual + '\n',
              visual,
          )

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic Series 5 source gates
        run: |
          node scripts/validate_ai_systems_eval_ch1_source.mjs
          node scripts/validate_ai_systems_eval_ch2_source.mjs
          node scripts/validate_ai_systems_eval_ch3_source.mjs
          node scripts/validate_ai_systems_eval_ch4_source.mjs

      - name: Commit exact integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/series5-ch4-integrate-once.yml
          git add mkdocs.yml mkdocs.en.yml locales/en/manifest.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'integrate(series5): wire chapter 5.4 publication surfaces'
          git push origin HEAD:series/evaluating-ai-systems-production-golden
