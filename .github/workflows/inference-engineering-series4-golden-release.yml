name: Inference Engineering Series 4 GOLDEN release certification
# release-contract-revision: 4

on:
  push:
    branches:
      - series/llm-inference-engineering-economics-golden
    paths:
      - '.github/workflows/inference-engineering-series4-golden-release.yml'

permissions:
  contents: read

jobs:
  certify-series:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert current main is an ancestor and checkout is exact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          echo "SERIES_CERTIFICATION_SHA=$(git rev-parse HEAD)"
          test -z "$(git status --short --untracked-files=no)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Validate Series 4 deterministic inventory and publication surfaces
        run: node scripts/validate_inference_engineering_series4_release.mjs

      - name: Validate all Series 4 source contracts
        run: |
          node scripts/validate_inference_engineering_ch1_source.mjs
          node scripts/validate_inference_engineering_ch2_source.mjs
          node scripts/validate_inference_engineering_ch3_source.mjs
          node scripts/validate_inference_engineering_ch4_source.mjs
          node scripts/validate_inference_engineering_ch5_source.mjs
          node scripts/validate_inference_engineering_ch6_source.mjs

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Validate public-series publication contract against rendered site
        run: python scripts/audit_publication_contract.py

      - name: Prepare and audit English source
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-series4-release-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-series4-release-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-series4-release-preview.log
          exit 1

      - name: Audit browser resources, bilingual hub and locale progression
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_series_mirror.mjs
          node scripts/validate_locale_switching.mjs

      - name: Re-run all Series 4 geometry, accessibility and responsive gates
        run: |
          node scripts/validate_inference_engineering_ch1_accessibility.mjs
          node scripts/validate_inference_engineering_ch2_accessibility.mjs
          node scripts/validate_inference_engineering_ch3_accessibility.mjs
          node scripts/validate_inference_engineering_ch4_accessibility.mjs
          node scripts/validate_inference_engineering_ch5_accessibility.mjs
          node scripts/validate_inference_engineering_ch6_accessibility.mjs

      - name: Validate reader navigation and responsive shell
        run: |
          node scripts/validate_direct_reader_navigation.mjs
          node scripts/validate_reader_header_overlap.mjs
          node scripts/validate_responsive_polish.mjs

      - name: Capture strongest-series comparison evidence
        shell: bash
        run: |
          mkdir -p artifacts/visual-review
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const targets = [
            ['series4-ch1','/series/llm-inference-engineering-economics/01-prefill-vs-decode-ttft-tpot-throughput-latency-budget/'],
            ['series4-ch6','/series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints/'],
            ['series3-ch1','/series/context-engineering-memory-mcp/01-context-engineering-vs-prompt-engineering/'],
            ['series3-ch6','/series/context-engineering-memory-mcp/06-skills-plugins-subagents-hooks-context-isolation-evaluation/'],
          ];
          for (const [name,targetPath] of targets) {
            for (const [vp,w,h] of [['desktop',1440,1000],['mobile',390,844]]) {
              const page = await browser.newPage({viewport:{width:w,height:h}});
              const response = await page.goto(`http://127.0.0.1:8000${targetPath}`,{waitUntil:'networkidle'});
              if (!response || !response.ok()) throw new Error(`${name} ${vp} failed: ${response?.status()}`);
              await page.screenshot({path:`artifacts/visual-review/series4-comparison-${name}-${vp}.png`,fullPage:true,animations:'disabled'});
              await page.close();
            }
          }
          await browser.close();
          NODE

      - name: Record exact release identities
        shell: bash
        run: |
          mkdir -p artifacts/visual-review
          {
            echo "certified_sha=$(git rev-parse HEAD)"
            echo "main_sha=$(git rev-parse origin/main)"
            echo "tree_sha=$(git rev-parse HEAD^{tree})"
            echo "release_validator_blob=$(git hash-object scripts/validate_inference_engineering_series4_release.mjs)"
            echo "permanent_workflow_blob=$(git hash-object .github/workflows/series4-golden-review.yml)"
            echo "live_workflow_blob=$(git hash-object .github/workflows/inference-engineering-live-qa.yml)"
            echo "series_hub_es_blob=$(git hash-object docs/series/index.md)"
            echo "series_hub_en_blob=$(git hash-object locales/en/series/index.md)"
            echo "locale_switch_validator_blob=$(git hash-object scripts/validate_locale_switching.mjs)"
            echo "english_series_mirror_validator_blob=$(git hash-object scripts/validate_english_series_mirror.mjs)"
            for f in docs/series/llm-inference-engineering-economics/*.md; do echo "es_blob[$f]=$(git hash-object "$f")"; done
            for f in locales/en/series/llm-inference-engineering-economics/*.md; do echo "en_blob[$f]=$(git hash-object "$f")"; done
            for f in docs/snippets/articulos-tecnicos/inference-*.html; do echo "visual_blob[$f]=$(git hash-object "$f")"; done
          } | tee artifacts/visual-review/inference-engineering-series4-identities.txt

      - name: Re-assert exact SHA and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/series/llm-inference-engineering-economics-golden | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          echo "SERIES_CERTIFICATION_SHA=$(git rev-parse HEAD)"
          git status --short
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload complete Series 4 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-engineering-series4-golden-evidence
          path: |
            artifacts/visual-review/inference-engineering-*.png
            artifacts/visual-review/inference-engineering-series4-inventory.json
            artifacts/visual-review/inference-engineering-series4-identities.txt
            artifacts/visual-review/english-series-mirror-*.png
            artifacts/visual-review/series4-comparison-*.png
          if-no-files-found: warn
          retention-days: 2
