name: One-shot inference Ch6 media repair

on:
  push:
    branches: [quality/llm-inference-requalification]
    paths:
      - 'scripts/repair_inference_ch6_visual_media.py'
      - '.github/workflows/inference-ch6-media-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality/llm-inference-requalification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install Pillow PyYAML
      - name: Regenerate Chapter 6 visual media
        run: python scripts/repair_inference_ch6_visual_media.py --write
      - name: Commit repaired binaries and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.{jpg,mp4}
          git add locales/en/series/llm-inference-engineering-economics/06-benchmarking-inference-cost-task-throughput-latency-energy-hardware-constraints.{jpg,mp4}
          git rm .github/workflows/inference-ch6-media-repair.yml
          git commit -m 'fix(golden): repair Chapter 6 mobile video labels'
          git push origin HEAD:quality/llm-inference-requalification
