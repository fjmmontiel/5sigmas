name: Temporary patch · editorial reader v3 iteration

on:
  push:
    branches:
      - redesign/reader-editorial-v3

permissions:
  contents: write

jobs:
  apply-iteration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/reader-editorial-v3
          fetch-depth: 0

      - name: Apply interaction, header and QA refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('docs/assets/javascripts/reader-navigation.js')
          js = js_path.read_text(encoding='utf-8')
          normalize_block = """  const normalize = (value) => String(value || '')
            .normalize('NFD')
            .replace(/[\\u0300-\\u036f]/g, '')
            .toLowerCase()
            .trim();
          """
          matches_block = normalize_block + """

            const matchesQuery = (value, query) => {
              const haystack = normalize(value);
              const tokens = normalize(query).split(/\\s+/).filter(Boolean);
              return tokens.length > 0 && tokens.every((token) => haystack.includes(token));
            };
          """
          if 'const matchesQuery' not in js:
              if normalize_block not in js:
                  raise SystemExit('reader navigation normalize block not found')
              js = js.replace(normalize_block, matches_block, 1)
          js = js.replace(
              "const tabMatches = normalize(tab.dataset.search || tab.textContent).includes(query);",
              "const tabMatches = matchesQuery(tab.dataset.search || tab.textContent, query);",
          )
          js = js.replace(
              "const matches = tabMatches || normalize(entry.dataset.search || entry.textContent).includes(query);",
              "const matches = tabMatches || matchesQuery(entry.dataset.search || entry.textContent, query);",
          )
          js_path.write_text(js, encoding='utf-8')

          fixes = Path('docs/stylesheets/reader-editorial-v3-iteration.css')
          fixes.write_text("""/* Iteration refinements kept separate while the reader is under review. */
          @media (min-width: 1320px) {
            body:has(.s5-reader-shell) .md-header {
              z-index: 5;
            }

            body:has(.s5-reader-shell) .md-tabs {
              z-index: 6;
            }
          }
          """, encoding='utf-8')

          css_path = Path('docs/stylesheets/reader-editorial-v3.css')
          css = css_path.read_text(encoding='utf-8')
          import_line = '@import url("reader-editorial-v3-iteration.css");\n\n'
          if not css.startswith(import_line):
              css_path.write_text(import_line + css, encoding='utf-8')

          workflow_path = Path('.github/workflows/temp-reader-v3-review.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace('geometry.navigator?.height > 52', 'geometry.navigator?.height > 58')
          workflow = workflow.replace('geometry.firstParagraph.width < 700 || geometry.firstParagraph.width > 790', 'geometry.firstParagraph.width < 800 || geometry.firstParagraph.width > 1020')
          workflow = workflow.replace('geometry.firstLead.width > 890', 'geometry.firstLead.width > 940')

          dump_step = """
                - name: Dump the presentation-page content outline
                  shell: bash
                  run: |
                    cat > dump-reader-outline.mjs <<'JS'
                    import { chromium } from 'playwright';
                    import fs from 'node:fs/promises';

                    const browser = await chromium.launch({ headless: true });
                    const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
                    await page.goto('http://127.0.0.1:8000/series/from-cave-to-agi/00_presentacion_serie/', { waitUntil: 'networkidle' });
                    await page.evaluate(() => document.fonts.ready);
                    const outline = await page.locator('.md-typeset').evaluate((root) => [...root.children].map((node, index) => ({
                      index,
                      tag: node.tagName,
                      className: node.className || '',
                      id: node.id || '',
                      text: (node.textContent || '').replace(/\\s+/g, ' ').trim().slice(0, 180),
                      html: node.outerHTML.slice(0, 900),
                    })));
                    await fs.writeFile('artifacts/reader-v3-review/series-presentation-outline.json', JSON.stringify(outline, null, 2));
                    await browser.close();
                    JS
                    node dump-reader-outline.mjs
          """
          marker = '      - name: Validate direct navigation contract\n'
          if 'Dump the presentation-page content outline' not in workflow:
              if marker not in workflow:
                  raise SystemExit('reader review validation marker not found')
              workflow = workflow.replace(marker, dump_step + '\n' + marker, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Commit iteration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/assets/javascripts/reader-navigation.js \
            docs/stylesheets/reader-editorial-v3.css \
            docs/stylesheets/reader-editorial-v3-iteration.css \
            .github/workflows/temp-reader-v3-review.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Refine reader search, global navigation and visual QA"
            git push origin HEAD:redesign/reader-editorial-v3
          fi
