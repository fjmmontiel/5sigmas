name: Temporary patch · editorial reader v3 iteration

on:
  push:
    branches:
      - redesign/reader-editorial-v3

permissions:
  contents: write

jobs:
  apply-iteration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/reader-editorial-v3
          fetch-depth: 0

      - name: Apply final header and regression-script refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('docs/stylesheets/reader-editorial-v3-iteration.css')
          css = css_path.read_text(encoding='utf-8')
          marker = """  body:has(.s5-reader-shell) .md-tabs__link {
            position: relative;
            color: var(--s5-muted) !important;
          }
          """
          replacement = """  body:has(.s5-reader-shell) .md-tabs__list {
            align-items: center !important;
          }

          body:has(.s5-reader-shell) .md-tabs__item {
            align-items: center !important;
            height: 100% !important;
            padding-right: .95rem !important;
          }

          body:has(.s5-reader-shell) .md-tabs__link {
            position: relative;
            align-items: center !important;
            justify-content: center !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 1px 0 0 !important;
            color: var(--s5-muted) !important;
            font-size: .64rem !important;
            font-weight: 660 !important;
            letter-spacing: 0 !important;
            line-height: 1 !important;
          }
          """
          if marker not in css:
              raise SystemExit('desktop global navigation marker not found')
          css_path.write_text(css.replace(marker, replacement, 1), encoding='utf-8')

          capture_path = Path('scripts/capture_site_screenshots.mjs')
          capture = capture_path.read_text(encoding='utf-8')
          capture = capture.replace(
              "{ name: 'reader-rail-desktop', path: articlePath, viewport: desktop, selector: '.s5-reader-shell' },",
              "{ name: 'reader-rail-desktop', path: articlePath, viewport: desktop, selector: '.s5-reader-direct' },",
          )
          capture = capture.replace(
              "{ name: 'reader-rail-mobile', path: articlePath, viewport: mobile, mobile: true, selector: '.s5-reader-shell' },",
              "{ name: 'reader-rail-mobile', path: articlePath, viewport: mobile, mobile: true, selector: '.s5-reader-topbar' },",
          )
          old_open = """const openReaderSurface = async (page) => {
            const courseButton = page.locator('.s5-reader-course[data-s5-reader-open]');
            if (await courseButton.isVisible()) {
              await courseButton.click();
              await page.locator('[data-s5-reader-library][open]').waitFor();
              return 'map';
            }

            const drawerToggle = page.locator('[data-s5-reader-direct-open]');
            await drawerToggle.click();
            await page.locator('[data-s5-reader-direct].is-open').waitFor();
            return 'library';
          };
          """
          new_open = """const openReaderSurface = async (page) => {
            const fullLibraryTrigger = page.locator('[data-s5-reader-open]:visible').first();
            if (await fullLibraryTrigger.count()) {
              await fullLibraryTrigger.click();
              await page.locator('[data-s5-reader-library][open]').waitFor();
              return 'map';
            }

            const drawerToggle = page.locator('[data-s5-reader-direct-open]:visible').first();
            await drawerToggle.click();
            await page.locator('[data-s5-reader-direct].is-open').waitFor();
            return 'library';
          };
          """
          if old_open not in capture:
              raise SystemExit('openReaderSurface block not found')
          capture_path.write_text(capture.replace(old_open, new_open, 1), encoding='utf-8')
          PY

      - name: Commit refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/stylesheets/reader-editorial-v3-iteration.css \
            scripts/capture_site_screenshots.mjs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Polish the global reader header and visual regressions"
            git push origin HEAD:redesign/reader-editorial-v3
          fi
