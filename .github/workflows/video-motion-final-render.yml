name: Video motion final render

on:
  push:
    branches:
      - migration/video-golden-modelos-razonadores
    paths:
      - 'motion/content/modelos-razonadores/**'
      - 'motion/src/**'
      - 'motion/theme/**'
      - 'motion/scripts/render.py'
      - '.github/workflows/video-motion-final-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        spec:
          - 00-presentacion.es
          - 00-presentacion.en
          - 01-que-es-razonar.es
          - 01-que-es-razonar.en
          - 02-fallos.es
          - 02-fallos.en
          - 03-test-time-compute.es
          - 03-test-time-compute.en
          - 04-latencia-streaming.es
          - 04-latencia-streaming.en
          - 05-riesgos.es
          - 05-riesgos.en
        orientation: [horizontal, vertical]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies and required fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-noto-extra
          fc-cache -f
          python -m pip install -r motion/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render deterministic 60 fps media
        working-directory: motion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          extra=()
          if [ "${{ matrix.orientation }}" = vertical ]; then extra+=(--portrait); fi
          python scripts/render.py "content/modelos-razonadores/${{ matrix.spec }}.json" --out dist --fps 60 "${extra[@]}"
          test -s dist/*.mp4
          test -s dist/*-validation.json
          test -s dist/*-chapters.json
          test -s dist/*-transcript.md
          test -s dist/*-captions.vtt
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate -show_entries format=duration -of json dist/*.mp4 > dist/ffprobe.json
      - name: Upload final review media
        uses: actions/upload-artifact@v4
        with:
          name: motion-final-${{ matrix.spec }}-${{ matrix.orientation }}
          path: motion/dist/
          if-no-files-found: error
          retention-days: 7
