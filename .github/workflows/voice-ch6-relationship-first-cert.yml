name: Voice chapter 6 relationship-first certification

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch6-relationship-first-cert.yml'

permissions:
  contents: write
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fix desktop visual reachability and harden the gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          visual_path = Path('docs/snippets/articulos-tecnicos/voice-turn-evidence-stack.html')
          visual = visual_path.read_text(encoding='utf-8')
          edits = [
            (
              'display:grid;margin:28px auto 34px;max-width:1380px',
              'display:grid;position:relative;left:50%;width:min(1160px,calc(100vw - 180px));max-width:none;margin:28px 0 34px;transform:translateX(-50%)',
            ),
            (
              '.s5v-turn-evidence-graph__svg{display:block;width:100%;min-width:1020px;height:auto;overflow:visible}',
              '.s5v-turn-evidence-graph__svg{display:block;width:100%;min-width:0;height:auto;overflow:visible}',
            ),
            (
              '@media(max-width:720px){.s5v-turn-evidence-graph__sheet',
              '@media(max-width:720px){.s5v-turn-evidence-graph{left:auto;width:100%;max-width:100%;margin:28px auto 34px;transform:none}.s5v-turn-evidence-graph__sheet',
            ),
          ]
          for old, new in edits:
              if visual.count(old) != 1:
                  raise SystemExit(f'visual patch drift: expected one {old!r}, found {visual.count(old)}')
              visual = visual.replace(old, new)
          visual_path.write_text(visual, encoding='utf-8')

          payload = visual.encode('utf-8')
          blob_sha = hashlib.sha1(f'blob {len(payload)}\0'.encode() + payload).hexdigest()
          i18n_path = Path('locales/en/snippets/articulos-tecnicos/voice-turn-evidence-stack.i18n.json')
          i18n = json.loads(i18n_path.read_text(encoding='utf-8'))
          i18n['source_blob_sha'] = blob_sha
          i18n_path.write_text(json.dumps(i18n, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gate_path = Path('scripts/validate_voice_evaluation_observability_ch6_accessibility.mjs')
          gate = gate_path.read_text(encoding='utf-8')
          needle = "        check(scrollState.focusable === true, `${testCase.route}: ${viewport.name} graph scroller is not keyboard-focusable`);\n        if (viewport.name === 'mobile') {"
          replacement = "        check(scrollState.focusable === true, `${testCase.route}: ${viewport.name} graph scroller is not keyboard-focusable`);\n        if (viewport.name === 'desktop') {\n          check(scrollState.maxScroll <= 2, `${testCase.route}: desktop evidence graph still clips behind an internal horizontal scroll (${JSON.stringify(scrollState)})`);\n          check(scrollState.diagnosisReachable === true, `${testCase.route}: desktop diagnosis bundle is not fully visible without scrolling (${JSON.stringify(scrollState)})`);\n        }\n        if (viewport.name === 'mobile') {"
          if gate.count(needle) != 1:
              raise SystemExit(f'gate patch drift: expected one insertion point, found {gate.count(needle)}')
          gate_path.write_text(gate.replace(needle, replacement), encoding='utf-8')
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate chapter 2 source contract
        run: node scripts/validate_voice_turn_taking_ch2_source.mjs
      - name: Validate chapter 3 source contract
        run: node scripts/validate_voice_latency_ch3_source.mjs
      - name: Validate chapter 4 source contract
        run: node scripts/validate_voice_tools_state_ch4_source.mjs
      - name: Validate chapter 5 source contract
        run: node scripts/validate_voice_network_telephony_ch5_source.mjs
      - name: Validate chapter 6 source and relationship contract
        run: node scripts/validate_voice_evaluation_observability_ch6_source.mjs

      - name: Build Spanish strictly
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build --clean --strict
      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en
      - name: Audit English source
        run: python scripts/audit_locale.py --locale en
      - name: Build English strictly
        env:
          S5_LOCALE: en
          DISABLE_MKDOCS_2_WARNING: 'true'
        run: mkdocs build -f mkdocs.en.yml --clean --strict
      - name: Audit rendered English
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/voice-ch6-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/series/agentes-voz-tiempo-real/06-evaluacion-observabilidad-reliability/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/voice-ch6-preview.log
          exit 1

      - name: Regress chapter 1 end-to-end
        run: node scripts/validate_voice_architecture_ch1.mjs
      - name: Audit browser resources
        run: node scripts/audit_browser_resources.mjs
      - name: Validate English series mirror
        run: node scripts/validate_english_series_mirror.mjs
      - name: Validate locale switching
        run: node scripts/validate_locale_switching.mjs
      - name: Regress chapter 1 accessibility
        run: node scripts/validate_voice_architecture_ch1_accessibility.mjs
      - name: Regress chapter 2 relationship geometry
        run: node scripts/validate_voice_turn_taking_ch2_accessibility.mjs
      - name: Regress chapter 3 relationship geometry
        run: node scripts/validate_voice_latency_ch3_accessibility.mjs
      - name: Regress chapter 4 relationship geometry
        run: node scripts/validate_voice_tools_state_ch4_accessibility.mjs
      - name: Regress chapter 5 relationship geometry
        run: node scripts/validate_voice_network_telephony_ch5_accessibility.mjs
      - name: Validate chapter 6 causal evidence geometry and accessibility
        run: node scripts/validate_voice_evaluation_observability_ch6_accessibility.mjs
      - name: Validate direct reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Commit exact tested visual correction
        shell: bash
        run: |
          git config user.name '5sigmas GOLDEN orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/snippets/articulos-tecnicos/voice-turn-evidence-stack.html locales/en/snippets/articulos-tecnicos/voice-turn-evidence-stack.i18n.json scripts/validate_voice_evaluation_observability_ch6_accessibility.mjs
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'fix(voice): keep chapter 6 diagnosis visible on desktop'
          git push origin HEAD:series/realtime-voice-agents-golden
          echo "CERTIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload chapter 6 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: voice-ch6-relationship-first-review
          path: artifacts/visual-review/voice-eval-ch6-*.png
          if-no-files-found: error
          retention-days: 2
      - name: Report certified SHA
        run: echo "Certified and pushed $CERTIFIED_SHA"
