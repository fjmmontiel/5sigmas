name: Validate and deploy 5sigmas remote MCP

on:
  pull_request:
    paths:
      - 'mcp-worker/**'
      - 'docs/robots.txt'
      - '.github/workflows/deploy-mcp-worker.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-worker/**'
      - 'docs/robots.txt'
      - '.github/workflows/deploy-mcp-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mcp-worker
            docs/robots.txt
            scripts/verify_ai_discovery_live.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned MCP and Workers dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit-test search, fetch and AI crawler policy
        run: npm test

      - name: Build Worker without publishing
        run: npm run deploy:dry

      - name: Verify current production AI discovery surfaces
        run: python3 ../scripts/verify_ai_discovery_live.py --origin https://5sigmas.com

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mcp-worker
            docs/robots.txt
            scripts/verify_ai_discovery_live.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned MCP and Workers dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error title=Missing Cloudflare API token::Add repository secret CLOUDFLARE_API_TOKEN with permission to create/deploy Workers and write the 5sigmas.com Worker route."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error title=Missing Cloudflare account ID::Add repository secret CLOUDFLARE_ACCOUNT_ID (preferred) or R2_ACCOUNT_ID."
            exit 1
          }

      - name: Deploy Streamable HTTP MCP Worker
        run: npm run deploy

      - name: Verify live MCP with the official MCP client
        run: |
          for attempt in {1..12}; do
            if npm run verify:live -- https://5sigmas.com/mcp; then
              exit 0
            fi
            sleep 5
          done
          exit 1
