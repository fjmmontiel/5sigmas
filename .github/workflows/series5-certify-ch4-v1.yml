name: Series 5 certify chapter 5.4

on:
  push:
    branches:
      - series/evaluating-ai-systems-production-golden
    paths:
      - '.github/workflows/series5-certify-ch4-v1.yml'

permissions:
  contents: read

jobs:
  certify-ch4:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify certification lineage
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='1c3a929c0266e2b8f0c4764d6ce0a2654a6501a9'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || { echo "Unexpected certification parent: $actual_parent"; exit 1; }
          echo "CERTIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Series 5 source contracts 5.1-5.4
        run: |
          node scripts/validate_ai_systems_eval_ch1_source.mjs
          node scripts/validate_ai_systems_eval_ch2_source.mjs
          node scripts/validate_ai_systems_eval_ch3_source.mjs
          node scripts/validate_ai_systems_eval_ch4_source.mjs

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Audit public-series publication contract
        run: python scripts/audit_publication_contract.py

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-series5-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-series5-preview.log
          exit 1

      - name: Audit browser resources, bilingual hub and locale parity
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_series_mirror.mjs
          node scripts/validate_locale_switching.mjs

      - name: Validate Series 5 relationship geometry and accessibility 5.1-5.4
        run: |
          node scripts/validate_ai_systems_eval_ch1_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch2_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch3_accessibility.mjs
          node scripts/validate_ai_systems_eval_ch4_accessibility.mjs

      - name: Validate reader navigation and responsive shell
        run: |
          node scripts/validate_direct_reader_navigation.mjs
          node scripts/validate_reader_header_overlap.mjs
          node scripts/validate_responsive_polish.mjs

      - name: Record exact certification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/visual-review
          {
            echo "certified_sha=$(git rev-parse HEAD)"
            echo "parent_sha=$(git rev-parse HEAD^)"
            echo "es_blob=$(git hash-object docs/series/evaluating-ai-systems-production/04-evaluacion-trayectorias-agentes-tools-exito-eficiencia-recuperacion-policy.md)"
            echo "en_blob=$(git hash-object locales/en/series/evaluating-ai-systems-production/04-evaluacion-trayectorias-agentes-tools-exito-eficiencia-recuperacion-policy.md)"
            echo "visual_blob=$(git hash-object docs/snippets/articulos-tecnicos/eval-agent-tool-trajectory-success-recovery-policy.html)"
            echo "source_gate_blob=$(git hash-object scripts/validate_ai_systems_eval_ch4_source.mjs)"
            echo "accessibility_gate_blob=$(git hash-object scripts/validate_ai_systems_eval_ch4_accessibility.mjs)"
            echo "mkdocs_es_blob=$(git hash-object mkdocs.yml)"
            echo "mkdocs_en_blob=$(git hash-object mkdocs.en.yml)"
            echo "manifest_en_blob=$(git hash-object locales/en/manifest.yml)"
            find artifacts/visual-review -maxdepth 1 -type f -name 'ai-systems-eval-ch4-*.png' -print0 | sort -z | xargs -0 -r sha256sum
          } > artifacts/visual-review/series5-ch4-certification.txt

      - name: Ensure no tracked source drift during certification
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload chapter 5.4 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-evaluation-ch4-golden-evidence
          path: |
            artifacts/visual-review/ai-systems-eval-ch4-*.png
            artifacts/visual-review/series5-ch4-certification.txt
          if-no-files-found: error
          retention-days: 1
