name: Fix video CTA QA contract

on:
  pull_request:
    paths:
      - '.github/workflows/fix-video-qa-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/media-density-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace arbitrary CTA width threshold with target-size contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_video_library.mjs')
          text = path.read_text(encoding='utf-8')
          old = """      display: style.display,\n      width: node.getBoundingClientRect().width,\n    };\n  });\n  if (ctaState.display === 'none' || ctaState.width < 180) {\n"""
          new = """      display: style.display,\n      width: node.getBoundingClientRect().width,\n      height: node.getBoundingClientRect().height,\n    };\n  });\n  if (ctaState.display === 'none' || ctaState.width < 96 || ctaState.height < 36) {\n"""
          if old not in text:
              raise SystemExit('Expected CTA assertion block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/fix-video-qa-contract.yml
          git config user.name '5sigmas-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate_video_library.mjs
          git commit -m 'Use robust target-size contract for video source CTA'
          git push origin HEAD:${{ github.head_ref }}
