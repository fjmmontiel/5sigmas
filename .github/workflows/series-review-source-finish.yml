name: Series review source finishing (one-off)
on:
  pull_request:
    paths:
      - '.github/workflows/series-review-source-finish.yml'
      - 'scripts/finish_series_review.plan.b64'
permissions:
  contents: write
jobs:
  prepare-commit:
    if: github.repository == 'fjmmontiel/5sigmas' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/series-discovery-review-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply checksum-verified source changes and validate syntax
        run: |
          python - <<'PY'
          import base64, zlib, hashlib, subprocess
          from pathlib import Path
          encoded=Path('scripts/finish_series_review.plan.b64').read_text().replace('PPrDPrDykXd','PPrDykXd')
          content=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(content).hexdigest()=='6e2807880ca72d3831a0ad46608decb8e187da26b2dd8c4480d2ba763a57d5a7'
          Path('scripts/finish_series_review.py').write_bytes(content)
          subprocess.run(['python','scripts/finish_series_review.py'],check=True)
          Path('scripts/finish_series_review.plan.b64').unlink()
          PY
          node --check docs/assets/javascripts/series-experience.js
          node --check scripts/audit_browser_resources.mjs
          python -m py_compile hooks/series_experience.py scripts/capture_series_ui_review.py
          node scripts/test_series_scenes.mjs
      - name: Create reviewed commit object only (never move any branch or deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo='fjmmontiel/5sigmas'; base=os.environ['BASE_SHA']
          modified=['docs/assets/javascripts/series-experience.js','docs/stylesheets/series-experience.css','scripts/capture_series_ui_review.py','scripts/audit_browser_resources.mjs','.github/workflows/series-ui-review.yml','hooks/series_experience.py','scripts/test_series_experience.py']
          removed=['scripts/finish_series_review.plan.b64','.github/workflows/series-review-source-finish.yml']
          observed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert observed==set(modified+removed), sorted(observed)
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          base_commit=api('git/commits/'+base)
          entries=[]
          for name in modified:
              blob=api('git/blobs',{'content':Path(name).read_text(),'encoding':'utf-8'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          entries += [{'path':name,'mode':'100644','type':'blob','sha':None} for name in removed]
          tree=api('git/trees',{'base_tree':base_commit['tree']['sha'],'tree':entries})
          commit=api('git/commits',{'message':'feat(series): finish causal learning scenes, compact mobile discovery and codec-aware evidence','tree':tree['sha'],'parents':[base]})
          print('REVIEW_COMMIT_CREATED='+commit['sha'])
          print(json.dumps({'parent':base,'tree':tree['sha'],'changed':modified,'removed_one_off_transport':removed}))
          PY
