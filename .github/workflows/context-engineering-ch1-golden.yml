name: Context Engineering 3.1 GOLDEN certification

on:
  push:
    branches:
      - series/context-engineering-memory-mcp-golden
    paths:
      - '.github/workflows/context-engineering-ch1-golden.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate chapter source contract
        run: node scripts/validate_context_engineering_ch1_source.mjs

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Prepare and audit English locale sources
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Build English site strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-context-ch1.log 2>&1 &
          echo $! > /tmp/5sigmas-context-ch1.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-context-ch1.log
          exit 1

      - name: Audit browser resources
        run: node scripts/audit_browser_resources.mjs

      - name: Validate English locale in browser
        run: node scripts/validate_english_locale.mjs

      - name: Validate direct reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Validate chapter relationship geometry and accessibility
        run: node scripts/validate_context_engineering_ch1_accessibility.mjs

      - name: Record exact certified SHA
        run: |
          mkdir -p artifacts/context-engineering-ch1-golden
          printf '%s\n' "$GITHUB_SHA" > artifacts/context-engineering-ch1-golden/certified-sha.txt
          cp artifacts/visual-review/context-engineering-ch1-*.png artifacts/context-engineering-ch1-golden/ 2>/dev/null || true
          sha256sum artifacts/context-engineering-ch1-golden/* > artifacts/context-engineering-ch1-golden/SHA256SUMS.txt

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-engineering-ch1-golden-evidence
          path: |
            artifacts/context-engineering-ch1-golden/*
            artifacts/visual-review/context-engineering-ch1-*.png
          if-no-files-found: warn
          retention-days: 3
