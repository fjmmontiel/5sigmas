name: Apply English editorial cleanup

on:
  push:
    branches:
      - agent/en-editorial-naturalness-audit
    paths:
      - 'scripts/fix_english_editorial_followup.py'
      - '.github/workflows/apply-english-editorial-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/en-editorial-naturalness-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependency
        run: pip install pyyaml

      - name: Apply reviewed editorial cleanup
        run: python scripts/fix_english_editorial_followup.py

      - name: Verify hard editorial anti-patterns are gone
        run: python scripts/audit_english_editorial_quality.py --strict

      - name: Commit remediation when needed
        run: |
          if git diff --quiet -- locales/en; then
            echo "No remediation diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/en
          git commit -m "fix(en): normalize editorial list style and translationese"
          git push origin HEAD:agent/en-editorial-naturalness-audit
