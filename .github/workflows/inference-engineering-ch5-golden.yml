name: Inference Engineering 4.5 GOLDEN certification

on:
  push:
    branches:
      - series/llm-inference-engineering-economics-golden
    paths:
      - '.github/workflows/inference-engineering-ch5-golden.yml'

permissions:
  contents: write
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/llm-inference-engineering-economics-golden
          fetch-depth: 0

      - name: Integrate chapter 4.5 into canonical publication surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def add_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if addition in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'anchor missing in {path}: {anchor}')
              p.write_text(text.replace(anchor, anchor + '\n' + addition, 1), encoding='utf-8')

          route = 'series/llm-inference-engineering-economics/05-model-routing-fallback-caching-workload-aware-serving.md'
          add_after(
              'mkdocs.yml',
              '          - Speculative decoding, prefix caching y otras optimizaciones de latencia: series/llm-inference-engineering-economics/04-speculative-decoding-prefix-caching-latency-optimisations.md',
              f'          - Model routing, fallback, caching y serving adaptado al workload: {route}',
          )
          add_after(
              'mkdocs.en.yml',
              '          - Speculative decoding, prefix caching, and other latency optimizations: series/llm-inference-engineering-economics/04-speculative-decoding-prefix-caching-latency-optimisations.md',
              f'          - Model routing, fallback, caching, and workload-aware serving: {route}',
          )
          add_after(
              'locales/en/manifest.yml',
              '  - series/llm-inference-engineering-economics/04-speculative-decoding-prefix-caching-latency-optimisations.md',
              f'  - {route}',
          )
          add_after(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/inference-speculative-prefix-latency.html',
              '  - snippets/articulos-tecnicos/inference-routing-fallback-cache-policy.html',
          )
          PY
          git diff --check
          git config user.name 'fjmmontiel'
          git config user.email '162696664+fjmmontiel@users.noreply.github.com'
          git add mkdocs.yml mkdocs.en.yml locales/en/manifest.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore(series4): integrate chapter 4.5 publication contract'
            git push origin HEAD:series/llm-inference-engineering-economics-golden
          fi
          cert_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/series/llm-inference-engineering-economics-golden | cut -f1)"
          test "$cert_sha" = "$remote_sha"
          echo "CERT_SHA=$cert_sha" >> "$GITHUB_ENV"
          echo "Certified integration head: $cert_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate media declarations, signatures and schema
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Validate Series 4 source contracts 4.1 through 4.5
        run: |
          node scripts/validate_inference_engineering_ch1_source.mjs
          node scripts/validate_inference_engineering_ch2_source.mjs
          node scripts/validate_inference_engineering_ch3_source.mjs
          node scripts/validate_inference_engineering_ch4_source.mjs
          node scripts/validate_inference_engineering_ch5_source.mjs

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Audit public-series publication contract
        run: python scripts/audit_publication_contract.py

      - name: Prepare and audit English source parity
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        shell: bash
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-series4-ch5-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null && curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/5sigmas-series4-ch5-preview.log
          exit 1

      - name: Audit browser resources and locale
        run: |
          node scripts/audit_browser_resources.mjs
          node scripts/validate_english_locale.mjs

      - name: Run Series 4 visual and accessibility regressions 4.1 through 4.5
        run: |
          node scripts/validate_inference_engineering_ch1_accessibility.mjs
          node scripts/validate_inference_engineering_ch2_accessibility.mjs
          node scripts/validate_inference_engineering_ch3_accessibility.mjs
          node scripts/validate_inference_engineering_ch4_accessibility.mjs
          node scripts/validate_inference_engineering_ch5_accessibility.mjs

      - name: Validate direct reader navigation
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Record exact certification evidence
        shell: bash
        run: |
          mkdir -p artifacts/visual-review
          current_sha="$(git rev-parse HEAD)"
          test "$current_sha" = "$CERT_SHA"
          remote_sha="$(git ls-remote origin refs/heads/series/llm-inference-engineering-economics-golden | cut -f1)"
          test "$current_sha" = "$remote_sha"
          {
            echo "certified_sha=$current_sha"
            echo "es_blob=$(git hash-object docs/series/llm-inference-engineering-economics/05-model-routing-fallback-caching-workload-aware-serving.md)"
            echo "en_blob=$(git hash-object locales/en/series/llm-inference-engineering-economics/05-model-routing-fallback-caching-workload-aware-serving.md)"
            echo "visual_blob=$(git hash-object docs/snippets/articulos-tecnicos/inference-routing-fallback-cache-policy.html)"
          } | tee artifacts/visual-review/inference-engineering-ch5-certification.txt

      - name: Upload chapter 4.5 GOLDEN visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-engineering-ch5-golden-evidence
          path: |
            artifacts/visual-review/inference-engineering-ch5-*.png
            artifacts/visual-review/inference-engineering-ch5-certification.txt
          if-no-files-found: warn
          retention-days: 5
