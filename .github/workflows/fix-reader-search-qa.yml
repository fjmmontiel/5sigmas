name: Fix reader search QA

on:
  pull_request:
    paths:
      - '.github/workflows/fix-reader-search-qa.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/media-density-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate ambiguous search through collection selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_direct_reader_navigation.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  await librarySearch.fill('prompt injection');
  if (await dialog.locator('a[href="/series/seguridad-ia/01-prompt-injection/"]:visible').count() !== 1) {
    throw new Error('Seguridad en IA is missing from the unified reader library.');
  }
'''
          new = '''  await librarySearch.fill('prompt injection');
  const securityTab = dialog.locator('[data-s5-series-tab]').filter({ hasText: 'Seguridad en IA' });
  if (await securityTab.count() !== 1 || !await securityTab.isVisible()) {
    throw new Error('Seguridad en IA is not discoverable for the prompt injection query.');
  }
  await securityTab.click();
  if (await dialog.locator('a[href="/series/seguridad-ia/01-prompt-injection/"]:visible').count() !== 1) {
    throw new Error('Prompt injection is missing after selecting Seguridad en IA.');
  }
'''
          if old not in text:
              raise SystemExit('Expected reader search assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit search QA correction
        run: |
          git config user.name '5sigmas-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/validate_direct_reader_navigation.mjs
          git commit -m 'Validate ambiguous reader search across matching collections'
          git push origin HEAD:${{ github.head_ref }}
