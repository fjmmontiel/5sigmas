name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install mkdocs mkdocs-material; fi

      - name: Validate video media declarations
        run: python scripts/prepare_video_media.py --check

      - name: Build Spanish site
        env:
          S5_VIDEO_MEDIA_ORIGIN: ${{ vars.S5_VIDEO_MEDIA_ORIGIN }}
        run: mkdocs build --clean --strict

      - name: Audit Spanish video indexing metadata
        run: python scripts/audit_video_indexing.py

      - name: Audit Spanish search foundation
        run: python scripts/audit_multilingual_search_foundation.py

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale into /en
        env:
          S5_LOCALE: en
          S5_VIDEO_MEDIA_ORIGIN: ${{ vars.S5_VIDEO_MEDIA_ORIGIN }}
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Restore reviewed English TTC media
        id: en-ttc-cache
        uses: actions/cache/restore@v4
        with:
          path: .localized-media/en/ttc-v1
          key: s5-en-ttc-4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33

      - name: Seed reviewed English TTC media from verified PR artifact
        if: steps.en-ttc-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: english-ttc-reviewed-seed
          path: .localized-media/en/ttc-v1
          run-id: 31689108864
          github-token: ${{ github.token }}

      - name: Verify and stage reviewed English TTC media
        shell: bash
        run: |
          set -euo pipefail
          media='.localized-media/en/ttc-v1'
          mp4="$media/03-test-time-compute.mp4"
          jpg="$media/03-test-time-compute.jpg"
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  .localized-media/en/ttc-v1/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  .localized-media/en/ttc-v1/03-test-time-compute.jpg' | sha256sum -c -
          test "$(stat -c %s "$mp4")" = '4337214'
          test "$(stat -c %s "$jpg")" = '105949'
          target='site/en/series/modelos-razonadores'
          mkdir -p "$target"
          cp "$mp4" "$target/03-test-time-compute.mp4"
          cp "$jpg" "$target/03-test-time-compute.jpg"

      - name: Save reviewed English TTC media cache
        if: steps.en-ttc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .localized-media/en/ttc-v1
          key: s5-en-ttc-4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  live-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for English TTC deployment
        shell: bash
        run: |
          for attempt in {1..18}; do
            body="$(curl --fail --silent --show-error --location https://5sigmas.com/en/series/modelos-razonadores/03-test-time-compute/ || true)"
            if grep -q 'PRM vs ORM: two ways to reward reasoning' <<< "$body"; then
              echo "Live English TTC release is serving the expected mirror."
              exit 0
            fi
            sleep 5
          done
          echo "English TTC production did not become ready within the validation window."
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Audit live Spanish resources
        env:
          S5_PREVIEW_URL: https://5sigmas.com
        run: node scripts/audit_browser_resources.mjs

      - name: Validate live English locale
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_locale.mjs

      - name: Validate live English SEO and schema
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_seo.mjs

      - name: Validate live English-Spanish homepage parity
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_home_parity.mjs

      - name: Validate live route-equivalent locale switching
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_locale_switching.mjs

      - name: Validate live English series mirror
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_series_mirror.mjs

      - name: Validate live English Data Centers media
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_datacenters_media.mjs

      - name: Validate live English AI Security media
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_security_media.mjs

      - name: Validate live English AI Agents media
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_agents_media.mjs

      - name: Validate live English Technical Articles
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_technical_articles.mjs

      - name: Validate live English Concepts
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
        run: node scripts/validate_english_concepts.mjs

      - name: Validate live English Test-Time Compute
        env:
          S5_PREVIEW_BASE: https://5sigmas.com
          S5_REQUIRE_EN_TTC_MEDIA: '1'
        run: node scripts/validate_english_reasoning_ttc.mjs

      - name: Upload live English screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5sigmas-en-live-qa
          path: artifacts/visual-review/english-*.png
          if-no-files-found: warn
          retention-days: 14
