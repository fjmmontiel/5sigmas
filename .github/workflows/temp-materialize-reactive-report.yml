name: Temporary materialization · reactive voice report

on:
  push:
    branches:
      - feature/adding-technical-report-reactive-proactive-voice

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adding-technical-report-reactive-proactive-voice
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize report files
        run: python scripts/apply_voice_report_patch.py

      - name: Update technical collection navigation validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_direct_reader_navigation.mjs')
          text = path.read_text(encoding='utf-8')

          continuation = """const assertCollectionContinuation = async (page, { nextHref, label }) => {
            const nextArrow = page.locator('.s5-reader-topbar .s5-reader-arrow--next');
            if (await nextArrow.evaluate((node) => node.classList.contains('is-disabled'))) {
              throw new Error(`${label} must continue inside the same collection.`);
            }
            if (await nextArrow.getAttribute('href') !== nextHref) {
              throw new Error(`${label} must continue to ${nextHref}.`);
            }
          };

          """
          marker = "await fs.mkdir(outputDir, { recursive: true });"
          if 'const assertCollectionContinuation' not in text:
              text = text.replace(marker, continuation + marker, 1)

          old = """  await desktop.goto(`${baseUrl}/articulos-tecnicos/proactive-reactive-agent-and-tool-calls/`, { waitUntil: 'networkidle' });
            await assertCollectionBoundary(desktop, { completionHref: '/articulos-tecnicos/', label: 'A completed technical collection' });
          """
          new = """  await desktop.goto(`${baseUrl}/articulos-tecnicos/proactive-reactive-agent-and-tool-calls/`, { waitUntil: 'networkidle' });
            await assertCollectionContinuation(desktop, {
              nextHref: '/articulos-tecnicos/reactive-proactive-voice-agents/',
              label: 'The technical collection',
            });

            await desktop.goto(`${baseUrl}/articulos-tecnicos/reactive-proactive-voice-agents/`, { waitUntil: 'networkidle' });
            await assertCollectionBoundary(desktop, { completionHref: '/articulos-tecnicos/', label: 'A completed technical collection' });
          """
          if old not in text:
              raise SystemExit('technical collection assertion block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit materialized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mkdocs.yml \
            docs/articulos-tecnicos \
            docs/snippets/articulos-tecnicos \
            scripts/validate_direct_reader_navigation.mjs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add reactive and proactive voice agents technical report"
            git push origin HEAD:feature/adding-technical-report-reactive-proactive-voice
          fi
