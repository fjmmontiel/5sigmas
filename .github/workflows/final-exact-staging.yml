name: Stage exact approved Foundations F1 and Welfare W1
on:
  push:
    branches: [release/owner-approved-video-batch-20260927]
    paths: [.github/workflows/final-exact-staging.yml]
permissions:
  contents: write
concurrency:
  group: exact-final-f1-w1-20260928
  cancel-in-progress: false
jobs:
  stage:
    if: github.actor == 'fjmmontiel'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .release-media
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot exact public text sources for release and requested animation audit
        run: |
          git fetch --quiet --depth=1 origin release/final-approved-f1-w1-20260928
          test "$(git rev-parse FETCH_HEAD)" = 6209a852b804338e31b95f06bdf604baeb04cf40
          python - <<'PY'
          from pathlib import Path
          import subprocess, json, zipfile, hashlib
          ref='6209a852b804338e31b95f06bdf604baeb04cf40'
          files=subprocess.check_output(['git','ls-tree','-r','--name-only',ref],text=True).splitlines()
          suffixes={'.py','.mjs','.json','.yml','.yaml','.md','.html','.vtt','.sha256','.txt','.sh','.js','.css','.svg','.csv','.toml'}
          paths=[p for p in files if Path(p).suffix in suffixes and not p.startswith('.release-media/')]
          subprocess.run(['git','archive','--format=zip','--output=/tmp/final-pinned-public-sources.zip',ref,'--',*paths],check=True)
          print('Pinned text snapshot:',ref,'files:',len(paths))
          print('SHA256:',hashlib.sha256(Path('/tmp/final-pinned-public-sources.zip').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-pinned-public-sources
          path: /tmp/final-pinned-public-sources.zip
          retention-days: 1
      - name: Install exact media validation dependencies
        run: |
          python -m pip install cryptography
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Receive and validate exact approved originals without merge or deployment
        run: python -u .release-media/final_receive.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-exact-media-evidence
          path: /tmp/final-evidence/*
          if-no-files-found: error
          retention-days: 1
