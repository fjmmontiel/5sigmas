name: Prompt injection taxonomy visual quality

on:
  pull_request:
    paths:
      - 'docs/temas/prompt-injection.md'
      - 'docs/snippets/temas/prompt-injection-taxonomy.html'
      - 'locales/en/temas/prompt-injection.md'
      - 'locales/en/snippets/temas/prompt-injection-taxonomy.html'
      - 'locales/en/snippets/temas/prompt-injection-taxonomy.i18n.json'
      - 'scripts/validate_prompt_injection_taxonomy_visual.mjs'
      - '.github/workflows/topic-prompt-injection-taxonomy-quality.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Build English locale strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-prompt-injection-taxonomy-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/temas/prompt-injection/ > /dev/null && \
            curl --fail --silent http://127.0.0.1:8000/en/temas/prompt-injection/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-prompt-injection-taxonomy-preview.log
          exit 1

      - name: Validate prompt injection taxonomy ES/EN
        run: node scripts/validate_prompt_injection_taxonomy_visual.mjs

      - name: Upload prompt injection taxonomy visual evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-injection-taxonomy-visual-review
          path: artifacts/visual-review/prompt-injection-taxonomy-*.png
          if-no-files-found: warn
          retention-days: 1
