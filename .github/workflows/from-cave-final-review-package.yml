name: From Cave to AGI complete review package

on:
  push:
    branches:
      - migration/video-golden-from-cave-to-agi
    paths:
      - 'motion/migration/from-cave-to-agi-content-v1.json'
      - 'motion/content/from-cave-to-agi/**'
      - 'motion/src/from-cave/**'
      - 'motion/src/render/**'
      - 'motion/web/from-cave-render.html'
      - 'motion/scripts/from_cave_render_check.py'
      - 'motion/scripts/from_cave_render_final.py'
      - 'motion/scripts/from_cave_package_final.py'
      - '.github/workflows/from-cave-final-review-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: from-cave-to-agi-complete-review-package
  cancel-in-progress: false

jobs:
  render:
    name: render-${{ matrix.chapter }}-${{ matrix.locale }}-${{ matrix.orientation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chapter: ['00', '01', '02', '03', '04', '05']
        locale: [es, en]
        orientation: [horizontal, vertical]
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact exporter source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile motion/scripts/from_cave_render_check.py motion/scripts/from_cave_render_final.py motion/scripts/from_cave_package_final.py
          node --check motion/src/from-cave/render.mjs
          node --check motion/src/from-cave/visuals.mjs
          node --check motion/src/from-cave/visuals-motion.mjs
          node --check motion/src/from-cave/visuals-text-layout.mjs

      - name: Install deterministic browser and media dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check playwright pillow
          command -v google-chrome || command -v chromium || command -v chromium-browser
          ffmpeg -version | head -1

      - name: Render and full-decode one native final candidate
        shell: bash
        run: |
          set -euo pipefail
          python motion/scripts/from_cave_render_final.py \
            --chapter '${{ matrix.chapter }}' \
            --locale '${{ matrix.locale }}' \
            --orientation '${{ matrix.orientation }}'
          cat motion/dist/from-cave-to-agi-final/${{ matrix.chapter }}-${{ matrix.locale }}-${{ matrix.orientation }}.json

      - name: Preserve exact candidate and per-output evidence
        uses: actions/upload-artifact@v4
        with:
          name: from-cave-final-${{ matrix.chapter }}-${{ matrix.locale }}-${{ matrix.orientation }}-${{ github.sha }}
          path: |
            motion/dist/from-cave-to-agi-final/${{ matrix.chapter }}-${{ matrix.locale }}-${{ matrix.orientation }}.mp4
            motion/dist/from-cave-to-agi-final/${{ matrix.chapter }}-${{ matrix.locale }}-${{ matrix.orientation }}.json
          if-no-files-found: error
          retention-days: 1

  package:
    name: validate-and-package-24
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore all 24 exact candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: from-cave-final-*-${{ github.sha }}
          path: motion/dist/from-cave-to-agi-final
          merge-multiple: true

      - name: Validate 24/24, ES/EN parity and native H/V parity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile motion/scripts/from_cave_package_final.py
          python motion/scripts/from_cave_package_final.py
          cat motion/dist/from-cave-to-agi-review-package/summary.json

      - name: Preserve complete immutable review candidate package
        uses: actions/upload-artifact@v4
        with:
          name: from-cave-to-agi-complete-review-${{ github.sha }}
          path: motion/dist/from-cave-to-agi-review-package/
          if-no-files-found: error
          retention-days: 2
