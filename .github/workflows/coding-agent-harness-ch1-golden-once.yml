name: Coding Agent Harness 2.1 GOLDEN QA

on:
  push:
    branches:
      - series/coding-agents-agent-harnesses-golden
    paths:
      - 'docs/series/coding-agents-agent-harnesses/01-que-es-agent-harness.md'
      - 'locales/en/series/coding-agents-agent-harnesses/01-que-es-agent-harness.md'
      - 'docs/snippets/articulos-tecnicos/coding-agent-harness-loop.html'
      - 'locales/en/snippets/articulos-tecnicos/coding-agent-harness-loop.html'
      - 'locales/en/snippets/articulos-tecnicos/coding-agent-harness-loop.i18n.json'
      - 'locales/en/manifest.yml'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
      - 'scripts/validate_coding_agent_harness_ch1_source.mjs'
      - 'scripts/validate_coding_agent_harness_ch1_accessibility.mjs'
      - 'scripts/validate_coding_agent_harness_ch1_locale_navigation.mjs'
      - '.github/workflows/coding-agent-harness-ch1-golden-once.yml'

permissions:
  contents: read

concurrency:
  group: coding-agent-harness-ch1-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate chapter 2.1 source contract
        run: node scripts/validate_coding_agent_harness_ch1_source.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate media declarations
        run: python scripts/prepare_video_media.py --check

      - name: Validate media binary signatures
        run: python scripts/audit_media_magic.py

      - name: Validate media structured-data contract
        run: python scripts/test_video_schema_contract.py

      - name: Build Spanish site strictly
        run: mkdocs build --clean --strict

      - name: Prepare English locale
        run: python scripts/prepare_locale.py --locale en

      - name: Audit English locale sources
        run: python scripts/audit_locale.py --locale en

      - name: Build English locale strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Audit rendered English locale
        run: python scripts/audit_locale.py --locale en --site site/en

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Audit chapter 2.1 browser resources ES and EN
        env:
          S5_BROWSER_RESOURCE_PATHS: /series/coding-agents-agent-harnesses/01-que-es-agent-harness/,/en/series/coding-agents-agent-harnesses/01-que-es-agent-harness/
        run: node scripts/audit_browser_resources.mjs

      - name: Validate chapter 2.1 locale and reader navigation
        run: node scripts/validate_coding_agent_harness_ch1_locale_navigation.mjs

      - name: Validate chapter 2.1 responsive and accessibility contract
        run: node scripts/validate_coding_agent_harness_ch1_accessibility.mjs

      - name: Validate canonical reader navigation regressions
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Validate responsive interaction regressions
        run: node scripts/validate_responsive_polish.mjs

      - name: Verify scoped branch diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git diff --name-only origin/main...HEAD | tee /tmp/ch1-scope.txt
          if grep -Ev '^(docs/series/coding-agents-agent-harnesses/01-que-es-agent-harness\.md|docs/snippets/articulos-tecnicos/coding-agent-harness-loop\.html|locales/en/series/coding-agents-agent-harnesses/01-que-es-agent-harness\.md|locales/en/snippets/articulos-tecnicos/coding-agent-harness-loop(\.html|\.i18n\.json)|locales/en/manifest\.yml|mkdocs\.yml|mkdocs\.en\.yml|scripts/validate_coding_agent_harness_ch1_(source|accessibility|locale_navigation)\.mjs|\.github/workflows/coding-agent-harness-ch1-golden-once\.yml)$' /tmp/ch1-scope.txt; then
            echo 'Unexpected file outside the chapter 2.1 construction scope.'
            exit 1
          fi

      - name: Upload chapter 2.1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-harness-ch1-golden-evidence
          path: artifacts/visual-review/coding-harness-ch1-*.png
          if-no-files-found: warn
          retention-days: 1
