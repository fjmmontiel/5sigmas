name: Final human visual fixes

on:
  pull_request:
    paths:
      - '.github/workflows/final-human-visual-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'reconcile/organic-growth-video-library-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix CTA contrast and deterministic visual capture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          css = Path('docs/stylesheets/video-library.css')
          body = css.read_text(encoding='utf-8')
          old = '.s5-video-watch__source > a {\n  display: inline-flex;'
          new = '.s5-video-watch .s5-video-watch__source > a {\n  display: inline-flex;'
          if new not in body:
              if old not in body:
                  raise SystemExit('CTA selector anchor missing')
              body = body.replace(old, new, 1)
          css.write_text(body, encoding='utf-8')

          script = Path('scripts/validate_video_library.mjs')
          body = script.read_text(encoding='utf-8')

          old_reset = "  await page.evaluate(() => window.scrollTo(0, 0));\n"
          new_reset = """  await page.evaluate(() => {\n    document.documentElement.style.scrollBehavior = 'auto';\n    if (document.body) document.body.style.scrollBehavior = 'auto';\n    window.scrollTo(0, 0);\n    window.dispatchEvent(new Event('scroll'));\n  });\n  await page.waitForFunction(() => window.scrollY < 2);\n  await page.waitForTimeout(180);\n"""
          if new_reset not in body:
              if old_reset not in body:
                  raise SystemExit('scroll reset anchor missing')
              body = body.replace(old_reset, new_reset, 1)

          anchor = """  if (articlePath !== '/series/modelos-razonadores/03-test-time-compute/') {\n    throw new Error(`The watch page does not return to its source article: ${articleHref}.`);\n  }\n\n"""
          assertion = """  if (articlePath !== '/series/modelos-razonadores/03-test-time-compute/') {\n    throw new Error(`The watch page does not return to its source article: ${articleHref}.`);\n  }\n\n  const ctaState = await articleLink.evaluate((node) => {\n    const style = getComputedStyle(node);\n    const parseRgb = (value) => {\n      const values = value.match(/[\\d.]+/g)?.slice(0, 3).map(Number) || [];\n      return values.length === 3 ? values : null;\n    };\n    const luminance = (rgb) => {\n      const channels = rgb.map((value) => {\n        const channel = value / 255;\n        return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;\n      });\n      return (0.2126 * channels[0]) + (0.7152 * channels[1]) + (0.0722 * channels[2]);\n    };\n    const foreground = parseRgb(style.color);\n    const background = parseRgb(style.backgroundColor);\n    let contrast = 0;\n    if (foreground && background) {\n      const light = Math.max(luminance(foreground), luminance(background));\n      const dark = Math.min(luminance(foreground), luminance(background));\n      contrast = (light + 0.05) / (dark + 0.05);\n    }\n    const rect = node.getBoundingClientRect();\n    return {\n      text: node.textContent.trim(),\n      color: style.color,\n      background: style.backgroundColor,\n      contrast,\n      width: rect.width,\n      height: rect.height,\n    };\n  });\n  if (ctaState.text !== 'Leer el artículo →') {\n    throw new Error(`The source CTA lost its visible label: ${JSON.stringify(ctaState)}.`);\n  }\n  if (ctaState.contrast < 4.5 || ctaState.width < 90 || ctaState.height < 40) {\n    throw new Error(`The source CTA is not visually legible: ${JSON.stringify(ctaState)}.`);\n  }\n\n"""
          if 'const ctaState = await articleLink.evaluate' not in body:
              if anchor not in body:
                  raise SystemExit('CTA assertion insertion anchor missing')
              body = body.replace(anchor, assertion, 1)

          script.write_text(body, encoding='utf-8')
          PY

          node --check scripts/validate_video_library.mjs
          git add docs/stylesheets/video-library.css scripts/validate_video_library.mjs
          git diff --cached --check
          git commit -m 'fix: make video CTA legible and screenshots deterministic'
          git push origin HEAD:${GITHUB_HEAD_REF}
