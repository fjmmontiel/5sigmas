name: Series experience requalification diagnostic

on:
  push:
    branches: ['quality/post-datacenters-requalification']
    paths: ['quality/series-requalification/audit-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: series-experience-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record exact audited revisions
        run: |
          git rev-parse HEAD
          cat quality/series-requalification/audit-request.json

      - name: Resolve diagnostic scope
        id: diagnostic_scope
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('quality/series-requalification/audit-request.json').read_text())
          scope = request.get('diagnostic_scope', 'full')
          allowed = {'full', 'focused_security_00_01'}
          if scope not in allowed:
              raise SystemExit(f'unsupported diagnostic_scope={scope!r}; allowed={sorted(allowed)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'scope={scope}\n')
          print(f'DIAGNOSTIC_SCOPE={scope}')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install existing build dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Negative regression fixtures
        run: python scripts/test_series_experience_audit.py -v

      - name: Public-series discovery regression
        id: publication_discovery
        continue-on-error: true
        run: python scripts/test_publication_contract_discovery.py -v

      - name: Independent source coverage audit
        id: source
        continue-on-error: true
        run: python scripts/audit_series_experience.py

      - name: Build Spanish strictly
        run: mkdocs build --clean --strict

      - name: Current publication contract across presentation-first and chapter-first series
        id: publication
        continue-on-error: true
        run: python scripts/audit_publication_contract.py

      - name: Inspect Security 00/01 native media with fail-closed ffprobe gate
        id: security_media_probe
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffprobe
          python scripts/validate_security_video_media.py --self-test
          python scripts/validate_security_media_locale_identity.py --self-test
          python scripts/validate_security_media_locale_identity.py
          python scripts/validate_security_video_media.py

      - name: Prepare English
        run: python scripts/prepare_locale.py --locale en

      - name: Build English strictly
        env:
          S5_LOCALE: en
        run: mkdocs build -f mkdocs.en.yml --clean --strict

      - name: Security 1.1 rendered structured provenance and locale metadata
        id: security_structured_metadata
        continue-on-error: true
        run: |
          python scripts/validate_security_structured_metadata.py --self-test
          python scripts/validate_security_structured_metadata.py

      - name: Security 00/01 reciprocal article-watch links and locale UI
        id: security_article_watch
        continue-on-error: true
        run: python scripts/validate_security_article_watch_contract.py

      - name: Independent complete rendered HTML audit
        id: rendered
        continue-on-error: true
        run: python scripts/audit_series_experience.py --site site

      - name: Install existing Playwright version
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve built preview with byte-range media support
        run: |
          python scripts/serve_preview.py --self-test
          python scripts/serve_preview.py --directory site --port 8000 > /tmp/series-experience-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null; then
              curl --fail --silent --show-error \
                -H 'Range: bytes=0-99' \
                -D /tmp/series-experience-range.headers \
                -o /tmp/series-experience-range.bin \
                http://127.0.0.1:8000/en/series/seguridad-ia/01-prompt-injection.mp4
              grep -q '^HTTP/1.[01] 206' /tmp/series-experience-range.headers
              grep -qi '^Content-Range: bytes 0-99/' /tmp/series-experience-range.headers
              test "$(wc -c < /tmp/series-experience-range.bin)" -eq 100
              exit 0
            fi
            sleep 1
          done
          cat /tmp/series-experience-preview.log
          exit 1

      - name: All inventoried pages, desktop/mobile, normal/reduced motion
        if: steps.diagnostic_scope.outputs.scope == 'full'
        id: browser
        continue-on-error: true
        env:
          S5_BROWSER_JOB_TIMEOUT_MS: '25000'
        run: node scripts/audit_series_experience_browser.mjs

      - name: Focused Security 00/01 interaction, layout and codec-aware playback diagnostic
        id: security_browser
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/validate_security_requalification_browser.mjs

      - name: Focused Security 00/01 WCAG contrast and state text visibility
        id: security_contrast
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/validate_security_contrast.mjs --self-test
          node scripts/validate_security_contrast.mjs
          node scripts/validate_security_text_visibility.mjs --self-test
          node scripts/validate_security_text_visibility.mjs

      - name: Focused Security 00/01 end-to-next lifecycle, keyboard/touch, normal/reduced motion
        id: security_video_lifecycle
        continue-on-error: true
        run: node scripts/validate_security_video_lifecycle.mjs

      - name: Focused Security 00/01 real touch article-watch round trip
        id: security_article_watch_touch
        continue-on-error: true
        timeout-minutes: 5
        run: |
          node scripts/validate_security_article_watch_touch.mjs
          test -s artifacts/security-requalification/article-watch-touch/report.json
          test -s artifacts/security-requalification/article-watch-touch-report.json

      - name: Focused Prompt Injection visual-state evidence across all teaching mechanisms
        id: security_prompt_states
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/validate_security_prompt_visual_states.mjs

      - name: Focused Security 00/01 real keyboard traversal and visible focus
        id: security_keyboard_focus
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/validate_security_keyboard_focus.mjs

      - name: Enforce technical failures; never certify pixel or pedagogical quality
        if: always()
        env:
          DIAGNOSTIC_SCOPE: ${{ steps.diagnostic_scope.outputs.scope }}
          PUBLICATION_DISCOVERY_OUTCOME: ${{ steps.publication_discovery.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          MEDIA_PROBE_OUTCOME: ${{ steps.security_media_probe.outcome }}
          SECURITY_STRUCTURED_METADATA_OUTCOME: ${{ steps.security_structured_metadata.outcome }}
          SECURITY_ARTICLE_WATCH_OUTCOME: ${{ steps.security_article_watch.outcome }}
          RENDERED_OUTCOME: ${{ steps.rendered.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SECURITY_BROWSER_OUTCOME: ${{ steps.security_browser.outcome }}
          SECURITY_CONTRAST_OUTCOME: ${{ steps.security_contrast.outcome }}
          SECURITY_VIDEO_LIFECYCLE_OUTCOME: ${{ steps.security_video_lifecycle.outcome }}
          SECURITY_ARTICLE_WATCH_TOUCH_OUTCOME: ${{ steps.security_article_watch_touch.outcome }}
          SECURITY_PROMPT_STATES_OUTCOME: ${{ steps.security_prompt_states.outcome }}
          SECURITY_KEYBOARD_FOCUS_OUTCOME: ${{ steps.security_keyboard_focus.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          scope = os.environ.get('DIAGNOSTIC_SCOPE') or 'full'
          print(f'GOLDEN=NOT_CERTIFIED; PIXEL_REVIEW=PENDING; PEDAGOGY_REVIEW=PENDING; DIAGNOSTIC_SCOPE={scope}')
          for name in ('report.json', 'browser-report.json'):
              path = Path('artifacts/series-experience') / name
              if path.exists():
                  data = json.loads(path.read_text())
                  print(name, json.dumps(data.get('summary', {k:v for k,v in data.items() if k != 'results'}), ensure_ascii=False))
          media_report = Path('artifacts/security-requalification/media-report.json')
          if media_report.exists():
              data = json.loads(media_report.read_text())
              print('security-requalification/media-report.json', json.dumps({
                  'status': data.get('status'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))
          security_report = Path('artifacts/security-requalification/report.json')
          if security_report.exists():
              data = json.loads(security_report.read_text())
              print('security-requalification/report.json', json.dumps({
                  'engine': data.get('engine'),
                  'chrome_launch_error': data.get('chrome_launch_error'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))
          contrast_report = Path('artifacts/security-requalification/contrast/report.json')
          if contrast_report.exists():
              data = json.loads(contrast_report.read_text())
              print('security-requalification/contrast/report.json', json.dumps({
                  'engine': data.get('engine'),
                  'threshold': data.get('threshold'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))
          lifecycle_report = Path('artifacts/security-requalification/video-lifecycle/report.json')
          if lifecycle_report.exists():
              data = json.loads(lifecycle_report.read_text())
              print('security-requalification/video-lifecycle/report.json', json.dumps({
                  'engine': data.get('engine'),
                  'chrome_launch_error': data.get('chrome_launch_error'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))
          touch_report = Path('artifacts/security-requalification/article-watch-touch/report.json')
          if touch_report.exists():
              data = json.loads(touch_report.read_text())
              print('security-requalification/article-watch-touch/report.json', json.dumps({
                  'engine': data.get('engine'),
                  'chrome_launch_error': data.get('chrome_launch_error'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))
          prompt_report = Path('artifacts/security-requalification/prompt-states/report.json')
          if prompt_report.exists():
              data = json.loads(prompt_report.read_text())
              print('security-requalification/prompt-states/report.json', json.dumps({
                  'engine': data.get('engine'),
                  'chrome_launch_error': data.get('chrome_launch_error'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))
          focus_report = Path('artifacts/security-requalification/keyboard-focus/report.json')
          if focus_report.exists():
              data = json.loads(focus_report.read_text())
              print('security-requalification/keyboard-focus/report.json', json.dumps({
                  'engine': data.get('engine'),
                  'chrome_launch_error': data.get('chrome_launch_error'),
                  'failure_count': len(data.get('failures', [])),
                  'failures': data.get('failures', []),
              }, ensure_ascii=False))

          names = [
              'PUBLICATION_DISCOVERY_OUTCOME',
              'SOURCE_OUTCOME',
              'PUBLICATION_OUTCOME',
              'MEDIA_PROBE_OUTCOME',
              'SECURITY_STRUCTURED_METADATA_OUTCOME',
              'SECURITY_ARTICLE_WATCH_OUTCOME',
              'RENDERED_OUTCOME',
              'SECURITY_BROWSER_OUTCOME',
              'SECURITY_CONTRAST_OUTCOME',
              'SECURITY_VIDEO_LIFECYCLE_OUTCOME',
              'SECURITY_ARTICLE_WATCH_TOUCH_OUTCOME',
              'SECURITY_PROMPT_STATES_OUTCOME',
              'SECURITY_KEYBOARD_FOCUS_OUTCOME',
          ]
          if scope == 'full':
              names.append('BROWSER_OUTCOME')
          else:
              print('GLOBAL_BROWSER_SWEEP=INTENTIONALLY_SKIPPED_FOR_FOCUSED_ITERATION; this run cannot certify the global catalogue')
          outcomes = {name: os.environ.get(name, '') for name in names}
          print('TECHNICAL_OUTCOMES', json.dumps(outcomes, sort_keys=True))
          raise SystemExit(0 if all(value == 'success' for value in outcomes.values()) else 1)
          PY

      - name: Retain bounded failed-diagnostic evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: series-experience-diagnostic
          path: |
            artifacts/series-experience/
            artifacts/security-requalification/
          retention-days: 1
          if-no-files-found: warn
          overwrite: true
