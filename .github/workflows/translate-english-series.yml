name: Generate English series drafts

on:
  push:
    branches:
      - 'agent/english-translation-*'
    paths:
      - 'scripts/translate_locale_with_models.py'
      - '.github/workflows/translate-english-series.yml'

permissions:
  contents: write
  models: read

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      S5_TRANSLATION_SERIES: fundamentos-ia-iag
      S5_TRANSLATION_LOCALE: en
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate draft translations with GitHub Models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          S5_TRANSLATION_MODEL: openai/gpt-4.1
        run: python scripts/translate_locale_with_models.py --locale "$S5_TRANSLATION_LOCALE" --series "$S5_TRANSLATION_SERIES"

      - name: Commit generated drafts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "locales/$S5_TRANSLATION_LOCALE/"
          if git diff --cached --quiet; then
            echo 'No new translation drafts were generated.'
            exit 0
          fi
          git commit -m "Draft English $S5_TRANSLATION_SERIES locale sources"
          git push origin HEAD:${{ github.ref_name }}
