name: Generate English series drafts

on:
  push:
    branches:
      - 'agent/english-translation-*'
    paths:
      - '.github/locale-translation-request.json'
      - 'scripts/translate_locale_with_models.py'
      - '.github/workflows/translate-english-series.yml'

permissions:
  contents: write
  models: read

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read translation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request='.github/locale-translation-request.json'
          if [[ ! -f "$request" ]]; then
            echo 'No translation request is present; infrastructure-only push.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          series="$(python -c 'import json; print(json.load(open(".github/locale-translation-request.json"))["series"])')"
          locale="$(python -c 'import json; print(json.load(open(".github/locale-translation-request.json")).get("locale", "en"))')"
          overwrite="$(python -c 'import json; print(str(bool(json.load(open(".github/locale-translation-request.json")).get("overwrite", False))).lower())')"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "locale=$locale" >> "$GITHUB_OUTPUT"
          echo "overwrite=$overwrite" >> "$GITHUB_OUTPUT"

      - name: Generate draft translations with GitHub Models
        if: steps.request.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          S5_TRANSLATION_MODEL: openai/gpt-4.1
        shell: bash
        run: |
          set -euo pipefail
          args=(--locale '${{ steps.request.outputs.locale }}' --series '${{ steps.request.outputs.series }}')
          if [[ '${{ steps.request.outputs.overwrite }}' == 'true' ]]; then args+=(--overwrite); fi
          python scripts/translate_locale_with_models.py "${args[@]}"

      - name: Commit generated drafts
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'locales/${{ steps.request.outputs.locale }}/'
          if git diff --cached --quiet; then
            echo 'No new translation drafts were generated.'
            exit 0
          fi
          git commit -m "Draft English ${{ steps.request.outputs.series }} locale sources"
          git push origin HEAD:${{ github.ref_name }}
