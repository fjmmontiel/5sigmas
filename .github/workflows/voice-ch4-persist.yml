name: Persist tested Voice chapter 4 patch

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch4-persist.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/realtime-voice-agents-golden

      - name: Reproduce the exact tested patch
        shell: bash
        run: |
          python scripts/_voice_ch4_builder.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('locales/en/series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^(\s*-\s+.+);\s*$', r'\1', text)
          if count != 35:
              raise SystemExit(f'Expected exactly 35 semicolon-list fixes, got {count}')
          path.write_text(text, encoding='utf-8')
          PY
          node scripts/validate_voice_tools_state_ch4_source.mjs
          git diff --check

      - name: Commit tested non-workflow content
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/pr-visual-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md \
            locales/en/series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md \
            docs/snippets/articulos-tecnicos/voice-action-lifecycle.html \
            locales/en/snippets/articulos-tecnicos/voice-action-lifecycle.html \
            locales/en/snippets/articulos-tecnicos/voice-action-lifecycle.i18n.json \
            locales/en/manifest.yml mkdocs.yml mkdocs.en.yml \
            scripts/validate_voice_tools_state_ch4_source.mjs \
            scripts/validate_voice_tools_state_ch4_accessibility.mjs
          git diff --cached --check
          git commit -m 'feat(voice): integrate chapter 4 state and async lifecycle'
          git push origin HEAD:series/realtime-voice-agents-golden
          echo "PERSISTED_COMMIT=$(git rev-parse HEAD)"
