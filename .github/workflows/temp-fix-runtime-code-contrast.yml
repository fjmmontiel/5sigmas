name: Temporary patch · runtime microlab contrast

on:
  push:
    branches:
      - agent/voice-animation-responsive
    paths:
      - '.github/workflows/temp-fix-runtime-code-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/voice-animation-responsive
          fetch-depth: 0

      - name: Keep the event envelope readable on the dark bus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/stylesheets/voice-report-animations.css')
          text = path.read_text(encoding='utf-8')
          old = '.s5v-runtime__bus code { color: #eaf4f2; font-size: .65rem; }'
          new = '.s5v-runtime__bus code { padding: 0; border: 0; background: transparent !important; box-shadow: none; color: #eaf4f2; font-size: .65rem; }'
          if old not in text:
              raise SystemExit('Missing runtime event-bus code marker')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit the contrast fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stylesheets/voice-report-animations.css
          git commit -m "Keep the runtime event envelope readable on its dark bus"
          git push origin HEAD:agent/voice-animation-responsive
