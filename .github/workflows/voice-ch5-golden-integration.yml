name: Voice chapter 5 GOLDEN integration gate

on:
  push:
    branches:
      - series/realtime-voice-agents-golden
    paths:
      - '.github/workflows/voice-ch5-golden-integration.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: voice-ch5-golden-integration
  cancel-in-progress: false

jobs:
  golden:
    if: contains(github.event.head_commit.message, 'run chapter 5 GOLDEN integration')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: series/realtime-voice-agents-golden
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wire chapter 5 into the canonical site contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def insert_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if addition.strip() in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, got {text.count(anchor)}')
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          include = '\n{{ include_html("snippets/articulos-tecnicos/voice-network-paths.html") }}\n'
          insert_after(
              'docs/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md',
              'PSTN/carrier → carrier media gateway → WSS audio protocol → application/runtime\n```\n',
              include,
          )
          insert_after(
              'locales/en/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md',
              'PSTN/carrier → carrier media gateway → WSS audio protocol → application/runtime\n```\n',
              include,
          )
          insert_after(
              'mkdocs.yml',
              '          - Tools, estado y acciones asíncronas: series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md\n',
              '          - WebRTC, SIP y telefonía: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
          )
          insert_after(
              'mkdocs.en.yml',
              '          - Tools, state and async actions: series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md\n',
              '          - WebRTC, SIP and telephony: series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - series/agentes-voz-tiempo-real/04-tools-estado-acciones-asincronas.md\n',
              '  - series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md\n',
          )
          insert_after(
              'locales/en/manifest.yml',
              '  - snippets/articulos-tecnicos/voice-action-lifecycle.html\n',
              '  - snippets/articulos-tecnicos/voice-network-paths.html\n',
          )
          insert_after(
              '.github/workflows/pr-visual-review.yml',
              '      - name: Validate Realtime Voice Agents chapter 4 accessibility and responsive states\n        run: node scripts/validate_voice_tools_state_ch4_accessibility.mjs\n',
              '\n      - name: Validate Realtime Voice Agents chapter 5 source contract\n        run: node scripts/validate_voice_network_telephony_ch5_source.mjs\n\n      - name: Validate Realtime Voice Agents chapter 5 accessibility and responsive states\n        run: node scripts/validate_voice_network_telephony_ch5_accessibility.mjs\n',
          )
          PY

      - name: Add deterministic chapter 5 browser and accessibility gate
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/validate_voice_network_telephony_ch5_accessibility.mjs <<'EOF'
          #!/usr/bin/env node
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const base = process.env.S5_PREVIEW_BASE || 'http://127.0.0.1:8000';
          const outDir = path.resolve('artifacts/visual-review');
          await fs.mkdir(outDir, { recursive: true });

          const failures = [];
          const check = (condition, message) => { if (!condition) failures.push(message); };
          const cases = [
            {
              locale: 'es',
              route: '/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red/',
              tableHeader: 'Pregunta',
              expected: ['WebRTC + ICE', 'SIP + SDP', 'WSS audio', 'contrato del carrier'],
              forbidden: [],
            },
            {
              locale: 'en',
              route: '/en/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red/',
              tableHeader: 'Question',
              expected: ['Network and media', 'WebRTC + ICE', 'SIP + SDP', 'WSS audio', 'carrier contract', 'agent runtime'],
              forbidden: ['Red y media', 'micrófono', 'pierna telefónica', 'contrato del carrier', 'runtime del agente'],
            },
          ];
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000, hasTouch: false },
            { name: 'mobile', width: 390, height: 844, hasTouch: true },
          ];

          const browser = await chromium.launch({ headless: true });
          try {
            for (const testCase of cases) {
              for (const viewport of viewports) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  hasTouch: viewport.hasTouch,
                  isMobile: viewport.hasTouch,
                  reducedMotion: 'reduce',
                });
                const page = await context.newPage();
                const runtimeErrors = [];
                const consoleErrors = [];
                page.on('pageerror', (error) => runtimeErrors.push(error.message));
                page.on('console', (message) => {
                  if (message.type() === 'error') consoleErrors.push(message.text());
                });

                const response = await page.goto(`${base}${testCase.route}`, { waitUntil: 'networkidle' });
                check(response?.ok(), `${testCase.route}: ${viewport.name} HTTP ${response?.status() ?? 'no response'}`);
                const htmlLang = await page.locator('html').getAttribute('lang');
                check((htmlLang || '').toLowerCase().startsWith(testCase.locale), `${testCase.route}: ${viewport.name} wrong html lang ${htmlLang}`);
                const h1 = (await page.locator('main h1').first().innerText()).trim();
                check(h1.length >= 25, `${testCase.route}: ${viewport.name} missing article h1`);

                const visual = page.locator('.s5v-network-paths');
                check((await visual.count()) === 1, `${testCase.route}: ${viewport.name} expected exactly one network-path visual`);
                if (await visual.count()) {
                  const label = (await visual.getAttribute('aria-label'))?.trim() || '';
                  check(label.length >= 20, `${testCase.route}: ${viewport.name} network visual missing meaningful aria-label`);
                  const visualText = (await visual.innerText()).trim();
                  for (const token of testCase.expected) check(visualText.includes(token), `${testCase.route}: ${viewport.name} missing localized visual token ${JSON.stringify(token)}`);
                  for (const token of testCase.forbidden) check(!visualText.includes(token), `${testCase.route}: ${viewport.name} untranslated visual token ${JSON.stringify(token)}`);
                  const pipes = visual.locator('.s5v-arch-map__pipe');
                  check((await pipes.count()) === 3, `${testCase.route}: ${viewport.name} expected three media-boundary paths`);
                  const visualBox = await visual.boundingBox();
                  check(Boolean(visualBox && visualBox.width <= viewport.width + 1), `${testCase.route}: ${viewport.name} visual exceeds viewport (${JSON.stringify(visualBox)})`);
                  for (let index = 0; index < await pipes.count(); index += 1) {
                    const box = await pipes.nth(index).boundingBox();
                    check(Boolean(box && box.width >= (viewport.name === 'mobile' ? 280 : 500)), `${testCase.route}: ${viewport.name} path ${index + 1} collapsed (${JSON.stringify(box)})`);
                    check(Boolean(box && box.height <= (viewport.name === 'mobile' ? 520 : 260)), `${testCase.route}: ${viewport.name} path ${index + 1} wraps pathologically (${JSON.stringify(box)})`);
                    const cards = pipes.nth(index).locator(':scope > span');
                    check((await cards.count()) >= 4, `${testCase.route}: ${viewport.name} path ${index + 1} lost its boundary cards`);
                    for (let cardIndex = 0; cardIndex < await cards.count(); cardIndex += 1) {
                      const cardBox = await cards.nth(cardIndex).boundingBox();
                      check(Boolean(cardBox && cardBox.width >= (viewport.name === 'mobile' ? 120 : 55)), `${testCase.route}: ${viewport.name} path ${index + 1} card ${cardIndex + 1} collapsed (${JSON.stringify(cardBox)})`);
                    }
                  }
                  await visual.screenshot({
                    path: path.join(outDir, `voice-network-ch5-${testCase.locale}-${viewport.name}-paths.png`),
                    animations: 'disabled',
                  });
                }

                const documentOverflow = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                }));
                check(documentOverflow.scrollWidth <= documentOverflow.clientWidth + 1, `${testCase.route}: ${viewport.name} horizontal page overflow ${JSON.stringify(documentOverflow)}`);

                const runtimeTable = page.locator('main table').filter({ hasText: testCase.tableHeader }).last();
                check((await runtimeTable.count()) === 1, `${testCase.route}: ${viewport.name} runtime decision table missing`);
                if (await runtimeTable.count()) {
                  const tableState = await runtimeTable.evaluate((table, args) => {
                    const lastHeader = table.querySelector('thead th:last-child');
                    if (!lastHeader) return { hasLastHeader: false };
                    if (args.viewportName !== 'mobile') {
                      const tableBox = table.getBoundingClientRect();
                      const lastBox = lastHeader.getBoundingClientRect();
                      return { hasLastHeader: true, desktopFits: tableBox.right <= window.innerWidth + 1 && lastBox.right <= window.innerWidth + 1 };
                    }
                    let scroller = table.parentElement;
                    while (scroller && scroller !== document.body) {
                      const style = getComputedStyle(scroller);
                      const canScroll = scroller.scrollWidth > scroller.clientWidth + 1;
                      const overflowAllowsScroll = style.overflowX === 'auto' || style.overflowX === 'scroll';
                      if (canScroll && overflowAllowsScroll) break;
                      scroller = scroller.parentElement;
                    }
                    if (!scroller || scroller === document.body) return { hasLastHeader: true, hasScroller: false };
                    const maxScroll = scroller.scrollWidth - scroller.clientWidth;
                    scroller.dataset.s5Ch5NetworkScroller = args.marker;
                    scroller.scrollLeft = maxScroll;
                    void scroller.offsetWidth;
                    const scrollerBox = scroller.getBoundingClientRect();
                    const lastBox = lastHeader.getBoundingClientRect();
                    return {
                      hasLastHeader: true,
                      hasScroller: true,
                      maxScroll,
                      actualScroll: scroller.scrollLeft,
                      lastColumnReachable: lastBox.left >= scrollerBox.left - 2 && lastBox.right <= scrollerBox.right + 2,
                    };
                  }, { viewportName: viewport.name, marker: `${testCase.locale}-${viewport.name}` });
                  check(tableState.hasLastHeader === true, `${testCase.route}: ${viewport.name} runtime table last header missing`);
                  if (viewport.name === 'desktop') {
                    check(tableState.desktopFits === true, `${testCase.route}: desktop runtime decision matrix clipped (${JSON.stringify(tableState)})`);
                  } else {
                    check(tableState.hasScroller === true, `${testCase.route}: mobile runtime matrix clips without horizontal scroll (${JSON.stringify(tableState)})`);
                    check(Number(tableState.maxScroll) > 20 && Number(tableState.actualScroll) > 20, `${testCase.route}: mobile runtime matrix horizontal scroll is inert (${JSON.stringify(tableState)})`);
                    check(tableState.lastColumnReachable === true, `${testCase.route}: mobile runtime matrix final column is not reachable (${JSON.stringify(tableState)})`);
                    const scroller = page.locator(`[data-s5-ch5-network-scroller="${testCase.locale}-${viewport.name}"]`);
                    if (await scroller.count()) {
                      await scroller.screenshot({
                        path: path.join(outDir, `voice-network-ch5-${testCase.locale}-mobile-runtime-table-end.png`),
                        animations: 'disabled',
                      });
                    }
                  }
                }

                for (const error of runtimeErrors) failures.push(`${testCase.route}: ${viewport.name} runtime error: ${error}`);
                for (const error of consoleErrors.filter((entry) => !/favicon|Failed to load resource.*404/i.test(entry))) failures.push(`${testCase.route}: ${viewport.name} console error: ${error}`);
                await page.screenshot({
                  path: path.join(outDir, `voice-network-ch5-${testCase.locale}-${viewport.name}-page.png`),
                  fullPage: true,
                  animations: 'disabled',
                });
                await context.close();
              }
            }
          } finally {
            await browser.close();
          }

          if (failures.length) {
            console.error(`Voice network/telephony chapter browser/accessibility QA failed (${failures.length}):`);
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log('Voice network/telephony chapter browser/accessibility QA PASS: ES/EN route language, localized three-path visual, desktop/mobile geometry, reduced-motion context, runtime-matrix reachability, whole-page overflow, runtime errors and review screenshots are valid.');
          EOF
          chmod +x scripts/validate_voice_network_telephony_ch5_accessibility.mjs

      - name: Validate chapter 5 source contract
        run: node scripts/validate_voice_network_telephony_ch5_source.mjs

      - name: Validate media declarations and signatures
        run: |
          python scripts/prepare_video_media.py --check
          python scripts/audit_media_magic.py
          python scripts/test_video_schema_contract.py

      - name: Strict Spanish build
        run: mkdocs build --clean --strict

      - name: Prepare and audit English locale sources
        env:
          S5_LOCALE: en
        run: |
          python scripts/prepare_locale.py --locale en
          python scripts/audit_locale.py --locale en

      - name: Strict English build and rendered locale audit
        env:
          S5_LOCALE: en
        run: |
          mkdocs build -f mkdocs.en.yml --clean --strict
          python scripts/audit_locale.py --locale en --site site/en

      - name: Restore reviewed English TTC media
        id: en-ttc-cache
        uses: actions/cache/restore@v4
        with:
          path: .localized-media/en/ttc-v1
          key: s5-en-ttc-4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33

      - name: Seed reviewed English TTC media from verified artifact
        if: steps.en-ttc-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: english-ttc-reviewed-seed
          path: .localized-media/en/ttc-v1
          run-id: 31689108864
          github-token: ${{ github.token }}

      - name: Verify and stage reviewed English TTC media
        shell: bash
        run: |
          set -euo pipefail
          media='.localized-media/en/ttc-v1'
          mp4="$media/03-test-time-compute.mp4"
          jpg="$media/03-test-time-compute.jpg"
          echo '4e6238a7dffc03643b48e08f7c579fb7d710217a827720113e7477c633be0f33  .localized-media/en/ttc-v1/03-test-time-compute.mp4' | sha256sum -c -
          echo '60cee7a788f546bb58e56e5008ca21c7efd9317b9b84c059a9427465d6e40f50  .localized-media/en/ttc-v1/03-test-time-compute.jpg' | sha256sum -c -
          test "$(stat -c %s "$mp4")" = '4337214'
          test "$(stat -c %s "$jpg")" = '105949'
          target='site/en/series/modelos-razonadores'
          mkdir -p "$target"
          cp "$mp4" "$target/03-test-time-compute.mp4"
          cp "$jpg" "$target/03-test-time-compute.jpg"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve combined preview
        run: |
          python -m http.server 8000 --directory site > /tmp/5sigmas-preview.log 2>&1 &
          echo $! > /tmp/5sigmas-preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/en/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/5sigmas-preview.log
          exit 1

      - name: Browser resource and broken-media audit
        run: node scripts/audit_browser_resources.mjs

      - name: Locale and mirror browser gates
        run: |
          node scripts/validate_english_locale.mjs
          node scripts/validate_english_home_parity.mjs

      - name: Chapters 1-4 regression gates
        run: |
          node scripts/validate_voice_architecture_ch1.mjs
          node scripts/validate_voice_architecture_ch1_accessibility.mjs
          node scripts/validate_voice_turn_taking_ch2_source.mjs
          node scripts/validate_voice_turn_taking_ch2_accessibility.mjs
          node scripts/validate_voice_latency_ch3_source.mjs
          node scripts/validate_voice_latency_ch3_accessibility.mjs
          node scripts/validate_voice_tools_state_ch4_source.mjs
          node scripts/validate_voice_tools_state_ch4_accessibility.mjs

      - name: Chapter 5 browser and accessibility gate
        run: node scripts/validate_voice_network_telephony_ch5_accessibility.mjs

      - name: Reader navigation gate
        run: node scripts/validate_direct_reader_navigation.mjs

      - name: Verify clean deterministic patch
        run: |
          git diff --check
          git status --short

      - name: Persist chapter 5 integration only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '5sigmas-golden-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md \
            locales/en/series/agentes-voz-tiempo-real/05-webrtc-sip-telefonia-red.md \
            mkdocs.yml mkdocs.en.yml locales/en/manifest.yml \
            scripts/validate_voice_network_telephony_ch5_accessibility.mjs \
            .github/workflows/pr-visual-review.yml
          git diff --cached --check
          git commit -m 'feat(voice): integrate chapter 5 network boundary and QA'
          git push origin HEAD:series/realtime-voice-agents-golden
          echo "certified_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chapter 5 GOLDEN visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-ch5-golden-visual-evidence
          path: artifacts/visual-review/voice-network-ch5-*.png
          if-no-files-found: warn
          retention-days: 1
