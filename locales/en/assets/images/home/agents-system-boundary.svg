<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI agent system boundary</title>
  <desc id="desc">A bounded AI agent moves from an objective to a decision, a tool action and verification while policy constrains the loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a2d"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#3154d8"/>
      <stop offset="1" stop-color="#6680ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1400" cy="120" r="210" fill="#3154d8" opacity=".08"/>
  <circle cx="1320" cy="760" r="300" fill="#f0642b" opacity=".055"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="96" y="98" fill="#94a4c2" font-size="22" font-weight="700" letter-spacing="5">5SIGMAS · AI AGENTS · CHAPTER 1</text>
    <text x="96" y="194" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-3">Autonomy needs</text>
    <text x="96" y="274" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-3">a system boundary.</text>
    <text x="100" y="326" fill="#aebbd0" font-size="25">The model proposes. Tools act. Policy decides what is allowed.</text>
  </g>

  <g transform="translate(96 412)" filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="1408" height="326" rx="30" fill="#0d1526" stroke="#33405a" stroke-width="2"/>

    <g transform="translate(48 58)">
      <rect width="242" height="148" rx="22" fill="#17233c" stroke="#3d4e70" stroke-width="2"/>
      <text x="26" y="38" fill="#8292af" font-size="17" font-weight="700" letter-spacing="2">01 · OBJECTIVE</text>
      <text x="26" y="82" fill="#fff" font-size="29" font-weight="800">Observe</text>
      <text x="26" y="115" fill="#9dabc2" font-size="18">goal + context + state</text>
    </g>

    <path d="M315 132 H382" stroke="#60708e" stroke-width="4" stroke-linecap="round"/>
    <path d="M370 120 L386 132 L370 144" fill="none" stroke="#60708e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(406 58)">
      <rect width="242" height="148" rx="22" fill="#1b2850" stroke="#4560b9" stroke-width="2"/>
      <text x="26" y="38" fill="#8ea3f5" font-size="17" font-weight="700" letter-spacing="2">02 · DECISION</text>
      <text x="26" y="82" fill="#fff" font-size="29" font-weight="800">Plan</text>
      <text x="26" y="115" fill="#a9b8de" font-size="18">answer · ask · call · stop</text>
    </g>

    <path d="M673 132 H740" stroke="#60708e" stroke-width="4" stroke-linecap="round"/>
    <path d="M728 120 L744 132 L728 144" fill="none" stroke="#60708e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(764 58)">
      <rect width="242" height="148" rx="22" fill="#292238" stroke="#825e99" stroke-width="2"/>
      <text x="26" y="38" fill="#c4a6d8" font-size="17" font-weight="700" letter-spacing="2">03 · TOOL</text>
      <text x="26" y="82" fill="#fff" font-size="29" font-weight="800">Act</text>
      <text x="26" y="115" fill="#c2b4cc" font-size="18">validated arguments only</text>
    </g>

    <path d="M1031 132 H1098" stroke="#60708e" stroke-width="4" stroke-linecap="round"/>
    <path d="M1086 120 L1102 132 L1086 144" fill="none" stroke="#60708e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(1122 58)">
      <rect width="238" height="148" rx="22" fill="#30231e" stroke="#a36c50" stroke-width="2"/>
      <text x="26" y="38" fill="#e1a47e" font-size="17" font-weight="700" letter-spacing="2">04 · RESULT</text>
      <text x="26" y="82" fill="#fff" font-size="29" font-weight="800">Verify</text>
      <text x="26" y="115" fill="#cfb7aa" font-size="18">success · retry · stop</text>
    </g>

    <path d="M1240 226 C1240 284 1010 292 704 292 C394 292 170 285 170 226" fill="none" stroke="#3154d8" stroke-width="4" stroke-dasharray="10 12" opacity=".85"/>
    <path d="M158 241 L170 222 L182 241" fill="none" stroke="#3154d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="640" y="280" fill="#8198ed" font-size="17" font-weight="700" letter-spacing="2">UPDATE STATE · LOOP</text>
  </g>

  <g transform="translate(96 786)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="1408" height="56" rx="14" fill="#3154d8"/>
    <rect x="0" y="0" width="8" height="56" rx="4" fill="#f0642b"/>
    <text x="28" y="35" fill="#fff" font-size="20" font-weight="800">POLICY BOUNDARY</text>
    <text x="252" y="35" fill="#dbe2ff" font-size="19">tools · permissions · budgets · approvals · stopping conditions</text>
    <text x="1326" y="35" text-anchor="end" fill="#fff" font-size="18" font-weight="700">bounded autonomy</text>
  </g>
</svg>
