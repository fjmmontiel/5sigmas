locale: en
name: English
status: mirror-in-progress
canonical_source_locale: es
route_strategy: preserve-source-slugs
fallback_to_spanish: false

# Canonical Spanish media is never inherited implicitly. Add only genuinely
# language-neutral files here. Localized posters/video/audio live under locales/en.
shared_media: []

published_routes:
  - index.md
  - series/index.md
  - series/fundamentos-ia-iag/00_presentacion_serie.md
  - series/from-cave-to-agi/00_presentacion_serie.md
  - series/multimodalidad-iag/00_presentacion_serie.md
  - series/modelos-razonadores/00_presentacion_serie.md
  - series/ia-pib-bienestar-energia/00_presentacion_serie.md
  - series/datacenters-espacio/00_presentacion_serie.md
  - series/seguridad-ia/00_presentacion_serie.md
  - series/agentes-ia/00_presentacion_serie.md
  - series/agentes-ia/01-que-es-un-agente.md
  - series/agentes-ia/02-anatomia-de-un-agente.md
  - series/agentes-ia/03-como-evaluar-un-agente.md
  - series/agentes-ia/04-seguridad-agentes.md
  - series/agentes-ia/05-de-la-demo-a-produccion.md
  - meta/about.md

required_snippets:
  - snippets/series_meta.html
  - snippets/ia-pib-energia/series_energy_ai_01_electricity.html
  - snippets/ia-pib-energia/series_energy_ai_02_ai.html
  - snippets/ia-pib-energia/series_energy_ai_03_measurement.html
  - snippets/ia-pib-energia/series_energy_ai_04_gdp.html
  - snippets/datacenters-espacio/dc_space_pressure_anim.html
  - snippets/seguridad-ia/00-series-mapa.html
  - snippets/agentes-ia/01-bucle-agente.html
  - snippets/agentes-ia/03-evaluacion.html
  - snippets/agentes-ia/04-seguridad.html

coverage:
  homepage: pilot_to_be_replaced_with_canonical_mirror
  series_hub: canonical_structure_mirrored
  series_presentations: complete
  agents_series: complete
  remaining_chapters: in_progress
  concept_hubs: not_yet_published
  technical_articles: not_yet_published
  visual_hub: blocked_on_localized_media
  video_hub: blocked_on_localized_media
  localized_video_media: not_yet_published

quality_gates:
  - no_spanish_fallback
  - no_implicit_spanish_media
  - strict_mkdocs_build
  - translated_snippet_contract
  - rendered_html_lang
  - canonical_locale_url
  - route_safe_language_switch
