site_name: 5sigmas - Más señal, menos ruido
site_description: Divulgación técnica sobre IA en español. Análisis riguroso de Inteligencia Artificial, IA generativa y AGI — sin hype, con contexto y fuentes primarias.
site_url: "https://5sigmas.com"
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - content.code.copy
    - content.action.edit
    - content.tooltips

extra:
  generator: false  # quita “Made with Material for MkDocs”
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fjmm1998/

nav:
  - Inicio: index.md
  - Series:
      - Fundamentos de IA e IA generativa:
          - Presentación: series/fundamentos-ia-iag/00_presentacion_serie.md
          - ¿Qué es la IA?: series/fundamentos-ia-iag/01-que-es-ia.md
          - ¿Qué es IA Generativa?: series/fundamentos-ia-iag/02-que-es-ia-generativa.md
          - IA vs IA Generativa: series/fundamentos-ia-iag/03-ia-vs-ia-generativa.md
          - AGI: series/fundamentos-ia-iag/04-agi.md
      - De las cavernas a la AGI:
          - Presentación: series/from-cave-to-agi/00_presentacion_serie.md
          - Representar: series/from-cave-to-agi/01-representar.md
          - Mecanizar: series/from-cave-to-agi/02-mecanizar.md
          - Aprender: series/from-cave-to-agi/03-aprender.md
          - Escalar: series/from-cave-to-agi/04-escalar.md
          - Más allá de escalar: series/from-cave-to-agi/05-mas-alla.md
      - Multimodalidad en IA Generativa:
          - Presentación: series/multimodalidad-iag/00_presentacion_serie.md
          - El problema: series/multimodalidad-iag/01-el-problema.md
          - Alineamiento: series/multimodalidad-iag/02-alineamiento.md
          - Arquitecturas: series/multimodalidad-iag/03-arquitecturas.md
          - Evaluación: series/multimodalidad-iag/04-evaluacion.md
          - Riesgos: series/multimodalidad-iag/05-riesgos.md
      - Modelos razonadores:
          - Presentación: series/modelos-razonadores/00_presentacion_serie.md
      - IA, PIB, bienestar y energía:
          - Presentación: series/ia-pib-bienestar-energia/00_presentacion_serie.md
      - Datacenters en el espacio:
          - Presentación: series/datacenters-espacio/00_presentacion_serie.md
  - Sobre 5sigmas: meta/about.md
markdown_extensions:
  - meta
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true   # hace que MathJax procese los bloques marcados
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/nav-gradient.js
  - javascripts/external-links.js
  - assets/javascripts/animation-shell.js
  - assets/javascripts/site-demos.js
  - assets/javascripts/tabbed-animations.js
  - path: https://unpkg.com/mermaid@10/dist/mermaid.min.js
    defer: true
  - javascripts/mermaid-init.js
  - javascripts/mathjax.js
  - path: https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
    defer: true
  - assets/javascripts/series_energy_ai_preview.js
  - assets/javascripts/series_energy_ai_local.js
extra_css:
  - stylesheets/extra.css
  - assets/stylesheets/animations.css
  - assets/stylesheets/series_energy_ai_preview.css

hooks:
  - hooks/reading_time.py

plugins:
  - search
  - macros
  - social:
      cards_layout: clean
      cards_layout_options:
        background_color: transparent
        background_image: docs/assets/social_liquid.png
        color: "#ffffff"
        font_family: Inter
      enabled: true
  # - blog        # optional – see below
exclude_docs: |
  drafts/
  drafts/**
  assets/templates/**
