site_name: 5sigmas
site_description: Inteligencia artificial explicada con rigor mediante vídeos, animaciones, series y notas técnicas.
site_url: "https://5sigmas.com"
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
  unrecognized_links: ignore
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - navigation.footer

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fjmm1998/

nav:
  - Inicio: index.md
  - Ver: visuales/index.md
  - Aprender:
      - series/index.md
      - Fundamentos de IA e IA generativa:
          - Presentación: series/fundamentos-ia-iag/00_presentacion_serie.md
          - ¿Qué es la IA?: series/fundamentos-ia-iag/01-que-es-ia.md
          - ¿Qué es IA Generativa?: series/fundamentos-ia-iag/02-que-es-ia-generativa.md
          - IA vs IA Generativa: series/fundamentos-ia-iag/03-ia-vs-ia-generativa.md
          - AGI: series/fundamentos-ia-iag/04-agi.md
      - De las cavernas a la AGI:
          - Presentación: series/from-cave-to-agi/00_presentacion_serie.md
          - Representar: series/from-cave-to-agi/01-representar.md
          - Mecanizar: series/from-cave-to-agi/02-mecanizar.md
          - Aprender: series/from-cave-to-agi/03-aprender.md
          - Escalar: series/from-cave-to-agi/04-escalar.md
          - Más allá del Transformer: series/from-cave-to-agi/05-mas-alla.md
      - Multimodalidad en IA Generativa:
          - Presentación: series/multimodalidad-iag/00_presentacion_serie.md
          - El problema: series/multimodalidad-iag/01-el-problema.md
          - Alineamiento: series/multimodalidad-iag/02-alineamiento.md
          - Arquitecturas: series/multimodalidad-iag/03-arquitecturas.md
          - Evaluación: series/multimodalidad-iag/04-evaluacion.md
          - Riesgos: series/multimodalidad-iag/05-riesgos.md
      - Modelos razonadores:
          - Presentación: series/modelos-razonadores/00_presentacion_serie.md
          - Qué es razonar: series/modelos-razonadores/01-que-es-razonar.md
          - Fallos de los modelos razonadores: series/modelos-razonadores/02-fallos.md
          - Test-Time Compute: series/modelos-razonadores/03-test-time-compute.md
          - Tiempo, latencia, streaming e interacción humana: series/modelos-razonadores/04-latencia-streaming.md
          - Riesgos: series/modelos-razonadores/05-riesgos.md
      - IA, PIB, bienestar y energía:
          - Presentación: series/ia-pib-bienestar-energia/00_presentacion_serie.md
          - Electricidad y bienestar: series/ia-pib-bienestar-energia/01-electricidad-bienestar.md
          - IA como tecnología eléctrica: series/ia-pib-bienestar-energia/02-ia-tecnologia-electrica.md
          - Medición — PIB vs bienestar: series/ia-pib-bienestar-energia/03-pib-vs-bienestar.md
          - IA y PIB hoy: series/ia-pib-bienestar-energia/04-ia-pib-hoy.md
      - Datacenters en el espacio:
          - Presentación: series/datacenters-espacio/00_presentacion_serie.md
          - Por qué ahora: series/datacenters-espacio/01-por-que-ahora.md
          - Energía, calor y conectividad: series/datacenters-espacio/02-energia-calor-conectividad.md
          - Qué es un datacenter espacial: series/datacenters-espacio/03-que-es-datacenter-espacio.md
          - La huella real de un datacenter: series/datacenters-espacio/04-huella-real-datacenter.md
  - Construir:
      - articulos-tecnicos/index.md
      - Agente Reactivo, Proactivo y Tool calls: articulos-tecnicos/proactive-reactive-agent-and-tool-calls.md
      - Agentes reactivos y proactivos en voz: articulos-tecnicos/reactive-proactive-voice-agents.md
      - Tres arquitecturas para agentes de voz: articulos-tecnicos/voice-agent-architectures.md
  - Próximamente: proximamente.md
  - Sobre: meta/about.md
markdown_extensions:
  - meta
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences:
  - pymdownx.highlight:
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - path: javascripts/external-links.js
    defer: true
  - path: javascripts/article-audio.js
    defer: true
  - path: assets/javascripts/animation-shell.js
    defer: true
  - path: assets/javascripts/site-demos.js
    defer: true
  - path: assets/javascripts/tabbed-animations.js
    defer: true
  - path: assets/javascripts/series_energy_ai_preview.js
    defer: true
  - path: assets/javascripts/series_energy_ai_local.js
    defer: true
  - path: assets/javascripts/editorial-system.js
    defer: true
  - path: assets/javascripts/visual-hub.js
    defer: true
  - path: assets/javascripts/reader-navigation.js
    defer: true
  - path: assets/javascripts/reader-direct-navigation.js
    defer: true
extra_css:
  - stylesheets/extra.css
  - assets/stylesheets/animations.css
  - assets/stylesheets/series_energy_ai_preview.css
  - stylesheets/revamp.css
  - stylesheets/revamp-fixes.css
  - stylesheets/revamp-responsive-fixes.css
  - stylesheets/revamp-ux.css
  - stylesheets/revamp-home-cover.css
  - stylesheets/revamp-quality.css
  - stylesheets/revamp-quality-responsive.css
  - stylesheets/revamp-home-meaning.css
  - stylesheets/visual-hub.css
  - stylesheets/visual-hub-responsive.css
  - stylesheets/reader-navigation.css
  - stylesheets/reader-navigation-responsive.css
  - stylesheets/reader-direct-navigation.css

hooks:
  - hooks/reading_time.py
  - hooks/og_article_type.py
  - hooks/serve_md_versions.py
  - hooks/jsonld_article.py
  - hooks/video_embed.py
  - hooks/reading_navigation.py
  - hooks/direct_reader_navigation.py
  - hooks/wip_series.py
  - hooks/nosnippet.py
  - hooks/sitemap_noindex.py
  - hooks/video_sitemap.py
  - hooks/video_hub_redirect.py

plugins:
  - search
  - tags:
  - macros
  - redirects:
      enabled: !ENV [MKDOCS_REDIRECTS, true]
      redirect_maps:
        'videos/index.md': 'visuales/index.md'
        'meta/advisor-ia.md': 'meta/about.md'
        'series/fundamentos-ia-iag/index.md': 'series/fundamentos-ia-iag/00_presentacion_serie.md'
        'series/from-cave-to-agi/index.md': 'series/from-cave-to-agi/00_presentacion_serie.md'
        'series/multimodalidad-iag/index.md': 'series/multimodalidad-iag/00_presentacion_serie.md'
        'series/modelos-razonadores/index.md': 'series/modelos-razonadores/00_presentacion_serie.md'
        'series/ia-pib-bienestar-energia/index.md': 'series/ia-pib-bienestar-energia/00_presentacion_serie.md'
        'series/datacenters-espacio/index.md': 'series/datacenters-espacio/00_presentacion_serie.md'
  - social:
      cards_layout: clean
      cards_layout_options:
        background_color: "#ffffff"
        color: "#111111"
        font_family: Inter
      enabled: true
exclude_docs: |
  drafts/
  drafts/**
  series/seguridad-ia/**
  snippets/seguridad-ia/**
  assets/templates/**
  includes/
