site_name: 5sigmas - Más señal, menos ruido
site_description: Divulgación técnica sobre IA en español. Análisis riguroso de Inteligencia Artificial, IA generativa y AGI — sin hype, con contexto y fuentes primarias.
site_url: "https://5sigmas.com"
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - scheme: default
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - navigation.footer

extra:
  generator: false  # quita “Made with Material for MkDocs”
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fjmm1998/

nav:
  - Inicio: index.md
  - Series:
      - series/index.md
      - Fundamentos de IA e IA generativa:
          - Presentación: series/fundamentos-ia-iag/00_presentacion_serie.md
          - ¿Qué es la IA?: series/fundamentos-ia-iag/01-que-es-ia.md
          - ¿Qué es IA Generativa?: series/fundamentos-ia-iag/02-que-es-ia-generativa.md
          - IA vs IA Generativa: series/fundamentos-ia-iag/03-ia-vs-ia-generativa.md
          - AGI: series/fundamentos-ia-iag/04-agi.md
      - De las cavernas a la AGI:
          - Presentación: series/from-cave-to-agi/00_presentacion_serie.md
          - Representar: series/from-cave-to-agi/01-representar.md
          - Mecanizar: series/from-cave-to-agi/02-mecanizar.md
          - Aprender: series/from-cave-to-agi/03-aprender.md
          - Escalar: series/from-cave-to-agi/04-escalar.md
          - Más allá del Transformer: series/from-cave-to-agi/05-mas-alla.md
      - Multimodalidad en IA Generativa:
          - Presentación: series/multimodalidad-iag/00_presentacion_serie.md
          - El problema: series/multimodalidad-iag/01-el-problema.md
          - Alineamiento: series/multimodalidad-iag/02-alineamiento.md
          - Arquitecturas: series/multimodalidad-iag/03-arquitecturas.md
          - Evaluación: series/multimodalidad-iag/04-evaluacion.md
          - Riesgos: series/multimodalidad-iag/05-riesgos.md
  - Próximamente: proximamente.md
  - Sobre 5sigmas: meta/about.md
markdown_extensions:
  - meta
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences:
  - pymdownx.highlight:
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - path: javascripts/nav-gradient.js
    defer: true
  - path: javascripts/external-links.js
    defer: true
  - path: assets/javascripts/animation-shell.js
    defer: true
  - path: assets/javascripts/site-demos.js
    defer: true
  - path: assets/javascripts/tabbed-animations.js
    defer: true
  - path: assets/javascripts/series_energy_ai_preview.js
    defer: true
  - path: assets/javascripts/series_energy_ai_local.js
    defer: true
extra_css:
  - stylesheets/extra.css
  - assets/stylesheets/animations.css
  - assets/stylesheets/series_energy_ai_preview.css

hooks:
  - hooks/reading_time.py
  - hooks/og_article_type.py
  - hooks/serve_md_versions.py
  - hooks/jsonld_article.py
  - hooks/wip_series.py

plugins:
  - search
  - tags:
  - macros
  - redirects:
      enabled: !ENV [MKDOCS_REDIRECTS, true]
      redirect_maps:
        # Canonical URL legacy — uppercase slug indexado por Google
        'series/fundamentos-IA-IAG/00_presentacion_serie.md': 'series/fundamentos-ia-iag/00_presentacion_serie.md'
  - social:
      cards_layout: clean
      cards_layout_options:
        background_color: transparent
        background_image: docs/assets/social_liquid.png
        color: "#ffffff"
        font_family: Inter
      enabled: true
  # - blog        # optional – see below
exclude_docs: |
  drafts/
  drafts/**
  assets/templates/**
  includes/
