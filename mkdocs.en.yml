          - What is AI?: series/fundamentos-ia-iag/01-que-es-ia.md
          - What is Generative AI?: series/fundamentos-ia-iag/02-que-es-ia-generativa.md
          - Classical AI vs Generative AI: series/fundamentos-ia-iag/03-ia-vs-ia-generativa.md
          - AGI: series/fundamentos-ia-iag/04-agi.md
      - From the Caves to AGI:
          - Introduction: series/from-cave-to-agi/00_presentacion_serie.md
          - Represent: series/from-cave-to-agi/01-representar.md
          - Mechanize: series/from-cave-to-agi/02-mecanizar.md
          - Learn: series/from-cave-to-agi/03-aprender.md
          - Scale: series/from-cave-to-agi/04-escalar.md
          - Beyond the Transformer: series/from-cave-to-agi/05-mas-alla.md
      - Multimodality in Generative AI:
          - Introduction: series/multimodalidad-iag/00_presentacion_serie.md
          - The real multimodality problem: series/multimodalidad-iag/01-el-problema.md
          - Alignment: series/multimodalidad-iag/02-alineamiento.md
          - Architectures: series/multimodalidad-iag/03-arquitecturas.md
          - Evaluation: series/multimodalidad-iag/04-evaluacion.md
          - Risks: series/multimodalidad-iag/05-riesgos.md
      - Reasoning Models:
          - Introduction: series/modelos-razonadores/00_presentacion_serie.md
          - What is reasoning?: series/modelos-razonadores/01-que-es-razonar.md
          - Reasoning-model failures: series/modelos-razonadores/02-fallos.md
          - Test-Time Compute: series/modelos-razonadores/03-test-time-compute.md
          - Time, latency, streaming and human interaction: series/modelos-razonadores/04-latencia-streaming.md
          - Risks: series/modelos-razonadores/05-riesgos.md
      - AI, GDP, Well-being and Energy:
          - Introduction: series/ia-pib-bienestar-energia/00_presentacion_serie.md
          - Electricity and well-being: series/ia-pib-bienestar-energia/01-electricidad-bienestar.md
          - AI as an electrical technology: series/ia-pib-bienestar-energia/02-ia-tecnologia-electrica.md
          - GDP vs well-being: series/ia-pib-bienestar-energia/03-pib-vs-bienestar.md
          - AI and GDP today: series/ia-pib-bienestar-energia/04-ia-pib-hoy.md
      - Data Centers in Space:
          - Introduction: series/datacenters-espacio/00_presentacion_serie.md
          - Why now: series/datacenters-espacio/01-por-que-ahora.md
          - Energy, heat and connectivity: series/datacenters-espacio/02-energia-calor-conectividad.md
          - What is a data center in space?: series/datacenters-espacio/03-que-es-datacenter-espacio.md
          - The real footprint of a data center: series/datacenters-espacio/04-huella-real-datacenter.md
      - AI Security:
          - Introduction: series/seguridad-ia/00_presentacion_serie.md
          - Prompt injection: series/seguridad-ia/01-prompt-injection.md
          - Jailbreaks: series/seguridad-ia/02-jailbreaks.md
          - Poisoning: series/seguridad-ia/03-envenenamiento.md
          - Red teaming: series/seguridad-ia/04-red-teaming.md
          - Production controls: series/seguridad-ia/05-controles-produccion.md
      - AI Agents:
          - Introduction: series/agentes-ia/00_presentacion_serie.md
          - What is an AI agent?: series/agentes-ia/01-que-es-un-agente.md
          - Anatomy of an agent: series/agentes-ia/02-anatomia-de-un-agente.md
          - How to evaluate an agent: series/agentes-ia/03-como-evaluar-un-agente.md
          - Agent security: series/agentes-ia/04-seguridad-agentes.md
          - From demo to production: series/agentes-ia/05-de-la-demo-a-produccion.md
  - Concepts:
      - Concepts: temas/index.md
      - What is an LLM?: temas/llms.md
      - How the Transformer works: temas/transformer.md
      - Reasoning in LLMs: temas/razonamiento.md
      - Evaluating AI models: temas/evaluacion-modelos.md
      - What is an AI agent?: temas/agentes-ia.md
      - What is prompt injection?: temas/prompt-injection.md
  - Build:
      - Technical Articles: articulos-tecnicos/index.md
      - Proactive and reactive agents and tool calls: articulos-tecnicos/proactive-reactive-agent-and-tool-calls.md
      - Reactive-proactive voice agents: articulos-tecnicos/reactive-proactive-voice-agents.md
      - Three architectures for voice agents: articulos-tecnicos/voice-agent-architectures.md
  - Coming Soon: proximamente.md
  - About: meta/about.md

markdown_extensions:
  - meta
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences:
  - pymdownx.highlight:
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en
  - tags:
  - macros:
      module_name: locale_main
      on_error_fail: true
      on_undefined: strict
  - social:
      cards_layout: clean
      cards_layout_options:
        background_color: "#ffffff"
        color: "#111111"
        font_family: Inter
      enabled: true

hooks:
  - hooks/video_sitemap_en.py
  - hooks/video_embed.py
  - hooks/reading_navigation.py
  - hooks/direct_reader_navigation.py
  - hooks/locale_alternates.py

extra_javascript:
  - path: javascripts/external-links.js
    defer: true
  - path: assets/javascripts/series_energy_ai_preview.js
    defer: true
  - path: assets/javascripts/tabbed-animations.js
    defer: true
  - path: assets/javascripts/locale-tabbed-adapter.js
    defer: true
  - path: assets/javascripts/visual-hub.js
    defer: true
  - path: assets/javascripts/video-library.js
    defer: true
  - path: assets/javascripts/reader-navigation.js
    defer: true
  - path: assets/javascripts/reader-direct-navigation.js
    defer: true
