INHERIT: mkdocs.yml

site_name: 5sigmas
site_description: "Artificial intelligence explained with technical rigor through visual explanations, learning series, primary sources and production engineering."
site_url: "https://5sigmas.com/en/"
docs_dir: .locale-build/en
site_dir: site/en

theme:
  language: en
  custom_dir: overrides_locale
  palette:
    - scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  content_language: en
  locale_code: en
  locale_name: English
  locale_prefix: /en
  global_site_root: https://5sigmas.com/
  generator: false
  video_watch_pages: true
  locale_video_pages:
    series/modelos-razonadores/03-test-time-compute.md:
      video: 03-test-time-compute.mp4
      video_poster: 03-test-time-compute.jpg
      video_title: Test-Time Compute
      video_duration: PT1M0S
  alternate:
