INHERIT: mkdocs.yml

site_name: 5sigmas
site_description: "Artificial intelligence explained with technical rigor through visual explanations, learning series, primary sources and production engineering."
site_url: "https://5sigmas.com/en/"
docs_dir: .locale-build/en
site_dir: site/en

theme:
  language: en
  custom_dir: overrides_locale
  palette:
    - scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  content_language: en
  locale_code: en
  locale_name: English
  locale_prefix: /en
  global_site_root: https://5sigmas.com/
  generator: false
  alternate:
    - name: Español
      link: /
      lang: es
    - name: English
      link: /en/
      lang: en
  schema_ui:
    home_title: "5sigmas: AI explained with technical rigor"
    markdown_label: Markdown version
    home_label: Home
    series_label: Series
    concepts_label: Concepts
    engineering_label: Engineering
    job_title: Real-time AI systems engineer
    profile_name: "About Francisco Maldonado — 5sigmas"
    person_description: "Dual graduate in Physics and Mathematics. Designs and builds production AI systems, including voice assistants, computer vision and real-time systems."
    concepts_collection_name: Artificial intelligence concepts
    engineering_collection_name: AI systems engineering
  reader_ui:
    learn_section: Learn
    build_section: Build
    series_kind: Series
    build_kind: Build
    technical_title: Technical notes
    concepts_title: Concepts
    content_singular: "{count} item"
    content_plural: "{count} items"
    previous: Previous
    next: Next
    chapters_aria: "Chapters in {collection}"
    reading: Reading
    open: Open
    contents_aria: "Contents of {collection}"
    library: Library
    library_title: "Series and technical notes."
    you_are_in: You are in
    search_placeholder: "Search series, chapter or note"
    search_aria: "Search series, chapter or technical note"
    close_library: Close library
    close: "Close ×"
    library_catalogue_aria: "Series and technical notes"
    no_results: "No content matches this search."
    next_chapter: Next chapter
    series_completed: Series completed
    choose_next_path: Choose the next path
    all_series: All series
    note_completed: Note completed
    explore_technical: Explore technical notes
    all_technical: All technical notes
    continue_learning: Keep learning
    open_library: Open library
    continue_aria: Continue learning
    context_aria: Reading context
    navigation_aria: "Navigation for {collection}"
    progress_of: of
    all_library: Full library
    search: Search
    direct_search_placeholder: "Series, chapter or note"
    direct_search_aria: "Search any series, chapter or technical note"
    direct_navigation_aria: "Navigation for {collection}"
    kind_notes: Notes
    kind_concepts: Concepts
    kind_series: Series
    reading_time_label: Reading time
    reading_estimated: Estimated reading
    reading_estimated_aria: Estimated reading time

nav:
  - Home: index.md
  - Learn:
      - Series: series/index.md
      - AI Agents:
          - Introduction: series/agentes-ia/00_presentacion_serie.md
          - What is an AI agent?: series/agentes-ia/01-que-es-un-agente.md
          - Anatomy of an agent: series/agentes-ia/02-anatomia-de-un-agente.md
          - How to evaluate an agent: series/agentes-ia/03-como-evaluar-un-agente.md
          - Agent security: series/agentes-ia/04-seguridad-agentes.md
          - From demo to production: series/agentes-ia/05-de-la-demo-a-produccion.md
  - About: meta/about.md

markdown_extensions:
  - meta
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences:
  - pymdownx.highlight:
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - abbr
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: en
  - tags:
  - macros:
      module_name: locale_main
      on_error_fail: true
      on_undefined: strict
  - social:
      cards_layout: clean
      cards_layout_options:
        background_color: "#ffffff"
        color: "#111111"
        font_family: Inter
      enabled: true

hooks:
  - hooks/reading_navigation.py
  - hooks/direct_reader_navigation.py
  - hooks/locale_alternates.py

extra_javascript:
  - path: javascripts/external-links.js
    defer: true
  - path: assets/javascripts/reader-navigation.js
    defer: true
  - path: assets/javascripts/reader-direct-navigation.js
    defer: true
